  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="63.36" y="51.48" transform="rotate(-0 63.36 51.48)">Metal forming changes cross-section by rolling, forging, pushing, or pulling</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="63.36" y="910.728" transform="rotate(-0 63.36 910.728)">1288  •  FIG-03-79-004</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 849.289875)">Four original forming schematics with exaggerated section changes. Rolling speeds follow constant-width incompressible volume flow; forging dashed outline</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 862.007375)">denotes the earlier shape. Extrusion pushes a confined billet through a die; drawing pulls wire through a converging die. Tool motion, contact friction,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 874.724875)">and forming-load magnitudes are not solved.</text>
  </g>
 </g>
