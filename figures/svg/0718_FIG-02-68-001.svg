      <tspan x="33.045898" y="-0.25" style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="59.896484" y="-0.25" style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d">1</tspan>
      <tspan x="76.438477" y="-0.25" style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="17.786133" y="-0.25" style="font-style: oblique; font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d">t</tspan>
