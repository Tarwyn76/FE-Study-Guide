      <tspan x="94.351562" y="4.015625" style="font-style: oblique; font-size: 18.2px; font-family: 'DejaVu Sans'; fill: #23313d">s</tspan>
     </text>
    </g>
   </g>
   <g id="text_7">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="549.298563" transform="rotate(-0 504 549.298563)">Uniform samples: tₙ=nΔt; retain timestamps and units.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A DAQ system conditions analog signals before sampling and conversion</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0718  •  FIG-02-68-001</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.028906 656.640625)">Anti-alias filtering is analog and precedes the sampling action; digital filtering cannot remove an alias already folded into the passband. ADC and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(185.410156 669.358125)">sample/hold functions may be integrated. Clock jitter, channel multiplexing and synchronization contribute to acquisition error.</text>
  </g>
