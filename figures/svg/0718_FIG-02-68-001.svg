   </ns0:g>
  </ns0:g>
  <ns0:g id="text_8">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="96.861" transform="rotate(-0 55.44 96.861)">A DAQ system conditions analog signals before sampling and conversion</ns0:text>
  </ns0:g>
  <ns0:g id="text_10">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.028906 656.640625)">Anti-alias filtering is analog and precedes the sampling action; digital filtering cannot remove an alias already folded into the passband. ADC and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(185.410156 669.358125)">sample/hold functions may be integrated. Clock jitter, channel multiplexing and synchronization contribute to acquisition error.</ns0:text>
  </ns0:g>
