   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="467.91" y="316.38885" transform="rotate(-0 467.91 316.38885)">Turbidity; TSS; temperature</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="316.38885" transform="rotate(-0 828.36 316.38885)">Separation / hydraulics</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="179.55" y="403.82565" transform="rotate(-0 179.55 403.82565)">Chemical:organics</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="467.91" y="403.82565" transform="rotate(-0 467.91 403.82565)">BOD; COD; specific compounds</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="403.82565" transform="rotate(-0 828.36 403.82565)">Biology / adsorption / oxidation</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="179.55" y="491.26245" transform="rotate(-0 179.55 491.26245)">Chemical:inorganic</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="467.91" y="491.26245" transform="rotate(-0 467.91 491.26245)">pH; alkalinity; hardness; nutrients</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="491.26245" transform="rotate(-0 828.36 491.26245)">Reagent demand / precipitation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="179.55" y="578.69925" transform="rotate(-0 179.55 578.69925)">Biological</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="467.91" y="578.69925" transform="rotate(-0 467.91 578.69925)">Indicator organisms; pathogens</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="578.69925" transform="rotate(-0 828.36 578.69925)">Disinfection / barriers</text>
   </g>
   <g id="text_16">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="685.8417" transform="rotate(-0 540 685.8417)">Choose measurements that match the target and the process.</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Water characteristics connect measured parameters to treatment objectives</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1124  •  FIG-03-56-001</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Representative categories, not an exhaustive analytical program. BOD and COD are different operational oxygen-demand measures and are not interchangeable</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">contaminant concentrations. Turbidity is an optical property rather than TSS mass concentration. Sampling, method, matrix, and treatment targets determine</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">which measurements are useful.</text>
  </g>
 </g>
