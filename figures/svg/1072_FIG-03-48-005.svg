  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1072  •  FIG-03-48-005</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">First-order constant-k loss with k=0.1 day⁻¹. Batch elapsed time and ideal PFR residence time are distinct physical quantities but obey the same parcel</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">equation. PFR assumes no axial mixing and uniform age at the exit; batch has no simultaneous inlet/outlet during reaction.</text>
  </g>
