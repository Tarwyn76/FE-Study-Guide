   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="179.795825" transform="rotate(-0 540 179.795825)">No.200: fraction passing?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.253594 315.650677)">&lt;50% passing → COARSE</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.607813 343.953098)">No.4 separates gravel / sand</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(689.479688 315.650677)">≥50% passing → FINE</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(647.681484 343.953098)">LL + PI + organic assessment</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.51375 485.642062)">Fines &lt;5%: gradation W/P</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(169.440313 512.59675)">5–12%: dual symbols</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(171.080938 539.551438)">&gt;12%: plasticity M/C</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(656.658437 486.713859)">Inorganic: LL&lt;50 → L; ≥50 → H</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(698.446563 512.320812)">A-line + PI → clay / silt</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(662.172891 537.927766)">Organic / peat: separate rules</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="624.871087" transform="rotate(-0 540 624.871087)">W criteria: gravel C_u≥4; sand C_u≥6; both 1≤C_c≤3</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">USCS classification starts with fines percentage, then follows gradation and plasticity</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0925  •  FIG-03-27-005</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.021875 716.305875)">Summary of supplied handbook USCS classification logic, not the complete ASTM test/classification standard. W/P checks apply to clean coarse soil; fines5–12% require</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.394531 729.023375)">dual classification. Fine fraction type and plasticity determine M/C; borderline PI4–7, organic tests, cobbles/boulders and exact boundary cases need full rules.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(427.523438 741.740875)">No.200 opening≈0.075 mm; No.4≈4.75 mm.</text>
  </g>
 </g>
