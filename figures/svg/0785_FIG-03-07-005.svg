  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0785  •  FIG-03-07-005</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.957031 650.142812)">Illustrative gas solution-diffusion membrane: permeability P_A divided by thickness is permeance; partial-pressure driving force must use compatible</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.528906 663.138438)">units. Feed5 mol A/s equals retentate1.8 plus permeate3.2. Selectivity is a permeability ratio under the chosen model, not simply the permeate/feed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(335.186719 675.855937)">concentration ratio. Polarization and module gradients are omitted.</text>
  </g>
