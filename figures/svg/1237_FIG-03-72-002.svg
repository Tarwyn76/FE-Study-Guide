  </g>
  <g id="text_36">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1237  •  FIG-03-72-002</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Balanced assigned transportation model with divisible units, no route capacities or fixed charges. Every row shipment equals its supply and every column</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">receipt meets demand. The plan has cost115 and was verified by linear programming; equal-cost alternate allocations can exist. Allocation fractions do not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">imply that indivisible loads can be split without an integer model.</text>
  </g>
