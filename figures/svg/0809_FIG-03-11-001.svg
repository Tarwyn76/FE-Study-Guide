   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.165625 656.640625)">Well-mixed, isothermal, irreversible first-order reaction at constant volume. Reaction time excludes charge, heat-up, discharge and cleaning. The</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(138.453125 669.358125)">reciprocal-rate integral must use the actual kinetics along the trajectory; an outlet-rate rectangle would be a CSTR relation, not this batch design.</text>
