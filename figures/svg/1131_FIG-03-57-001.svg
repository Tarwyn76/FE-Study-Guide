  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Coagulation destabilizes particles before gentler flocculation builds settleable aggregates</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1131  •  FIG-03-57-001</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual particle destabilization and aggregation, not a scaled micrograph. Rapid mixing disperses reagent; lower-intensity flocculation promotes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">collisions while limiting breakage. Coagulant choice/dose depend on pH, alkalinity, temperature, and particle chemistry; jar testing informs selection.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">Precipitated hydroxide floc may also capture particles.</text>
  </g>
 </g>
