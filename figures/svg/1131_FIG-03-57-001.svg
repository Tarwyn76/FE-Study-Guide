   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="848.88" y="587.919737" transform="rotate(-0 848.88 587.919737)">Larger floc</text>
