  <ns0:g id="text_11">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="97.318" transform="rotate(-0 55.44 97.318)">A closed system retains its mass; an open control volume permits mass flow</ns0:text>
  </ns0:g>
  <ns0:g id="text_13">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.929688 656.640625)">Both boundaries can exchange heat and work. A closed-system boundary may move; an open control volume may be fixed or moving. Arrows establish the shown</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(347.432031 669.358125)">input/output directions, not a claim that every transfer occurs.</ns0:text>
  </ns0:g>
