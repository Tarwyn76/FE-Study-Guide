  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.929688 656.640625)">Both boundaries can exchange heat and work. A closed-system boundary may move; an open control volume may be fixed or moving. Arrows establish the shown</text>
