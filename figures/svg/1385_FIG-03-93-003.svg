  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.097875)">Assigned balanced sinusoidal three-phase input, RMS line quantities. P is electrical input, not shaft power; motor efficiency gives the useful mechanical</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.532875)">output. For a star load Vphase=VL/√3 and Iphase=IL; delta relations differ. Reactive power is positive for the stated lagging load.</text>
