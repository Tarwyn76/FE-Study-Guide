   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="427.859062" transform="rotate(-0 145.152 427.859062)">Definition / environment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="387.3744" y="427.859062" transform="rotate(-0 387.3744 427.859062)">Calibration / drift</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="620.6256" y="427.859062" transform="rotate(-0 620.6256 427.859062)">Noise / gain / loading</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="862.848" y="427.859062" transform="rotate(-0 862.848 427.859062)">Quantization / timing</text>
   </g>
   <g id="text_9">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="544.330563" transform="rotate(-0 504 544.330563)">Uncertainty can enter at every stage and through interactions.</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A measurement chain turns a defined physical quantity into a reported indication</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0704  •  FIG-02-66-001</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.761719 656.640625)">Define the measurand, operating conditions and units before selecting instrumentation. Conditioning may include excitation, amplification, filtering and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(198.503125 669.358125)">isolation. Contributions can be correlated; the chain is not an instruction to add every quoted specification independently.</text>
  </g>
