   <ns0:g id="text_1">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(89.7723 247.645266)">MEASURAND</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(70.404019 271.904484)">Physical quantity</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(323.395819 247.645266)">TRANSDUCER</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(314.283319 271.904484)">Electrical signal</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(554.849494 247.645266)">CONDITIONING</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(559.206056 271.904484)">Amplify / filter</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(823.925981 247.645266)">OUTPUT</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(800.038012 271.904484)">DAQ / display</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="427.859062" transform="rotate(-0 145.152 427.859062)">Definition / environment</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="387.3744" y="427.859062" transform="rotate(-0 387.3744 427.859062)">Calibration / drift</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="620.6256" y="427.859062" transform="rotate(-0 620.6256 427.859062)">Noise / gain / loading</ns0:text>
   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="862.848" y="427.859062" transform="rotate(-0 862.848 427.859062)">Quantization / timing</ns0:text>
   </ns0:g>
   <ns0:g id="text_9">
    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="544.330563" transform="rotate(-0 504 544.330563)">Uncertainty can enter at every stage and through interactions.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_10">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="180.417" transform="rotate(-0 55.44 180.417)">A measurement chain turns a defined physical quantity into a reported indication</ns0:text>
  </ns0:g>
  <ns0:g id="text_12">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.761719 656.640625)">Define the measurand, operating conditions and units before selecting instrumentation. Conditioning may include excitation, amplification, filtering and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(198.503125 669.358125)">isolation. Contributions can be correlated; the chain is not an instruction to add every quoted specification independently.</ns0:text>
  </ns0:g>
 </ns0:g>
