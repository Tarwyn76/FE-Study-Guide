   <g id="text_1">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(106.51475 258.1354)">Ambient inlet</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(87.3185 278.4834)">p1=101.3 kPa abs</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(448.452 246.965587)">Blower</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(439.297234 268.585337)">ηis=0.70</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(403.861531 290.205087)">Pshaft=5.106 kW</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="400.016475" transform="rotate(-0 876.42 400.016475)">Diffusers</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="203.83555" transform="rotate(-0 828.36 203.83555)">p2=151.3 kPa abs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(303.234766 616.292637)">ṁ=0.10 kg/s; T1=293 K; ideal-gas κ=1.4</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(296.483906 645.542888)">Pshaft=(ṁcpT1/ηis)[(p2/p1)^((κ−1)/κ)−1]</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A blower raises gas pressure to overcome diffuser submergence and system losses</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1094  •  FIG-03-51-006</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative ideal-gas isentropic compression with cp=1004.5 J/(kg·K); shaft power excludes motor losses and assumes the stated isentropic efficiency. Use</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">absolute pressure in the ratio, not gauge pressure. Diffuser submergence/line pressure drops are included only in the assigned outlet pressure; oxygen</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">transfer is not calculated.</text>
  </g>
 </g>
