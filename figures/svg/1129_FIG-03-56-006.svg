   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1129  •  FIG-03-56-006</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Synthetic sigmoid breakthrough curve and conceptual moving adsorption zone, not a measured GAC capacity. Bed volumes normalize throughput by bed volume.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">Influent concentration, competing solutes, contact time, temperature, and mass-transfer resistance affect breakthrough. Spent media requires replacement or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">regeneration; adsorption transfers contaminant mass rather than destroying it.</text>
  </g>
 </g>
