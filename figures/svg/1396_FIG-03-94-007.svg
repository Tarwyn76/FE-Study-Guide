  <g id="text_31">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A lifecycle decision matrix separates mandatory gates from weighted preferences</text>
  </g>
  <g id="text_32">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1396  •  FIG-03-94-007</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned normalized weights and ordinal preference scores; higher is better, including cost desirability. Safety is a noncompensatory gate rather than a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">low-scoring tradeoff. Weighted scores are decision aids, not physical measurements. Ratings and weights need rationale and sensitivity analysis; B leads by</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">only.15 points.</text>
  </g>
