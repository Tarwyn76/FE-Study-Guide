   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(863.200031 187.452937)">Treated water</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(877.513312 206.529187)">55 kg/day</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(889.132453 285.819337)">Sludge</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(877.513312 304.895587)">25 kg/day</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(868.943391 384.185737)">Air emission</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(882.285187 403.261987)">5 kg/day</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(867.292219 482.552137)">Spent media</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(882.285187 501.628387)">5 kg/day</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(840.506672 580.918537)">Recovered resource</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(877.513312 599.994788)">10 kg/day</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="366.984" y="565.340162" transform="rotate(-0 366.984 565.340162)">100=55+25+5+5+10 kg/day</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A whole-plant constituent balance tracks all exits rather than only treated water</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1151  •  FIG-03-59-007</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned steady balance for one conserved constituent on a common mass basis, not total water flow. Accumulation is zero; no chemical destruction is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">assumed. Recovered material is an external exit rather than an additional duplicated credit. Reactions require tracking products or a conserved element;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">water, solids, and energy have separate balances.</text>
  </g>
 </g>
