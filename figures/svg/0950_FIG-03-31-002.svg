  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Band occupancy and energy gaps distinguish conductors, semiconductors, and insulators</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0950  •  FIG-03-31-002</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.195312 716.166812)">Conductor panel represents a partially occupied band; metals may also have overlapping bands. Semiconductor/insulator gap sizes are conceptual, not universal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.007812 728.884312)">thresholds. Intrinsic Fermi level E_i is near midgap, with a density-of-states correction in general; E_g=E_C−E_V. Band occupancy depends on temperature and Fermi</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(436.829687 741.879937)">statistics, not merely the drawing height.</text>
  </g>
