   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="133.402830" transform="rotate(-0 59.4 133.402830)">Band occupancy and energy gaps distinguish conductors, semiconductors, and insulators</text>
  </g>
  <g id="text_20">
   </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.195 646.943396)">Conductor panel represents a partially occupied band; metals may also have overlapping bands. Semiconductor/insulator gap sizes are conceptual, not universal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.008 659.660896)"><tspan font-size="10.000px">thresholds. Intrinsic Fermi level E</tspan><tspan font-size="6.800px" dy="2.400px">i</tspan><tspan font-size="10.000px" dy="-2.400px"> is near midgap, with a density-of-states correction in general; E</tspan><tspan font-size="6.800px" dy="2.400px">g</tspan><tspan font-size="10.000px" dy="-2.400px">=E</tspan><tspan font-size="6.800px" dy="2.400px">C</tspan><tspan font-size="10.000px" dy="-2.400px">−E</tspan><tspan font-size="6.800px" dy="2.400px">V</tspan><tspan font-size="10.000px" dy="-2.400px">. Band occupancy depends on temperature and Fermi</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(436.83 672.656521)">statistics, not merely the drawing height.</text>
  </g>
 </g>
