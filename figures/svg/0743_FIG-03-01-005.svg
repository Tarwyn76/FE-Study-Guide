   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(319.5225 543.337688)">Unit 1: F−M=0; unit 2: M−P=0</ns0:text>
    <ns0:text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(290.555625 575.683312)">Overall: F−P=0; internal M cancels.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="137.892" transform="rotate(-0 55.44 137.892)">An overall process boundary cancels internal transfers between units</ns0:text>
  </ns0:g>
  <ns0:g id="text_10">
</ns0:g>
  <ns0:g id="text_11">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.535156 656.640625)">Schematic steady nonreactive single-stream two-unit process without side feeds/products. Each control volume has its own external crossings. An internal</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(149.9625 669.358125)">stream crosses unit boundaries but not the overall boundary; its positive and negative contributions cancel when unit balances are summed.</ns0:text>
  </ns0:g>
