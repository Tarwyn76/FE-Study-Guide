  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="47.52" y="630.504" transform="rotate(-0 47.52 630.504)">0602  •  FIG-02-51-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.545312 590.616625)">Steady adiabatic turbine, negligible KE/PE change. State 2s has the actual exit pressure and s₂s=s₁. Irreversibility gives less work</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(229.671094 603.334125)">and higher exit enthalpy than the isentropic reference under these assumptions.</text>
