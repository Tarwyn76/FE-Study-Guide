   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(699.640688 345.663244)">Two factors of interest</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(708.51225 361.836056)">Two-factor factorial</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="514.011388" transform="rotate(-0 468 514.011388)">Randomize; replicate; collect the response</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="580.982188" transform="rotate(-0 468 580.982188)">Partition sums of squares; calculate F ratios</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="647.952988" transform="rotate(-0 468 647.952988)">Compare each relevant F with its critical value</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="714.923788" transform="rotate(-0 468 714.923788)">Inspect residuals: independence, spread, normality</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="781.894588" transform="rotate(-0 468 781.894588)">State a conclusion limited to the tested design</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="844.316975" transform="rotate(-0 468 844.316975)">A significant global F does not identify which means differ. Follow-up comparisons need an appropriate multiplicity procedure.</text>
