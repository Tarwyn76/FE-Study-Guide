   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned constant-speed duty. Calendar time is not automatically operating time. For changing speed, integrate rotational speed over the actual running</text>
