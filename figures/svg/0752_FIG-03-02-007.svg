   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="916.6752" y="199.882938" transform="rotate(-0 916.6752 199.882938)">P unknown</text>
   </g>
   <g id="text_8">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="583.798625" transform="rotate(-0 504 583.798625)">A cuts F and P; B/C also cut unknown internal and recycle flows.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Choose the balance boundary that cuts the fewest unknown streams</text>
  </g>
  <g id="text_10">
</g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.082812 650.281875)">Illustrative known fresh feed and specified reaction/separation model. Overall boundary eliminates internal recycle terms and may determine the external</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.128125 662.999375)">product first. Then use unit boundaries to resolve internal flows. The preferred cut depends on the actual known variables and independent equations;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(362.926562 675.716875)">fewest crossings alone is not a universal solvability rule.</text>
  </g>
