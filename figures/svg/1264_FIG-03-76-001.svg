  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned planar instantaneous motion. The link position difference is(2,1) m; positive angular velocity is counterclockwise out of the page. Velocity</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">arrows use explanatory drawing scales rather than a common velocity-diagram scale. Translation of A need not be perpendicular to AB; only the relative</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">rotational velocity is perpendicular.</text>
  </g>
