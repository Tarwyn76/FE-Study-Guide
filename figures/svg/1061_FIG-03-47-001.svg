    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="259.2" y="148.4006" transform="rotate(-0 259.2 148.4006)">Pseudocode:sum1…n</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 235.44645)">input integer n≥0</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 260.88145)">s←0; i←1</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 286.31645)">while i≤n:</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 311.75145)">    s←s+i</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 337.18645)">    i←i+1</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(66.312 362.62145)">output s</text>
   </g>
  </g>
