  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Swept geometry and a toggle singularity impose distinct mechanism constraints</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1270  •  FIG-03-76-007</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Left shades the convex hull of sampled centerline configurations, not a certified swept envelope: link thickness, intermediate positions, tolerances, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">tooling need added clearance. Right is a separate ideal collinear two-link toggle, μ0° or180°, where a kinematic constraint becomes singular. The original</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">four-bar is not claimed to reach that toggle. Numerical conditioning and branch choice need attention near singularities.</text>
  </g>
