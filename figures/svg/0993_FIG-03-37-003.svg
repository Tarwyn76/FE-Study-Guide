  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A parallel-plate capacitor stores field energy in the dielectric between opposite charges</text>
  </g>
  <g id="text_10" transform="translate(0.000000 -173.068845)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.395312 650.142812)"><tspan style="font-size: 10.000px">Ideal parallel plates with uniform dielectric, negligible fringing, ε=ε</tspan><tspan style="font-size: 7.200px" dy="2.400px">r</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">ε₀. C=εA/d,E=V/d=100 kV/m,Q=CV=35.4168 nC,U=½CV². Geometry is schematic, not a</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.042969 663.138438)">breakdown/clearance design. Voltage is top relative to bottom; energy belongs to the electric field. Actual insulation limits depend on material,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(434.465625 675.855937)">environment and geometry.</text>
  </g>
