  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">The same endpoints have different distances under different movement rules</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1230  •  FIG-03-71-002</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Coordinates A(0,0), B(3,4) m. Euclidean is straight physical path length; rectilinear uses separate axis travel. Chebyshev corresponds to simultaneous axis</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">motion with equal speed limits and a time-equivalent distance, not the Euclidean length of the dashed path. Obstacles and unequal axis speeds require a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">different model.</text>
  </g>
