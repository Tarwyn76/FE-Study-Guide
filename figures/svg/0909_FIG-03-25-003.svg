  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.523438 650.281875)">Conceptual plan-view lap details; overlap geometry is schematic. Opposing external tension loads drive force transfer. Fillet throat formula applies to a right-angle</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.603125 662.999375)">equal-leg ideal weld. Hole size, spacing, edge distances, weld length, eccentricity, material strengths and inspection determine actual capacity; no connection is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(512.688281 675.716875)">sized here.</text>
