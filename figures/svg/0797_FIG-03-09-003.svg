  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(64.375 650.281875)">Example US mesh equivalents from the handbook table: #10≈2 mm,#18≈1 mm,#35≈0.5 mm. Plus means retained; minus means passing. Stack masses10+30+40+20=100</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.8875 662.999375)">g. Pan receives material passing the smallest sieve. Aperture, sieve standard, shape and test procedure matter; mesh number alone is not a universal</text>
