    <ns0:text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="480.879062" transform="rotate(-0 540 480.879062)"><ns0:tspan style="font-size: 26.000px">S</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">x</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">=I</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">x</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">/(d/2)       r</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">x</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">=√(I</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">x</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">/A)       r</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">y</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">=√(I</ns0:tspan><ns0:tspan style="font-size: 18.720px" dy="6.240px">y</ns0:tspan><ns0:tspan style="font-size: 26.000px" dy="-6.240px">​</ns0:tspan><ns0:tspan style="font-size: 26.000px">/A)</ns0:tspan></ns0:text>
