  <ns0:g id="text_17">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Section tables provide properties; available strength also depends on loading and restraint</ns0:text>
  </ns0:g>
  <ns0:g id="text_19" transform="translate(0.000000 -153.900000)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(157.350781 649.864687)"><ns0:tspan style="font-size: 10.000px">Original table concept for the fabricated I-section d=300,b</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">f</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=150,t</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">f</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=12,t</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">w</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=8 mm, neglecting fillets. It is not an excerpt of an AISC rolled-shape table.</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.648438 662.860312)"><ns0:tspan style="font-size: 10.000px">Area/inertia/elastic modulus/radii are geometric properties; strength tables apply specified design assumptions. S</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">x</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px"> is elastic section modulus, distinct from</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(511.607031 675.855937)"><ns0:tspan style="font-size: 10.000px">plastic Z</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">x</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">.</ns0:tspan></ns0:text>
  </ns0:g>
