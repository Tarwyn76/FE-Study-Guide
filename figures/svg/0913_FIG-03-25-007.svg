   <g id="text_15">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="480.879062" transform="rotate(-0 540 480.879062)">S_x=I_x/(d/2)       r_x=√(I_x/A)       r_y=√(I_y/A)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="568.588687" transform="rotate(-0 540 568.588687)">Strength columns require the stated L_b, KL/r, material, and design basis</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Section tables provide properties; available strength also depends on loading and restraint</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0913  •  FIG-03-25-007</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(157.350781 649.864687)">Original table concept for the fabricated I-section d=300,b_f=150,t_f=12,t_w=8 mm, neglecting fillets. It is not an excerpt of an AISC rolled-shape table.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.648438 662.860312)">Area/inertia/elastic modulus/radii are geometric properties; strength tables apply specified design assumptions. S_x is elastic section modulus, distinct from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(511.607031 675.855937)">plastic Z_x.</text>
  </g>
