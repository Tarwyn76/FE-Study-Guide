  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Beam design checks flexural strength, shear strength, and service deflection separately</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0911  •  FIG-03-25-005</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.470312 650.281875)">Simply supported prismatic Euler–Bernoulli beam with EI=20,000 kN·m² and uniform load; magnitudes are demand/response only. Strength checks include</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(144.382812 662.999375)">section classification and restraint; serviceability uses an appropriate service load and specified limit. The schematic I-section is not assigned a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(372.824219 675.716875)">capacity, and deflection is not a strength limit state.</text>
  </g>
