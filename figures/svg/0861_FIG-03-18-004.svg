   <g id="text_10">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(242.248047 557.496102)">At each junction: ΣQ_in−ΣQ_out=demand</text>
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(181.326172 591.884773)">Around a loop: algebraic head changes sum to zero</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A looped network must satisfy junction continuity and compatible path head losses</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0861  •  FIG-03-18-004</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.534375 650.281875)">Illustrative loop topology with assumed pipe-flow directions, not a solved numerical hydraulic network. Pump belongs on the supply path; final directions</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.569531 662.999375)">may reverse after the network equations are solved. Reservoir head, pump curve, demands, losses and pressure constraints are needed to determine actual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(489.508594 675.716875)">flows.</text>
  </g>
