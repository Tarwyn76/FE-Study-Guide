   <g id="text_1">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="150.496338" transform="rotate(-0 468 150.496338)">What parameter?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="246.5424" y="316.819588" transform="rotate(-0 246.5424 316.819588)">Mean: one or two independent samples?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(653.569394 355.108041)">Variance / standard deviation</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(650.445331 372.628588)">Chi-square; normal population</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(687.421191 390.149134)">Take √bounds for σ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="157.1076" y="495.684325" transform="rotate(-0 157.1076 495.684325)">ONE sample</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="442.4472" y="495.684325" transform="rotate(-0 442.4472 495.684325)">TWO samples</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.410725 680.377247)">σ known → z</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(101.900569 700.593263)">σ unknown → t</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.056428 720.809278)">ν = n−1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(512.452275 681.449044)">Known σ₁, σ₂ → z difference</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(447.07665 700.317325)">Unknown, equal variances justified → pooled t</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(506.972587 719.185606)">Unknown, unequal → Welch t</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(190.319531 837.578303)">Check confidence level, tail split, units, interval direction, sampling assumptions, and whether data are paired.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(324.863281 851.055647)">Paired data require an interval on within-pair differences.</text>
   </g>
  </g>
