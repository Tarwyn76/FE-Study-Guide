  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.007031 656.501562)">Illustrative ideal floor quantizer with saturation outside nominal range. N=clip[floor((V−V_L)/LSB),0,2ⁿ−1]; lower-edge decoding gives V_hat=V_L+N·LSB.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(154.091406 669.497187)">Error in each unsaturated bin is [0,LSB), not symmetric ±LSB/2. Midpoint/rounding conventions use different error and endpoint definitions.</text>
  </g>
