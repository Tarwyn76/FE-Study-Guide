   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.920312 656.3625)">Isothermal first-order reaction in a well-mixed, constant-volume batch vessel. N_A=10e^(−0.20t) mol; initial disappearance rate is0.40 mol/(L·min). Signed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(226.819531 669.358125)">formation rate r_A is negative for A; −r_A is the positive disappearance rate. No feed or outlet during reaction.</text>
