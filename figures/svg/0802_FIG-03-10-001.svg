  <ns0:g id="text_19">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="109.592" transform="rotate(-0 55.44 109.592)">Reactant disappearance is positive when the reactant inventory decreases</ns0:text>
  </ns0:g>
  <ns0:g id="text_20">
</ns0:g>
  <ns0:g id="text_21">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.920312 656.3625)"><ns0:tspan font-size="10.000px">Isothermal first-order reaction in a well-mixed, constant-volume batch vessel. N</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=10e^(−0.20t) mol; initial disappearance rate is0.40 mol/(L·min). Signed</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(226.819531 669.358125)"><ns0:tspan font-size="10.000px">formation rate r</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> is negative for A; −r</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> is the positive disappearance rate. No feed or outlet during reaction.</ns0:tspan></ns0:text>
  </ns0:g>
