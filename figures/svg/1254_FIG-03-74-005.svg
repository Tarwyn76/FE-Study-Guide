     <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="650.079687" y="181.756562" transform="rotate(-0 650.079687 181.756562)">Shifted μ=10.1</text>
    </g>
   </g>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Cp measures potential spread capability; Cpk also accounts for centering</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1254  •  FIG-03-74-005</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned stable normal populations, identical within-process SD and specification limits9.7–10.3 mm. Shifting the mean leaves Cp unchanged while lowering</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Cpk. These are population examples rather than estimated sample indices; uncertainty, nonnormality, instability, and measurement-system effects require</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">separate evaluation. A single threshold is not presented as a universal acceptance rule.</text>
  </g>
