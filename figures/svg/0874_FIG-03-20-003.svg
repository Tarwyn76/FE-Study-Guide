   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="249.838875" transform="rotate(-0 504 249.838875)">AQUITARD</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="163.0944" y="180.010937" transform="rotate(-0 163.0944 180.010937)">Piezometric surface</text>
   </g>
   <g id="text_5">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="560.338313" transform="rotate(-0 504 560.338313)">T=Kb; Q=2πT(h₂−h₁)/ln(r₂/r₁)</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A confined aquifer remains saturated while pumping lowers its piezometric head</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0874  •  FIG-03-20-003</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.430469 650.281875)">Conceptual confined section; curved piezometric profile is qualitative, not the logarithmic solution. With K=10⁻⁴ m/s,b=10 m,T=0.001 m²/s,h₂−h₁=2</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(106.773438 662.999375)">m,r₂/r₁=10, steady Thiem Q=0.005458 m³/s. Pumped head remains above aquifer top. Full penetration, steady radial flow, constant T and suitable boundaries</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(429.007812 675.716875)">are assumed by the equation.</text>
  </g>
