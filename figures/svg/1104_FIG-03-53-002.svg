  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual synthetic reach responses: downstream has2-hour translation plus a broader gamma shape. Total volume is equal over the infinite tails; plotted</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">window truncates some flow. This is not a fitted Muskingum or hydraulic solution. Lateral inputs, losses, channel geometry, and backwater can change real</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">behavior.</text>
  </g>
