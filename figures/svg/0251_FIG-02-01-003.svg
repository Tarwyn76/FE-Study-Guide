   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="219.7152" y="159.173063" transform="rotate(-0 219.7152 159.173063)">COMPLETE EXCERPT</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="636.4224" y="159.173063" transform="rotate(-0 636.4224 159.173063)">OMITTED QUALIFICATION</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.8852 238.778303)">“Capacity is adequate for the</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.6102 257.646584)">assumed loading. Corrosion is</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.916919 276.514866)">not measured; field verification</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.157856 295.383147)">is needed before final acceptance.”</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(553.302869 238.778303)">“Capacity is adequate.”</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(636.4224 257.646584)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(536.092713 276.514866)">Known corrosion uncertainty</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(599.095994 295.383147)">is omitted.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #26776f" transform="translate(110.508169 489.070655)">Facts + assumptions + limits</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #26776f" transform="translate(136.635122 509.28667)">Truthful completeness</text>
   </g>
   <g id="text_6">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #a23b34" transform="translate(570.352088 489.070655)">Material omission</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #a23b34" transform="translate(553.00365 509.28667)">Misleading impression</text>
   </g>
  </g>
  <g id="text_7">
