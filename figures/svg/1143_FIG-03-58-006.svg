   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="237.14925" transform="rotate(-0 193.968 237.14925)">Zone</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="501.552" y="237.14925" transform="rotate(-0 501.552 237.14925)">Electron-acceptor condition</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="237.14925" transform="rotate(-0 847.584 237.14925)">Representative process</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="340.98045" transform="rotate(-0 193.968 340.98045)">Aerobic</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="501.552" y="340.98045" transform="rotate(-0 501.552 340.98045)">Dissolved O2 present</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="340.98045" transform="rotate(-0 847.584 340.98045)">Carbon oxidation; nitrification</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="444.81165" transform="rotate(-0 193.968 444.81165)">Anoxic</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="501.552" y="444.81165" transform="rotate(-0 501.552 444.81165)">No free O2; nitrate/nitrite available</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="444.81165" transform="rotate(-0 847.584 444.81165)">Denitrification to N2</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="548.64285" transform="rotate(-0 193.968 548.64285)">Anaerobic (BNR context)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="501.552" y="548.64285" transform="rotate(-0 501.552 548.64285)">No free O2 or nitrate/nitrite</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="548.64285" transform="rotate(-0 847.584 548.64285)">PAO carbon storage; P release</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="662.87875" transform="rotate(-0 540 662.87875)">Zone labels describe chemistry; merely switching off air does not ensure anaerobic conditions.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Aerobic, anoxic, and anaerobic zones support different biological pathways</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1143  •  FIG-03-58-006</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Biological nutrient-removal terminology. Actual transformations require suitable organisms, carbon, retention time, and operating conditions. The anaerobic</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">PAO step supports later phosphorus uptake; it is not itself net phosphorus removal. Anaerobic digestion is a different process context from the BNR basin</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">zones shown here.</text>
  </g>
 </g>
