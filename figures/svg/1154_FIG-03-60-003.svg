  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1154  •  FIG-03-60-003</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative constant lapse rates with surface temperature20°C. Comparison describes small dry, unsaturated parcel displacements, not a forecast or a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">saturated/moist stability criterion. Inversion is one stable case but is not required for stability. Wind shear, moisture, radiation, and changing profiles</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">are omitted.</text>
  </g>
