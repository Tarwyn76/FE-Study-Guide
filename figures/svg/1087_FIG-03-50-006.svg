   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="197.466075" transform="rotate(-0 540 197.466075)">Elimination: Remove noisy task / toxic process</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="286.890075" transform="rotate(-0 540 286.890075)">Substitution: Quieter process / less hazardous material</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="376.314075" transform="rotate(-0 540 376.314075)">Engineering: Enclosure / local exhaust ventilation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="465.738075" transform="rotate(-0 540 465.738075)">Administrative: Access/time limits / work procedures</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="555.162075" transform="rotate(-0 540 555.162075)">PPE: Hearing protection / suitable chemical PPE</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="705.029887" transform="rotate(-0 540 705.029887)">More effective / less reliance on individual action toward the top.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">The control hierarchy prioritizes removing hazards before relying on worker actions</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1087  •  FIG-03-50-006</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">NIOSH-style occupational hierarchy with illustrative noise/chemical examples. PPE choice depends on hazard, task and exposure, and can supplement higher-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">level controls. Examples are not a prescribed protection plan or compliance determination; effectiveness must be verified under the actual conditions.</text>
  </g>
