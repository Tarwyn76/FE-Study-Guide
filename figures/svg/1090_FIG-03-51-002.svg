  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Illustrative pressurized constant-diameter main profile downstream of a pump, not a solved pipe design. Friction loss5.5 m plus local fitting losses1.0+0.5</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">m=7 m. HGL is pressure head plus elevation; EGL adds kinetic head for alpha=1. Assigned losses, pipe elevation and velocity head are illustrative.</text>
  </g>
