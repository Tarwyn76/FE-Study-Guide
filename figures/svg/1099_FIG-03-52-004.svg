  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Conventional illustrative NRCS/SCS curve-number relation with abstraction ratio0.2; alternative calibrated ratios exist. CN is assigned, not selected from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">land-use/soil tables here. Storm runoff depth is not peak flow; antecedent conditions, event suitability and routing must be evaluated separately.</text>
