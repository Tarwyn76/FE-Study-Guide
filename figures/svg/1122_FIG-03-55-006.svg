   <g id="text_19">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.430625" transform="rotate(-0 540 663.430625)">Candidate mapping guides investigation; it does not select a remedy.</text>
