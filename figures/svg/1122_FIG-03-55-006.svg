  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">In-situ remedy candidates depend on contaminant behavior and accessible media</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1122  •  FIG-03-55-006</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Representative approaches, not universal matches or a remedy recommendation. Characterization, treatability tests, delivery, groundwater chemistry,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">exposure controls, and long-term performance govern applicability. Some contaminants are transformed; others are captured or immobilized. Volatile-vadose</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">treatment must control extracted vapor.</text>
  </g>
