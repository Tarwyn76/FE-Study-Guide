  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Forward bias lowers the junction barrier; reverse bias raises it and widens depletion</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0954  •  FIG-03-31-006</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.620312 716.02775)">Energy increases upward and position p→n to the right; band edges fall from p to n. Example V_bi≈0.7143 V from the stipulated concentrations at300 K. Biased panels</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(151.767969 729.023375)">intentionally omit a single equilibrium Fermi level: nonequilibrium carriers require quasi-Fermi levels. Band curvature/widths are schematic; barrier change</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(286.294531 741.740875)">q(V_bi−V_A) applies in the junction teaching approximation, not beyond breakdown or high injection.</text>
  </g>
 </g>
