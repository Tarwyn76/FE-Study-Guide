  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0606  •  FIG-02-52-001</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.066406 656.640625)">Kelvin–Planck: a cyclic device cannot convert heat from one reservoir entirely into work as its sole effect. Clausius: a cyclic device cannot move heat</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(219.104688 669.358125)">from cold to warm as its sole effect. These forbidden diagrams illustrate the limits; they are not usable machines.</text>
  </g>
