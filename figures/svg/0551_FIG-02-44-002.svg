  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.8625 590.616625)">Steady, incompressible, inviscid flow along one streamline with gravity as body force; no shaft work. Here v is local streamline</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(237.534375 603.334125)">speed. Across streamlines, an additional irrotational-flow condition is needed.</text>
