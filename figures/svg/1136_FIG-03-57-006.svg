  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned solution mass fraction0.10 and density1.10 kg/L; dose is active chemical per process-water volume. Dilution can change concentration and metering</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">volume without changing the required active mass. Actual pumps require calibration and compatible materials. Purity, reaction demand, safety, and dose-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">control feedback are separate considerations.</text>
  </g>
