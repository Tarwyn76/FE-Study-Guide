   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0918  •  FIG-03-26-005</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.663281 650.281875)">Conceptual bar layout illustrating straight development, hook, lap and clear cover; overlap here is a teaching locator, not a prescribed lap detail. Clear</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.652344 662.999375)">cover is measured to the outer steel surface, and effective depth to the bar centroid. Required development/lap lengths, bend diameters, confinement and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(272.128906 675.716875)">cover depend on the selected code and materials; no construction dimensions are specified.</text>
  </g>
