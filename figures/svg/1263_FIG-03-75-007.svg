  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Availability includes repair; mission reliability and lifecycle risk answer other questions</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1263  •  FIG-03-75-007</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned alternating up/repair process with long-run mean up time1000 h and repair time10 h. The exponential mission curve additionally assumes a constant</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">failure rate; the availability ratio alone does not require exponential distributions. Maintainability concerns restoration time, while lifecycle risk also</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">combines consequence, environment, aging, and uncertainty. No safety conclusion follows from high availability.</text>
  </g>
