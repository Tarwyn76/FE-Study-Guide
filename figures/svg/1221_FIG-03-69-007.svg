  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned matched-period illustration. Energy falls100/1200=8.33%, while intensity falls(1.2−1100/1200)/1.2=23.61%. A causal improvement claim requires</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">comparable product mix, conditions, boundaries, and quality. Energy, emissions, cost, and peak power are different metrics; no carbon factor is assigned.</text>
  </g>
