  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Combustion quality depends on air ratio as well as mixing, residence time, and temperature</text>
