  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Qualitative schematic, arbitrary relative scales. Rich mixtures can leave incomplete products; excess air can increase stack losses. Lean operation can</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">still form CO if the flame cools or mixing is poor. Curves are not measured emissions, combustion limits, or a calibrated efficiency model.</text>
  </g>
