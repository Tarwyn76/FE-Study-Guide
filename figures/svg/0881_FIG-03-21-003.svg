  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Sampling locations and timing must match the treatment question being investigated</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0881  •  FIG-03-21-003</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.698437 650.281875)">Conceptual representative treatment sampling points. Grab captures conditions at sampling time; a correctly weighted composite may characterize a specified interval.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(152.182031 662.999375)">Some analytes require grab sampling or preservation and cannot be validly combined. Match analyte, location, timing, handling and approved method; no</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(431.657812 675.716875)">compliance-sampling schedule is assigned.</text>
  </g>
