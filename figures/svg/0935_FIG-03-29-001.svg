   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="311.1192" y="448.293727" transform="rotate(-0 311.1192 448.293727)">Reaction: vt=50.0 m</text>
   </g>
   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="660.996" y="447.101407" transform="rotate(-0 660.996 447.101407)">Braking: v²/(2a)=58.82 m</text>
   </g>
   <g id="text_5">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="569.722437" transform="rotate(-0 504 569.722437)">t=2.5 s; a=3.4 m/s² → level-road SSD=108.82 m</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Stopping distance combines travel during reaction with travel during braking</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0935  •  FIG-03-29-001</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.423437 650.281875)">Physics teaching example with constant initial speed during reaction, then constant deceleration on a level road. Exact SI formula SSD=vt+v²/(2a); grade</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.220312 662.999375)">changes the braking term. Driver, tire, pavement and visibility conditions affect real stopping performance. Roadway dimensions are schematic; stated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(298.989844 675.716875)">reaction/deceleration are assumptions rather than universally guaranteed values.</text>
  </g>
