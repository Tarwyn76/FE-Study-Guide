   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="97.993" transform="rotate(-0 59.4 97.993)">Strain sensors use resistance changes or generated charge</ns0:text>
  </ns0:g>
  <ns0:g id="text_15">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.304688 656.640625)">Gauge bonded to the member experiences axial strain. Piezoresistive devices require electrical excitation; piezoelectric devices generate charge under applied force.</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(152.8625 669.358125)">Leakage makes ordinary piezoelectric measurement unsuitable for indefinite static load measurement without special methods. Diagrams are conceptual.</ns0:text>
  </ns0:g>
