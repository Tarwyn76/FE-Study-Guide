  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Strain sensors use resistance changes or generated charge</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0714  •  FIG-02-67-004</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.304688 656.640625)">Gauge bonded to the member experiences axial strain. Piezoresistive devices require electrical excitation; piezoelectric devices generate charge under applied force.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(152.8625 669.358125)">Leakage makes ordinary piezoelectric measurement unsuitable for indefinite static load measurement without special methods. Diagrams are conceptual.</text>
  </g>
