<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080pt" height="600pt" viewBox="0 0 1080 600" version="1.1">
  <defs>
    <style>
      .title{font:700 30px "DejaVu Sans",Arial,sans-serif;fill:#23313d}
      .head{font:700 22px "DejaVu Sans",Arial,sans-serif;fill:#23313d}
      .body{font:18px "DejaVu Sans",Arial,sans-serif;fill:#23313d}
      .small{font:16px "DejaVu Sans",Arial,sans-serif;fill:#23313d}
      .box{fill:#f5f8fa;stroke:#235a78;stroke-width:2}
      .accent{stroke:#a23b34;stroke-width:4;fill:none}
      .arrow{stroke:#b47722;stroke-width:3;fill:none}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#b47722"/>
    </marker>
  </defs>

  <g id="figure_1">
    <rect x="0" y="0" width="1080" height="600" fill="#ffffff"/>
    <g id="text_13">
      <text class="title" x="540" y="54" text-anchor="middle">Strain and force transducers</text>
    </g>

    <g id="axes_1">
      <!-- Metallic strain gauge -->
      <rect class="box" x="55" y="105" width="300" height="390" rx="10"/>
      <text class="head" x="205" y="145" text-anchor="middle">METALLIC STRAIN GAUGE</text>
      <rect x="100" y="205" width="210" height="70" fill="#edf3f6" stroke="#235a78" stroke-width="2"/>
      <path class="accent" d="M125 255 L125 220 L150 220 L150 255 L175 255 L175 220 L200 220 L200 255 L225 255 L225 220 L250 220 L250 255 L275 255 L275 220"/>
      <text class="body" x="205" y="305" text-anchor="middle">Bonded to loaded member</text>
      <text class="body" x="205" y="350" text-anchor="middle">GF = (ΔR/R) / ε</text>
      <text class="small" x="205" y="392" text-anchor="middle">Typical metallic GF ≈ 2</text>
      <text class="small" x="205" y="426" text-anchor="middle">Requires electrical excitation</text>
      <text class="small" x="205" y="460" text-anchor="middle">Best for static or dynamic strain</text>

      <!-- Piezoresistive -->
      <rect class="box" x="390" y="105" width="300" height="390" rx="10"/>
      <text class="head" x="540" y="145" text-anchor="middle">PIEZORESISTIVE</text>
      <rect x="445" y="205" width="190" height="70" fill="#edf3f6" stroke="#235a78" stroke-width="2"/>
      <text class="body" x="540" y="248" text-anchor="middle">Semiconductor element</text>
      <path class="arrow" d="M540 180 L540 202" marker-end="url(#arrowhead)"/>
      <text class="body" x="540" y="320" text-anchor="middle">Stress changes resistivity</text>
      <text class="small" x="540" y="365" text-anchor="middle">High sensitivity</text>
      <text class="small" x="540" y="399" text-anchor="middle">Requires electrical excitation</text>
      <text class="small" x="540" y="433" text-anchor="middle">Common in pressure sensors</text>

      <!-- Piezoelectric -->
      <rect class="box" x="725" y="105" width="300" height="390" rx="10"/>
      <text class="head" x="875" y="145" text-anchor="middle">PIEZOELECTRIC</text>
      <path class="arrow" d="M875 175 L875 215" marker-end="url(#arrowhead)"/>
      <text class="small" x="875" y="170" text-anchor="middle">Applied force</text>
      <rect x="815" y="220" width="120" height="70" fill="#edf3f6" stroke="#235a78" stroke-width="2"/>
      <text class="body" x="875" y="263" text-anchor="middle">Crystal</text>
      <text class="body" x="875" y="335" text-anchor="middle">q = dF</text>
      <text class="small" x="875" y="380" text-anchor="middle">Generates charge directly</text>
      <text class="small" x="875" y="414" text-anchor="middle">Excellent for dynamic force</text>
      <text class="small" x="875" y="448" text-anchor="middle">Not ideal for indefinite static load</text>
    </g>
  </g>
</svg>
