  </ns0:g>
  <ns0:g id="text_8" transform="translate(0.000000 -70.581841)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.740625 650.142812)"><ns0:tspan font-size="10.000px">First-order propagation of standard uncertainties for uncorrelated inputs. Sensitivity coefficients have the necessary derivative units. Expanded U=k u</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">c</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.170312 663.138438)">with k=2 gives 0.141 Ω; an approximate 95% interpretation requires suitable distribution and degrees of freedom. Correlated inputs require covariance</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(487.93125 675.855937)">terms.</ns0:text>
  </ns0:g>
