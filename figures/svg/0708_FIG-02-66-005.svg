  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.740625 650.142812)">First-order propagation of standard uncertainties for uncorrelated inputs. Sensitivity coefficients have the necessary derivative units. Expanded U=k u_c</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.170312 663.138438)">with k=2 gives 0.141 Ω; an approximate 95% interpretation requires suitable distribution and degrees of freedom. Correlated inputs require covariance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(487.93125 675.855937)">terms.</text>
  </g>
