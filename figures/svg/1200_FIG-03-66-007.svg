   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(451.148438 185.65325)">Strategy: reliable,</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(456.003125 211.08825)">efficient delivery</text>
   </g>
   <g id="text_2">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(243.680906 335.143162)">Financial</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(197.230359 359.306412)">Cost per good unit</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(239.505359 383.469662)">$24 / unit</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(748.573234 335.143162)">Customer</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(723.027141 359.306412)">On-time orders</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(720.143 383.469662)">92 / 100 = 92%</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(209.146922 537.340762)">Internal process</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(214.314031 561.504012)">First-pass yield</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(210.707 585.667262)">96 / 100 = 96%</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(698.040656 537.340762)">Learning / capability</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(703.431906 561.504012)">Qualified operators</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(726.187375 585.667262)">18 / 20 = 90%</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A balanced scorecard connects strategy to complementary performance measures</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1200  •  FIG-03-66-007</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned scorecard measures share a strategy, not a common numerical scale. A measure needs an owner, denominator, observation period, direction, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">target. Leading capability measures and lagging outcomes complement each other; proposed causal links require evidence. No weighted composite score is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">inferred.</text>
  </g>
 </g>
