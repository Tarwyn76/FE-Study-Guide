<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Universal gas constant forms</title>
<desc id="svg-desc">Four common forms of the universal gas constant with units and use cases</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1160" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">UNIVERSAL GAS CONSTANT — SELECT BY UNITS</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Each value is the same constant expressed in a different unit system.</text>
<rect x="80" y="210" width="800" height="350" rx="22" fill="#F8FAFC" stroke="#2F6F9F" stroke-width="4" />
<rect x="80" y="210" width="800" height="70" rx="22" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="0" />
<text x="110" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start">SI — ENERGY FORM</text>
<text x="480" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033" text-anchor="middle">8,314 J/(kmol·K)</text>
<line x1="140" y1="415" x2="820" y2="415" stroke="#AAB7C4" stroke-width="2" stroke-linecap="round" />
<text x="480" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">Use with energy in joules</text>
<text x="480" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">and amount in kilomoles</text>
<rect x="920" y="210" width="800" height="350" rx="22" fill="#F8FAFC" stroke="#2A7F7F" stroke-width="4" />
<rect x="920" y="210" width="800" height="70" rx="22" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="950" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start">SI — pV FORM</text>
<text x="1320" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033" text-anchor="middle">8.314 kPa·m³/(kmol·K)</text>
<line x1="980" y1="415" x2="1660" y2="415" stroke="#AAB7C4" stroke-width="2" stroke-linecap="round" />
<text x="1320" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">Use when p is kPa</text>
<text x="1320" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">and V is m³</text>
<rect x="80" y="640" width="800" height="350" rx="22" fill="#F8FAFC" stroke="#C85D32" stroke-width="4" />
<rect x="80" y="640" width="800" height="70" rx="22" fill="#C85D32" stroke="#C85D32" stroke-width="0" />
<text x="110" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start">USCS</text>
<text x="480" y="805" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033" text-anchor="middle">1,545 ft·lbf/(lbmol·°R)</text>
<line x1="140" y1="845" x2="820" y2="845" stroke="#AAB7C4" stroke-width="2" stroke-linecap="round" />
<text x="480" y="895" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">Use with ft·lbf, lbmol,</text>
<text x="480" y="933" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">and absolute °R</text>
<rect x="920" y="640" width="800" height="350" rx="22" fill="#F8FAFC" stroke="#D39A22" stroke-width="4" />
<rect x="920" y="640" width="800" height="70" rx="22" fill="#D39A22" stroke="#D39A22" stroke-width="0" />
<text x="950" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start">CHEMISTRY</text>
<text x="1320" y="805" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033" text-anchor="middle">0.08206 L·atm/(mol·K)</text>
<line x1="980" y1="845" x2="1660" y2="845" stroke="#AAB7C4" stroke-width="2" stroke-linecap="round" />
<text x="1320" y="895" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">Use with litres, atmospheres,</text>
<text x="1320" y="933" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#526274" text-anchor="middle">moles, and kelvin</text>
<text x="900" y="1090" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#B94747" text-anchor="middle">Do not choose by memory — choose the row whose units cancel.</text>
</svg>