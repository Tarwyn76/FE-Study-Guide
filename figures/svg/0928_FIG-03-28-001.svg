  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0928  •  FIG-03-28-001</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(149.753125 650.281875)">Mohr–Coulomb teaching model; upper half-circle shown. Principal effective stresses define circle center/radius. Tangency was computed from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.7625 662.999375)">σ′₁=σ′₃(1+sinφ′)/(1−sinφ′)+2c′cosφ′/(1−sinφ′). Undrained total-stress parameters are a different basis. Straight envelope and assigned strengths do not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(406.325 675.716875)">characterize a real soil without testing.</text>
  </g>
 </g>
