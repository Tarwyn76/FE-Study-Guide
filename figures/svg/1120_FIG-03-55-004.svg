  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Monitoring locations test upgradient conditions and downgradient plume migration</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1120  •  FIG-03-55-004</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Conceptual investigation layout, not a complete sampling plan. Upgradient groundwater provides context; downgradient and side-gradient wells constrain</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">migration. Soil borings and screened groundwater intervals sample different media. Screen depth, seasonal head variation, sampling quality, and source</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">heterogeneity must be considered independently.</text>
  </g>
