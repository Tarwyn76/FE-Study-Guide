<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="690pt" height="410pt" viewBox="20 20 690 410">
  <defs>
    <style>
      text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#23313d}
      .box{stroke:#235a78;stroke-width:1.2;fill:#f7f8f9}
      .rational{fill:#e8f0f5}
      .inner{fill:#ffffff}
      .subset{fill:#f9fbfc}
      .head{font-weight:700}
      .math{font-family:'STIXGeneral','FreeSerif',serif}
    </style>
  </defs>
  <rect x="0" y="0" width="730" height="450" fill="#ffffff"/>
  <text x="32" y="46" class="head" font-size="18">The number sets</text>

  <!-- Complex numbers -->
  <rect x="48" y="67" width="625" height="310" class="box"/>
  <text x="66" y="94" class="head" font-size="14">COMPLEX NUMBERS  <tspan class="math">ℂ</tspan></text>

  <!-- Real numbers -->
  <rect x="72" y="108" width="455" height="219" class="box"/>
  <text x="89" y="134" class="head" font-size="14">REAL NUMBERS  <tspan class="math">ℝ</tspan></text>

  <!-- Rational numbers -->
  <rect x="94" y="150" width="303" height="157" class="box rational"/>
  <text x="111" y="174" class="head" font-size="13">RATIONAL NUMBERS  <tspan class="math">ℚ</tspan></text>

  <!-- Integers -->
  <rect x="116" y="190" width="259" height="94" class="box inner"/>
  <text x="132" y="211" class="head" font-size="11">INTEGERS  <tspan class="math">ℤ</tspan></text>
  <text x="245" y="230" font-size="10.5" text-anchor="middle">… −2, −1, 0, 1, 2 …</text>

  <!-- Whole numbers -->
  <rect x="145" y="239" width="205" height="37" class="box subset"/>
  <text x="158" y="254" class="head" font-size="9.5">WHOLE NUMBERS  <tspan class="math">𝕎</tspan></text>
  <text x="190" y="268" font-size="9.5" text-anchor="middle">0, 1, 2, 3, …</text>

  <!-- Natural numbers nested in whole numbers -->
  <rect x="274" y="245" width="64" height="25" class="box inner"/>
  <text x="306" y="256" class="head" font-size="7.0" text-anchor="middle">NATURAL  <tspan class="math">ℕ</tspan></text>
  <text x="306" y="266" font-size="7.0" text-anchor="middle">1, 2, 3, …</text>

  <!-- Rational examples -->
  <text x="245" y="300" font-size="11.5" text-anchor="middle">½   −¾   0.125</text>

  <!-- Irrational numbers -->
  <text x="466" y="170" class="head" font-size="12" text-anchor="middle">IRRATIONAL</text>
  <text class="math" x="466" y="194" font-size="10.5" text-anchor="middle">ℝ∖ℚ = {x ∣ x∈ℝ ∧ x∉ℚ}</text>
  <text x="466" y="227" font-size="17" text-anchor="middle">π   e   √2</text>

  <!-- Imaginary numbers -->
  <rect x="546" y="145" width="104" height="118" class="box inner"/>
  <text x="598" y="168" class="head" font-size="11" text-anchor="middle">IMAGINARY</text>
  <text x="598" y="185" class="head" font-size="10" text-anchor="middle">NUMBERS  <tspan class="math">𝕀</tspan></text>
  <text x="598" y="215" font-size="12" text-anchor="middle">i, 2i, −3i</text>
  <text x="598" y="238" font-size="10" text-anchor="middle">i² = −1</text>


  <!-- Complex-number examples -->
  <text x="598" y="287" class="head" font-size="10" text-anchor="middle">COMPLEX EXAMPLES</text>
  <text x="598" y="305" font-size="10.5" text-anchor="middle">3 + 2i,  −1 + 4i,  5 − i</text>

  <!-- Complex-number definition -->
  <text class="math" x="357" y="360" font-size="10.5" text-anchor="middle">ℂ = {a + bi ∣ a,b ∈ ℝ}</text>

  <!-- Set relation -->
  <text class="math" x="357" y="337" font-size="10.5" text-anchor="middle">ℕ ⊂ 𝕎 ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ    and    𝕀 ⊂ ℂ</text>
</svg>