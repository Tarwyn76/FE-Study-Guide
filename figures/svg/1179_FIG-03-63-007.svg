  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Model verification example, not proof that a real process is represented correctly. Constraint residuals are b−Ax. Complementary slackness and primal/dual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">agreement support this continuous LP result. Also compare small test cases, input provenance, solver status, numerical tolerances, and sensitivity</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">assumptions before operational use.</text>
  </g>
