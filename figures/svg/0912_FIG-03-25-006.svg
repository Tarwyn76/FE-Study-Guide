  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(105.909375 650.00375)">Same illustrative sharp-cornered I-section as901, E=200,000 MPa,F_y=345 MPa. Handbook360-16 nonslender flexural-buckling curve is shown; with equal K/L,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.15 662.999375)">smaller r_y produces lower F_cr. Actual W-column design may also require local, torsional, flexural-torsional and interaction checks. Section illustration</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(427.477344 675.995)">is not a manufacturer’s shape.</text>
