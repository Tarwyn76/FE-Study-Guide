  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1245  •  FIG-03-73-003</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Elementary external static moment model around a reference joint, with force perpendicular to the moment arm. It excludes body-segment weights, muscle</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">lever arms, dynamics, and internal joint forces, so it is not a lifting limit or injury prediction. Cumulative exposure also depends on repetition,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">duration, posture, and recovery; no numeric trauma threshold is asserted.</text>
  </g>
