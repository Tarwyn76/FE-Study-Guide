   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(175.070594 446.311062)">HIT</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.335516 467.930812)">Read or write</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(855.78625 446.311062)">MISS</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(816.297109 467.930812)">Choose victim</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="290.088" y="371.588725" transform="rotate(-0 290.088 371.588725)">Yes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="780.3" y="371.588725" transform="rotate(-0 780.3 371.588725)">No</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(796.8455 599.6854)">If dirty:write back</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(800.88425 620.0334)">Fetch / fill / retry</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(194.478562 602.057862)">Write-through: update next level</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(191.932547 623.677612)">Write-back: mark cache line dirty</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Cache access checks validity and tags before miss handling or write policy</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1044  •  FIG-03-44-005</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Simplified access flow with write-allocate misses assumed. Direct-mapped caches have a predetermined victim; associative caches need a replacement policy.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Dirty eviction applies to write-back caches. No-write-allocate is a separate miss policy; write-through/write-back specify handling of writes that hit.</text>
  </g>
