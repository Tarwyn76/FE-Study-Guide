  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual two-dimensional flow sketches, not CFD or measured separation angles. Body shape and pressure gradient influence boundary-layer separation;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Reynolds number and surface conditions also matter. The streamlined sketch shows a smaller wake in this illustration, not a guaranteed drag value. Friction</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">drag remains, and the upstream/downstream geometry must be compared on a stated reference area.</text>
  </g>
 </g>
