  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A helical torsion spring converts arm force into wire bending and angular deflection</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1325  •  FIG-03-84-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned coil-body torsion-spring model, negligible arm compliance. Units converted consistently to N·m/rad. Despite its name, a helical torsion spring</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">wire is primarily in bending. Ki=(4C²−C−1)/[4C(C−1)], C10. Load direction, winding, and material limits need consideration in real design.</text>
  </g>
