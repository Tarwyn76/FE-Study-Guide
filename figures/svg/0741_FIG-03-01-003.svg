   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="111.111" transform="rotate(-0 55.44 111.111)">Degrees of freedom count unknowns minus independent usable equations</ns0:text>
  </ns0:g>
  <ns0:g id="text_18">
</ns0:g>
  <ns0:g id="text_19" transform="translate(0.000000 -56.942140)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(100.729687 650.142812)"><ns0:tspan font-size="10.000px">Nonreactive two-component mixer with known feed rates and compositions. Unknowns are P,x</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A,x</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">B</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">. Solution P=100 mol/s,x</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=0.40,x</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">B</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=0.60. Do not add the</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(103.470312 663.138438)">total balance as a third independent balance on top of both component balances. DOF=0 is necessary for determination but does not guarantee consistency or</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(473.810156 675.855937)">uniqueness.</ns0:text>
  </ns0:g>
 </ns0:g>
