   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="248.3208" y="412.12725" transform="rotate(-0 248.3208 412.12725)">Composition normalization</text>
