   <ns0:g id="text_12">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="755.1936" y="411.7935" transform="rotate(-0 755.1936 411.7935)"><ns0:tspan font-size="12.000px">x</ns0:tspan><ns0:tspan font-size="8.160px" dy="2.880px">A</ns0:tspan><ns0:tspan font-size="12.000px" dy="-2.880px">+x</ns0:tspan><ns0:tspan font-size="8.160px" dy="2.880px">B</ns0:tspan><ns0:tspan font-size="12.000px" dy="-2.880px">=1</ns0:tspan></ns0:text>
