  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Degrees of freedom count unknowns minus independent usable equations</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0741  •  FIG-03-01-003</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(100.729687 650.142812)">Nonreactive two-component mixer with known feed rates and compositions. Unknowns are P,x_A,x_B. Solution P=100 mol/s,x_A=0.40,x_B=0.60. Do not add the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(103.470312 663.138438)">total balance as a third independent balance on top of both component balances. DOF=0 is necessary for determination but does not guarantee consistency or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(473.810156 675.855937)">uniqueness.</text>
  </g>
