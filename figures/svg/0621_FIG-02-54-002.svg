  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.950781 590.616625)">Reversible limits for heat transfer between two constant-temperature reservoirs. Actual COP is lower. The ideal limit diverges as</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(172.290625 603.334125)">lift approaches zero; that limit does not guarantee finite useful capacity or negligible equipment losses.</text>
