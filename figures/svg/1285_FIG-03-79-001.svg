  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A sand-casting mold provides a connected feed path and a riser for solidification shrinkage</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1285  •  FIG-03-79-001</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Original simplified mold section, not a designed gating system. The sprue, runner, gate, cavity, and riser are connected; a hot spot is a candidate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">shrinkage location rather than a prediction. Porosity, inclusions, cold shuts, and shrinkage have different causes. Actual feeding, venting, alloy</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">behavior, cooling modulus, and process parameters need evaluated geometry and evidence.</text>
  </g>
