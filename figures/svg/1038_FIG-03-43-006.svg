    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(835.932656 244.788862)">register</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="378.157275" transform="rotate(-0 540 378.157275)">Capture clock arrives tskew later than launch clock.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="132.241275" transform="rotate(-0 540 132.241275)">Data path:tCQ →logic delay →setup / hold at capture input</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="126.684" y="477.60045" transform="rotate(-0 126.684 477.60045)">Check</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="429.462" y="477.60045" transform="rotate(-0 429.462 477.60045)">Constraint</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="842.778" y="477.60045" transform="rotate(-0 842.778 477.60045)">Illustrative margin</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="126.684" y="548.64285" transform="rotate(-0 126.684 548.64285)">Setup</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="429.462" y="548.64285" transform="rotate(-0 429.462 548.64285)">T≥tCQ,max+tpd,max+tsetup−tskew</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="842.778" y="548.64285" transform="rotate(-0 842.778 548.64285)">5−(0.3+3.8+0.5−0.2)=0.6 ns</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="126.684" y="619.68525" transform="rotate(-0 126.684 619.68525)">Hold</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="429.462" y="619.68525" transform="rotate(-0 429.462 619.68525)">tCQ,min+tcd,min≥thold+tskew</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="842.778" y="619.68525" transform="rotate(-0 842.778 619.68525)">0.1+0.4−(0.2+0.2)=0.1 ns</text>
   </g>
   <g id="text_15">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="690.754625" transform="rotate(-0 540 690.754625)">Positive capture skew helps setup but makes hold more demanding.</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Setup and hold constrain maximum and minimum register-path delays</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1038  •  FIG-03-43-006</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Same-frequency rising-edge registers; positive skew means later capture clock. Example T=5 ns,tCQ,max/min=0.3/0.1 ns,logic max/min=3.8/0.4 ns,setup=0.5</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">ns,hold=0.2 ns,skew=0.2 ns. Clock uncertainty and jitter are omitted; hold is not repaired merely by increasing the period.</text>
  </g>
 </g>
