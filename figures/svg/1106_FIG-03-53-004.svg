   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="588.06" y="198.37075" transform="rotate(-0 588.06 198.37075)">Sediment transport</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(797.392547 322.633187)">Low-velocity reach</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(836.526609 346.796437)">deposition</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="251.64" y="449.199675" transform="rotate(-0 251.64 449.199675)">Cover / slope stabilization</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="549.612" y="547.566075" transform="rotate(-0 549.612 547.566075)">Bank protection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="596.473337" transform="rotate(-0 828.36 596.473337)">Sediment capture / maintenance</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Erosion, transport, and deposition occur at different locations in a watershed</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1106  •  FIG-03-53-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual slope and stream section, not a sediment-budget calculation. Stabilization addresses sources and banks; trapping sediment downstream does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">eliminate upstream erosion. Particle size, shear stress, flow variability, and habitat effects govern suitable measures. Stabilization labels are examples,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">not engineering specifications.</text>
  </g>
 </g>
