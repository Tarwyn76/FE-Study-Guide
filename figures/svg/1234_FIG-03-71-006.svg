   <g id="text_14">
    <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="599.784587" transform="rotate(-0 540 599.784587)">Round aggregate requirement up:2 crews</text>
   </g>
   <g id="text_15">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="679.549087" transform="rotate(-0 540 679.549087)">If each crew has2 people:2 crews correspond to4 people.</text>
