    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="483.920037" transform="rotate(-0 540 483.920037)">440 crew-min/day ÷ 400 min/crew·day=1.10 crews</text>
