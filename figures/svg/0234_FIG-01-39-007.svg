   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="153.113188" transform="rotate(-0 331.7184 153.113188)">Collect rational subgroups in time order</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="264.731188" transform="rotate(-0 331.7184 264.731188)">Compute subgroup mean and spread</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="376.349188" transform="rotate(-0 331.7184 376.349188)">Chart spread; investigate special causes if unstable</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="487.967188" transform="rotate(-0 331.7184 487.967188)">Chart mean; apply the four selected zone tests</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="599.585188" transform="rotate(-0 331.7184 599.585188)">If signal: investigate and document; revise baseline only with justification</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="331.7184" y="711.203188" transform="rotate(-0 331.7184 711.203188)">If stable: freeze baseline and monitor future subgroups</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(739.779219 626.711841)">Stable process</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(714.986797 644.232388)">→ compare with specs</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(717.915859 661.752934)">and assess capability</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="844.316975" transform="rotate(-0 468 844.316975)">Control and capability are different questions. A special-cause investigation is not automatic permission to delete a point.</text>
   </g>
