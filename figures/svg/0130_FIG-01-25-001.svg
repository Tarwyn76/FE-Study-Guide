   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="126.957881" transform="rotate(-0 432 126.957881)">Unknown function: how many independent variables?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="224.882678" transform="rotate(-0 432 224.882678)">One or several?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(734.466937 228.901174)">PDE</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(722.952562 245.073987)">uₜ = uₓₓ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="636.4224" y="172.618116" transform="rotate(-0 636.4224 172.618116)">Several</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="352.517856" transform="rotate(-0 432 352.517856)">ODE: y(t) — identify highest derivative (order)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="473.272769" transform="rotate(-0 432 473.272769)">Linear in y and derivatives?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.294737 474.403009)">Nonlinear</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.516925 490.575821)">y′ = y²</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(382.745781 585.806932)">Linear: L[y] = g(t)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(376.120859 600.63201)">g = 0 homogeneous</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(365.784297 615.457088)">g ≠ 0 nonhomogeneous</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="687.555654" transform="rotate(-0 432 687.555654)">Finally: constant coefficients or variable coefficients?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="471.312" y="288.148392" transform="rotate(-0 471.312 288.148392)">One</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="259.0272" y="444.114263" transform="rotate(-0 259.0272 444.114263)">No</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="471.312" y="536.538483" transform="rotate(-0 471.312 536.538483)">Yes</text>
