  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Pressure and chemical sensors define both the measurand and its reference</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0716  •  FIG-02-67-006</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.269531 716.305875)">Pressure reference is the other diaphragm-face pressure; the bowed membrane is schematic. A pH meter measures selective glass-electrode potential relative to a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.348437 729.023375)">reference electrode using a high-impedance input, calibrated buffers and temperature compensation. Chemical sensor mechanisms form parallel families, with</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(430.713281 741.740875)">selectivity and cross-sensitivity constraints.</text>
  </g>
 </g>
