   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.4195 514.261125)">Incompressible approximation</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(181.90575 537.152625)">may be adequate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(696.785344 514.261125)">Compressible conservation</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(731.442375 537.152625)">+ equation of state</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #26776f" x="184.356" y="410.3942" transform="rotate(-0 184.356 410.3942)">Yes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a23b34" x="876.42" y="410.3942" transform="rotate(-0 876.42 410.3942)">No</text>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="641.295488" transform="rotate(-0 540 641.295488)">Then evaluate heat transfer, friction, shocks, choking, and property variation.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Choose gas-flow models using Mach number, density variation, and process physics</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1305  •  FIG-03-81-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Model-selection decision tree. M≈0.3 is a common screening scale, not a universal accuracy guarantee. Strong heating, large pressure changes, or long ducts</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">can require density variation at low local Mach number. The two branches identify an approximation choice; assumptions must fit the particular process.</text>
  </g>
