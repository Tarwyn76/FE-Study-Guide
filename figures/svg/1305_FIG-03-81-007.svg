   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="187.44115" transform="rotate(-0 540 187.44115)">Specify gas / geometry / pressure / temperature / accuracy</text>
   </g>
   <g id="text_2">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(478.459297 339.027587)">Small M AND</text>
