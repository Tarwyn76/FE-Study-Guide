   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.642187 656.640625)">Hypothetical constant-storage-coefficient reservoir, dS/dt=I−O with S in m³,t in seconds and S/O=3600 s. Inflow is a triangular four-hour event; initial</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.078906 669.358125)">storage/outflow zero. Outlet structure symbol is conceptual: O=S/3600, not a computed orifice/weir rating. No infiltration or evaporation modeled.</text>
