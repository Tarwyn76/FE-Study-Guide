  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1203  •  FIG-03-67-003</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Single exponential smoothing with the same assigned demand series as1202. Forecasts are indexed by their target period. Initialization F1=100 is specified;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">F2 also equals100. The figure compares response to updates and does not claim either coefficient is optimal. Trend and seasonal extensions are separate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">models.</text>
  </g>
