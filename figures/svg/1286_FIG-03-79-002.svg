  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Turning removes a radial depth while the workpiece rotates and the tool feeds axially</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1286  •  FIG-03-79-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned longitudinal external turning, tool advances left into the uncut20 mm diameter and leaves16 mm diameter behind it. Radial depth=(20−16)/2=2 mm.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Cutting speed is specified at the initial diameter; it decreases at fixed rpm as diameter falls. Chip and tool geometry are schematic; machining</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">feasibility also depends on material, tool, power, rigidity, and actual cutting conditions.</text>
  </g>
