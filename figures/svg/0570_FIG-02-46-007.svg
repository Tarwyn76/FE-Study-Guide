  <ns0:g id="text_10" transform="translate(0.000000 -49.437509)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.580469 590.477562)"><ns0:tspan font-size="10.000px">h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">T</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> denotes the available total-head drop assigned to the turbine; connecting-pipe losses are separate. Efficiency multiplies the</ns0:tspan></ns0:text>
