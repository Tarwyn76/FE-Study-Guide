<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Dot product geometry</title>
<desc id="svg-desc">Two vectors and projection of B onto A</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1100" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">DOT PRODUCT — GEOMETRIC MEANING</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">A · B measures how much one vector points along the other.</text>
<line x1="220" y1="820" x2="1460" y2="820" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="220" y1="820" x2="980" y2="300" stroke="#2A7F7F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="980" y1="300" x2="980" y2="820" stroke="#AAB7C4" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
<line x1="220" y1="820" x2="980" y2="820" stroke="#D39A22" stroke-width="14" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 390 820 A 170 170 0 0 1 350 720" fill="none" stroke="#C85D32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="425" y="720" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#C85D32" text-anchor="start">θ</text>
<text x="1130" y="870" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#2F6F9F" text-anchor="start">A</text>
<text x="700" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#2A7F7F" text-anchor="start">B</text>
<text x="610" y="785" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#D39A22" text-anchor="middle">|B| cos θ</text>
<rect x="1060" y="220" width="650" height="310" rx="18" fill="#F6F9FB" stroke="#183B5B" stroke-width="3" />
<rect x="1060" y="220" width="650" height="62" rx="18" fill="#183B5B" stroke="#183B5B" stroke-width="0" />
<text x="1085" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">SCALAR RESULT</text>
<text x="1085" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">A · B = |A||B| cos θ</text>
<text x="1085" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">positive: same general direction</text>
<text x="1085" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">zero: perpendicular</text>
<text x="1085" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">negative: opposite directions</text>
</svg>