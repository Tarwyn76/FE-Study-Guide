  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Ideal air normal shock, no heat/work transfer. Conservation of mass, momentum, and total enthalpy gives the stated downstream values. Entropy rises; total</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">pressure is not conserved. Static temperature rises even though total temperature remains540 K.</text>
  </g>
