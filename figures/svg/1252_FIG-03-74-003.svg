   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Original fishbone branches list candidate causes, not demonstrated causal relationships. Assigned quadratic loss uses target10 mm and calibration$4 at0.2</text>
