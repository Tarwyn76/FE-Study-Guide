   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Resource efficiency accounts for useful output and residual streams on the same basis</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1227  •  FIG-03-70-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned steady mass balance without reaction or accumulation. Recovered material is an external exit, not both an exit and an uncounted internal recycle.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Product yield is80%; product plus recovery totals95% diverted from the unrecovered stream but is not95% product yield. Energy, water, toxicity, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">lifecycle effects require separate indicators.</text>
  </g>
