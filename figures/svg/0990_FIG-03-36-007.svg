  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.350781 650.281875)">Synthetic linear voltage-versus-load profile, not a solved transformer or feeder curve. Standard pictured definition normalizes by full-load magnitude.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.558594 662.999375)">Actual profile depends on complex impedance, power factor, control and source conditions; leading PF can yield negative regulation. This figure does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(360.707031 675.716875)">imply every source/load drops linearly or by this amount.</text>
  </g>
