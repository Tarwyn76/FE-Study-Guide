   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(160.505 193.85045)">Planning</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(80.51125 219.28545)">Requirements / methods</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(488.175 193.85045)">Assurance</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(444.148438 219.28545)">Process confidence</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(840.277812 193.85045)">Control</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(762.6075 219.28545)">Evaluate actual output</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="446.743212" transform="rotate(-0 203.58 446.743212)">Evidence / deviations</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(476.096172 434.661587)">Improvement</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(466.342344 458.824837)">Address causes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(796.461172 434.661587)">Updated process</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(806.103672 458.824837)">Verify / sustain</text>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="619.436287" transform="rotate(-0 540 619.436287)">Requirements → method → evidence → corrective learning → revised baseline</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Quality planning, assurance, control, and improvement have distinct purposes</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1250  •  FIG-03-74-001</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual quality-management structure. Planning defines acceptable outcomes and methods; assurance examines the process and evidence; control evaluates</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">realized results; improvement changes causes and verifies effects. These roles interact rather than form a mandatory linear certification sequence.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">Proposed metrics include defect rate, first-pass yield, and recurrence of validated nonconformities.</text>
  </g>
 </g>
