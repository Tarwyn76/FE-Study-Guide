  <g id="text_29">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Waste identification begins with observable conditions and measurable consequences</text>
  </g>
  <g id="text_30">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1223  •  FIG-03-70-002</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Eight-category teaching convention with representative examples rather than a diagnosis of a facility. A low local cost or higher machine activity does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">by itself remove waste. Measures need a baseline, consistent boundary, and quality/safety constraints; changes can move queues or burden to another</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">location.</text>
  </g>
