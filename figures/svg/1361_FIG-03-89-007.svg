   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="227.875275" transform="rotate(-0 413.8425 227.875275)">CONTROLLER</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="227.875275" transform="rotate(-0 666.1575 227.875275)">VALVE / DRIVE</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="227.875275" transform="rotate(-0 918.4725 227.875275)">ACTUATOR</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="487.177337" transform="rotate(-0 540 487.177337)">POSITION / SPEED SENSOR</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="400.844287" transform="rotate(-0 540 400.844287)">Feedback measurement → error → commanded effort</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="625.177025" transform="rotate(-0 540 625.177025)">Define safe state for pressure, inertia, gravity, springs, and electrical supply.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A feedback loop commands motion while stored-energy and safe-state requirements remain explicit</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1361  •  FIG-03-89-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual closed-loop actuator. Ordinary feedback control is not itself a safety-rated function. Stored energy can remain after command removal; the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">desired safe state and independent protective behavior must be defined for the particular machine and failure modes.</text>
  </g>
