   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(279.876719 509.357547)">Solute: 1000(0.10)=250(0.40)=100 kg/h</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(274.342344 539.007703)">Q̇=750×2257=1.693×10⁶ kJ/h=470.2 kW</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An evaporator concentrates nonvolatile solute while vapor removes solvent</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0793  •  FIG-03-08-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.025 650.281875)">Ideal single effect, nonvolatile solute, negligible entrainment/loss and boiling-point elevation; feed and concentrate already at the boiling temperature.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.874219 662.999375)">Vapor latent heat2257 kJ/kg. Steam latent heat2200 kJ/kg gives769.43 kg/h steam and equal condensate. Feed sensible heating, solution enthalpy and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(414.920313 675.716875)">pressure effects would modify duty.</text>
  </g>
