  </g>
  <g id="text_7" transform="translate(0.000000 -79.594325)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.810156 590.477562)"><tspan font-size="10.000px">Uniform circular pipe, steady incompressible flow, ρ=1000 kg/m³. f</tspan><tspan font-size="6.800px" dy="2.400px">D</tspan><tspan font-size="10.000px" dy="-2.400px"> is the Darcy factor; f</tspan><tspan font-size="6.800px" dy="2.400px">D</tspan><tspan font-size="10.000px" dy="-2.400px">=4f</tspan><tspan font-size="6.800px" dy="2.400px">Fanning</tspan><tspan font-size="10.000px" dy="-2.400px">. Pressure-loss expression</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(253.485937 603.473187)">isolates friction; elevation/velocity changes are separate energy terms.</text>
  </g>
