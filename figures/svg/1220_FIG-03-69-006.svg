   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1220  •  FIG-03-69-006</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Same task chain and available time as1219. Three stations attain its lower bound. Line efficiency is total assigned work divided by station count times</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">cycle time; balance delay is22.22%. Forty seconds is summed station idle per unit cycle, not the elapsed line cycle time. The deterministic model excludes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">downtime and variability.</text>
  </g>
