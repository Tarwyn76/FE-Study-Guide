  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.589844 656.640625)">Numerically solved exponential diode in series with source/resistor. η=1, no series resistance or breakdown. The plotted load-line segment is magnified</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.070312 669.358125)">near the intersection; its full intercepts are i=5 mA at v=0 and v=5 V at i=0. Neither a fixed0.7 V model nor an arbitrary assumed point produced Q.</text>
  </g>
 </g>
