   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="305.45925" transform="rotate(-0 515.97 305.45925)">90 good /100 inspected</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="881.226" y="305.45925" transform="rotate(-0 881.226 305.45925)">90%</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="392.89605" transform="rotate(-0 174.744 392.89605)">Good throughput</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="392.89605" transform="rotate(-0 515.97 392.89605)">90 good /5 hours</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="881.226" y="392.89605" transform="rotate(-0 881.226 392.89605)">18 good/hour</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="480.33285" transform="rotate(-0 174.744 480.33285)">Availability</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="480.33285" transform="rotate(-0 515.97 480.33285)">240 running /300 planned min</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="881.226" y="480.33285" transform="rotate(-0 881.226 480.33285)">80%</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="567.76965" transform="rotate(-0 174.744 567.76965)">OEE factors</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="567.76965" transform="rotate(-0 515.97 567.76965)">Availability0.80; performance0.75; quality0.90</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="881.226" y="567.76965" transform="rotate(-0 881.226 567.76965)">0.80×0.75×0.90=54%</text>
   </g>
   <g id="text_16">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.706563" transform="rotate(-0 540 663.706563)">Aggregate counts first; avoid averaging unequal-denominator percentages.</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A KPI is a defined numerator and denominator tied to one population and time window</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1169  •  FIG-03-62-004</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic shift totals and assigned OEE factors, not measured plant performance. Count good output and inspection scope consistently; first-pass quality</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">excludes rework unless deliberately redefined. Performance requires an ideal-rate convention separate from availability. Throughput is a plant aggregate;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">it is not inferred from the sample machine-cycle times in1170.</text>
  </g>
 </g>
