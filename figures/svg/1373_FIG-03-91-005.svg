  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual material-property map. Modulus is not strength; toughness is not yield stress. The fracture relation assumes the applicable linear-elastic</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">mode-I geometry factor and crack definition. Constitutive and fracture models require the correct material condition and domain.</text>
