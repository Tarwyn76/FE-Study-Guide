    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.706563" transform="rotate(-0 540 663.706563)">Steady: Qin−Wout=Σout ṁ(h+V²/2+gz)−Σin ṁ(h+V²/2+gz)</text>
