  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A thermal-fluid control volume accounts for mass, heat, work, and transported energy</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1376  •  FIG-03-92-001</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Steady open-system energy equation with positive heat into and shaft work out of the boundary. Flow work is already included in enthalpy h; adding pv again</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">would double-count it. Mass balance and accumulation terms are separate requirements for unsteady operation.</text>
  </g>
