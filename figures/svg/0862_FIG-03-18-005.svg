  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.610937 650.142812)">Hypothetical curves at one speed, same head datum. Static head15 m plus quadratic losses; operating point solves H_p=H_s. Green band is a conceptual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.645312 663.138438)">efficiency region, not a measured pump efficiency curve or guaranteed preferred operating range. Cavitation, motor power and transient behavior are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(458.746094 675.855937)">additional checks.</text>
