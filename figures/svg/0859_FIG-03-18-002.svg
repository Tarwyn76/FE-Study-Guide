   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(163.713281 650.281875)">Illustrative Darcy friction factor and hypothetical local K values, all referenced to the shown constant-pipe velocity. ΣK=4.5,distributed factor fL/D=10.</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.797656 662.999375)">Exit/entrance represent reservoir transitions outside the drawing. Actual K depends on fitting geometry/opening and local velocity; do not substitute a Fanning</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(474.498437 675.716875)">factor without conversion.</ns0:text>
