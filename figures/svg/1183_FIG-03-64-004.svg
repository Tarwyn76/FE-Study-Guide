  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Finite capacity blocks new arrivals when all service and waiting positions are occupied</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1183  •  FIG-03-64-004</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">Birth–death M/M/1/4 with no waiting outside the boundary or abandonment. Pn=rho^n/∑rho^j; λeff=λ(1−P4) is admitted throughput. Little’s law for admitted</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">jobs uses λeff, not offered λ. Capacity includes the job in service. If overflow is rerouted or retried, that requires an expanded model.</text>
  </g>
