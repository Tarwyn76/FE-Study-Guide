   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned pump head curve H1=40−.002Q1² and constant-density, same-diameter speed change. Scaled curves use Q2=sQ1 and H2=s²H1; power ratio assumes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">comparable efficiency. Dots are corresponding similarity points, not operating points against a specified system curve. Fan pressure uses analogous speed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">trends at fixed density; changing density, cavitation, compressibility, or efficiency can require corrections.</text>
