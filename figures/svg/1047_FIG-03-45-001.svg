  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Switches connect LAN hosts; routers forward packets between networks</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1047  •  FIG-03-45-001</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Logical network topology; link shapes do not represent physical distance. Layer2 switches forward frames within a LAN; routers select next hops using</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">network-layer information. WAN cloud represents intermediate links/routers. Each routed hop generally has new link-layer framing; IP addressing supports</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">end-to-end delivery.</text>
  </g>
