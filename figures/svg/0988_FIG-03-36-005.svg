  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An ideal transformer preserves power while reflecting impedance by the square of turns ratio</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0988  •  FIG-03-36-005</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.914844 650.142812)">Ideal lossless transformer, RMS quantities, resistive load, same dotted-end voltage reference. Primary current enters its dotted terminal while secondary</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.847656 662.860312)">delivered current leaves its dot, so I_p=I_s/a for the pictured directions; both currents entering dots would have a minus sign. Magnetizing current,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(245.676562 675.855937)">copper/core loss, leakage and regulation are omitted. Dots mark winding polarity, not protective earth.</text>
  </g>
 </g>
