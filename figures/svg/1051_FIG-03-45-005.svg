    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="820.8" y="191.66325" transform="rotate(-0 820.8 191.66325)">No reliability/order guarantee</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">TCP establishes a reliable ordered byte stream; UDP sends independent datagrams</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1051  •  FIG-03-45-005</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">TCP SYN consumes one sequence number; application write boundaries are not preserved in the byte stream. Reliability applies while the connection succeeds,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">not as a guarantee against every failure. UDP retains datagram boundaries; applications may add their own acknowledgements, sequencing or reliability.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">Checksums and connection close omitted.</text>
  </g>
 </g>
