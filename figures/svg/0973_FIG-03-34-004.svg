   <g id="text_1">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(709.419834 201.155414)">A_OL→∞; R_in→∞</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(689.745459 230.041898)">i_+=i_−=0; R_out=0</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(670.492725 375.035414)">Follower: v_−=v_+=v_in</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(726.323194 403.921898)">so v_out=v_in</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(712.6746 526.484062)">Virtual equality is</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(744.907413 553.43875)">conditional</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(684.4996 580.393437)">No physical input short</text>
   </g>
  </g>
