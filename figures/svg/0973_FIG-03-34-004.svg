  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Negative feedback makes ideal op-amp inputs equal only while the output remains linear</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0973  •  FIG-03-34-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.682031 650.142812)">Ideal voltage-follower topology with feedback to the inverting input. Open-loop equation v_out=A_OL(v_+−v_−); finite linear output with A_OL→∞ implies</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.028906 663.138438)">vanishing differential voltage. Requires negative feedback, a stable closed loop, suitable common-mode range and unsaturated output. Equality is not valid</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(301.107031 675.855937)">for an arbitrary open-loop or saturated circuit; supply pins are omitted for clarity.</text>
  </g>
 </g>
