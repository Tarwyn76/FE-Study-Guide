   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="328.536" y="272.194875" transform="rotate(-0 328.536 272.194875)">AMPLIFIER</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(470.993344 260.065266)">ANTI-ALIAS</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(491.729906 284.324484)">FILTER</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="713.016" y="272.194875" transform="rotate(-0 713.016 272.194875)">ADC</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(870.071625 260.065266)">DIGITAL</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(849.754125 284.324484)">PROCESSOR</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="232.416" y="433.930813" transform="rotate(-0 232.416 433.930813)">Excitation / reference</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(480.870844 421.127336)">Analog bandwidth &lt; Nyquist</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(439.519125 446.734289)">with adequate stop-band attenuation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="905.256" y="433.654875" transform="rotate(-0 905.256 433.654875)">Sampling / scaling</text>
   </g>
   <g id="text_9">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="569.170562" transform="rotate(-0 540 569.170562)">Example12-bit ADC,3.3 V span → ideal code width3.3/4096=0.8057 mV</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">A measurement chain preserves useful signal while controlling gain, noise, and aliasing</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0976  •  FIG-03-34-007</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.914062 650.142812)">Conceptual sensor signal chain; a bridge can produce a differential signal requiring appropriate input common-mode handling. Anti-alias filter must attenuate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.75625 662.860312)">out-of-band content before sampling, not merely have a nominal cutoff below f_s/2. ADC code width is an ideal quantization step, distinct from resolution accuracy,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(283.021875 675.855937)">ENOB, input headroom and reference error. No sampling frequency or actual noise budget is assigned.</text>
  </g>
 </g>
