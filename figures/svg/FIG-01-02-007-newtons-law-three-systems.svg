<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Newton&#x27;s second law in three systems</title>
<desc id="svg-desc">SI, slug USCS, and lbm-lbf forms of Newton second law with unit annotations</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1120" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">NEWTON&#x27;S SECOND LAW — THREE UNIT SYSTEMS</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">The equation changes only when mass is expressed in lbm and force in lbf.</text>
<rect x="90" y="215" width="1620" height="220" rx="22" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="4" />
<rect x="90" y="215" width="340" height="220" rx="22" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="0" />
<text x="260" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle">SI</text>
<text x="260" y="363" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">COHERENT</text>
<text x="700" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="800" fill="#172033" text-anchor="middle">F = ma</text>
<text x="1080" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#526274" text-anchor="middle">N = kg·m/s²</text>
<rect x="90" y="480" width="1620" height="220" rx="22" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="4" />
<rect x="90" y="480" width="340" height="220" rx="22" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="260" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle">USCS — SLUG</text>
<text x="260" y="628" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">COHERENT</text>
<text x="700" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="800" fill="#172033" text-anchor="middle">F = ma</text>
<text x="1080" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#526274" text-anchor="middle">lbf = slug·ft/s²</text>
<rect x="90" y="745" width="1620" height="220" rx="22" fill="#FDF0F0" stroke="#B94747" stroke-width="4" />
<rect x="90" y="745" width="340" height="220" rx="22" fill="#B94747" stroke="#B94747" stroke-width="0" />
<text x="260" y="850" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle">USCS — LBM</text>
<text x="260" y="893" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">NEEDS g_c</text>
<text x="700" y="850" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="800" fill="#172033" text-anchor="middle">F = ma / g_c</text>
<text x="1080" y="900" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#526274" text-anchor="middle">lbf = (lbm·ft/s²) ÷ [lbm·ft/(lbf·s²)]</text>
<circle cx="880" cy="838" r="55" fill="none" stroke="#B94747" stroke-width="5"/>
<path d="M 935 815 C 1080 770 1210 765 1300 805" fill="none" stroke="#B94747" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<text x="1310" y="810" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#B94747" text-anchor="start">g_c: bookkeeping, not physics</text>
</svg>