   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0858  •  FIG-03-18-001</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.5875 650.281875)">Steady incompressible example with zero reservoir surface velocity and atmospheric surface pressure. HGL curve is the pipe-side head; tank surfaces</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.7 662.999375)">coincide with reservoir EGL/HGL, not the adjacent pipe points. Pump adds15 m; distributed/fitting/entrance/exit losses sum7 m. Pipe velocity-head offset</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(367.528125 675.716875)">assumes constant diameter; loss splits are illustrative.</text>
  </g>
