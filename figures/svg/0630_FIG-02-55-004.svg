  </ns0:g>
  <ns0:g id="text_12" transform="translate(0.000000 -73.968153)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.880469 590.616625)">Steady 1D series path with common area, no contact resistance, no internal generation. The heat rate through each element is the</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(226 603.334125)">same. Node temperatures differ by Q̇ times the corresponding thermal resistance.</ns0:text>
