   <g id="text_4">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="369.435175" transform="rotate(-0 540 369.435175)">CaCO3+2H⁺ →Ca²⁺+CO2+H2O</text>
   </g>
   <g id="text_5">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(361.982188 507.356575)">For a1.00 L sample:99.91 meq/L</text>
