  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Stoichiometric coefficients connect mass, moles, equivalents, and concentration</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1075  •  FIG-03-49-001</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Example complete acid neutralization. Molar mass100.09 g/mol is rounded; one mole CaCO3 consumes two moles H⁺, hence two acid-neutralizing equivalents.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Equivalent weight depends on the specified reaction; concentration in “as CaCO3” units is a reporting convention, not proof that solid CaCO3 is actually</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">dissolved.</text>
  </g>
