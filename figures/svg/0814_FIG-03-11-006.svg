  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.916406 650.00375)">Hypothetical k_D=0.2 L/(mol·min),k_U=0.1 min⁻¹; both products form one-to-one from A. Curves show concentration environments schematically, not a solved</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.414062 662.999375)">axial profile. Higher C_A favors D here because its reaction order is higher. Overall yield requires integration/material balance; reversing the relative</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(401.903906 675.995)">orders can reverse the preferred reactor.</text>
  </g>
