   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="346.44525" transform="rotate(-0 487.134 346.44525)">Suspended particles</text>
