   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="559.57245" transform="rotate(-0 174.744 559.57245)">Membranes</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="559.57245" transform="rotate(-0 487.134 559.57245)">Size / charge / permeability</text>
