   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="417.48765" transform="rotate(-0 174.744 417.48765)">Adsorption</text>
