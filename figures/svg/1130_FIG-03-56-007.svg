   </g>
   <g id="text_19">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.9825" transform="rotate(-0 540 663.9825)">A physical separation usually relocates mass to another stream.</text>
   </g>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Physical treatment mechanisms match different contaminant properties</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1130  •  FIG-03-56-007</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Mechanism comparison, not a universal contaminant-removal guarantee. Membrane classes differ substantially; filtration does not generally remove all</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">dissolved species. Volatility and gas–liquid transfer govern stripping. Adsorption depends on compound/media affinity. Residual-stream management and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">pretreatment are integral to selecting a process.</text>
  </g>
