   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.39" y="417.48765" transform="rotate(-0 852.39 417.48765)">Spent media; competition</text>
