   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="477.0864" y="205.67875" transform="rotate(-0 477.0864 205.67875)">Net cut through two holes</text>
   </g>
   <g id="text_3">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(214.347656 507.468445)">b=120 mm; t=10 mm; deduction d_h=22 mm</text>
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.294922 541.857117)">A_g=1,200 mm²; A_n=(120−2×22)10=760 mm²; A_e=U A_n</text>
   </g>
  </g>
  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Bolt holes reduce net area; shear lag may further reduce effective net area</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0908  •  FIG-03-25-002</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.084375 650.281875)">Straight nonstaggered critical net section through two holes; dimensions are illustrative and hole deduction is stipulated. U represents shear lag and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.192187 662.999375)">must be established for connection geometry. Gross yielding and effective-net rupture are distinct limit states; block shear and connection checks remain</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(367.605469 675.716875)">separate. Dark circles depict holes, not reinforcement.</text>
  </g>
