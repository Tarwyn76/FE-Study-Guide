   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(396.6894 145.005406)">1  TRIP GENERATION</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(335.1894 171.960094)">Origins and destinations by zone</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(389.986275 264.237406)">2  TRIP DISTRIBUTION</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(372.484712 291.192094)">Origin–destination matrix</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(414.472212 383.469406)">3  MODE CHOICE</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(337.962837 410.424094)">Shares by available travel mode</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(420.542525 502.701406)">4  ASSIGNMENT</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(370.5144 529.656094)">Routes and network flows</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(32.426156 327.133266)">Safety / access</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(58.949437 351.392484)">feedback</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="907.704" y="338.986938" transform="rotate(-0 907.704 338.986938)">Review</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Four-step transportation planning links travel demand to assigned network flows</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0941  •  FIG-03-29-007</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.819531 650.281875)">Conceptual classical demand-model workflow. Land use, demographics, policy, generalized travel cost, mode availability and network performance feed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.215625 662.999375)">assumptions. Safety/access feedback is a planning evaluation loop, not a universal fifth calibrated model. Induced demand, behavior, uncertainty and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(310.09375 675.716875)">equity can require iteration or alternative models; no trip totals are assigned.</text>
  </g>
 </g>
