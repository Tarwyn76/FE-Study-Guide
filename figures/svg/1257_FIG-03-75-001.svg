   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="583.254" y="193.43085" transform="rotate(-0 583.254 193.43085)">Evidence</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="193.43085" transform="rotate(-0 886.032 193.43085)">Question answered</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="237.222" y="286.33245" transform="rotate(-0 237.222 286.33245)">User need:reliable monitoring</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="583.254" y="286.33245" transform="rotate(-0 583.254 286.33245)">Representative-use evaluation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="286.33245" transform="rotate(-0 886.032 286.33245)">Does it meet the intended need?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="237.222" y="379.23405" transform="rotate(-0 237.222 379.23405)">Requirement:sample at10 Hz</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="583.254" y="379.23405" transform="rotate(-0 583.254 379.23405)">Timestamp / rate test</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="379.23405" transform="rotate(-0 886.032 379.23405)">Was the specified system built?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="237.222" y="472.13565" transform="rotate(-0 237.222 472.13565)">Design:buffer and timing</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="583.254" y="472.13565" transform="rotate(-0 583.254 472.13565)">Design review / unit checks</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="472.13565" transform="rotate(-0 886.032 472.13565)">Does implementation follow design?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="571.0809" transform="rotate(-0 540 571.0809)">Need → measurable requirement → design → test evidence → acceptance</text>
   </g>
   <g id="text_14">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.430625" transform="rotate(-0 540 663.430625)">Maintain traceability and state the test conditions and pass criteria.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Verification checks specified requirements; validation checks the intended use</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1257  •  FIG-03-75-001</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual systems-engineering trace. Verification compares objective evidence with specified requirements; validation evaluates the resulting system</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">against stakeholder needs in its intended context. A10 Hz rate is an assigned example, not a validated device result. Requirements should identify units,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">conditions, tolerances, and an observable criterion.</text>
  </g>
 </g>
