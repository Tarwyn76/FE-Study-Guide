  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0989  •  FIG-03-36-006</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.389844 716.166812)">Conceptual normal generating/motoring power directions. p counts poles, n rpm; induction example uses four-pole60 Hz synchronous speed1,800 rpm. Synchronous</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.8 728.884312)">generator rotor speed equals n_s in steady synchronization, induction motor normal motoring speed is lower. DC SI constants are compatible; converted power excludes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(234.595312 741.879937)">copper, core, friction and other losses. Diagram arrows are converted/terminal flow locators, not a complete loss balance.</text>
  </g>
