  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Abstract examples, not memory-layout specifications. Dynamic-array insertion and linked-list access have different costs; map/set behavior depends on</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">implementation. A tree is connected and acyclic, while a general graph may have cycles. Arrows on lists denote links; on queue/stack panels they indicate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">operations.</text>
