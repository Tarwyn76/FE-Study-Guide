  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A shunt Zener regulator divides resistor current between the load and reverse-biased diode</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0960  •  FIG-03-32-005</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.589062 650.281875)">Stipulated ideal5.1 V breakdown regulator; Zener cathode is connected to positive output, anode to return. Reverse current is cathode→anode. The current</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.146875 662.999375)">split is positive at the assumed state; actual regulation requires knee current, tolerance, dynamic resistance, source/load extremes and component power</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(367.994531 675.716875)">ratings. No part selection or rating margin is asserted.</text>
  </g>
