  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A straight current produces circulating H and B; flux integrates B over area</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0690  •  FIG-02-64-001</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.523438 656.640625)">Long straight wire in a uniform linear isotropic medium, away from ends. Current out of page gives counterclockwise field by the right-hand rule. H and B</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(240.039062 669.358125)">share direction only for scalar positive µ. Flux depends on the oriented surface normal; B is not total flux.</text>
  </g>
