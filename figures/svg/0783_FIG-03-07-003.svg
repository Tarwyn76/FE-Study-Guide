  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0783  •  FIG-03-07-003</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.946094 650.281875)">X is solute mass/carrier mass in raffinate; Y is solute mass/solvent mass in extract. Assume immiscible carriers and negligible mutual carrier solubility.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.564062 662.999375)">Feed100 kg/h with10 kg/h A and90 carrier plus100 kg/h pure solvent gives X=10/(90+2×100)=0.034483,Y=0.068966; raffinate93.103 and extract106.897 kg/h. A</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(368.76875 675.716875)">phase-settling step separates the equilibrated liquids.</text>
  </g>
