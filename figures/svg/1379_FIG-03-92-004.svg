   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="214.489213" transform="rotate(-0 918.4725 214.489213)">h=Nu k/L</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="417.790562" transform="rotate(-0 540 417.790562)">Assigned fully developed laminar circular tube: Nu=3.66 (constant wall temperature)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="544.032837" transform="rotate(-0 540 544.032837)">k=0.60 W/(m·K); D=.020 m → h=109.8 W/(m²·K)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.430625" transform="rotate(-0 540 663.430625)">Convective heat: Q=hA(Tsurface−Tbulk) under the stated local / mean convention.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Convection analysis connects flow regime and properties to Nusselt number and h</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1379  •  FIG-03-92-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">The Nu3.66 example requires fully developed laminar circular-tube heat transfer with constant wall temperature and negligible axial conduction/property</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">variation. It is not used for the turbulent examples of1377. Correlation length, boundary condition, range, and property-evaluation temperature must be</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">specified.</text>
  </g>
