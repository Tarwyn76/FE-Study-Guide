<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Law of sines triangle</title>
<desc id="svg-desc">General triangle with corresponding sides and opposite angles labeled</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1700" height="1050" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">LAW OF SINES</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Each side pairs with the sine of its opposite angle.</text>
<polygon points="230,800 1450,800 980,240" fill="#F7FAFC" fill-opacity="1" stroke="#183B5B" stroke-width="5" stroke-linejoin="round"/>
<text x="195" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#D39A22" text-anchor="start">A</text>
<text x="1470" y="835" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#D39A22" text-anchor="start">B</text>
<text x="980" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#D39A22" text-anchor="middle">C</text>
<text x="1245.0" y="520.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#2F6F9F" text-anchor="start">a</text>
<text x="575.0" y="520.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#2A7F7F" text-anchor="start">b</text>
<text x="840.0" y="855" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#C85D32" text-anchor="middle">c</text>
<rect x="320" y="875" width="1060" height="110" rx="18" fill="#FFF5DB" stroke="#D39A22" stroke-width="3" />
<text x="850" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="800" fill="#172033" text-anchor="middle">a / sin A  =  b / sin B  =  c / sin C</text>
</svg>