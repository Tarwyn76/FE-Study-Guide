  <ns0:g id="text_8" transform="translate(0.000000 -36.267445)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.558594 650.281875)">Constant-volume, completely mixed hypothetical constituent, equal inlet/outlet water flow. Use C in kg/m³ when Q is m³/day and W kg/day;10 mg/L=0.010</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.028906 662.999375)">kg/m³. Source is mass-only in this example. Real kinetics/speciation and spatial gradients may require a different model; no water-quality limit is</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(483.948438 675.716875)">implied.</ns0:text>
