   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="247.002075" transform="rotate(-0 918.4725 247.002075)">Flow measurement</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(376.411969 492.761862)">Comminution option</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(368.306422 514.381612)">retained solids remain</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="630.641825" transform="rotate(-0 540 630.641825)">Screenings and grit leave through separate solids-handling paths.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Wastewater headworks protect downstream units and measure incoming flow</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1126  •  FIG-03-56-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual headworks sequence; comminution is an optional alternative/supplement and does not remove mass as screening does. Screening targets large</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">debris, while grit removal targets dense inorganic particles. Bypass, odor control, redundancy, and hydraulic grade details are omitted. Flow meters</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">require device-specific installation and calibration.</text>
  </g>
