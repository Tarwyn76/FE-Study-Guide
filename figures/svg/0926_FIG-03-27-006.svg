     <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="521.274062" y="153.676562" transform="rotate(-0 521.274062 153.676562)">Zero-air-voids line, G_s=2.65</text>
    </g>
   </g>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A compaction curve identifies optimum moisture for a specified laboratory effort</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0926  •  FIG-03-27-006</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.858594 650.142812)">Synthetic curve for one assumed compaction effort, not a soil test. Zero-air-voids line corresponds to100% saturation and bounds dry unit weight for fixed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.815625 662.860312)">G_s; laboratory curve lies below it. Field point is compared with the relevant test maximum. Moisture tolerance, required compaction and test method are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(368.507812 675.855937)">project specifications, not assigned acceptance limits.</text>
  </g>
