   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.010937 656.3625)">Steady isothermal ideal binary gas at uniform total pressure. B has zero total molar flux, while Stefan bulk flow contributes to A transport. N_A is total</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(213.542188 669.358125)">flux in the +z direction. Log-mean B pressure=(p_B2−p_B1)/ln(p_B2/p_B1); p_A and p_B sum to100 kPa throughout.</text>
  </g>
