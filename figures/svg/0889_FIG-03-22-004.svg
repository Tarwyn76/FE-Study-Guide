  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Building load cases act through tributary areas and distinct vertical or lateral paths</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0889  •  FIG-03-22-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.721875 650.281875)">Conceptual building bay. Dead/live/roof/lateral and moving loads are distinct load cases; design combinations depend on the applicable standard, edition</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.854687 662.999375)">and conditions. Tributary load reaches beams/columns through floor or roof support geometry. Arrows are conceptual magnitudes and do not define design</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(473.872656 675.716875)">load values.</text>
  </g>
