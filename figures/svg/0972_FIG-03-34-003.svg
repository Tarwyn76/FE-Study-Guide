  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A differential pair steers its tail current according to the difference between inputs</text>
  </g>
  <g id="text_16" transform="translate(0.000000 -127.701284)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.761719 650.281875)">Matched NPN pair with ideal constant tail current, forward-active operation and α≈1. Both collectors have equal resistive loads; outputs are inverted with</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.071094 662.999375)">respect to their own increasing collector current. Tail-source compliance, input common-mode range, mismatch and finite tail resistance limit actual CMRR.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(321.864844 675.716875)">Supply rails are conceptual; no device or headroom values are assigned.</text>
  </g>
