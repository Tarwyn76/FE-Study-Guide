  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(98.025 590.616625)">Illustrative positive changes. In general each contribution can be negative. For fixed mass, ΔKE=½m(V₂²−V₁²) and ΔPE=mg(z₂−z₁); V</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(296.671875 603.334125)">here denotes translational speed, not system volume.</text>
