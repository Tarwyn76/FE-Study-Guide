   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(99.53125 656.640625)">Mechanical-energy equations also need stated assumptions. Unsteady or compressible flow may require a fuller momentum/energy model; the last branch is not</text>
