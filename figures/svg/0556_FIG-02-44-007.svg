   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(600.07505 334.983195)">NO: steady, incompressible,</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(599.942238 357.89468)">lossless along a streamline?</text>
   </g>
   <g id="text_4">
