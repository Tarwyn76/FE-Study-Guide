    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="175.87075" transform="rotate(-0 504 175.87075)">Fluid at rest?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.141653 334.187336)">YES: hydrostatics</text>
