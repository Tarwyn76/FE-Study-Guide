   <g id="text_1">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(386.044141 151.263617)">DRAWING QUANTITY</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(323.124766 182.261508)">Concrete: 12×8×0.15=14.4 m³</text>
   </g>
   <g id="text_2">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(426.378594 280.431617)">DIRECT COST</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(308.640156 311.429508)">14.4 m³×200 USD/m³=2,880 USD</text>
   </g>
   <g id="text_3">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(340.858125 409.599617)">INDIRECTS + CONTINGENCY</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(302.872187 440.597508)">10% of direct, then15% of subtotal</text>
   </g>
   <g id="text_4">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="570.274312" transform="rotate(-0 504 570.274312)">USD 2,880 + 288 + 475.20 = 3,643.20</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A quantity takeoff carries a defined measurement basis into the estimate total</text>
