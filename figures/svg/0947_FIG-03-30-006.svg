  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0947  •  FIG-03-30-006</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(144.879687 650.281875)">Hypothetical single-item estimate: slab volume is geometrical quantity with no waste factor. Unit price is assumed and not a market quotation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.921094 662.999375)">Indirects=10% of direct; contingency=15% of direct plus indirects, explicitly compounded. Taxes, escalation, design fees and scope allowances are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(328.13125 675.716875)">excluded; contingency basis must be stated to avoid double counting.</text>
  </g>
