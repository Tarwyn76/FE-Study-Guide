   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="112.256787" transform="rotate(-0 432 112.256787)">Name each unknown; count n</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(314.942813 201.774844)">Write independent conditions; count m</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(346.395938 217.947656)">Check units and consistency</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="322.644575" transform="rotate(-0 432 322.644575)">Compare m and n</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="156.816" y="400.47045" transform="rotate(-0 156.816 400.47045)">m &lt; n</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(108.436625 472.946634)">Underdetermined</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(81.948969 487.771713)">If consistent: free variables</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(81.710063 502.596791)">Look for missing conditions</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="400.47045" transform="rotate(-0 432 400.47045)">m = n</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(416.975547 472.946634)">Solve</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(383.111875 487.771713)">Unique if full rank</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(391.58875 502.596791)">and consistent</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="707.184" y="400.47045" transform="rotate(-0 707.184 400.47045)">m &gt; n</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(662.222359 472.946634)">Overdetermined</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(652.111812 487.771713)">May be inconsistent</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(627.409078 502.596791)">Use extra equations to verify</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="585.376175" transform="rotate(-0 432 585.376175)">Count is a first check; independence and consistency determine the solution.</text>
   </g>
