  <ns0:g id="text_8">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(100.844531 656.501562)"><ns0:tspan font-size="10.000px">C=ṁc</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">p</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> for single-phase streams with constant c</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">p</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">. ε=Q̇</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">actual</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">/Q̇</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">max</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">; here T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ho</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=76°C and T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">co</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=68°C from each stream energy balance. Q̇</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">max</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> is a limiting</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(360.60625 669.497187)">reference; a finite exchanger generally does not attain it.</ns0:text>
