  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.141406 716.305875)">Representative test-property matrix, not an exhaustive standards list. A test result supports the property and conditions it actually measures; it is not a universal</text>
