   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">The shoelace sum gives signed polygon area from ordered coordinate vertices</text>
  </g>
  <g id="text_24">
</g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.451562 650.281875)">Simple non-self-intersecting parcel with coordinate pairs E,N in metres. Close the vertex sequence back to its first point. Counterclockwise ordering</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.135156 662.999375)">gives positive signed area in east-right/north-up coordinates; reversing order changes sign but not magnitude. Boundary survey uncertainty and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(393.403906 675.716875)">grid-to-ground area corrections are omitted.</text>
  </g>
 </g>
