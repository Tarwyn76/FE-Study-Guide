   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="110.756" transform="rotate(-0 55.44 110.756)">The shoelace sum gives signed polygon area from ordered coordinate vertices</ns0:text>
  </ns0:g>
  <ns0:g id="text_24">
</ns0:g>
  <ns0:g id="text_25" transform="translate(0.000000 -62.376915)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.451562 650.281875)">Simple non-self-intersecting parcel with coordinate pairs E,N in metres. Close the vertex sequence back to its first point. Counterclockwise ordering</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.135156 662.999375)">gives positive signed area in east-right/north-up coordinates; reversing order changes sign but not magnitude. Boundary survey uncertainty and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(393.403906 675.716875)">grid-to-ground area corrections are omitted.</ns0:text>
  </ns0:g>
 </ns0:g>
