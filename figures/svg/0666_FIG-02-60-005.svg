  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.516406 656.640625)">KCL uses all branch currents leaving node A. The ideal source fixes the known node at 12 V relative to the common reference. Ground is a voltage</text>
