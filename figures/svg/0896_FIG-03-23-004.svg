  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Separating a pin-connected frame reveals equal and opposite hinge forces</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0896  •  FIG-03-23-004</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.482031 650.142812)">Special pin-connected frame with two straight inclined two-force members, both bases pinned and apex loaded. Half-span4 m,rise3 m. Assign external10 kN downward load</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.06875 662.860312)">at B to member AB in separated FBDs. Internal hinge forces B_AB=(−6.667,+5) kN and B_BC=(+6.667,−5) kN are equal/opposite. Combined resultant at B on AB</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(264.624219 675.855937)">is(−6.667,−5) kN. No ideal hinge moment; a general loaded frame member need not be a two-force member.</text>
  </g>
