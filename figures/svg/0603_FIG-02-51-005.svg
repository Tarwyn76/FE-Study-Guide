  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.330469 656.501562)">Steady adiabatic devices with negligible KE/PE changes; 2s is at the same exit pressure as 2 and s₂s=s₁. Incompressible pump ideal work uses absolute</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(180.1375 669.219062)">pressure difference and liquid specific volume. Work input is a positive magnitude here; work-out convention gives negative w_s.</text>
