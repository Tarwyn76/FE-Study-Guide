   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="143.998687" transform="rotate(-0 540 143.998687)">Correlation • signatures • anomaly context</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Telemetry feeds detection, triage, and proportionate response</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1057  •  FIG-03-46-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual detection pipeline. Monitoring/IDS raises findings; blocking/IPS requires an explicit enforcement path or response action. Analysts or approved</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">automation validate context and choose actions. Detection can have false positives/negatives and is not equivalent to prevention.</text>
  </g>
