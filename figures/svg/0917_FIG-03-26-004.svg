   </g>
   <g id="text_4">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="569.374781" transform="rotate(-0 504 569.374781)">V_n=V_c+V_s;  V_s=A_v f_y d/s  (vertical stirrup model)</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Stirrups bridge diagonal cracks while concrete and steel contribute to shear resistance</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0917  •  FIG-03-26-004</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.71875 650.142812)">Schematic RC beam under point loading. A_v is total stirrup-leg area crossing the section within spacing s. Concrete contribution V_c and allowable</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.628906 663.138438)">spacing depend on governing provisions, member size, reinforcement and loading; the figure assigns no concrete shear formula or capacity. Cracks and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(402.988281 675.855937)">bar/stirrup dimensions are exaggerated.</text>
  </g>
