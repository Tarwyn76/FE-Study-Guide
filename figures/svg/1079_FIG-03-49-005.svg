  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Same ideal monoprotic system as1076, externally controlled pH and fixed analytical total. Vertical axis is inverted so larger concentration appears higher.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">This is a species-distribution diagram, not a Pourbaix diagram; no redox potential is plotted. Boundary describes equality, not disappearance of either</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">species.</text>
  </g>
