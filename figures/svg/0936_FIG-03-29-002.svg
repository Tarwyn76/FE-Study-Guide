  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.864844 650.281875)">Plan-view circular curve and separate schematic banking section. PC/PT are tangent points; PI is tangent intersection. Small-angle equilibrium uses e as</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.45 662.999375)">decimal cross slope and f as lateral friction-demand ratio. Required f is demand, not an available friction guarantee. Curve radius is illustrated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(220.221875 675.716875)">schematically; highway design also requires governing speed, superelevation, friction and sight-distance criteria.</text>
  </g>
