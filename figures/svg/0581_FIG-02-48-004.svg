   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(100.459375 656.3625)"><ns0:tspan font-size="10.000px">Rounded excerpt from the user-supplied FE Handbook 10.6 Saturated Water—Temperature Table. Rounding can make h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">f</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">+h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">fg</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> differ slightly from tabulated h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">g</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">.</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(364.279687 669.358125)"><ns0:tspan font-size="10.000px">Similar f/g/fg notation applies to u and s; v</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">fg</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=v</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">g</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−v</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">f</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">.</ns0:tspan></ns0:text>
