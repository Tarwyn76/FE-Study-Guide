  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic status snapshot with BAC100,000 dollars. Earned value is budgeted completed scope, not cash received. Negative SV is expressed in budget</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">currency, not days late. EAC formula assumes current cost efficiency persists; ETC=82,500 and VAC=−37,500 dollars. Scope changes, remaining-work risk, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">alternative forecasting assumptions require separate evaluation.</text>
  </g>
