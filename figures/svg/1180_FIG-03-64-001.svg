   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="203.83555" transform="rotate(-0 203.58 203.83555)">Arrivals λ=8/hour</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="203.83555" transform="rotate(-0 540 203.83555)">Single-server queue</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="203.83555" transform="rotate(-0 876.42 203.83555)">Service μ=10/hour</text>
   </g>
   <g id="text_4">
    <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="419.446187" transform="rotate(-0 540 419.446187)">Utilization ρ=λ/μ=0.80</text>
   </g>
   <g id="text_5">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(321.378594 538.705625)">Infinite-buffer M/M/1 stability:λ&lt;μ</text>
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(358.304688 571.771125)">For c identical servers:λ&lt;cμ</text>
   </g>
   <g id="text_6">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="674.636162" transform="rotate(-0 540 674.636162)">Capacity is a rate; number waiting is a population.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Arrival load must remain below total service capacity for an infinite queue to stabilize</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1180  •  FIG-03-64-001</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Steady open-queue concept with no abandonment or blocking and constant rates. Service rate is per server. For M/M/1, Poisson arrivals and exponential</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">independent service are assumed; utilization alone does not determine every waiting-time distribution. Finite buffers can have stationary occupancy even</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">above capacity by blocking arrivals.</text>
  </g>
