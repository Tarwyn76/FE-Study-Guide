  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0969  •  FIG-03-33-007</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.135156 650.281875)">Same simplified grounded-emitter12 V/6 kΩ DC load line as964. Gold ellipse is a conceptual bias-variation envelope, not a probability distribution or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.435156 662.999375)">solved worst-case tolerance set. Green segment stays clear of the schematic cutoff/saturation bands. Real safe operating area, dissipation, temperature</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(285.232813 675.716875)">and AC loading must be assessed separately; the diagram assigns no rated safe swing.</text>
  </g>
