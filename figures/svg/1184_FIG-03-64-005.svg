  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Service-time variability increases mean waiting even when average service speed is unchanged</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1184  •  FIG-03-64-005</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Pollaczek–Khinchine FCFS M/G/1 example with independent service times and finite second moment. The constant-time case has CV0; exponential service has</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">CV1. Same utilization and mean service time do not imply the same queue wait. Arrival variability, priorities, dependence, and multi-server effects are not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">represented by this formula.</text>
  </g>
 </g>
