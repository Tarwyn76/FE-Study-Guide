  <ns0:g id="text_10">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.878906 656.640625)">Overall boundary encloses the reactor, separator and recycle path. Recycle is excluded from overall balance terms because it does not cross that boundary;</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.228906 669.358125)">it is not physically outside the control volume. Use mass conservation overall, or species balances with reaction generation/consumption as appropriate.</ns0:text>
