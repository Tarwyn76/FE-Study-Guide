  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.504687 656.640625)">Clockwise traversal rises through the source from − to +, then crosses each resistor from + to − in the current direction. Sum of signed voltage changes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(326.082812 669.358125)">around the closed loop is zero; reversing traversal reverses every sign.</text>
