  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.989062 656.640625)">Unity negative feedback with stable closed-loop dynamics, no hidden cancellation, and a valid final-value theorem. Type is the count of uncancelled</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.989062 669.358125)">open-loop poles at s=0. Finite constants are assumed where shown; ramp slope and acceleration are unity. A finite error table cannot establish stability.</text>
  </g>
