  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.789844 656.3625)">Source current exits its positive terminal; load current enters its positive terminal. Delivered and absorbed are separate sign conventions: p_del=−p_abs.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(346.274219 669.358125)">Ideal wires store no energy and dissipate no power; Σp_abs=0.</text>
