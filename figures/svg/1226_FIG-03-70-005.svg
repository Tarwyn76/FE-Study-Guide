   <g id="text_16">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="608.782625" transform="rotate(-0 540 608.782625)">Both alternatives meet the assigned minimum function score of75.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="673.532412" transform="rotate(-0 540 673.532412)">Function score is an explicit local scale; ratios do not replace hard constraints.</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Value engineering compares function and lifecycle cost before selecting an alternative</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1226  •  FIG-03-70-005</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned function scores and lifecycle costs with one consistent boundary. Alternative B has85/90=0.944 score points per$1000 versus80/100=0.8 for A. A</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">scoring scale must be justified; this is an illustrative comparison, not a procurement recommendation. Reliability, safety, service, and other mandatory</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">requirements are screened before ratios.</text>
  </g>
