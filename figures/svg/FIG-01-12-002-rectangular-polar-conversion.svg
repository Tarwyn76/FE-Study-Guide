<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Rectangular and polar conversion</title>
<desc id="svg-desc">Right-triangle relationship and formulas for converting complex-number forms</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1200" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">RECTANGULAR ↔ POLAR CONVERSION</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">The geometry supplies both conversion directions.</text>
<polygon points="170,900 900,900 900,300" fill="#EAF2F8" fill-opacity="1" stroke="#183B5B" stroke-width="5" stroke-linejoin="round"/>
<rect x="840" y="840" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B5B" stroke-width="3" />
<text x="535" y="950" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#2F6F9F" text-anchor="middle">a = r cos θ</text>
<text x="940" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#2A7F7F" text-anchor="start">b = r sin θ</text>
<text x="500" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#C85D32" text-anchor="middle">r</text>
<path d="M 300 900 A 130 130 0 0 1 270 815" fill="none" stroke="#D39A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="330" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#D39A22" text-anchor="start">θ</text>
<rect x="1050" y="230" width="650" height="300" rx="18" fill="#FDF0E9" stroke="#C85D32" stroke-width="3" />
<rect x="1050" y="230" width="650" height="62" rx="18" fill="#C85D32" stroke="#C85D32" stroke-width="0" />
<text x="1075" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">RECTANGULAR → POLAR</text>
<text x="1075" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">r = √(a² + b²)</text>
<text x="1075" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">θ = atan2(b, a)</text>
<rect x="1050" y="650" width="650" height="300" rx="18" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="3" />
<rect x="1050" y="650" width="650" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="1075" y="692" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">POLAR → RECTANGULAR</text>
<text x="1075" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">a = r cos θ</text>
<text x="1075" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">b = r sin θ</text>
<text x="900" y="1110" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#183B5B" text-anchor="middle">z = a + jb  =  r(cos θ + j sin θ)  =  r∠θ</text>
</svg>