  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.122656 656.640625)">Uniform linear core, negligible leakage and fringing, constant cross-section and no air gap. ℓ follows the mean magnetic path, not inner perimeter. Series</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(272.195312 669.358125)">air gaps add reluctance g/(µ₀A), often dominating the total. Diagram geometry is schematic.</text>
