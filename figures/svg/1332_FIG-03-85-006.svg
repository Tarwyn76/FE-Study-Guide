  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual vertical vessel on a skirt support. Internal pressure generates shell stress; weight, wind, nozzle forces and moments, thermal motion, and</text>
