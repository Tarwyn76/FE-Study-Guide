  <ns0:g id="text_24">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.994531 656.501562)"><ns0:tspan font-size="10.000px">Steady planar film with constant D and fixed endpoints C</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=10/2 mol/m³. Position increases high-to-low; gradient is−8000 mol/m⁴, hence positive flux. J</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(284.883594 669.497187)">denotes diffusive flux relative to a stated reference; total flux may include bulk motion.</ns0:text>
  </ns0:g>
