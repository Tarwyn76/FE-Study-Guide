   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.994531 656.501562)">Steady planar film with constant D and fixed endpoints C_A=10/2 mol/m³. Position increases high-to-low; gradient is−8000 mol/m⁴, hence positive flux. J</text>
