   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Confined homogeneous isotropic aquifer of constant transmissivity, fully penetrating well, steady flow. Head datum is arbitrary but common to h1 and h2.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Radius increases away from pumping; natural logarithm is required. Same assigned Q,T,H and outer radius as1113. Unconfined radial flow instead involves</text>
