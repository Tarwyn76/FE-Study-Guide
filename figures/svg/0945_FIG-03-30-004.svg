  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.616406 716.305875)">Finish-to-start AON network with zero lag, deterministic durations and unlimited resource availability. Times use elapsed-day boundaries starting at0; EF=ES+duration</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.851562 729.023375)">and LS=LF−duration. Total float=LS−ES. Red path has zero float; C/E share the alternate branch’s4-day flexibility and cannot each independently consume extra time</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(377.8375 741.740875)">without coordination. Resource limits and calendars are omitted.</text>
  </g>
