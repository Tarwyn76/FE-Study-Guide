  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned representative water properties for a teaching comparison, not a property table for metrology. Both examples screen turbulent for the stated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">straight-pipe geometry. Transition depends on disturbances and entrance conditions; Reynolds thresholds are geometry-specific, not universal for all flows.</text>
