  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">The open-loop product determines the closed-loop characteristic equation</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0727  •  FIG-02-69-003</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.966406 656.640625)">For the displayed negative-feedback loop with no disturbance and zero initial conditions. L is the transfer product around the opened loop, not the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(166.638281 669.358125)">reference-to-output transfer. Stability requires evaluating roots of the closed-loop characteristic equation, including internal dynamics.</text>
  </g>
