  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Pole location distinguishes decay, sustained motion, and growth</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0729  •  FIG-02-69-005</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.775 656.640625)">Finite-dimensional continuous-time LTI state dynamics. All poles strictly in the left half-plane give asymptotic stability. Simple imaginary-axis modes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.228125 669.358125)">can be marginal if all other modes decay; repeated/nonsemisimple axis modes can be unstable. Imaginary-axis transfer poles do not give BIBO stability.</text>
  </g>
 </g>
