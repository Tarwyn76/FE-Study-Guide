  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Decision logic makes inspection limits and counter updates explicit</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1168  •  FIG-03-62-003</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned inclusive diameter limits, not a product specification. Example d=10.3 mm takes the reject branch; exactly9.8/10.2 mm takes pass. Missing/non-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">numeric measurements require a prior validation path and are not counted as measured conformance. Flow describes software logic, not physical machine</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">control or a complete inspection procedure.</text>
  </g>
