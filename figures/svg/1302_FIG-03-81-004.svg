  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1302  •  FIG-03-81-004</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Steady converging nozzle, ideal air, discharge coefficient1. Above the critical ratio the exit is subsonic; below it the throat is sonic and reducing back</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">pressure does not raise mass flow. This threshold is for a converging nozzle, not every converging-diverging nozzle back-pressure regime.</text>
  </g>
