  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.8375 716.305875)">Illustrative linked views of cooling-loss scenario. HAZOP identifies deviations; LOPA evaluates selected scenarios and qualified independent layers; fault tree works</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.788281 729.023375)">backward from a top event; event tree follows forward outcomes. PFD multiplication is valid only with defensible independence and demand assumptions. No numerical</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(462.6375 741.740875)">risk acceptance claim is made.</text>
  </g>
