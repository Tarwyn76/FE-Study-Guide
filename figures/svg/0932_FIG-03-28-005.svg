  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Foundation type changes how load reaches near-surface soil or deeper strata</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0932  •  FIG-03-28-005</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(150.01875 650.281875)">Comparative sections are schematic and not to a common design scale. Strip footing extends perpendicular to the section; mat supports multiple columns.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(138.742188 662.999375)">Deep-foundation capacity can include shaft resistance and toe resistance, whose relative contributions depend on soil/rock, installation and load. The lower line</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(369.517969 675.716875)">marks a different stratum, not necessarily a universal bearing layer.</text>
  </g>
