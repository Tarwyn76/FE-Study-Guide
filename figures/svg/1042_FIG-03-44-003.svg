   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="222.96235" transform="rotate(-0 504 222.96235)">Registers</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="315.86395" transform="rotate(-0 504 315.86395)">L1 / L2 / L3 caches</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="425.15995" transform="rotate(-0 504 425.15995)">Main memory (RAM)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="545.38555" transform="rotate(-0 504 545.38555)">Nonvolatile storage</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.0944" y="148.635675" transform="rotate(-0 163.0944 148.635675)">Faster access</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="764.1648" y="657.138012" transform="rotate(-0 764.1648 657.138012)">Greater capacity • lower cost/bit</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">Memory hierarchy trades access speed against capacity and cost per bit</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1042  •  FIG-03-44-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Conceptual ordering rather than quantitative geometry or fixed latency values. Temporal and spatial locality make caching effective. Registers/cache/RAM</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">are ordinarily volatile; storage is nonvolatile. Technology, workloads, and architecture determine actual capacity, cost, and latency.</text>
  </g>
