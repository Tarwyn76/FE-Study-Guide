   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="635.55475" transform="rotate(-0 540 635.55475)">Ventilation</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="972.54" y="548.11795" transform="rotate(-0 972.54 548.11795)">Infiltration</text>
   </g>
   <g id="text_8">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="515.605087" transform="rotate(-0 540 515.605087)">Total=sensible+latent</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Building cooling loads include sensible and latent contributions</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1318  •  FIG-03-83-006</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual load decomposition. Envelope conduction and most equipment loads are predominantly sensible; people and outdoor moisture can add latent loads.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Ventilation is intentional outdoor air; infiltration is uncontrolled leakage. Solar gain, schedules, humidity, and dynamic storage require stated design</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">conditions and methods.</text>
  </g>
