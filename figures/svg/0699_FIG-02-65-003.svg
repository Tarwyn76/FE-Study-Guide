  <ns0:g id="text_18">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="110.527" transform="rotate(-0 55.44 110.527)">Supply frequency and pole count set synchronous speed</ns0:text>
  </ns0:g>
  <ns0:g id="text_20">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.905469 656.640625)">Pole count is total poles, not pole pairs. Synchronous-machine rotor runs at synchronous speed in steady synchronism; induction motor rotor runs below it</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(170.039844 669.358125)">for positive motoring slip. The 1740 rpm example has 3.33% slip. Other operating modes can have negative or greater-than-one slip.</ns0:text>
  </ns0:g>
