  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.905469 656.640625)">Pole count is total poles, not pole pairs. Synchronous-machine rotor runs at synchronous speed in steady synchronism; induction motor rotor runs below it</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(170.039844 669.358125)">for positive motoring slip. The 1740 rpm example has 3.33% slip. Other operating modes can have negative or greater-than-one slip.</text>
  </g>
