    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="134.361138" transform="rotate(-0 432 134.361138)">x̄/R baseline reasonably stable?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="133.2288" y="192.79725" transform="rotate(-0 133.2288 192.79725)">No</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.549459 327.538395)">STOP</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(45.685241 350.44988)">Investigate stability first</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="573.5232" y="211.68645" transform="rotate(-0 573.5232 211.68645)">Yes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(501.81075 311.759466)">μ̂ = x̿; σ̂ = R̄/d₂</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(404.132625 336.018684)">Use stable within-subgroup variation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(475.224187 559.927266)">Cp = (USL−LSL)/(6σ̂)</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(417.141844 585.266484)">Cpk = min[(USL−μ̂),(μ̂−LSL)]/(3σ̂)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="714.846575" transform="rotate(-0 432 714.846575)">Combine the stable process estimates with independently defined specifications. Check the distributional model.</text>
   </g>
  </g>
