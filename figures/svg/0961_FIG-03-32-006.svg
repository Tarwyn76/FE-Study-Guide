  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An SCR can be gate-triggered into a latched state that persists above holding current</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0961  •  FIG-03-32-006</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.796094 650.00375)">Qualitative conventional SCR characteristic, not measured data; triggering lowers the forward turn-on threshold. Latching current I_L must be reached</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.003125 662.999375)">before removing gate drive; once latched, conduction persists until anode current falls below holding current I_H and recovery conditions are met.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(300.482813 675.995)">Reverse/forward breakdown ratings and commutation behavior are not assigned.</text>
  </g>
