<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1050" viewBox="0 0 2200 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Engineering orders of magnitude</title>
<desc id="svg-desc">Logarithmic number line from ten to the minus nineteenth through ten to the eleventh with labeled reference points for electron charge, human hair diameter, standard gravity, atmospheric pressure, and steel elastic modulus</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
