   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="142.990875" transform="rotate(-0 504 142.990875)">Discrete or continuous?</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="256.3344" y="238.050325" transform="rotate(-0 256.3344 238.050325)">DISCRETE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="256.3344" y="347.39925" transform="rotate(-0 256.3344 347.39925)">Finite lot; no replacement → Hypergeometric</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="256.3344" y="457.30005" transform="rotate(-0 256.3344 457.30005)">Event count over exposure → Poisson</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="256.3344" y="567.20085" transform="rotate(-0 256.3344 567.20085)">Trials to first success → Geometric</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="256.3344" y="677.10165" transform="rotate(-0 256.3344 677.10165)">Trials to rth success → Negative binomial</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="751.6656" y="238.050325" transform="rotate(-0 751.6656 238.050325)">CONTINUOUS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="751.6656" y="347.39925" transform="rotate(-0 751.6656 347.39925)">Bounded; equally likely → Uniform</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="751.6656" y="457.30005" transform="rotate(-0 751.6656 457.30005)">Bounded with a mode → Triangular</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="751.6656" y="567.20085" transform="rotate(-0 751.6656 567.20085)">Constant-hazard waiting time → Exponential</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="751.6656" y="677.10165" transform="rotate(-0 751.6656 677.10165)">Flexible lifetime hazard → Weibull</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="779.581775" transform="rotate(-0 504 779.581775)">Selection depends on model assumptions, not only on whether the observations are numbers or measurements.</text>
