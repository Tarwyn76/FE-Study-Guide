  <ns0:g id="text_5">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="109.120" transform="rotate(-0 55.44 109.120)">An equilibrium flash splits a feed into coupled vapor and liquid streams</ns0:text>
  </ns0:g>
  <ns0:g id="text_6">
</ns0:g>
  <ns0:g id="text_7">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.092969 656.532812)"><ns0:tspan font-size="10.000px">Illustrative equilibrium K values at a selected temperature/pressure. Vapor fraction β=0.5 solves Σz</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">i</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">(K</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">i</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−1)/[1+β(K</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">i</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−1)]=0. Both phase compositions sum</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(205.678125 669.528437)">to1. A flash also needs an energy balance when temperature or duty is unknown; equilibrium alone does not specify it.</ns0:text>
  </ns0:g>
