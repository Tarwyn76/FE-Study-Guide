  <g id="text_7" transform="translate(0.000000 -132.352727)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.092969 656.532812)"><tspan style="font-size: 10.000px">Illustrative equilibrium K values at a selected temperature/pressure. Vapor fraction β=0.5 solves Σz</tspan><tspan style="font-size: 7.200px" dy="2.400px">i</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">(K</tspan><tspan style="font-size: 7.200px" dy="2.400px">i</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">−1)/[1+β(K</tspan><tspan style="font-size: 7.200px" dy="2.400px">i</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">−1)]=0. Both phase compositions sum</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(205.678125 669.528437)">to1. A flash also needs an energy balance when temperature or duty is unknown; equilibrium alone does not specify it.</text>
  </g>
