   <ns0:g id="text_4">
    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(343.076172 526.992789)"><ns0:tspan font-size="25.000px">F=V+L; Fz</ns0:tspan><ns0:tspan font-size="17.000px" dy="6.000px">A</ns0:tspan><ns0:tspan font-size="25.000px" dy="-6.000px">=Vy</ns0:tspan><ns0:tspan font-size="17.000px" dy="6.000px">A</ns0:tspan><ns0:tspan font-size="25.000px" dy="-6.000px">+Lx</ns0:tspan><ns0:tspan font-size="17.000px" dy="6.000px">A</ns0:tspan></ns0:text>
