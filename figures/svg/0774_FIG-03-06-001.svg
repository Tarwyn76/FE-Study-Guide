  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.092969 656.532812)">Illustrative equilibrium K values at a selected temperature/pressure. Vapor fraction β=0.5 solves Σz_i(K_i−1)/[1+β(K_i−1)]=0. Both phase compositions sum</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(205.678125 669.528437)">to1. A flash also needs an energy balance when temperature or duty is unknown; equilibrium alone does not specify it.</text>
