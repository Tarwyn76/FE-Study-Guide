   <g id="text_17">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="612" y="538.656962" transform="rotate(-0 612 538.656962)">Submit section1 only after its review; submitted questions cannot be revisited.</text>
