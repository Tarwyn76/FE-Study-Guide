  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 783.193875)">Illustrative pacing allocation, not an official prescribed time split. NCEES lists320 minutes of exam time and a25-minute scheduled break after submitting</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 795.911375)">the first question section. Both sections include their own review; no return to submitted first-section questions is implied. Timeline excludes tutorial</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 808.628875)">and NDA time.</text>
  </g>
