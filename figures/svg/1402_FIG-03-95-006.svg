   <g id="text_18">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="612" y="645.689825" transform="rotate(-0 612 645.689825)">Actual section split and pacing vary. Scheduled break is separate from the320-minute exam clock.</text>
