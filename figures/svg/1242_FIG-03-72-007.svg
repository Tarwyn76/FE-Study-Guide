  <g id="text_24">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">The bullwhip effect describes amplification of order variability upstream</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1242  •  FIG-03-72-007</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic aligned sequences with deviations multiplied by2 and3, giving variance ratios4 and9 exactly. No causal replenishment simulation is claimed.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Batching, forecasts, delays, incentives, and shortages can amplify orders in actual systems. Coordination may reduce amplification, but its effect needs</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">comparable measured variability and service outcomes.</text>
  </g>
 </g>
