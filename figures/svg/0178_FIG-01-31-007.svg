   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="246.5424" y="299.284175" transform="rotate(-0 246.5424 299.284175)">Population σ known?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="76.1904" y="387.433775" transform="rotate(-0 76.1904 387.433775)">Yes</text>
