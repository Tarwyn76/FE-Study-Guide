   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="399.8592" y="381.137375" transform="rotate(-0 399.8592 381.137375)">No</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(108.357047 523.90703)">z = (x̄−μ)/(σ/√n)</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.099625 544.123045)">Standard normal</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(399.797634 523.90703)">t = (x̄−μ)/(s/√n)</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(428.431228 544.123045)">ν = n−1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(665.27715 410.259425)">One normal-population</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(723.1559 431.823175)">variance</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(696.52715 453.386925)">χ² = (n−1)s²/σ²</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(724.47715 474.958175)">ν = n−1</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="714.846575" transform="rotate(-0 468 714.846575)">Reference laws require their sampling assumptions. Small-sample t and exact chi-square variance results assume normality.</text>
   </g>
