   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.753125 656.640625)">A rigid tank removes boundary work only. Adiabatic removes heat transfer only. Neither condition alone justifies deleting every</ns0:text>
