    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="182.771062" transform="rotate(-0 432 182.771062)">1  Choose the fixed mass and define the system boundary</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="253.979062" transform="rotate(-0 432 253.979062)">2  Identify initial/final states and applicable property model</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="325.187063" transform="rotate(-0 432 325.187063)">3  Set heat/work signs; include all work modes</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="396.395062" transform="rotate(-0 432 396.395062)">4  Evaluate ΔU, ΔKE, ΔPE and moving-boundary work if present</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="467.603062" transform="rotate(-0 432 467.603062)">5  Solve Q−W=ΔU+ΔKE+ΔPE with consistent energy units</ns0:text>
