   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">For this IPv4/26 example, addresses span192.0.2.128–191; ordinary subnet network/broadcast are128/191, leaving129–190 as62 conventional host addresses.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">IPv6 has no broadcast and prefixes are not universally/64. The illustrated/64 split is common on subnets; interface identifiers are not necessarily derived</text>
