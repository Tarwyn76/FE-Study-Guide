   <g id="text_1">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(172.562984 266.545437)">User</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(101.121031 295.795687)">Intent / workload</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(494.513281 266.905375)">Controls</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(446.419219 294.883875)">Action / mapping</text>
   </g>
   <g id="text_3">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(838.341781 266.545437)">System</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(787.373422 295.795687)">State / response</text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="548.669825" transform="rotate(-0 540 548.669825)">Display / feedback → perceivable state and error recovery</text>
   </g>
   <g id="text_5">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="641.295488" transform="rotate(-0 540 641.295488)">Measure task success, errors, completion time, and operator workload.</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Usable controls expose system state and make action consequences observable</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1243  •  FIG-03-73-001</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual human-system interaction loop. Control-display mapping, legibility, consistency, feedback timing, and recoverable errors affect usability.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Assigned measures are proposed evaluation dimensions, not test results. Workload is not inferred from completion time alone. A display should communicate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">actionable state without assuming color is the only distinguishable cue.</text>
  </g>
 </g>
