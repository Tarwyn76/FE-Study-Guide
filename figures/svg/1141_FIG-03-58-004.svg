  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned total solids inventory6,000 kg and total solids loss600 kg/day through wasting plus effluent. Solids age excludes internal RAS as an external</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">loss. Nominal aeration HRT uses external influent Q; recycle affects pass hydraulics. Inventory definition must consistently include relevant</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">basin/clarifier solids. No equal water/biomass age is implied.</text>
  </g>
