    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="96.814938" transform="rotate(-0 432 96.814938)">2x + y = 7    and    3x − y = 8</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="219.7152" y="152.951188" transform="rotate(-0 219.7152 152.951188)">SUBSTITUTION</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="223.6464" y="232.81125" transform="rotate(-0 223.6464 232.81125)">Isolate y: y = 7 − 2x</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="223.6464" y="324.39525" transform="rotate(-0 223.6464 324.39525)">Substitute: 3x − (7 − 2x) = 8</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="223.6464" y="415.97925" transform="rotate(-0 223.6464 415.97925)">Solve: 5x = 15 → x = 3</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="223.6464" y="507.56325" transform="rotate(-0 223.6464 507.56325)">Back-substitute: y = 1</text>
   </g>
   <g id="text_7">
