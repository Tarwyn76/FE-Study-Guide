  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0930  •  FIG-03-28-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.453125 650.00375)">Dry Rankine teaching example H=4 m,φ′=30°,γ=18 kN/m³,level backfill; uniform surcharge adds K_a q H at H/2. Soil weight, wall weight, groundwater, passive</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.010937 662.999375)">resistance and base friction must be included consistently in a full design. Arrows show force directions only; W and base reactions are not numerically</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(225.567187 675.716875)">assigned. Check sliding ΣF_R/ΣF_D and overturning ΣM_R/ΣM_O with a defined datum, plus bearing/settlement.</text>
  </g>
