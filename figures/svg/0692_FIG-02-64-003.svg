  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0692  •  FIG-02-64-003</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.261719 656.640625)">Closed resistive coil with N turns and increasing external field into the page. CCW induced current produces an outward induced field, opposing the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.796094 669.358125)">increase of inward flux. Faraday emf is signed around the chosen positive loop, not an arbitrary terminal voltage without a winding reference.</text>
  </g>
