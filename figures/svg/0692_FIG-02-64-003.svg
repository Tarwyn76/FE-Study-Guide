  <ns0:g id="text_17">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.261719 656.640625)">Closed resistive coil with N turns and increasing external field into the page. CCW induced current produces an outward induced field, opposing the</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.796094 669.358125)">increase of inward flux. Faraday emf is signed around the chosen positive loop, not an arbitrary terminal voltage without a winding reference.</ns0:text>
