   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.146094 650.281875)">Hypothetical purchase-cost scaling for comparable equipment within a valid capacity range. Lang factor5 is the handbook fluid-processing fixed-capital</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.892187 662.999375)">example; total-capital factor is a different basis. Apply plant-level factor to the defined total purchased-equipment cost, not automatically to one</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(364.851562 675.716875)">isolated equipment item. Factors depend on scope/site.</ns0:text>
  </ns0:g>
 </ns0:g>
