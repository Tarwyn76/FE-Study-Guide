  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(90.160156 656.501562)">C_A0=2 mol/L; ε_A=1 for pure A→2B. At X=0.50, remaining A amount is0.5N_A0 but volume is1.5V0, so C_A/C_A0=1/3. Moving piston represents volume change; no</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(259.632812 669.497187)">gas is fed or discharged. Constant-volume conversion formula would overestimate concentration.</text>
