    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="154.1232" y="347.54325" transform="rotate(-0 154.1232 347.54325)">A</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="369.432" y="347.54325" transform="rotate(-0 369.432 347.54325)">5</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="593.712" y="347.54325" transform="rotate(-0 593.712 347.54325)">5</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="826.9632" y="347.54325" transform="rotate(-0 826.9632 347.54325)">Limiting</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="154.1232" y="436.96725" transform="rotate(-0 154.1232 436.96725)">B</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="369.432" y="436.96725" transform="rotate(-0 369.432 436.96725)">12</text>
