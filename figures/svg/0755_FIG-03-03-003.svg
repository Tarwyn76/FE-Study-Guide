      <tspan x="57.348633" y="-0.734375" style="font-size: 30px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
      <tspan x="102.861328" y="-0.734375" style="font-size: 30px; font-family: 'DejaVu Sans'; fill: #23313d">→</tspan>
     </text>
    </g>
   </g>
