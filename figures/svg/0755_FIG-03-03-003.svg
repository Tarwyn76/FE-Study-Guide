     <text>
      <tspan x="0" y="-0.734375" style="font-style: oblique; font-size: 30px; font-family: 'DejaVu Sans'; fill: #23313d">A</tspan>
      <tspan x="76.435547" y="-0.734375" style="font-style: oblique; font-size: 30px; font-family: 'DejaVu Sans'; fill: #23313d">B</tspan>
      <tspan x="133.842773" y="-0.734375" style="font-style: oblique; font-size: 30px; font-family: 'DejaVu Sans'; fill: #23313d">C</tspan>
