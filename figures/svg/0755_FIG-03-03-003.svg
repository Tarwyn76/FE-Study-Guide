   <ns0:g id="text_14">
    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(315.068359 503.195758)">B required for 5 mol A: 10 mol</ns0:text>
    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(282.109375 536.889117)">B excess=(12−10)/10×100%=20%</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_15">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="98.504" transform="rotate(-0 55.44 98.504)">The limiting reactant sets the maximum extent; excess uses the stoichiometric requirement</ns0:text>
  </ns0:g>
  <ns0:g id="text_16">
</ns0:g>
  <ns0:g id="text_17" transform="translate(0.000000 -92.626251)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.397656 650.281875)">Assume only this reaction. Extent cannot exceed 5 mol; at complete A consumption outlets are A=0,B=2,C=5 mol. Excess percentage is relative to the</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.288281 662.999375)">stoichiometric requirement, not relative to actual B feed. Limiting-reactant identification does not imply completion is kinetically or thermodynamically</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(481.939062 675.716875)">possible.</ns0:text>
  </ns0:g>
