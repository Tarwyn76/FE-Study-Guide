   <ns0:g id="text_9">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="826.9632" y="347.54325" transform="rotate(-0 826.9632 347.54325)">Limiting</ns0:text>
