  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A square-thread power screw raises load by converting input torque into axial motion</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1341  •  FIG-03-87-001</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned square-thread screw. Raising torque is Fdm/2×(tanλ+μ)/(1−μtanλ) plus Fμc dc/2; λ is the lead angle. Mean collar diameter uses the specified</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">friction model. No Acme-thread angle correction is applied. Thread and collar torque oppose raising motion.</text>
  </g>
