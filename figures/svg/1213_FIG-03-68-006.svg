  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Johnson's two-machine rule minimizes makespan under its flow-shop assumptions</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1213  •  FIG-03-68-006</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Every job visits machine1 then machine2 once, without preemption; machines process one job at a time. Processing times are deterministic, all jobs are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">available initially, and transfer/setup complications are excluded. The selected order has makespan24 min and was compared with all24 permutations; tied</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">optimal sequences may exist.</text>
  </g>
