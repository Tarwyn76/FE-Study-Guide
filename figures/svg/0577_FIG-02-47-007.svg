  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.464844 656.640625)">For subcritical liquid–vapor equilibrium outside the solid region. P and T are dependent at saturation and cannot determine quality. Beyond the critical</text>
