   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A watershed budget balances precipitation and exchanges against losses and stored water</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0844  •  FIG-03-16-001</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.900781 650.281875)">Illustrative budget on watershed-area-equivalent depth over one period. Control volume includes surface and shallow soil storage; infiltration across the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.122656 662.999375)">land surface is an internal transfer, while deep recharge leaves this chosen volume. Precipitation, evapotranspiration, runoff and lateral groundwater</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(282.014063 675.716875)">exchanges must share time/area basis; do not double-count infiltration as a second loss.</text>
  </g>
 </g>
