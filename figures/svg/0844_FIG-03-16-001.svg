   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="91.3248" y="244.870875" transform="rotate(-0 91.3248 244.870875)">GW in=5</text>
