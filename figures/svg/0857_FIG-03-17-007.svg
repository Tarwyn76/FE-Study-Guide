  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(105.389844 650.142812)">Same trapezoid,n and Q as851–852; computed GVF profile with hydrostatic pressure and α=1. Both normal/control depths are subcritical and y&gt;y_n, giving an</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.142969 663.138438)">M1 profile. Downstream red line identifies imposed control, not a fully modeled weir. Bed/surface elevation plotted to separate depth from absolute</text>
