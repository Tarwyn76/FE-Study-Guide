   <ns0:g id="text_18">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(175.965625 530.025406)">A conversion: X=3/5=0.60; yield C per initial limiting A: 3/5=0.60</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(64.270312 556.980094)">Selectivity needs an undesired product; none is present in this single-reaction example.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_19">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="82.393" transform="rotate(-0 55.44 82.393)">Stoichiometric extent links inlet amounts to outlet amounts and conversion</ns0:text>
  </ns0:g>
  <ns0:g id="text_20">
</ns0:g>
  <ns0:g id="text_21">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.349219 656.501562)"><ns0:tspan font-size="10.000px">A is limiting: ξ</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">max</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=min(5/1,12/2)=5 mol. Species outlet n</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">i</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=n</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">i0</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">+ν</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">iξ,</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> with negative reactant coefficients. Yield is desired product divided by its</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.53125 669.497187)">maximum possible stoichiometric amount from initial limiting feed. Selectivity C/undesired product is undefined when no undesired product is formed.</ns0:text>
  </ns0:g>
 </ns0:g>
