   <g id="text_18">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(175.965625 530.025406)">A conversion: X=3/5=0.60; yield C per initial limiting A: 3/5=0.60</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(64.270312 556.980094)">Selectivity needs an undesired product; none is present in this single-reaction example.</text>
