  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Stoichiometric extent links inlet amounts to outlet amounts and conversion</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0753  •  FIG-03-03-001</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.349219 656.501562)">A is limiting: ξ_max=min(5/1,12/2)=5 mol. Species outlet n_i=n_i0+ν_iξ, with negative reactant coefficients. Yield is desired product divided by its</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.53125 669.497187)">maximum possible stoichiometric amount from initial limiting feed. Selectivity C/undesired product is undefined when no undesired product is formed.</text>
  </g>
