   <g id="text_6">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="625.452963" transform="rotate(-0 540 625.452963)">Pressure example:0–10 bar →4–20 mA →250 Ω shunt gives1–5 V</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A measurement chain conditions physical sensor output before conversion and logging</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1386  •  FIG-03-93-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned pressure-transmitter example; current-loop and shunt conversion are independent of the sensor technology. Temperature and pH require appropriate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">sensor-specific compensation. Calibration, isolation, input range, bandwidth, resolution, and uncertainty remain part of the complete chain.</text>
  </g>
