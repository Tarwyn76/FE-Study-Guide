   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="287.685" y="463.689487" transform="rotate(-0 287.685 463.689487)">A/D CONVERTER</text>
