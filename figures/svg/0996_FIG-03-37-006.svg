  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Lenz’s law makes the induced circulation oppose the change in linked magnetic flux</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0996  •  FIG-03-37-006</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.889062 650.281875)">Coil face-view with many turns represented by one loop. Crosses are increasing external flux into the page; gold dot is the opposing induced field out of</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.907031 662.999375)">page. Positive emf follows the right-hand contour for the chosen normal. Induced current requires a closed conducting path; the figure assumes a closed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(246.763281 675.716875)">loop. Self-inductance/load dynamics are not solved, and magnitude of induced current is not assigned.</text>
  </g>
