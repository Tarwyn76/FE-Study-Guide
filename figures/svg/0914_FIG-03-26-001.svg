  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0914  •  FIG-03-26-001</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.634375 650.174062)">Singly reinforced rectangular beam, compression at top, tensile concrete ignored, plane sections remain plane. β₁=0.85 is stipulated for the teaching example.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.840625 662.891562)">ε_t≈0.00904 exceeds yield strain0.0021, justifying f_s=f_y. Stress/strain panels are schematic rather than scaled in the horizontal direction; C=T for pure bending.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(425.09375 675.887187)">d is to tension-steel centroid, not total height.</text>
  </g>
