  <ns0:g id="text_16">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.634 591.334873)">Singly reinforced rectangular beam, compression at top, tensile concrete ignored, plane sections remain plane. β₁=0.85 is stipulated for the teaching example.</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.841 604.052373)"><ns0:tspan font-size="10.000px">ε</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">t</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">≈0.00904 exceeds yield strain0.0021, justifying f</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">s</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=f</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">y</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">. Stress/strain panels are schematic rather than scaled in the horizontal direction; C=T for pure bending.</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(425.094 617.047998)">d is to tension-steel centroid, not total height.</ns0:text>
  </ns0:g>
