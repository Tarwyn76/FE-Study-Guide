   <g id="text_14">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="642.1233" transform="rotate(-0 540 642.1233)">Rows are current states; columns are next states.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A row-stochastic transition matrix updates a row probability vector by right multiplication</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1188  •  FIG-03-65-002</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Same discrete daily chain as1187, using row-vector convention. Changing to column vectors requires transposing the update convention. Entries are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">nonnegative and rows sum to1; repeated matrix multiplication advances time. State ordering Up/Down is fixed for both vectors and matrices; transposing</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">accidentally changes the interpretation.</text>
  </g>
