  <g id="text_38">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned flows and coordinates, with Manhattan distance and no obstacles. Score contributions are30+35+6+32+4=107 load·m/day. Loads are a common unit</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">across links; no monetary handling rate or travel-time penalty is assigned. Symmetric distances do not imply symmetric flows, and this single layout has</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">not been optimized.</text>
  </g>
