  </g>
  <g id="text_23">
</g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.207031 716.305875)">Simplified signal block diagrams: TIC temperature controller; FIC flow controller. Cascade needs the inner loop faster than the outer loop; ratio uses measured</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.466406 729.023375)">master flow to set the slave flow. Feedforward needs a measured disturbance and adequate model; feedback corrects remaining error. Process piping and independent</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(467.616406 741.740875)">safety functions are omitted.</text>
  </g>
