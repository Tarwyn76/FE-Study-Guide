      <tspan x="83.756836" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">−</tspan>
      <tspan x="102.19043" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∂</tspan>
      <tspan x="130.334961" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="137.74707" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∂</tspan>
      <tspan x="41.722656" y="-0.96875" style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">E</tspan>
      <tspan x="113.566406" y="-0.96875" style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">B</tspan>
