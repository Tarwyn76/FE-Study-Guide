     </text>
    </g>
   </g>
   <g id="text_9">
    <!-- $\nabla\times\mathbf{H}=\mathbf{J}+\partial\mathbf{D}/\partial t$ -->
    <g style="fill: #23313d" transform="translate(704.958 611.470337)">
     <text>
      <tspan x="0" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∇</tspan>
