      <tspan x="89.514648" y="2.640625" style="font-style: oblique; font-size: 15.4px; font-family: 'DejaVu Sans'; fill: #23313d">f</tspan>
     </text>
    </g>
   </g>
   <g id="text_7">
    <!-- $\nabla\cdot\mathbf{B}=0$ -->
    <g style="fill: #23313d" transform="translate(750.608 496.754225)">
     <text>
      <tspan x="0" y="-0.671875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∇</tspan>
