      <tspan x="122.332031" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∂</tspan>
      <tspan x="151.969727" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="159.381836" y="-0.96875" style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">∂</tspan>
      <tspan x="41.722656" y="-0.96875" style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">H</tspan>
      <tspan x="87.140625" y="-0.96875" style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">J</tspan>
      <tspan x="133.708008" y="-0.96875" style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">D</tspan>
      <tspan x="170.757812" y="-0.96875" style="font-style: oblique; font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d">t</tspan>
     </text>
    </g>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Maxwell’s laws link charge, current, electric fields, and magnetic fields</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0997  •  FIG-03-37-007</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.491406 715.808063)">Macroscopic Maxwell equations with free-charge densityρ_f and free/conduction current densityJ; displacement-current term is explicit. Constitutive relations shown</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.304688 729.521187)">assume homogeneous linear isotropic media; J=σE for ohmic conduction. Source-free lossless media support waves at v=1/√(με), with power flow E×H. Concept arrows are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(282.907812 742.238687)">relationships, not a time-order causal simulation; boundary/initial conditions complete a field problem.</text>
  </g>
 </g>
