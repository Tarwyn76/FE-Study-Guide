   <g id="text_2">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="156.307975" transform="rotate(-0 540 156.307975)">Throughput λ=8 jobs/hour</text>
   </g>
   <g id="text_3">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(392.423594 576.959225)">L=λW=8×0.50=4 jobs</text>
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(285.738281 610.024725)">Queue only:Lq=λWq=8×0.40=3.2 jobs</text>
   </g>
  </g>
  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Little’s law links average population to throughput and average time in a matched system boundary</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1181  •  FIG-03-64-002</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Stable long-run example consistent with the M/M/1 model in1182. Little’s law is broader than M/M/1 and does not require exponential distributions when</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">conservation/average conditions hold. Match throughput, time, and population boundaries; blocked arrivals are not admitted throughput. Queue waiting</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">excludes service, while system time includes it.</text>
  </g>
 </g>
