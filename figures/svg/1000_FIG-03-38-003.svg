  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">Traveling-wave amplitudes are specified at the load. Positive line current points toward the load: IL=(V⁺−V⁻)/Z₀=80 mA. Peak phasor amplitudes;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 670.078125)">incident/reflected powers are 0.36/0.04 W and load power is 0.32 W. Source impedance is not assigned.</text>
  </g>
