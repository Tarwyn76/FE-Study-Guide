tspan style="font-size: 7.200px" dy="2.400px">w</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">/V</tspan><tspan style="font-size: 7.200px" dy="2.400px">v</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">; moisture</tspan></text>
