   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(79.751562 656.501562)">Example G_s=2.65,γ_w=9.81 kN/m³,V_s=1 m³,e=0.65,S=70%. V_v=V_a+V_w=0.65 m³ and total volume1.65 m³. e=V_v/V_s,n=V_v/V,w=W_w/W_s,S=V_w/V_v; moisture</text>
