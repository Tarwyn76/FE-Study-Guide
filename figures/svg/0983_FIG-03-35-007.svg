  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Converter losses reduce efficiency and must leave through a defined thermal path</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0983  •  FIG-03-35-007</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.971875 650.142812)">Hypothetical additive loss budget; component losses must be evaluated at their actual operating point. η=P_out/(P_out+P_loss). The14 W semiconductor group</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(98.939844 663.138438)">and3 K/W aggregate thermal resistance are a separate assumed steady-state example, not a package rating; other4+1+1 W losses heat other components. Real</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(195.6625 675.855937)">thermal paths may be parallel and temperature dependent; no maximum junction temperature or safe margin is specified.</text>
  </g>
 </g>
