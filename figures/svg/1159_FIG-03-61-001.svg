  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned first-destination split, not a local waste forecast or ultimate-output balance. Recycling/composting/WTE can produce rejects or residuals later</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">sent to landfill. Do not add those transfers to the initial generation again. Material quality, markets, emissions, energy, and operational capacity affect</text>
