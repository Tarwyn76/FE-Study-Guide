   <g id="text_1">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="540" y="226.998137" transform="rotate(-0 540 226.998137)">ELIMINATION: remove the hazardous operation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="540" y="316.422137" transform="rotate(-0 540 316.422137)">SUBSTITUTION: replace with a less hazardous process</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="540" y="405.846138" transform="rotate(-0 540 405.846138)">ENGINEERING: guard / isolate / ventilate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="540" y="495.270138" transform="rotate(-0 540 495.270138)">ADMINISTRATIVE: procedures / access / schedules</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="540" y="584.694138" transform="rotate(-0 540 584.694138)">PPE: protect the individual</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="722.914688" transform="rotate(-0 540 722.914688)">Examples: machine guarding • chemical source capture • electrical isolation • avoid confined entry</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="169.000000" transform="rotate(-0 59.4 47.52)">The hierarchy of controls prioritizes removing hazards before relying on worker behavior</text>
  </g>
  <g id="text_8">
   </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 751.000000)">Original hierarchy diagram consistent with OSHA/NIOSH guidance. Examples are schematic prevention choices; actual controls must address the specific hazard</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 763.717500)">and their own introduced risks. Engineering controls can still need maintenance and training. The hierarchy does not replace hazard assessment or task-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 776.435000)">specific requirements.</text>
  </g>
