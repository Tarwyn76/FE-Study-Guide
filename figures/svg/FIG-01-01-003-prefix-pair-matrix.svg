<rect x="1368" y="1030" width="312" height="205" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2.5" />
<text x="1524.0" y="1098" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+9 + -9 = +0</text>
<text x="1524.0" y="1150" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁰</text>
<text x="1524.0" y="1196" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#D39A22" text-anchor="middle">no prefix  —</text>
<rect x="120" y="1275" width="1560" height="105" rx="14" fill="#F4F7FA" stroke="#D0DAE3" stroke-width="2" />
<text x="900" y="1320" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="750" fill="#172033" text-anchor="middle">Example: mega × micro = 10⁶ × 10⁻⁶ = 10⁰</text>
<text x="900" y="1356" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#526274" text-anchor="middle">The prefixes cancel, leaving the base unit.</text>
</svg>