<text x="1524.0" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">nano  n</text>
<rect x="120" y="620" width="312" height="205" rx="0" fill="#E4F2ED" stroke="#2A7F7F" stroke-width="3" />
<text x="276.0" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="middle">kilo  k</text>
<text x="276.0" y="752" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2A7F7F" text-anchor="middle">10³</text>
<rect x="432" y="620" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
