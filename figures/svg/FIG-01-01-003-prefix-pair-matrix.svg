<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Prefix pair multiplication matrix</title>
<desc id="svg-desc">Five-by-five matrix including headers showing the net SI prefix when base, kilo, mega, or giga is multiplied by base, milli, micro, or nano</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1450" fill="#FFFFFF"/>
<text x="70" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="800" fill="#183B5B" text-anchor="start">PREFIX-PAIR MULTIPLICATION MATRIX</text>
<text x="70" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#526274" text-anchor="start">Multiply powers of ten by adding their exponents.</text>
<rect x="120" y="210" width="312" height="205" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="3" />
<text x="276.0" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">ROW × COLUMN</text>
<text x="276.0" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#DDEAF3" text-anchor="middle">ADD EXPONENTS</text>
<rect x="432" y="210" width="312" height="205" rx="0" fill="#DCECF6" stroke="#2F6F9F" stroke-width="3" />
<text x="588.0" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#183B5B" text-anchor="middle">BASE</text>
<text x="588.0" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2F6F9F" text-anchor="middle">10⁰</text>
<rect x="744" y="210" width="312" height="205" rx="0" fill="#DCECF6" stroke="#2F6F9F" stroke-width="3" />
<text x="900.0" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#183B5B" text-anchor="middle">milli  m</text>
<text x="900.0" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2F6F9F" text-anchor="middle">10⁻³</text>
<rect x="1056" y="210" width="312" height="205" rx="0" fill="#DCECF6" stroke="#2F6F9F" stroke-width="3" />
<text x="1212.0" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#183B5B" text-anchor="middle">micro  µ</text>
<text x="1212.0" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2F6F9F" text-anchor="middle">10⁻⁶</text>
<rect x="1368" y="210" width="312" height="205" rx="0" fill="#DCECF6" stroke="#2F6F9F" stroke-width="3" />
<text x="1524.0" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#183B5B" text-anchor="middle">nano  n</text>
<text x="1524.0" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2F6F9F" text-anchor="middle">10⁻⁹</text>
<rect x="120" y="415" width="312" height="205" rx="0" fill="#E4F2ED" stroke="#2A7F7F" stroke-width="3" />
<text x="276.0" y="493" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="middle">BASE</text>
<text x="276.0" y="547" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2A7F7F" text-anchor="middle">10⁰</text>
<rect x="432" y="415" width="312" height="205" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2.5" />
