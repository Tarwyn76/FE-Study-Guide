<text x="1212.0" y="893" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+6 + -6 = +0</text>
<text x="1212.0" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁰</text>
<text x="1212.0" y="991" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#D39A22" text-anchor="middle">no prefix  —</text>
<rect x="1368" y="825" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
<text x="1524.0" y="893" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+6 + -9 = -3</text>
<text x="1524.0" y="945" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁻³</text>
<text x="1524.0" y="991" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">milli  m</text>
<rect x="120" y="1030" width="312" height="205" rx="0" fill="#E4F2ED" stroke="#2A7F7F" stroke-width="3" />
