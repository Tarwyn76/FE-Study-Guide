<text x="1212.0" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">milli  m</text>
<rect x="1368" y="620" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
<text x="1524.0" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+3 + -9 = -6</text>
<text x="1524.0" y="740" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁻⁶</text>
<text x="1524.0" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">micro  µ</text>
