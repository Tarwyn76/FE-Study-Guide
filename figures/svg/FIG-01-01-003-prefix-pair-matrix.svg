<text x="900.0" y="1150" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁶</text>
<text x="900.0" y="1196" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">mega  M</text>
