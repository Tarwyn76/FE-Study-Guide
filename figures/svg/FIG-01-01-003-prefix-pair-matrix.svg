<text x="276.0" y="957" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="750" fill="#2A7F7F" text-anchor="middle">10⁶</text>
<rect x="432" y="825" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
<text x="588.0" y="893" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+6 + +0 = +6</text>
