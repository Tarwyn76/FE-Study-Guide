<rect x="432" y="1030" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
<text x="588.0" y="1098" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+9 + +0 = +9</text>
