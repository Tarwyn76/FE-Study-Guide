<text x="900.0" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+3 + -3 = +0</text>
<text x="900.0" y="740" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁰</text>
<text x="900.0" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#D39A22" text-anchor="middle">no prefix  —</text>
<rect x="1056" y="620" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
<text x="1212.0" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+3 + -6 = -3</text>
