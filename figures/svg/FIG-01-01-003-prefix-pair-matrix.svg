<text x="900.0" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" text-anchor="middle">+0 + -3 = -3</text>
<text x="900.0" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#172033" text-anchor="middle">10⁻³</text>
<text x="900.0" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="750" fill="#2F6F9F" text-anchor="middle">milli  m</text>
<rect x="1056" y="415" width="312" height="205" rx="0" fill="#F8FAFC" stroke="#CAD5DF" stroke-width="2.5" />
