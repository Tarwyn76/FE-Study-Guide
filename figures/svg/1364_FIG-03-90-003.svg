  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Handbook preferred metric limit-fit values for25 mm. Capital H denotes the hole zone with lower deviation0; lowercase letters denote shaft positions;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">grade6/7 identifies the tolerance width. Numerical deviations depend on basic-size interval, so the same designation does not imply the same micrometers at</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">every diameter.</text>
  </g>
 </g>
