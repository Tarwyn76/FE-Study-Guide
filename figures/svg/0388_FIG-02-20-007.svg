   <g id="text_1">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="122.699125" transform="rotate(-0 432 122.699125)">Identify electrical, pressure, mechanical, chemical, and thermal sources</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="199.019125" transform="rotate(-0 432 199.019125)">Shut down and isolate using the applicable energy-control procedure</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="275.339125" transform="rotate(-0 432 275.339125)">Apply locks / tags and control access as required</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="351.659125" transform="rotate(-0 432 351.659125)">Release or restrain stored energy; prevent reaccumulation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="427.979125" transform="rotate(-0 432 427.979125)">Verify effective isolation before work</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="504.299125" transform="rotate(-0 432 504.299125)">Meet confined-space permit, monitoring, and rescue requirements separately</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="38.88" y="36" transform="rotate(-0 38.88 36)">Verify isolation before work or confined-space entry</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="38.88" y="700.56" transform="rotate(-0 38.88 700.56)">0388  •  FIG-02-20-007</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="673.2" transform="rotate(-0 432 673.2)">Use authorized workers and the applicable program. Electrical isolation verification also follows the relevant electrical-safety requirements.</text>
