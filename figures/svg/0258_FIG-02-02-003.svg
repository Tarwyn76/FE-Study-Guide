   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="227.5776" y="143.718263" transform="rotate(-0 227.5776 143.718263)">AUTHORITY</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.790178 198.801114)">Direct, review, change, reject,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.712912 216.321661)">and approve work as it develops</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="620.6976" y="143.718263" transform="rotate(-0 620.6976 143.718263)">PROJECT AWARENESS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(495.650803 198.801114)">Understand scope, needs, constraints,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(538.168928 216.321661)">and special requirements</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="227.5776" y="329.175863" transform="rotate(-0 227.5776 329.175863)">EXPLAIN DECISIONS</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.614787 384.258714)">Answer relevant technical questions</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.263459 401.779261)">and explain the engineering basis</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="620.6976" y="329.175863" transform="rotate(-0 620.6976 329.175863)">ACCEPT RESPONSIBILITY</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(527.615569 384.258714)">Exercise professional control</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(505.481037 401.779261)">and take responsibility for the work</text>
   </g>
  </g>
