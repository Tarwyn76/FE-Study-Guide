  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1080  •  FIG-03-49-006</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Equilibrium partitioning concept with consistent concentration conventions. H′ is dimensionless air/water concentration ratio at the same temperature;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">dimensional Henry forms differ. Kd and Koc often have L/kg units; BCF units depend on biota concentration basis. Kow is dimensionless for matched molar</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">concentrations and is not a universal BCF.</text>
  </g>
