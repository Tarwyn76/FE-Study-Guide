  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.314844 650.281875)">Hypothetical cumulative project values. EV is budgeted value of completed scope, not actual cost or cash received. SV is a monetary/value variance, not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.782031 662.999375)">days of delay; SPI below1 alone does not establish critical-path completion delay. Curves after the status date are illustrative future records, not a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(409.0625 675.716875)">forecast inferred from current indices.</text>
  </g>
