   <g id="text_2">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="217.221612" transform="rotate(-0 413.8425 217.221612)">Authentication</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="217.221612" transform="rotate(-0 666.1575 217.221612)">Authorization</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(874.910547 205.139987)">Resource</text>
