   <g id="text_5">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="477.351487" transform="rotate(-0 540 477.351487)">Accounting log</text>
   </g>
   <g id="text_6">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="625.452963" transform="rotate(-0 540 625.452963)">Who are you?  →  May you do this?  →  What happened?</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Authentication establishes identity; authorization decides permitted actions</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1055  •  FIG-03-46-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual AAA flow. A successful authentication does not automatically authorize every resource action. Policies evaluate the identity and context for the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">requested operation; allowed/denied outcomes should be logged with appropriate privacy, integrity and retention. Credentials and actual identifiers are not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">shown.</text>
  </g>
