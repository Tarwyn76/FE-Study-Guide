   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.007031 656.671875)">Illustrative beta model R₀=10 kΩ at 25°C. The coefficient β and valid temperature range are manufacturer dependent; precision work may require</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.210938 669.389375)">Steinhart–Hart coefficients. Resistance falls steeply at low temperature. Lead resistance, self-heating and tolerance are not included in the curve.</text>
