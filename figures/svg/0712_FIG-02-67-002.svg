  <ns0:g id="text_20">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="109.250" transform="rotate(-0 55.44 109.250)">An NTC thermistor’s resistance decreases nonlinearly with absolute temperature</ns0:text>
  </ns0:g>
  <ns0:g id="text_22">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.007031 656.671875)">Illustrative beta model R₀=10 kΩ at 25°C. The coefficient β and valid temperature range are manufacturer dependent; precision work may require</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.210938 669.389375)">Steinhart–Hart coefficients. Resistance falls steeply at low temperature. Lead resistance, self-heating and tolerance are not included in the curve.</ns0:text>
  </ns0:g>
