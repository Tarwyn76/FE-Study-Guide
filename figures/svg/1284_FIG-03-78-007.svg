  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Creep progresses from a falling strain rate through a near-steady stage to accelerating strain</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1284  •  FIG-03-78-007</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned smooth qualitative creep-strain curve under nominally constant load and temperature; horizontal scale is normalized rather than hours. Stage</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">boundaries are illustrative and depend on material and conditions. Initial elastic strain and an experimentally measured rupture time are not included.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">Increasing tertiary rate can involve damage and changing stress as the section deforms.</text>
  </g>
