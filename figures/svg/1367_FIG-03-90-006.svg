    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="212.308687" transform="rotate(-0 203.58 212.308687)">A=20±0.10 mm</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="212.308687" transform="rotate(-0 540 212.308687)">B=30±0.15 mm</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="212.308687" transform="rotate(-0 876.42 212.308687)">C=10±0.05 mm</text>
   </g>
   <g id="text_4">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="407.964712" transform="rotate(-0 540 407.964712)">Assembly length L=A+B+C=60 mm</text>
   </g>
   <g id="text_5">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="527.638438" transform="rotate(-0 540 527.638438)">Worst-case half-width=0.10+0.15+0.05=0.30 mm</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="647.599975" transform="rotate(-0 540 647.599975)">If each limit is±3σ and independent: 3σL=√(0.10²+0.15²+0.05²)=0.1871 mm</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Worst-case stackup adds absolute limits; RSS requires a statistical model</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1367  •  FIG-03-90-006</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned additive dimension chain. Worst-case guarantees the stated interval under all part combinations. Statistical RSS assumes centered independent</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">normal variables and specified±3σ part limits; tolerance values alone do not establish those distributions. Correlation, bias, and process drift invalidate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">the simple RSS interpretation.</text>
  </g>
 </g>
