  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned Taylor relation at fixed feed, depth, tool, material, and failure criterion. With T in minutes and V in m/min, C has compatible dimensional units</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">and is numerically200; n is dimensionless. Plot axes are T horizontal and V vertical, giving slope−n. Reversing axes gives−1/n. Constants do not transfer</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">automatically to another process or material.</text>
  </g>
