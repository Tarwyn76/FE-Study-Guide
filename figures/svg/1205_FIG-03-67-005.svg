  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A tracking signal accumulates signed errors relative to average absolute error</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1205  •  FIG-03-67-005</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned errors [2,3,1,4,2,3,1,4] units use actual minus forecast. MAD is the expanding mean of absolute errors; TS therefore equals period number in this</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">all-positive example. Dashed ±4 values are illustrative operational flags, not formal statistical control limits. TS is undefined if MAD is zero. A flag</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">prompts investigation, not automatic model replacement.</text>
  </g>
 </g>
