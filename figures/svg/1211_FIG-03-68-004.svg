  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1211  •  FIG-03-68-004</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned four-period demand, identical aggregate units, no shortages or losses. The level plan requires capacity of at least125 units per period and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">carries inventory. A chase plan has zero ending inventory but must support150-unit peaks. Cost, staffing, overtime, backlog, and hiring constraints</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">determine which plan is preferable; no cost optimum is claimed.</text>
  </g>
