  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Noise dose adds exposure fractions under the stated exchange-rate convention</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1246  •  FIG-03-73-004</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Illustrative U.S. OSHA general-industry Appendix A computation: assigned segments only, with no additional counted noise. This dose model uses a5 dB</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">exchange rate, not equal-energy3 dB averaging. Actual exposure assessment needs calibrated measurements, correct integration settings, and the full</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">workshift. Dose arithmetic alone is not a determination of safe exposure or compliance.</text>
  </g>
