   <g id="text_17">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="622.119362" transform="rotate(-0 540 622.119362)">Dose=100ΣC/T=75%; TWA8=16.61log10(0.75)+90=87.92 dBA</text>
   </g>
   <g id="text_18">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="723.190625" transform="rotate(-0 540 723.190625)">Assigned two-segment exposure; do not average decibels arithmetically.</text>
