   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.853125 656.640625)">Illustrative metallic conductor over a range where a constant reference coefficient is adequate. α is referenced to T₀; it is not generally temperature</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(278.305469 669.358125)">independent over a large range. Celsius temperature differences equal Kelvin differences.</ns0:text>
