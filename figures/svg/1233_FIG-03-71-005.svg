   <g id="text_13">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="483.368162" transform="rotate(-0 540 483.368162)">Total workload=620 min/shift; usable time=420 min/machine·shift</text>
   </g>
   <g id="text_14">
    <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="599.784587" transform="rotate(-0 540 599.784587)">Mrequired=620/420=1.476 → at least2 machines</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="679.27315" transform="rotate(-0 540 679.27315)">Discrete assignment and schedule feasibility still require checking.</text>
   </g>
