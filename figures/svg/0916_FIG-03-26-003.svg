   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="173.938625" transform="rotate(-0 504 173.938625)">Geometry + materials → strain compatibility</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="302.800687" transform="rotate(-0 504 302.800687)"><tspan font-size="22.000px">Equilibrium C=T → a, c, ε</tspan><tspan font-size="14.960px" dy="5.280px">t</tspan><tspan font-size="22.000px" dy="-5.280px"> and steel stress</tspan></text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="431.968687" transform="rotate(-0 504 431.968687)"><tspan font-size="22.000px">M</tspan><tspan font-size="14.960px" dy="5.280px">n</tspan><tspan font-size="22.000px" dy="-5.280px">=T(d−a/2) → select φ for stated code edition</tspan></text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="568.588687" transform="rotate(-0 504 568.588687)"><tspan font-size="22.000px">Example: ε</tspan><tspan font-size="14.960px" dy="5.280px">t</tspan><tspan font-size="22.000px" dy="-5.280px">=0.0090; assumed φ=0.90 → φM</tspan><tspan font-size="14.960px" dy="5.280px">n</tspan><tspan font-size="22.000px" dy="-5.280px">=304.179 kN·m ≥ M</tspan><tspan font-size="14.960px" dy="5.280px">u</tspan></text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="113.087931" transform="rotate(-0 55.44 113.087931)">Concrete flexural design checks strain before reducing nominal moment capacity</text>
  </g>
  <g id="text_6">
   </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.301 590.137931)">Same yielding-steel example as914–915. The displayed φ=0.90 is a stated tension-controlled teaching assumption consistent with the supplied handbook’s</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.449 602.855431)"><tspan font-size="10.000px">ACI318-14 context. Determine φ from the governing code edition and strain limits for an actual design. No numerical M</tspan><tspan font-size="6.800px" dy="2.400px">u</tspan><tspan font-size="10.000px" dy="-2.400px"> is supplied, so the inequality is</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(381.654 615.851056)">a check to perform, not an adequacy conclusion.</text>
  </g>
