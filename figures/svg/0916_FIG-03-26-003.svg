   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0916  •  FIG-03-26-003</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.300781 650.142812)">Same yielding-steel example as914–915. The displayed φ=0.90 is a stated tension-controlled teaching assumption consistent with the supplied handbook’s</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.449219 662.860312)">ACI318-14 context. Determine φ from the governing code edition and strain limits for an actual design. No numerical M_u is supplied, so the inequality is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(381.653906 675.855937)">a check to perform, not an adequacy conclusion.</text>
  </g>
