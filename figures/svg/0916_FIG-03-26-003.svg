   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="173.938625" transform="rotate(-0 504 173.938625)">Geometry + materials → strain compatibility</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="302.800687" transform="rotate(-0 504 302.800687)"><tspan style="font-size: 22.000px">Equilibrium C=T → a, c, ε</tspan><tspan style="font-size: 15.840px" dy="5.280px">t</tspan><tspan style="font-size: 22.000px" dy="-5.280px">​</tspan><tspan style="font-size: 22.000px"> and steel stress</tspan></text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="431.968687" transform="rotate(-0 504 431.968687)"><tspan style="font-size: 22.000px">M</tspan><tspan style="font-size: 15.840px" dy="5.280px">n</tspan><tspan style="font-size: 22.000px" dy="-5.280px">​</tspan><tspan style="font-size: 22.000px">=T(d−a/2) → select φ for stated code edition</tspan></text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="568.588687" transform="rotate(-0 504 568.588687)"><tspan style="font-size: 22.000px">Example: ε</tspan><tspan style="font-size: 15.840px" dy="5.280px">t</tspan><tspan style="font-size: 22.000px" dy="-5.280px">​</tspan><tspan style="font-size: 22.000px">=0.0090; assumed φ=0.90 → φM</tspan><tspan style="font-size: 15.840px" dy="5.280px">n</tspan><tspan style="font-size: 22.000px" dy="-5.280px">​</tspan><tspan style="font-size: 22.000px">=304.179 kN·m ≥ M</tspan><tspan style="font-size: 15.840px" dy="5.280px">u</tspan><tspan style="font-size: 22.000px" dy="-5.280px">​</tspan></text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Concrete flexural design checks strain before reducing nominal moment capacity</text>
  </g>
  <g id="text_7" transform="translate(0.000000 -102.497083)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.300781 650.142812)">Same yielding-steel example as914–915. The displayed φ=0.90 is a stated tension-controlled teaching assumption consistent with the supplied handbook’s</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.449219 662.860312)"><tspan style="font-size: 10.000px">ACI318-14 context. Determine φ from the governing code edition and strain limits for an actual design. No numerical M</tspan><tspan style="font-size: 7.200px" dy="2.400px">u</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px"> is supplied, so the inequality is</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(381.653906 675.855937)">a check to perform, not an adequacy conclusion.</text>
  </g>
