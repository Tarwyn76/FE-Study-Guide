   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="568.588687" transform="rotate(-0 504 568.588687)">Example: ε_t=0.0090; assumed φ=0.90 → φM_n=304.179 kN·m ≥ M_u</text>
