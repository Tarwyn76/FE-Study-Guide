   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0987  •  FIG-03-36-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.397656 650.142812)">Sinusoidal fixed10 kW inductive load at constant bus voltage, corrected from lagging0.75 to lagging0.95 displacement PF. Capacitor supplies positive</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.086719 662.860312)">magnitude Q_C locally (its passive complex Q is negative). Bank connection/voltage/frequency determine capacitance. Harmonics, resonance, switching,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(324.186719 675.855937)">overcorrection at light load and actual ratings are outside this example.</text>
  </g>
