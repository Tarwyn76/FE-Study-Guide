   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Separate SI and US example flows; they are not claimed to be equivalent.1 mg/L=0.001 kg/m³. US gallon=3.785411784 L; pound=0.45359237 kg. The familiar8.34</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">coefficient is rounded. Variable-flow daily loading requires integrating Q(t)C(t), not multiplying unrelated averages.</text>
