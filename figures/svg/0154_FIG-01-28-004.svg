   <g id="text_1">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(583.782347 200.776247)">Intersection counted twice</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(629.91555 220.992263)">in P(A) + P(B).</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(621.381956 241.208278)">Subtract it once.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="459.897425" transform="rotate(-0 432 459.897425)">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(454.023356 520.378184)">Disjoint special case: P(A ∩ B) = 0</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(495.089294 539.246466)">P(A ∪ B) = P(A) + P(B)</text>
   </g>
  </g>
