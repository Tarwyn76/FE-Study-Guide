  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1149  •  FIG-03-59-005</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Management alternatives, not a regulatory eligibility determination. Composting and thermal treatment may be further processing steps before final use or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">disposal. Pathogens, vector attraction, metals, other contaminants, site restrictions, and receiving-facility acceptance affect the appropriate route.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">Verify applicable requirements for the actual material and location.</text>
  </g>
