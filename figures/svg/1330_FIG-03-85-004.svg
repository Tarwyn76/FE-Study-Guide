  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1330  •  FIG-03-85-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative end-of-life membrane calculation: nominal thickness less corrosion allowance. Cross-section layers are enlarged for visibility, not scaled.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Manufacturing tolerance, measured remaining wall, localized attack, joint efficiency, and applicable code equations are separate requirements; this is not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">a code thickness determination.</text>
  </g>
