    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.5275" y="225.69475" transform="rotate(-0 161.5275 225.69475)">Sense condition</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="225.69475" transform="rotate(-0 413.8425 225.69475)">Transform signal</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="225.69475" transform="rotate(-0 666.1575 225.69475)">Decide / control</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="225.69475" transform="rotate(-0 918.4725 225.69475)">Actuate output</text>
   </g>
   <g id="text_5">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="401.6721" transform="rotate(-0 540 401.6721)">Material, energy, and information cross explicitly defined boundaries.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="208.386" y="491.26245" transform="rotate(-0 208.386 491.26245)">Interface</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="491.26245" transform="rotate(-0 515.97 491.26245)">Quantity / content</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="491.26245" transform="rotate(-0 847.584 491.26245)">Assigned requirement</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="208.386" y="556.84005" transform="rotate(-0 208.386 556.84005)">Sensor → processor</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="556.84005" transform="rotate(-0 515.97 556.84005)">Sample + timestamp</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="556.84005" transform="rotate(-0 847.584 556.84005)">10 samples/s; documented units</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="208.386" y="622.41765" transform="rotate(-0 208.386 622.41765)">Processor → actuator</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="515.97" y="622.41765" transform="rotate(-0 515.97 622.41765)">Command + status</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="622.41765" transform="rotate(-0 847.584 622.41765)">Command acknowledged</text>
   </g>
   <g id="text_15">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="679.549087" transform="rotate(-0 540 679.549087)">Allocate function → define interface contract → verify interactions</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Functional analysis separates required behavior from interface implementation</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1258  •  FIG-03-75-002</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual functional chain and two assigned interface examples. Required functions do not uniquely prescribe hardware. Interfaces need timing, units,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">range, direction, failure behavior, and ownership. Local component tests can miss interaction failures, so integration evidence belongs to the system</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">boundary.</text>
  </g>
 </g>
