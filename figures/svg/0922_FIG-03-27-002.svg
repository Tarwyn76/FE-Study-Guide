   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.672181 222.891453)">G_s=γ_s/γ_w=2.65</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.484525 253.153484)">e=0.65; γ_w=9.81 kN/m³</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(649.255006 223.391609)">n=e/(1+e)=0.3939</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(699.769069 253.041766)">S=wG_s/e</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(185.357925 404.177344)">DRY</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.172925 428.436562)">γ_d=G_sγ_w/(1+e)</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.219644 453.196406)">=15.755 kN/m³</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(455.593725 404.177344)">SATURATED</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(395.072944 428.436562)">γ_sat=(G_s+e)γ_w/(1+e)</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(439.240444 453.196406)">=19.620 kN/m³</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(755.734838 404.177344)">SUBMERGED</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(750.306713 428.436562)">γ′=γ_sat−γ_w</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(749.987494 453.196406)">=9.810 kN/m³</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Unit-weight equations follow directly from specific gravity and void volumes</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0922  •  FIG-03-27-002</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.982031 650.281875)">Same soil skeleton as921. Dry means water weight removed at fixed volume; saturated means all voids filled. Submerged unit weight describes effective</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.657812 662.999375)">weight under hydrostatic buoyancy, not total moist weight. At70% saturation, bulk unit weight is18.4606 kN/m³. Compressible skeleton or changing void</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(409.346875 675.716875)">ratio requires a new state calculation.</text>
  </g>
 </g>
