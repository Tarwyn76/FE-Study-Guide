  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1232  •  FIG-03-71-004</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Fixed cost$40 per open site. Matrix rows are customers and columns are sites; entries cover each customer’s complete demand over one common period. Each</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">customer is assigned once to an open site. No site capacities or distance restrictions are imposed, so all nonempty opening patterns can be enumerated. The</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">tie is intentional, not a unique location recommendation.</text>
  </g>
