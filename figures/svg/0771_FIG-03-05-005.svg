   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(106.9625 656.501562)">Chosen units: H=50 Pa·m³/mol,k_G=10⁻⁵ mol/(m²·s·Pa),k_L=10⁻³ m/s. p_G=200 Pa,p_i=100 Pa,C_i=2,C_L=1 mol/m³ give equal film fluxes. Interface is at local</text>
