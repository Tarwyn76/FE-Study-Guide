   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="454.664475" transform="rotate(-0 203.58 454.664475)">Performance monitoring</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="454.664475" transform="rotate(-0 540 454.664475)">Optimization</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="454.664475" transform="rotate(-0 876.42 454.664475)">Closure verification</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="630.641825" transform="rotate(-0 540 630.641825)">Iterate when monitoring challenges the conceptual site model.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Remediation proceeds through investigation, selection, implementation, and verification</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1123  •  FIG-03-55-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Generic remediation lifecycle; closure follows evidence against applicable objectives, not simply elapsed operating time. Monitoring can trigger model</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">revision or remedy optimization. Institutional controls, residual contamination, stakeholder review, and post-closure monitoring may remain. No</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">jurisdiction-specific procedural requirement is implied.</text>
  </g>
