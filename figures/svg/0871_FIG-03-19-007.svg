   </ns0:g>
  </ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="185.786" transform="rotate(-0 59.4 185.786)">A stormwater treatment train captures sediment before detention and controlled release</ns0:text>
  </ns0:g>
  <ns0:g id="text_10">
</ns0:g>
  <ns0:g id="text_11" transform="translate(0.000000 -128.880866)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.589844 650.281875)">Conceptual runoff treatment train. Forebay captures settleable sediment before the main cell; outlet controls release and receiving channel protection addresses</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.980469 662.999375)">erosion. Actual pollutant removal, hydraulic capacity, bypass, drawdown time and maintenance depend on site-specific design and operation; no universal treatment</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(484.904688 675.716875)">efficiency is assigned.</ns0:text>
  </ns0:g>
 </ns0:g>
