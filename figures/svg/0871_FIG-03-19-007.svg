    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(265.69075 460.473406)">Sediment removal</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(254.9845 487.428094)">maintenance access</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
