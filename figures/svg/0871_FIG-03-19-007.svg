  </g>
  <g id="text_10">
</g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.589844 650.281875)">Conceptual runoff treatment train. Forebay captures settleable sediment before the main cell; outlet controls release and receiving channel protection addresses</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.980469 662.999375)">erosion. Actual pollutant removal, hydraulic capacity, bypass, drawdown time and maintenance depend on site-specific design and operation; no universal treatment</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(484.904688 675.716875)">efficiency is assigned.</text>
  </g>
