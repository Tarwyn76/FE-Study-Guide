  <ns0:g id="text_22">
</ns0:g>
  <ns0:g id="text_23">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.089062 656.501562)"><ns0:tspan font-size="10.000px">Illustrative empirical rate law; C</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">B</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> is held at1 mol/L. Dimensionless logarithms use C</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ref</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=1 mol/L,r</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ref</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=1 mol/(L·min). For overall order2, k has units</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(157.497656 669.497187)">L/(mol·min); selected k=0.5. Orders are not automatically stoichiometric coefficients; changing conditions can change the apparent order.</ns0:text>
  </ns0:g>
 </ns0:g>
