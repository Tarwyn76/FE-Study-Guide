   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.089062 656.501562)">Illustrative empirical rate law; C_B is held at1 mol/L. Dimensionless logarithms use C_ref=1 mol/L,r_ref=1 mol/(L·min). For overall order2, k has units</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(157.497656 669.497187)">L/(mol·min); selected k=0.5. Orders are not automatically stoichiometric coefficients; changing conditions can change the apparent order.</text>
