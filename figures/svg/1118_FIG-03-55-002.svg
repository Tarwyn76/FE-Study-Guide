    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="664.534375" transform="rotate(-0 540 664.534375)">D=Rv V/A=250×0.10/10=2.50 m</text>
