   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="389.065088" transform="rotate(-0 193.968 389.065088)">1.1 Design</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="389.065088" transform="rotate(-0 540 389.065088)">1.2 Build</text>
