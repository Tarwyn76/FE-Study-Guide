    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="389.065088" transform="rotate(-0 886.032 389.065088)">1.3 Verify</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="193.968" y="590.931675" transform="rotate(-0 193.968 590.931675)">Drawings / BOM</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="590.931675" transform="rotate(-0 540 590.931675)">Hardware / assembly</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="590.931675" transform="rotate(-0 886.032 590.931675)">Test evidence / report</text>
   </g>
   <g id="text_8">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="741.075425" transform="rotate(-0 540 741.075425)">Work-package record:scope • owner • estimate • acceptance criteria</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A work breakdown structure decomposes deliverable scope rather than scheduling dependencies</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1195  •  FIG-03-66-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Deliverable-oriented WBS with illustrative identifiers. Connecting lines denote scope decomposition, not precedence or duration. The combined child scope</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">should cover its parent without double counting. Scheduling, resources, costs, and responsibility are associated records; a WBS alone does not determine</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">the critical path or percent complete.</text>
  </g>
 </g>
