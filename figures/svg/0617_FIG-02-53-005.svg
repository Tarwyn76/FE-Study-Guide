   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">The Rankine loop assigns a state to each component connection</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0617  •  FIG-02-53-005</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.507031 656.640625)">Conceptual steam-cycle T–s diagram, not water property data. Ideal pump/turbine are isentropic; boiler and condenser operate at their respective constant pressures.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(339.728906 669.358125)">State 1 is saturated liquid; 3 is superheated vapor; 4 is in the two-phase region.</text>
  </g>
 </g>
