   <ns0:g id="text_5">
    <ns0:text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(763.494244 186.131609)"><ns0:tspan font-size="22.000px">ṁ</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">da</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px">=1 kg/s</ns0:tspan></ns0:text>
