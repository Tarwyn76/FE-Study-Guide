  <ns0:g id="text_7">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="104.035" transform="rotate(-0 55.44 104.035)">Humidifier water balance is simplest on a conserved dry-air basis</ns0:text>
  </ns0:g>
  <ns0:g id="text_8">
</ns0:g>
  <ns0:g id="text_9" transform="translate(0.000000 -49.957821)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.390625 650.281875)">Steady humidification with all injected water evaporated, no liquid drain, no shaft work/KE/PE change. Humidity ratio is kg water/kg dry air; total</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.260156 662.999375)">moist-air flow is not conserved. Moist-air enthalpy h uses the same dry-air basis and reference as injected-water enthalpy. Heat duty cannot be determined</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(468.898438 675.716875)">from W alone.</ns0:text>
  </ns0:g>
 </ns0:g>
