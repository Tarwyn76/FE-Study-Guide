  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Humidifier water balance is simplest on a conserved dry-air basis</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0789  •  FIG-03-08-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.390625 650.281875)">Steady humidification with all injected water evaporated, no liquid drain, no shaft work/KE/PE change. Humidity ratio is kg water/kg dry air; total</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.260156 662.999375)">moist-air flow is not conserved. Moist-air enthalpy h uses the same dry-air basis and reference as injected-water enthalpy. Heat duty cannot be determined</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(468.898438 675.716875)">from W alone.</text>
  </g>
