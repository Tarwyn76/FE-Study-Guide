   <ns0:g id="text_6">
    <ns0:text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(251.397031 548.489672)"><ns0:tspan font-size="22.000px">Evaporated water=ṁ</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">da</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px">(W₂−W₁)=0.010 kg/s</ns0:tspan></ns0:text>
    <ns0:text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(238.276094 578.751703)"><ns0:tspan font-size="22.000px">Energy: ṁ</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">da</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px"> h₁+ṁ</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">water</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px"> h</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">water</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px">+Q̇=ṁ</ns0:tspan><ns0:tspan font-size="14.960px" dy="5.280px">da</ns0:tspan><ns0:tspan font-size="22.000px" dy="-5.280px"> h₂</ns0:tspan></ns0:text>
   </ns0:g>
