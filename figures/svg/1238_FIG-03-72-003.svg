   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(108.637219 247.778575)">Candidate sites</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(88.639563 275.757075)">Binary open / close</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(461.681484 248.138512)">Flow allocation</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(452.055938 274.845262)">Ship only if open</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(794.079891 248.138512)">Customer service</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(781.755516 274.845262)">Demand / lead time</text>
   </g>
   <g id="text_4">
    <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="451.95905" transform="rotate(-0 540 451.95905)">Minimize Σfj xj + Σcij qij</text>
   </g>
   <g id="text_5">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="571.356837" transform="rotate(-0 540 571.356837)">Link opening and flow:Σi qij≤Kj xj; xj∈{0,1}; qij≥0</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.154687" transform="rotate(-0 540 663.154687)">Demand balances + capacity + service restrictions define feasibility.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Network design separates facility-opening decisions from subsequent shipment allocation</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1238  •  FIG-03-72-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual capacitated facility-location formulation. qij is shipment from site j to customer i; Kj is capacity over the same period as customer demand,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">and fj is its fixed opening cost. The linking constraint prohibits shipment from a closed site. Time/service constraints need explicit modeling. No network</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">solution or capacity values are assigned.</text>
  </g>
