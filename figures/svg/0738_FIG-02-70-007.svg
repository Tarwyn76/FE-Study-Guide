   <ns0:g id="text_1">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.31725 216.643477)">CONTROLLER</ns0:text>
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(162.439828 244.945898)">P / I / D</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(483.227812 216.643477)">ACTUATOR</ns0:text>
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(474.817969 244.945898)">Valve / drive</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(830.433141 216.643477)">PROCESS</ns0:text>
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(806.786812 244.945898)">Physical plant</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(674.763937 455.505406)">SENSOR /</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(652.4155 482.460094)">TRANSMITTER</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(281.795437 455.505406)">CONDITIONING</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(335.3095 482.460094)">DAQ</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="136.12675" transform="rotate(-0 540 136.12675)">Setpoint → controller; feedback returns the measured process value.</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="540" y="369.346812" transform="rotate(-0 540 369.346812)">Actuator: saturation / rate limits</ns0:text>
   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="809.136" y="592.630875" transform="rotate(-0 809.136 592.630875)">Sensor: noise / drift / delay</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="102.559" transform="rotate(-0 59.4 102.559)">An industrial loop closes through actuator, process, sensor, and acquisition hardware</ns0:text>
  </ns0:g>
  <ns0:g id="text_10">
</ns0:g>
  <ns0:g id="text_11">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.827344 656.640625)">Hardware loop is conceptual. Controller compares the setpoint with conditioned feedback; final control element changes the process input. Include actuator limits,</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(195.398438 669.358125)">anti-windup, sample delay and measurement noise in design. An analog anti-alias filter is needed ahead of sampled DAQ where relevant.</ns0:text>
  </ns0:g>
 </ns0:g>
