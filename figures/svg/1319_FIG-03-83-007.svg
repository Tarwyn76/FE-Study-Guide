  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Refrigerators and heat pumps use the same cycle with different useful heat outputs</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1319  •  FIG-03-83-007</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned steady refrigeration cycle, positive magnitudes: QH=QL+Win. Compressor work enters, evaporator heat enters from the cold load, condenser heat</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">exits to the hot load. Expansion valve is approximately isenthalpic. COP is dimensionless and can exceed1; values are assigned, not rated performance.</text>
  </g>
 </g>
