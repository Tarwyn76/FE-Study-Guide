   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="222.410475" transform="rotate(-0 540 222.410475)">COMPRESSOR</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="549.7466" transform="rotate(-0 540 549.7466)">EXPANSION DEVICE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a23b34" x="737.389286" y="132.517213" transform="rotate(-0 737.389286 132.517213)">Win=1 kW</text>
   </g>
   <g id="text_6">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(431.818359 386.051162)">COPR=QL/Win=3</text>
