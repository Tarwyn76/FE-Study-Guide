   <g id="text_1">
    <!-- $P(x)=2x^3-x^2-7x+6$ -->
    <g style="fill: #23313d" transform="translate(315.9 110.020625)">
     <text>
      <tspan x="0" y="-0.953125" style="font-style: oblique; font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">P</tspan>
      <tspan x="19.863281" y="-0.953125" style="font-style: oblique; font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">x</tspan>
      <tspan x="76.777344" y="-0.953125" style="font-style: oblique; font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">x</tspan>
      <tspan x="123.511393" y="-0.953125" style="font-style: oblique; font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">x</tspan>
      <tspan x="182.970052" y="-0.953125" style="font-style: oblique; font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">x</tspan>
      <tspan x="12.060547" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">(</tspan>
      <tspan x="31.699219" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">)</tspan>
      <tspan x="43.398438" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="64.052734" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
      <tspan x="102.857096" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">−</tspan>
      <tspan x="149.591146" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">−</tspan>
      <tspan x="170.245443" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">7</tspan>
      <tspan x="198.702474" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">+</tspan>
      <tspan x="219.356771" y="-0.953125" style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d">6</tspan>
      <tspan x="89.50651" y="-8.609375" style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d">3</tspan>
      <tspan x="136.24056" y="-8.609375" style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
     </text>
    </g>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="186.246635" transform="rotate(-0 432 186.246635)">1  Remove any factor xᵏ: a₀ = 6 ≠ 0, so no zero root</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.804688 293.740998)">2  Descartes: P(x) signs + − − +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.579375 309.91381)">2 changes → 2 or 0 positive roots</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(566.505937 293.740998)">P(−x) signs − − + +</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(522.420937 309.91381)">1 change → exactly 1 negative root</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(272.813437 425.833305)">3  Rational-root candidates: factors of 6 / factors of 2</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(355.865625 442.006118)">±1, ±2, ±3, ±6, ±½, ±³⁄₂</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="549.500481" transform="rotate(-0 432 549.500481)">4  Test simplest first: x = 1 gives P(1) = 0</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="648.569712" transform="rotate(-0 432 648.569712)">5  Divide by (x − 1): remaining factor 2x² + x − 6</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(777.829697 476.56171)">Repeat</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(772.533759 488.691319)">if needed</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="727.825096" transform="rotate(-0 432 727.825096)">Stop at a quadratic: roots ³⁄₂ and −2; complete roots 1, ³⁄₂, −2.</text>
   </g>
  </g>
