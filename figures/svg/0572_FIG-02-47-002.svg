   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="378.1728" y="170.04165" transform="rotate(-0 378.1728 170.04165)">Examples</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="674.2224" y="170.04165" transform="rotate(-0 674.2224 170.04165)">Split into equal halves</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="135.9504" y="259.46565" transform="rotate(-0 135.9504 259.46565)">Extensive</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="378.1728" y="259.46565" transform="rotate(-0 378.1728 259.46565)">m, V, U, H, S</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="674.2224" y="259.46565" transform="rotate(-0 674.2224 259.46565)">Each half: half the amount</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="135.9504" y="348.88965" transform="rotate(-0 135.9504 348.88965)">Intensive</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="378.1728" y="348.88965" transform="rotate(-0 378.1728 348.88965)">T, P, ρ</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="674.2224" y="348.88965" transform="rotate(-0 674.2224 348.88965)">Same in each uniform half</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="135.9504" y="438.31365" transform="rotate(-0 135.9504 438.31365)">Specific (per mass)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="378.1728" y="438.31365" transform="rotate(-0 378.1728 438.31365)">v=V/m, u=U/m, h=H/m</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="674.2224" y="438.31365" transform="rotate(-0 674.2224 438.31365)">Same in each uniform half</text>
   </g>
   <g id="text_13">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="512.336288" transform="rotate(-0 432 512.336288)">Specific properties are intensive; “specific” means divided by mass here.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="47.52" y="35.64" transform="rotate(-0 47.52 35.64)">Intensive properties do not scale with system mass; extensive properties do</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="47.52" y="630.504" transform="rotate(-0 47.52 630.504)">0572  •  FIG-02-47-002</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.957812 590.616625)">The equal-half comparison assumes a uniform equilibrium state. Specific volume v has units m³/kg; total volume V has units m³.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(302.733594 603.334125)">Temperature and pressure are not divided by mass.</text>
  </g>
