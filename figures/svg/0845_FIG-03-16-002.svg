  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0845  •  FIG-03-16-002</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.220312 650.281875)">Synthetic teaching curves, not location-specific design rainfall or NOAA data. Duration is averaging duration, and return period is not a guaranteed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.721875 662.999375)">recurrence interval. For the stated annual-maximum convention T=1/AEP. Real design must use approved local precipitation-frequency data and uncertainty;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(316.190625 675.716875)">intensity at time of concentration is used for the rational-method example.</text>
  </g>
 </g>
