   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.935937 656.501562)"><tspan font-size="10.000px">Hypothetical reaction with constant ΔC</tspan><tspan font-size="6.800px" dy="2.400px">p</tspan><tspan font-size="10.000px" dy="-2.400px"> over the range and no phase transition. Reaction enthalpy uses products minus reactants at the same temperature.</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(165.271094 669.497187)">Temperature-dependent heat capacities should be integrated; latent heats must be included if reference paths cross phase transitions.</text>
