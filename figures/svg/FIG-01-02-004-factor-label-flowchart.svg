<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Factor-label conversion method</title>
<desc id="svg-desc">Three-step unit conversion flowchart with cancellation decision and correction loop</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1900" height="1050" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">FACTOR-LABEL METHOD</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Let the units determine whether each conversion factor is upright or inverted.</text>
<rect x="90" y="250" width="350" height="230" rx="18" fill="#F6F9FB" stroke="#183B5B" stroke-width="3" />
<rect x="90" y="250" width="350" height="62" rx="18" fill="#183B5B" stroke="#183B5B" stroke-width="0" />
<text x="115" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">1  WRITE UNITS</text>
<text x="115" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Start value and</text>
<text x="115" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">desired final unit</text>
<rect x="530" y="250" width="350" height="230" rx="18" fill="#F6F9FB" stroke="#2F6F9F" stroke-width="3" />
<rect x="530" y="250" width="350" height="62" rx="18" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="0" />
<text x="555" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">2  SET UP FRACTIONS</text>
<text x="555" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Multiply by unit</text>
<text x="555" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">ratios equal to 1</text>
<rect x="970" y="250" width="350" height="230" rx="18" fill="#F6F9FB" stroke="#2A7F7F" stroke-width="3" />
<rect x="970" y="250" width="350" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="995" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">3  CANCEL UNITS</text>
<text x="995" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Strike matching units</text>
<text x="995" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">above and below</text>
<line x1="440" y1="365" x2="520" y2="365" stroke="#526274" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="880" y1="365" x2="960" y2="365" stroke="#526274" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<polygon points="1540,240 1780,365 1540,490 1300,365" fill="#FFF5DB" fill-opacity="1" stroke="#D39A22" stroke-width="4" stroke-linejoin="round"/>
<text x="1540" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="middle">UNITS CANCEL</text>
<text x="1540" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033" text-anchor="middle">CORRECTLY?</text>
<line x1="1780" y1="365" x2="1850" y2="365" stroke="#2A7F7F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1815" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#2A7F7F" text-anchor="middle">YES</text>
<rect x="1430" y="600" width="300" height="70" rx="35.0" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="1580.0" y="645.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">COMPUTE</text>
<path d="M 1540 490 L 1540 590" fill="none" stroke="#2A7F7F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1580" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#2A7F7F" text-anchor="start">YES</text>
<path d="M 1300 365 C 1160 365 1170 720 970 720 L 700 720 L 700 500" fill="none" stroke="#B94747" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<text x="980" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#B94747" text-anchor="middle">NO — INVERT THE FACTOR</text>
</svg>