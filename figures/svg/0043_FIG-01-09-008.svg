   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(624.555472 173.847714)">Parallel rays enter</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(620.003441 191.368261)">from the open side.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(633.432503 282.369417)">Each reflected ray</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(612.453441 297.194495)">passes through the focus.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(683.5968 312.019573)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(614.963675 326.844652)">Run the paths backward:</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(618.251644 341.66973)">a focal source produces</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(638.917034 356.494808)">a parallel beam.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="520.640975" transform="rotate(-0 432 520.640975)">Angles of incidence and reflection are equal; shown ray paths satisfy specular reflection.</text>
