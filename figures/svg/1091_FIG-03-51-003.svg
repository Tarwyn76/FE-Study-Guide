   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">Hazen–Williams head loss responds strongly to diameter and empirical C</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1091  •  FIG-03-51-003</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Full-pipe turbulent-water comparison with hypothetical C values, not a universal roughness specification. Hazen–Williams does not explicitly include</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">viscosity. Minor losses are omitted; Darcy–Weisbach provides a broader physical basis. SI coefficient and unit conventions must be kept consistent.</text>
  </g>
 </g>
