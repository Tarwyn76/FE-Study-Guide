  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An emitter follower buffers voltage with high input resistance and lower output resistance</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0971  •  FIG-03-34-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(149.942187 649.99125)">BJT example uses I_CQ=1 mA,β=100,T=300 K, r_o neglected and ideal low-impedance base drive for output resistance. R_in=r_π+(β+1)R_E,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(97.889062 663.074375)">R_out≈[r_π/(β+1)]||R_E. Gain approaches1 but DC emitter voltage differs from base by V_BE. A complete biased implementation needs suitable supply/headroom</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(350.757812 676.07)">and input-bias path; the sketch identifies the signal topology.</text>
  </g>
