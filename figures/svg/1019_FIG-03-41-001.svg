  <g id="text_26">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">TDM, FDM, and CDM separate users in different resources</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1019  •  FIG-03-41-001</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Three users A/B/C. TDM slots repeat and FDM bands include conceptual gaps; actual guards are design dependent. The CDM example uses orthogonal length4</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Walsh sequences at perfect alignment. Multipath, timing offsets, and unequal received powers can destroy that ideal separation.</text>
  </g>
