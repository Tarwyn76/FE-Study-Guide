  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">Monod growth approaches a maximum as the limiting substrate increases</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1138  •  FIG-03-58-001</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Single limiting-substrate Monod model with assigned parameters and constant conditions. This curve is gross growth; net growth is μ−b when endogenous decay</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">is included. Ks is a half-saturation concentration, not a growth rate. Inhibition, multiple limitations, temperature effects, and organism-specific</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">calibration are omitted.</text>
  </g>
 </g>
