   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="133.620963" transform="rotate(-0 540 133.620963)">Material / product →</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #26776f" x="540" y="466.697825" transform="rotate(-0 540 466.697825)">Demand / status information ↔</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="540" y="625.177025" transform="rotate(-0 540 625.177025)">Payment / financial settlement ←</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Supply chains carry material, information, and payment in distinct directions</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1236  •  FIG-03-72-001</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual chain. Material generally moves toward customers, while returns can move upstream. Demand and shipment information can be shared both ways;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">settlement typically flows upstream but actual contracts can differ. Arrows represent flow types rather than time or volume. End-to-end service depends on</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">coordinated capacities, lead times, and inventories.</text>
  </g>
