  <g id="text_18">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Standard reaction enthalpy is products’ formation enthalpy minus reactants’</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0757  •  FIG-03-03-005</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.702344 650.281875)">Illustrative rounded standard formation enthalpies at 298.15 K, water vapor products. Negative reaction enthalpy means exothermic at that reference state.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.239844 662.999375)">Liquid-water products give a different value; phase labels and the stoichiometric reaction basis are essential. Elemental O₂ in its reference state has</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(442.982031 675.716875)">zero formation enthalpy.</text>
  </g>
