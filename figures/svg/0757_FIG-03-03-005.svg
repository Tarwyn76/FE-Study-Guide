  <ns0:g id="text_18">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="93.100" transform="rotate(-0 55.44 93.100)">Standard reaction enthalpy is products’ formation enthalpy minus reactants’</ns0:text>
  </ns0:g>
  <ns0:g id="text_19">
</ns0:g>
  <ns0:g id="text_20" transform="translate(0.000000 -69.964671)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.702344 650.281875)">Illustrative rounded standard formation enthalpies at 298.15 K, water vapor products. Negative reaction enthalpy means exothermic at that reference state.</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.239844 662.999375)">Liquid-water products give a different value; phase labels and the stoichiometric reaction basis are essential. Elemental O₂ in its reference state has</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(442.982031 675.716875)">zero formation enthalpy.</ns0:text>
  </ns0:g>
