  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1300  •  FIG-03-81-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Ideal air, γ=1.4 and R=287 J/(kg·K); reversible adiabatic stagnation. Static and total states are distinct. A real probe or shock can lose total pressure;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">the drawn local streamline is conceptual. Stagnation temperature follows the steady-flow energy balance.</text>
  </g>
