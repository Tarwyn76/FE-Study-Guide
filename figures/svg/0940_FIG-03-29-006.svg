   <g id="text_1">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(701.257988 187.588266)">Lane group example</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(731.834316 215.890687)">s=1,800 veh/h</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(726.215175 244.193109)">g=30 s; C=90 s</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(701.551659 375.619477)">c=s(g/C)=600 veh/h</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(704.109394 403.921898)">v=500 → v/c=0.833</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(727.880175 539.961406)">LOS depends on</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(680.069237 566.916094)">control delay and method</text>
   </g>
  </g>
  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Signalized capacity depends on saturation flow and effective green for each lane group</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0940  •  FIG-03-29-006</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.035156 650.281875)">Conceptual intersection, lane groups, stop lines and signal control. s is saturation flow for the specified lane group, g effective green and C cycle</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.146094 662.999375)">length. Demand v and capacity c must use a consistent period/lane basis. Capacity ratio alone does not determine level of service; delay also depends on</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(257.969531 675.716875)">arrivals, queues, phasing and analysis conditions. No signal timing or safety adequacy is certified.</text>
  </g>
 </g>
