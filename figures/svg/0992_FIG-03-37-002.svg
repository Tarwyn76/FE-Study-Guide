  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Gaussian surfaces exploit symmetry to turn a flux integral into a field magnitude</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0992  •  FIG-03-37-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.113281 716.305875)">Homogeneous linear dielectric, isolated point charge/infinite straight line/infinite uniform sheet, so symmetry fixes field direction and constant magnitude on the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(159.372656 729.023375)">relevant surface. Sphere/cylinder/pillbox are imaginary integration surfaces, not conductors. Cylinder end-cap and pillbox side flux vanish in these ideal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(270.825781 741.740875)">symmetries. For D, Gauss law uses enclosed free charge; finite distributions may lack these simplifications.</text>
  </g>
 </g>
