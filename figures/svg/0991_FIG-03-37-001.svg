  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.132031 650.399063)">E(P)=Σ[q_i/(4πε₀r_i²)]r̂_i with r̂_i from each charge to P. Negative q reverses its contribution relative to r̂. Equal magnitudes at distance√2 m give</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.882812 663.394688)">oppositely signed y components and positive x components. Arrow lengths are scaled and coordinate axes omitted; physical positions are in the labels.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(342.94375 676.112188)">Fields inside finite charged bodies need their distribution model.</text>
  </g>
