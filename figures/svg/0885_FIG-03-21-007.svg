   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="496.72725" transform="rotate(-0 487.134 496.72725)">Activated carbon / suitable oxidation</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="837.972" y="496.72725" transform="rotate(-0 837.972 496.72725)">Spent media; transformation products</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="189.162" y="562.30485" transform="rotate(-0 189.162 562.30485)">Selected dissolved salts</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="562.30485" transform="rotate(-0 487.134 562.30485)">Membrane separation</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="837.972" y="562.30485" transform="rotate(-0 837.972 562.30485)">Concentrate; fouling residuals</text>
   </g>
   <g id="text_22">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="630.08995" transform="rotate(-0 540 630.08995)">Specific contaminant chemistry, performance objectives, and residual disposal govern selection.</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Treatment process choice follows contaminant form and the resulting residual stream</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0885  •  FIG-03-21-007</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.120312 716.305875)">Conceptual examples, not universal removals or treatment recommendations for a specific water source. Process suitability depends on speciation, concentration,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.407031 729.023375)">competing constituents, hydraulic conditions and validated performance. Disinfection effectiveness and byproduct control require separate evaluation; residual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(438.396094 741.740875)">streams need appropriate management.</text>
  </g>
 </g>
