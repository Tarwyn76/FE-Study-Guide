   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="837.972" y="431.14965" transform="rotate(-0 837.972 431.14965)">Waste biomass; residual organics</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="189.162" y="496.72725" transform="rotate(-0 189.162 496.72725)">Selected dissolved organics</text>
