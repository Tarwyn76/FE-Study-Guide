   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="189.162" y="299.99445" transform="rotate(-0 189.162 299.99445)">Pathogens</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="299.99445" transform="rotate(-0 487.134 299.99445)">Filtration + suitable disinfection</text>
