   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="189.162" y="365.57205" transform="rotate(-0 189.162 365.57205)">Dissolved hardness</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="487.134" y="365.57205" transform="rotate(-0 487.134 365.57205)">Chemical precipitation / ion exchange</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="837.972" y="365.57205" transform="rotate(-0 837.972 365.57205)">Sludge or regenerant brine</text>
