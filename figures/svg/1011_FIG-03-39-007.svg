   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1011  •  FIG-03-39-007</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Zero initial conditions; unit delays. FIR impulse response is [0.5,0.5] and IIR impulse response is0.5(0.5)^n u[n], stable pole z=0.5. FIR lower path</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">branches from the input and runs left-to-right; the IIR lower path branches from the output and runs right-to-left.</text>
  </g>
