    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a23b34" x="265.385455" y="521.529777" transform="rotate(-0 265.385455 521.529777)">Heat loss</text>
   </g>
   <g id="text_11">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="582.290182" y="759.608973" transform="rotate(-0 582.290182 759.608973)">Mass balance → hydraulic head → motor input → measured control → protection → lifetime economics</text>
   </g>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="67.32" y="51.48" transform="rotate(-0 67.32 51.48)">An integrated process skid links energy, flow, measurement, protection, and lifecycle cost</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="67.32" y="910.728" transform="rotate(-0 67.32 910.728)">1403  •  FIG-03-95-007</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 849.289875)">Conceptual cross-domain capstone skid. Blue flow arrows distinguish process transport from gold shaft power, teal signal/control, and red input/loss links.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 862.007375)">Relief outlet requires a defined safe destination; it is not drawn discharging into the work area. Functional layout omits detailed piping and safety</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(67.32 874.724875)">validation. The cost block tracks electrical input and lifecycle assumptions.</text>
  </g>
 </g>
