   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.678906 650.281875)">Sinusoidal RMS complex power using passive load convention S=V I*. Real P positive for consumption; reactive sign identifies lagging or leading current.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.249219 662.999375)">Teal mirror line depicts a separate−6 kvar leading case at the same P. Distorted waveforms require distinguishing true PF from displacement PF; the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(365.650781 675.716875)">triangle alone describes fundamental sinusoidal power.</text>
  </g>
