    <g id="text_19">
     <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="547.38" y="157.748906" transform="rotate(-0 547.38 157.748906)">y=x</text>
    </g>
   </g>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Batch distillation enriches withdrawn vapor while the pot loses the volatile component</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0775  •  FIG-03-06-002</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.217969 656.640625)">Differential equilibrium vapor withdrawal, negligible vapor holdup, no reflux, constant relative volatility α=2.5. Decreasing pot x₀=0.60→x=0.30 gives</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.28125 669.358125)">W/W₀≈0.2479 from Rayleigh integration. Vapor follows the equilibrium curve and is richer in A than the pot; the integral is negative as the pot depletes.</text>
  </g>
