  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">A completely mixed flow reactor discharges at its internal concentration</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1073  •  FIG-03-48-006</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Constant-volume ideal CMFR/CSTR, equal inlet/outlet flow, first-order loss, no other source. Governing transient V dC/dt=Q(C0−C)−kVC; steady formula</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">applies only after equilibration. Perfect mixing does not mean every exiting parcel has the same residence time.</text>
  </g>
