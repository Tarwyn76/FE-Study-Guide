   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(138.598437 650.281875)">Illustrative percent-passing curve with exact percentile knots. Diameter increases to the right on a logarithmic scale; percent passing is linear. Cu</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.188281 662.999375)">measures spread, Cc curvature. Classification also requires fines percentage, sand/gravel fraction and plasticity; these coefficients alone do not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(422.826562 675.716875)">identify a complete USCS group.</text>
  </g>
 </g>
