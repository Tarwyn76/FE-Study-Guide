  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Generator G(x)=x⁴+x+1; binary polynomial division uses XOR over GF(2). This simple teaching CRC has no reflection, initial-register preset, or final XOR.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">Zero syndrome means no detected error, not proof that every possible corruption is absent.</text>
