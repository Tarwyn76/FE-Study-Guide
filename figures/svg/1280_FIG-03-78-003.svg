  <g id="text_25">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A Coulomb-Mohr brittle envelope distinguishes tensile and compressive strengths</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1280  •  FIG-03-78-003</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned brittle Coulomb-Mohr plane-stress model with third principal stress zero. In like-sign quadrants the extreme tensile/compressive principal stress</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">controls; mixed-sign quadrants use the linear interaction shown. This is not the modified-Mohr criterion or a material-specific validated failure locus.</text>
