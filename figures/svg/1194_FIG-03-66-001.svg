   <g id="text_1">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="198.293887" transform="rotate(-0 540 198.293887)">Project sponsor / owner</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="368.475425" transform="rotate(-0 540 368.475425)">Engineering lead</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="266.058" y="534.572412" transform="rotate(-0 266.058 534.572412)">Engineering / test team</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="828.36" y="534.572412" transform="rotate(-0 828.36 534.572412)">Independent review</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="668.98435" transform="rotate(-0 540 668.98435)">Work package:one accountable owner; responsible contributors; clear acceptance evidence.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="752.44675" transform="rotate(-0 540 752.44675)">Motivation supports:autonomy within scope • useful feedback • skill development</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Clear responsibility and feedback connect an organization to engineering deliverables</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1194  •  FIG-03-66-001</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Illustrative functional responsibility structure, not a universal organizational design or psychological ranking. Accountability, authority, competence,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">and review independence should match the decision. Performance measures should support quality and outcomes rather than only activity counts. The diagram</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">is separate from the self-managing Scrum example in1199.</text>
  </g>
 </g>
