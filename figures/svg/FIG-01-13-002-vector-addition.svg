<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Vector addition methods</title>
<desc id="svg-desc">Tip-to-tail and parallelogram constructions giving the same resultant</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1900" height="1050" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">VECTOR ADDITION — TWO EQUIVALENT CONSTRUCTIONS</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Both methods produce R = A + B.</text>
<line x1="950" y1="180" x2="950" y2="970" stroke="#AAB7C4" stroke-width="3" stroke-linecap="round" />
<line x1="150" y1="820" x2="540" y2="500" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="540" y1="500" x2="820" y2="250" stroke="#2A7F7F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="150" y1="820" x2="820" y2="250" stroke="#C85D32" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="420" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#2F6F9F" text-anchor="start">A</text>
<text x="680" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#2A7F7F" text-anchor="start">B</text>
<text x="430" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#C85D32" text-anchor="start">R</text>
<text x="500" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#183B5B" text-anchor="middle">TIP-TO-TAIL</text>
<line x1="1080" y1="820" x2="1450" y2="550" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="1080" y1="820" x2="1260" y2="350" stroke="#2A7F7F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1450" y1="550" x2="1630" y2="80" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/>
<line x1="1260" y1="350" x2="1630" y2="80" stroke="#AAB7C4" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/>
<line x1="1080" y1="820" x2="1630" y2="80" stroke="#C85D32" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1370" y="660" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#2F6F9F" text-anchor="start">A</text>
<text x="1140" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#2A7F7F" text-anchor="start">B</text>
<text x="1390" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#C85D32" text-anchor="start">R</text>
<text x="1450" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#183B5B" text-anchor="middle">PARALLELOGRAM</text>
</svg>