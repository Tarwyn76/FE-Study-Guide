  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1071  •  FIG-03-48-004</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">All curves start at C0=10 mg/L and share initial loss rate1 mg/(L·day), but their k values have different units. Zero-order decay is stopped at C=0; it is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">not extrapolated to negative concentration. Models assume one reacting constituent and constant temperature.</text>
  </g>
 </g>
