   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Illustrative dilute-solution acid with fixed total analytical concentration and externally controlled pH. Activities are approximated by concentrations.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">At25°C, pH+pOH≈14 for dilute water; neutrality at pH7 is temperature dependent. Species fractions do not by themselves solve charge balance or predict a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">titration curve.</text>
  </g>
 </g>
