   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0920  •  FIG-03-26-007</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.391406 650.174062)">Computed nominal section interaction: plane sections, ε_cu=0.003,β₁=0.85,Es=200,000 MPa, elastic-perfectly-plastic steel. Four bars at y=50 mm and four</text>
