   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.674219 656.640625)">Illustrative exact linear calibration at six reference values. Real calibration must evaluate reference uncertainty, repeatability, residuals, hysteresis</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.778906 669.358125)">and drift. Calibration establishes a relation and uncertainty; it does not necessarily adjust the instrument. Corrected values retain uncertainty.</ns0:text>
  </ns0:g>
 </ns0:g>
