  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0705  •  FIG-02-66-002</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.674219 656.640625)">Illustrative exact linear calibration at six reference values. Real calibration must evaluate reference uncertainty, repeatability, residuals, hysteresis</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.778906 669.358125)">and drift. Calibration establishes a relation and uncertainty; it does not necessarily adjust the instrument. Corrected values retain uncertainty.</text>
  </g>
