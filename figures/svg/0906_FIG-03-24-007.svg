  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.123437 650.281875)">Schematic laterally displaced cantilever/frame column; Δ is top lateral displacement. The added base moment is PΔ with consistent length units. Curvature</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.215625 662.999375)">and offset are exaggerated. Global P–Δ sway and local member P–δ effects are distinct; this sketch does not determine amplified displacement or stability</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(476.733594 675.716875)">on its own.</text>
  </g>
