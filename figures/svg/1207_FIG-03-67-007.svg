  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Single-period assigned planning example with no target ending stock, receipts, scrap, or backlog:130−20=110 units. Additional supply could come from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">overtime, subcontracting, or another permitted option and needs its own constraints. Forecast uncertainty and realized demand are monitored separately from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">the controllable plan.</text>
  </g>
