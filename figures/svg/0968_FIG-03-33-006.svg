  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A MOSFET small-signal gate controls incremental drain current without DC gate conduction</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0968  •  FIG-03-33-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.223437 650.00375)">Low-frequency saturated nMOS incremental model, v_gs=v_g−v_s, drain controlled current flows D→S. Gate is open for DC/low-frequency current in the ideal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.571094 662.999375)">model; parasitic capacitances and leakage are omitted. r_o is a separately assigned finite output-resistance example and corresponds to channel-length</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(286.722656 675.995)">modulation, unlike λ=0 plot967. Body effect omitted when bulk/source move together.</text>
  </g>
 </g>
