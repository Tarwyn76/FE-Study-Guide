  <ns0:g id="text_10" transform="translate(0.000000 -162.987165)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.223437 650.00375)"><ns0:tspan style="font-size: 10.000px">Low-frequency saturated nMOS incremental model, v</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">gs</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=v</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">g</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">−v</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">s</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">, drain controlled current flows D→S. Gate is open for DC/low-frequency current in the ideal</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.571094 662.999375)"><ns0:tspan style="font-size: 10.000px">model; parasitic capacitances and leakage are omitted. r</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">o</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px"> is a separately assigned finite output-resistance example and corresponds to channel-length</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(286.722656 675.995)">modulation, unlike λ=0 plot967. Body effect omitted when bulk/source move together.</ns0:text>
