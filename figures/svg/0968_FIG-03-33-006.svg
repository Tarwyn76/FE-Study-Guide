  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="173.605172" transform="rotate(-0 55.44 173.605172)">A MOSFET small-signal gate controls incremental drain current without DC gate conduction</text>
  </g>
  <g id="text_9">
   </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.223 590.137931)"><tspan font-size="10.000px">Low-frequency saturated nMOS incremental model, v</tspan><tspan font-size="6.800px" dy="2.400px">gs</tspan><tspan font-size="10.000px" dy="-2.400px">=v</tspan><tspan font-size="6.800px" dy="2.400px">g</tspan><tspan font-size="10.000px" dy="-2.400px">−v</tspan><tspan font-size="6.800px" dy="2.400px">s,</tspan><tspan font-size="10.000px" dy="-2.400px"> drain controlled current flows D→S. Gate is open for DC/low-frequency current in the ideal</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.571 603.133556)"><tspan font-size="10.000px">model; parasitic capacitances and leakage are omitted. r</tspan><tspan font-size="6.800px" dy="2.400px">o</tspan><tspan font-size="10.000px" dy="-2.400px"> is a separately assigned finite output-resistance example and corresponds to channel-length</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(286.723 616.129181)">modulation, unlike λ=0 plot967. Body effect omitted when bulk/source move together.</text>
  </g>
