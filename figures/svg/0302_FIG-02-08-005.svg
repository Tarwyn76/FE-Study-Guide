  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.380469 525.8425)">Initial investment $1,000; net inflow $300/year. Fractional interpolation assumes inflow spreads through the year.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.046094 538.56)">If receipts occur only at year ends, recovery occurs at year 4. Simple payback ignores discounting and later value.</text>
