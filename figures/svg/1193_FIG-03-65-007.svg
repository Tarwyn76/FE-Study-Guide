   <ns0:g id="text_1">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="213.937338" transform="rotate(-0 203.58 213.937338)">Verify event logic / balances</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="213.937338" transform="rotate(-0 540 213.937338)">Compare analytical / toy cases</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="213.937338" transform="rotate(-0 876.42 213.937338)">Replicate / quantify uncertainty</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="454.388537" transform="rotate(-0 203.58 454.388537)">Validate against field observations</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="454.388537" transform="rotate(-0 540 454.388537)">Check scenarios / assumptions</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="454.388537" transform="rotate(-0 876.42 454.388537)">Document limits / revise model</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="619.436287" transform="rotate(-0 540 619.436287)">Trace benchmark:waits[0,2,1] min; mean1 min. No field-validation data supplied.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_8" transform="translate(0 90.8400)">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Simulation verification checks implementation; validation checks whether the model represents reality</ns0:text>
  </ns0:g>
  <ns0:g id="text_10" transform="translate(0 -63.8979)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Verification uses code/model consistency, conservation, and known-case comparisons such as1192. Validation needs independent observations relevant to</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">intended use; agreement with an analytical model alone is not field validation. Replications, uncertainty intervals, warm-up, dependence, and seed control</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">affect simulation output. No completed real-system validation is claimed.</ns0:text>
  </ns0:g>
 </ns0:g>
