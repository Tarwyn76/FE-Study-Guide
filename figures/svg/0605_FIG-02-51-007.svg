   <ns0:g id="text_1">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(152.254163 221.731281)">BOILER / CONDENSER</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(190.5026 248.685969)"><ns0:tspan font-size="20.000px">q=h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">out</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">−h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">in</ns0:tspan></ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(611.817712 221.731281)">TWO-STREAM EXCHANGER</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(577.344275 248.685969)"><ns0:tspan font-size="20.000px">ṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">h</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">(h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">hi</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">−h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">ho</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">)=ṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">c</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">(h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">co</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">−h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">ci</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">)</ns0:tspan></ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(171.891662 456.375812)">MIXING CHAMBER</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(192.105725 483.3305)"><ns0:tspan font-size="20.000px">Σṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">in</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">=ṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">out</ns0:tspan></ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.582288 510.841437)"><ns0:tspan font-size="20.000px">Σṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">in</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px"> h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">in</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px">=ṁ</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">out</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px"> h</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">out</ns0:tspan></ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(623.306775 456.932062)">COMMON ASSUMPTIONS</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(624.2849 483.88675)">Steady; negligible KE/PE</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(677.127087 510.841437)">No shaft work</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_5">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="121.128" transform="rotate(-0 55.44 121.128)">Steady component balances simplify according to heat, work, and mixing</ns0:text>
  </ns0:g>
  <ns0:g id="text_7">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.721094 656.640625)">Boiler/condenser q uses heat-positive-in convention: condensation usually gives q&lt;0. Exchanger/mixer balance is for the whole device with negligible heat</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(280.308594 669.358125)">leakage. Streams in a heat exchanger remain separate; a mixer combines mass streams.</ns0:text>
  </ns0:g>
