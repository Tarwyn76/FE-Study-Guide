   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(152.254163 221.731281)">BOILER / CONDENSER</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(190.5026 248.685969)">q=h_out−h_in</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(611.817712 221.731281)">TWO-STREAM EXCHANGER</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(577.344275 248.685969)">ṁ_h(h_hi−h_ho)=ṁ_c(h_co−h_ci)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(171.891662 456.375812)">MIXING CHAMBER</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(192.105725 483.3305)">Σṁ_in=ṁ_out</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.582288 510.841437)">Σṁ_in h_in=ṁ_out h_out</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(623.306775 456.932062)">COMMON ASSUMPTIONS</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(624.2849 483.88675)">Steady; negligible KE/PE</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(677.127087 510.841437)">No shaft work</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Steady component balances simplify according to heat, work, and mixing</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0605  •  FIG-02-51-007</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.721094 656.640625)">Boiler/condenser q uses heat-positive-in convention: condensation usually gives q&lt;0. Exchanger/mixer balance is for the whole device with negligible heat</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(280.308594 669.358125)">leakage. Streams in a heat exchanger remain separate; a mixer combines mass streams.</text>
  </g>
