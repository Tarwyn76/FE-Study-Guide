   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0894  •  FIG-03-23-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.685156 650.281875)">Same triangle as888. Joint arrows represent initially assumed tensile forces, so negative results reverse those directions in the actual compressed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.546875 662.999375)">members. Inclined members have horizontal/vertical direction cosines4/5 and3/5. The10 kN external load acts down at B; joint equilibrium has no moment</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(426.503125 675.716875)">equation for concurrent forces.</text>
  </g>
