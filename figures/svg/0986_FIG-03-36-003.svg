  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.428125 650.112188)">Single-phase equivalent with series impedance1+j1 Ω specified for the complete circuit loop; lower return is ideal, not a second uncounted resistance.</text>
