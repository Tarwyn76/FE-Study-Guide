  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Loading changes a voltage divider; a current divider needs shared nodes</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0665  •  FIG-02-60-004</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.096875 656.501562)">Loaded divider uses the parallel combination as its lower leg; unloaded V_o would be 8 V. Current-divider branches share both nodes, so their voltages are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(335.490625 669.497187)">equal. Formulas apply to the displayed ideal DC resistive networks.</text>
  </g>
