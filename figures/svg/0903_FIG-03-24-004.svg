  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A fixed–fixed beam needs equilibrium and end-rotation compatibility</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0903  •  FIG-03-24-004</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.310937 650.281875)">Prismatic constant-EI beam, full-span uniform load, small elastic deflection, both end translations and rotations fixed. Sagging section moment is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.353125 662.999375)">positive, so end section moments are hogging negative. External support reaction couples have opposite rotational directions; equilibrium alone does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(427.491406 675.716875)">determine both end moments.</text>
  </g>
 </g>
