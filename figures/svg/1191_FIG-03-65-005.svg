  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Inverse transformation maps a uniform variate to a chosen distribution’s quantile</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1191  •  FIG-03-65-005</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Exponential inverse-CDF example with0≤U&lt;1, using log1p for numerical accuracy. Theλ here is a distribution rate, not necessarily a queue arrival rate.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Uniform generator quality and independence affect generated samples. The dashed lines show a quantile lookup; no empirical distribution was fitted.</text>
  </g>
