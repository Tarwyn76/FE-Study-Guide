     <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="544.015625" y="184.884219" transform="rotate(-0 544.015625 184.884219)">Tresca</text>
    </g>
   </g>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Tresca and von Mises give different biaxial yield envelopes for the same yield strength</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1279  •  FIG-03-78-002</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Ideal isotropic ductile yield criteria under plane stress with two nonzero principal stresses. Axes use the same scale and strength Sy. Interior points</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">remain below the displayed yield criterion; no factor of safety, fatigue, instability, or fracture criterion is included. Tresca is the inner hexagon and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">the envelopes meet at uniaxial and equal-biaxial states.</text>
  </g>
 </g>
