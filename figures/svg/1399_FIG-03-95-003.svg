   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="212.03275" transform="rotate(-0 203.58 212.03275)">Identify quantity dimensions</text>
   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="212.03275" transform="rotate(-0 540 212.03275)">Convert every input</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="212.03275" transform="rotate(-0 876.42 212.03275)">Substitute consistent units</text>
   </g>
   <g id="text_4">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="413.429512" transform="rotate(-0 540 413.429512)">Example: F=100 lbf; A=2 in² →σ=50 psi=344.738 kPa</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(313.263125 517.926237)">100 lbf×4.448221615 N/lbf=444.822 N</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(322.65 547.176488)">2 in²×(0.0254 m/in)²=0.00129032 m²</text>
   </g>
   <g id="text_6">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="658.5177" transform="rotate(-0 540 658.5177)">σ=F/A → N/m²=Pa  •  Do not mix pound-force with pound-mass.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Convert units before substitution and verify dimensions again after solving</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1399  •  FIG-03-95-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Exact inch and standard pound-force conversions, with rounded displayed results. Area conversion squares the length factor; failing to square it is a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">common error. US customary dynamic equations using lbm and lbf require their consistent force/mass conversion convention; no such mixed-unit equation is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">used here.</text>
  </g>
