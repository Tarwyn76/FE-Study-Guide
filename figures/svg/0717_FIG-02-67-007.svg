  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Low-level sensor signals require a compatible excitation and conditioning chain</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0717  •  FIG-02-67-007</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.442187 650.281875)">Excitation is needed for resistive sensors and bridges; thermocouples and piezoelectric sensors use different front ends. Filter before conversion to suppress</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.428125 662.999375)">unwanted frequencies. Isolation is application dependent and may be placed elsewhere in the chain. Blocks represent functions rather than a mandatory physical module</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(525.533594 675.716875)">order.</text>
  </g>
