  <ns0:g id="text_12">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="97.058" transform="rotate(-0 59.4 97.058)">Low-level sensor signals require a compatible excitation and conditioning chain</ns0:text>
  </ns0:g>
  <ns0:g id="text_14" transform="translate(0.000000 -169.142750)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.442187 650.281875)">Excitation is needed for resistive sensors and bridges; thermocouples and piezoelectric sensors use different front ends. Filter before conversion to suppress</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.428125 662.999375)">unwanted frequencies. Isolation is application dependent and may be placed elsewhere in the chain. Blocks represent functions rather than a mandatory physical module</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(525.533594 675.716875)">order.</ns0:text>
  </ns0:g>
