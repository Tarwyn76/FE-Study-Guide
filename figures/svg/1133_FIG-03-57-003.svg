   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="230.607675" transform="rotate(-0 413.8425 230.607675)">Flocculation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="230.607675" transform="rotate(-0 666.1575 230.607675)">Clarification</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="230.607675" transform="rotate(-0 918.4725 230.607675)">Recarbonation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="328.536" y="121.86355" transform="rotate(-0 328.536 121.86355)">Lime / soda feed</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="770.688" y="121.86355" transform="rotate(-0 770.688 121.86355)">CO2 feed</text>
   </g>
   <g id="text_7">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(383.764375 434.874425)">Ca²⁺+CO3²⁻ →CaCO3(s)</text>
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(372.584375 467.939925)">Mg²⁺+2OH⁻ →Mg(OH)2(s)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="857.196" y="613.971487" transform="rotate(-0 857.196 613.971487)">Softening sludge</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Lime–soda softening couples hardness precipitation to clarification and pH adjustment</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1133  •  FIG-03-57-003</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual lime–soda treatment; carbonate hardness, noncarbonate hardness, alkalinity, magnesium, and CO2 govern chemical demand. Clarification removes</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">precipitated solids; recarbonation adjusts pH/stability rather than reversing every reaction. Final filtration may be required and is omitted. Equations</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">show representative precipitation, not a complete dose calculation.</text>
  </g>
 </g>
