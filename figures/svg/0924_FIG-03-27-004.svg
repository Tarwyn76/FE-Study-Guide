   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(132.894531 650.281875)">Simplified Casagrande chart. CL/CH clay-like and ML/MH silt-like fields shown for inorganic fine-grained soils; organic classification and low-PI CL–ML</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.689062 662.999375)">boundary zone need additional rules. LL/PL/PI are reported as percentage numbers. Example class requires50% or more passing No.200 and no organic</text>
