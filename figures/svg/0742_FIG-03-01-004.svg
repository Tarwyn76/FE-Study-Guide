   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(470.65525 475.377406)">Both outlets have</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(450.344313 502.332094)">the inlet composition.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(785.696063 475.377406)">Outlet compositions</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(836.192938 502.332094)">can differ.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">A mixer, ideal splitter, and separator impose different composition constraints</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0742  •  FIG-03-01-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.354687 656.640625)">Nonreactive steady units. A mixer combines component flows. An ideal splitter only divides a homogeneous stream, so outlet compositions and thermodynamic state are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.449219 669.358125)">equal before any downstream change. A separator changes composition through a specified separation mechanism; conservation alone may not determine the split.</text>
  </g>
 </g>
