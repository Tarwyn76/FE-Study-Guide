   <ns0:g id="text_5">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(470.65525 475.377406)">Both outlets have</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(450.344313 502.332094)">the inlet composition.</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(785.696063 475.377406)">Outlet compositions</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(836.192938 502.332094)">can differ.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_7">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="118.786" transform="rotate(-0 59.4 118.786)">A mixer, ideal splitter, and separator impose different composition constraints</ns0:text>
  </ns0:g>
  <ns0:g id="text_8">
</ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.354687 656.640625)">Nonreactive steady units. A mixer combines component flows. An ideal splitter only divides a homogeneous stream, so outlet compositions and thermodynamic state are</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.449219 669.358125)">equal before any downstream change. A separator changes composition through a specified separation mechanism; conservation alone may not determine the split.</ns0:text>
  </ns0:g>
 </ns0:g>
