  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">Timeline follows completion of the last bit at the receiver: propagation begins for the first bit during serialization, but last-bit delivery adds the full</text>
