  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic additive example, Tt=80+2t and St=8sin[2π(t−1)/4]. All three components are assigned, not estimated from actual data. Future mean excludes the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">irregular component. Horizon is measured from the last historical period; the dashed curve is a scenario mean, not an observed continuation or prediction</text>
