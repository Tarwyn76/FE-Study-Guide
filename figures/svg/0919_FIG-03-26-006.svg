    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="441.2016" y="125.638875" transform="rotate(-0 441.2016 125.638875)">P (normal to section)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(625.385575 515.121406)">Closed tie (schematic)</text>
