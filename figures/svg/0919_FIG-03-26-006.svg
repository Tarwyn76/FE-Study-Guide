   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Column ties confine the core and restrain longitudinal reinforcement</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0919  •  FIG-03-26-006</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.563281 650.142812)">Schematic tied-column cross-section. Gross area includes the steel footprint; A_st is total longitudinal steel area, often denoted A_s when context is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.344531 663.138438)">clear. In-plane arrow marks the axial load symbol only: P acts along the column, perpendicular to the cross-section. The tie detail is conceptual and does</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(326.796094 675.855937)">not establish compliant lateral support, hooks or confinement spacing.</text>
  </g>
