  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned feature limits; drawn size differences are exaggerated. MMC is smallest hole/largest shaft, LMC the reverse. Internal virtual condition is MMC</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">minus geometric tolerance; external is MMC plus it. Bonus requires the specified MMC modifier. Form and datum mobility are not detailed; the unrelated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">example features are not claimed to assemble.</text>
  </g>
