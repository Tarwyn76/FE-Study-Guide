   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="625.177025" transform="rotate(-0 540 625.177025)">Time step=1 day; current state determines the transition distribution.</text>
