  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.510156 650.281875)">Ideal homogeneous confined aquifer, fully penetrating well, fixed-head boundary at R and steady radial flow. Circular plan contours indicate equal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.182812 662.999375)">drawdown; section uses the exact stated logarithmic equation. R is an imposed model boundary here, not a universally sharp physical radius of influence.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(398.282812 675.716875)">Well losses and transient storage omitted.</text>
  </g>
