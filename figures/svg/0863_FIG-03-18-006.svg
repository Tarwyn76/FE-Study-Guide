  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.014844 650.281875)">Illustrative flowing-main head losses4 m per250 m reach; elevations and HGL are not a solved distribution model. Node pressure head excludes velocity</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(91.691406 662.999375)">head; pressure p=ρg(HGL−z). Under no-flow conditions the connected HGL approaches tank surface head if no other imposed heads intervene. Minimum/maximum</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(416.605469 675.716875)">design pressures are not specified.</text>
  </g>
