  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Piezometer levels reveal hydraulic gradients rather than ground-surface slopes</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1112  •  FIG-03-54-003</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Illustrative water-level measurements in a uniform isotropic aquifer; the plan contours are vertical and flow arrows point perpendicular to them toward</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">lower head. Anisotropy can change that angle. Tube water elevations represent head, not the elevation of the screened interval; surface relief is not a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">substitute for head measurements.</text>
  </g>
