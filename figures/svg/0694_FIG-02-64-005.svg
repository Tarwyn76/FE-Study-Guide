   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Ideal transformer dots set voltage polarity and current reference</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0694  •  FIG-02-64-005</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.754687 656.640625)">Voltages are top dotted terminal minus bottom terminal on both windings. Primary current enters its dot; secondary load current leaves its dot. Ideal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(192.705469 669.358125)">sinusoidal transformer has no loss, leakage or magnetizing current: VₚIₚ*=VₛIₛ*. Numerical example uses unity power factor.</text>
  </g>
