   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="151.594713" transform="rotate(-0 161.3664 151.594713)">Current (mA)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="151.594713" transform="rotate(-0 587.2464 151.594713)">Possible effects (teaching summary)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="233.447913" transform="rotate(-0 161.3664 233.447913)">1</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="233.447913" transform="rotate(-0 587.2464 233.447913)">Perception / tingling; danger remains possible</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="315.301112" transform="rotate(-0 161.3664 315.301112)">5</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="315.301112" transform="rotate(-0 587.2464 315.301112)">Shock and involuntary reaction may cause injury</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="397.154313" transform="rotate(-0 161.3664 397.154313)">6–16</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="397.154313" transform="rotate(-0 587.2464 397.154313)">Pain; loss of muscular control / let-go range</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="479.007513" transform="rotate(-0 161.3664 479.007513)">17–99</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="479.007513" transform="rotate(-0 587.2464 479.007513)">Severe contraction and respiratory arrest; death possible</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="560.860713" transform="rotate(-0 161.3664 560.860713)">100–2,000</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="560.860713" transform="rotate(-0 587.2464 560.860713)">Ventricular fibrillation / nerve injury; death likely</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.3664" y="642.713913" transform="rotate(-0 161.3664 642.713913)">&gt; 2,000</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="587.2464" y="642.713913" transform="rotate(-0 587.2464 642.713913)">Cardiac arrest; organ injury / severe burns; death probable</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="42.12" y="39.6" transform="rotate(-0 42.12 39.6)">Current-through-body effects — FE Handbook 10.6</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="42.12" y="770.616" transform="rotate(-0 42.12 770.616)">0387  •  FIG-02-20-006</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(93.7 727.8025)">FE Reference Handbook 10.6, printed p. 23. Effects are probable, not guaranteed: path, duration, frequency, contact, and individual variation matter.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(375.039062 740.52)">No current range is a safe-work limit.</text>
  </g>
