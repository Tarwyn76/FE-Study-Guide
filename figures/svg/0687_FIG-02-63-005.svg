  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.428125 656.501562)">Balanced abc sequence; V_ab=V_an−V_bn. Current arrows reference line current entering each phase load. A source has the same wye topology with source</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(216.284375 669.497187)">windings replacing impedances. A balanced neutral carries zero current; neutral is not automatically earth ground.</text>
