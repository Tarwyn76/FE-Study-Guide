  <ns0:g id="text_25">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.39375 656.3625)"><ns0:tspan font-size="10.000px">Hypothetical first-order rate constant with k</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ref</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=1 min⁻¹ for dimensionless logarithms. Temperature must be Kelvin; E</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">a</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=50000 J/mol matches R=8.314</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(160.805469 669.358125)"><ns0:tspan font-size="10.000px">J/(mol·K). Straight-line model assumes constant A and E</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">a</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> over the range; transport effects or mechanism changes can cause curvature.</ns0:tspan></ns0:text>
  </ns0:g>
