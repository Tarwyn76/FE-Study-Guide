   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="109.762" transform="rotate(-0 55.44 109.762)">An Arrhenius plot is linear in inverse absolute temperature for constant activation energy</ns0:text>
