   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned risk-neutral monetary decision with probabilities summing to1 within each alternative. Chance nodes are circles; the initial choice is a decision.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Safety or legal constraints exclude infeasible options before ranking; expected monetary value does not compensate for a violated mandatory constraint.</text>
