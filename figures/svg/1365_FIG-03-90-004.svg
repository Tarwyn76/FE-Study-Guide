  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual drawing example with a position feature-control frame. Datum A is the plate broad face, B the bottom long edge, C the left short edge. Position</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">tolerance is a cylindrical zone at MMC; drawn circled M is the material-condition modifier. This sketch does not replace a complete production drawing.</text>
