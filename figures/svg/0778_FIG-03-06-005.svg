  <ns0:g id="text_23">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="106.569" transform="rotate(-0 55.44 106.569)">Feed thermal condition sets the q-line slope through the feed composition</ns0:text>
  </ns0:g>
  <ns0:g id="text_24">
</ns0:g>
  <ns0:g id="text_25">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.573437 656.501562)"><ns0:tspan font-size="10.000px">For constant molar overflow, q=(h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">V,sat</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">F</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">)/(h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">V,sat</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−h</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">L,sat</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">) at the column pressure. In a saturated two-phase feed it equals the liquid mole fraction</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(162.653906 669.497187)">under the model; subcooled and superheated feeds have q&gt;1 and q&lt;0. q=1 uses the vertical limiting form rather than division by zero.</ns0:text>
  </ns0:g>
 </ns0:g>
