  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0778  •  FIG-03-06-005</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.573437 656.501562)">For constant molar overflow, q=(h_V,sat−h_F)/(h_V,sat−h_L,sat) at the column pressure. In a saturated two-phase feed it equals the liquid mole fraction</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(162.653906 669.497187)">under the model; subcooled and superheated feeds have q&gt;1 and q&lt;0. q=1 uses the vertical limiting form rather than division by zero.</text>
  </g>
