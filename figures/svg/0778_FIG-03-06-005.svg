    <ns0:g id="line2d_34">
     <ns0:path d="M 88.74 181.019531  L 97.74 181.019531  L 106.74 181.019531  " style="fill: none; stroke: #b47722; stroke-width: 1.5; stroke-linecap: square" />
    </ns0:g>
