     <ns0:text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="113.94" y="184.169531" transform="rotate(-0 113.94 184.169531)">Superheated q=−0.5</ns0:text>
    </ns0:g>
