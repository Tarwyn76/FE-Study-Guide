   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="568.066812" transform="rotate(-0 174.744 568.066812)">One force reaction</text>
   </g>
   <g id="text_4">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="530.388" y="152.410437" transform="rotate(-0 530.388 152.410437)">PIN</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(455.686516 429.471617)">Restrains u,v</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(483.008 460.469508)">Allows θ</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="530.388" y="568.066812" transform="rotate(-0 530.388 568.066812)">Two force reactions</text>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="151.306687" transform="rotate(-0 886.032 151.306687)">FIXED</text>
