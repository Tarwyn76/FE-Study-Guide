   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="886.032" y="568.066812" transform="rotate(-0 886.032 568.066812)">Two forces + one moment</text>
