  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Planar support symbols identify restrained translations and rotations</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0886  •  FIG-03-22-001</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(161.132031 650.320938)">Ideal 2D supports with horizontal roller surface: u horizontal translation,v vertical translation,θ in-plane rotation. Roller reaction is normal to its support</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(149.732031 663.038437)">surface. Pins transmit forces, not an ideal couple; fixed supports transmit both forces and moment. Real connections/support stiffness can differ from these</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(507.058594 675.755937)">idealizations.</text>
  </g>
