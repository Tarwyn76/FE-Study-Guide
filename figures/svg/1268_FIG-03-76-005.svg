  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">External spur gears rotate in opposite directions while pitch-line speeds match</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1268  •  FIG-03-76-005</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Ideal external spur-gear pair with common module, no slip at the pitch point, and parallel shafts. Dashed circles are pitch circles; actual tooth profiles</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">are intentionally omitted. Angular velocities are signed about a common out-of-page axis. Tooth count, radius ratio, and speed ratio agree; torque requires</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">efficiency and load assumptions not supplied here.</text>
  </g>
 </g>
