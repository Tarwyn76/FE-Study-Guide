   <g id="text_9">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="652.501025" transform="rotate(-0 540 652.501025)">e=r−H(s)y; for the stated linear loop: y/r=G(s)C(s)/[1+G(s)C(s)H(s)]</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Negative feedback compares measured output with the setpoint and responds to error</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1388  •  FIG-03-93-006</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual negative-feedback block diagram, where G includes actuator and plant. Disturbance is shown as a separate plant input. Closed-loop formula is for</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">zero other inputs and initial conditions in a linear time-invariant model; stability and actuator limits are not guaranteed by drawing a feedback path.</text>
  </g>
