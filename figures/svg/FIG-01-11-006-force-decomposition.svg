<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Force vector decomposition</title>
<desc id="svg-desc">Force vector resolved into horizontal cosine and vertical sine components</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1700" height="1050" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">FORCE DECOMPOSITION</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Resolve a force into perpendicular x- and y-components.</text>
<line x1="220" y1="820" x2="1250" y2="820" stroke="#2F6F9F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="1250" y1="820" x2="1050" y2="300" stroke="#2A7F7F" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="220" y1="820" x2="1050" y2="300" stroke="#C85D32" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1050" y1="300" x2="1050" y2="820" stroke="#AAB7C4" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
<path d="M 360 820 A 140 140 0 0 1 340 745" fill="none" stroke="#D39A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="400" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#D39A22" text-anchor="start">θ</text>
<text x="700" y="875" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#2F6F9F" text-anchor="middle">Fₓ = F cos θ</text>
<text x="1280" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#2A7F7F" text-anchor="start">Fᵧ = F sin θ</text>
<text x="650" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="800" fill="#C85D32" text-anchor="middle">F</text>
<rect x="1100" y="170" width="500" height="180" rx="18" fill="#F6F9FB" stroke="#183B5B" stroke-width="3" />
<rect x="1100" y="170" width="500" height="62" rx="18" fill="#183B5B" stroke="#183B5B" stroke-width="0" />
<text x="1125" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">VECTOR CHECK</text>
<text x="1125" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">F² = Fₓ² + Fᵧ²</text>
</svg>