   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="287.901" transform="rotate(-0 438.8436 287.901)">∫₀⁴ (2+x) dx = 16 kN</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="287.92725" transform="rotate(-0 742.9032 287.92725)">W = 16 kN</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.9404" y="387.28725" transform="rotate(-0 163.9404 387.28725)">Moment magnitude about x=0</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="387.261" transform="rotate(-0 438.8436 387.261)">∫₀⁴ x(2+x) dx = 112/3 kN·m</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="387.28725" transform="rotate(-0 742.9032 387.28725)">W x̄ = 16(7/3) = 112/3</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.9404" y="486.64725" transform="rotate(-0 163.9404 486.64725)">Resultant location</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="486.64725" transform="rotate(-0 438.8436 486.64725)">x̄ = (first moment)/(total load)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="486.64725" transform="rotate(-0 742.9032 486.64725)">x̄ = 7/3 m</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="587.936625" transform="rotate(-0 468 587.936625)">Signed rigid-body moment for the downward load: M_O,z = −112/3 kN·m</text>
   </g>
