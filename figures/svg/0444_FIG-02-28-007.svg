   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="188.56725" transform="rotate(-0 438.8436 188.56725)">Distributed model</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="188.56725" transform="rotate(-0 742.9032 188.56725)">Resultant model</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.9404" y="287.92725" transform="rotate(-0 163.9404 287.92725)">Total downward force</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="287.901" transform="rotate(-0 438.8436 287.901)">∫₀⁴ (2+x) dx = 16 kN</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="287.92725" transform="rotate(-0 742.9032 287.92725)">W = 16 kN</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.9404" y="387.28725" transform="rotate(-0 163.9404 387.28725)">Moment magnitude about x=0</ns0:text>
   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="387.261" transform="rotate(-0 438.8436 387.261)">∫₀⁴ x(2+x) dx = 112/3 kN·m</ns0:text>
   </ns0:g>
   <ns0:g id="text_9">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="387.28725" transform="rotate(-0 742.9032 387.28725)">W x̄ = 16(7/3) = 112/3</ns0:text>
   </ns0:g>
   <ns0:g id="text_10">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="163.9404" y="486.64725" transform="rotate(-0 163.9404 486.64725)">Resultant location</ns0:text>
   </ns0:g>
   <ns0:g id="text_11">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="438.8436" y="486.64725" transform="rotate(-0 438.8436 486.64725)">x̄ = (first moment)/(total load)</ns0:text>
   </ns0:g>
   <ns0:g id="text_12">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="742.9032" y="486.64725" transform="rotate(-0 742.9032 486.64725)">x̄ = 7/3 m</ns0:text>
   </ns0:g>
   <ns0:g id="text_13">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="587.936625" transform="rotate(-0 468 587.936625)"><ns0:tspan font-size="20.000px">Signed rigid-body moment for the downward load: M</ns0:tspan><ns0:tspan font-size="13.600px" dy="4.800px">O,z</ns0:tspan><ns0:tspan font-size="20.000px" dy="-4.800px"> = −112/3 kN·m</ns0:tspan></ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_14">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="51.48" y="117.099" transform="rotate(-0 51.48 117.099)">Check both total load and first moment after replacement</ns0:text>
  </ns0:g>
  <ns0:g id="text_16" transform="translate(0.000000 -12.396015)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="621.082" transform="rotate(-0 468 621.082)">Equivalence requires both resultant force and moment. For signed loads with zero net force, a single finite-location force may not exist; a couple can remain.</ns0:text>
  </ns0:g>
