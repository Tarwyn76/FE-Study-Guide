  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="660.24" transform="rotate(-0 468 660.24)">Equivalence requires both resultant force and moment. For signed loads with zero net force, a single finite-location force may not exist; a couple can remain.</text>
