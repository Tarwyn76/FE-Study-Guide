  <ns0:g id="text_23">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.428125 656.3625)"><ns0:tspan font-size="10.000px">Constant-volume ideal first-order reversible reaction, initially pure A. C</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">A</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=1−X,C</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">B</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=X mol/L. Rate intersection has nonzero microscopic forward/reverse</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(163.208594 669.358125)"><ns0:tspan font-size="10.000px">rates; net rate vanishes. The relationship K</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">c</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=k</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">f</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">/k</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">r</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> follows this compatible elementary rate model, not every empirical kinetic model.</ns0:tspan></ns0:text>
  </ns0:g>
 </ns0:g>
