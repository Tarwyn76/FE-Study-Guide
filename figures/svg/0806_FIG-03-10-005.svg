  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.428125 656.3625)">Constant-volume ideal first-order reversible reaction, initially pure A. C_A=1−X,C_B=X mol/L. Rate intersection has nonzero microscopic forward/reverse</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(163.208594 669.358125)">rates; net rate vanishes. The relationship K_c=k_f/k_r follows this compatible elementary rate model, not every empirical kinetic model.</text>
  </g>
