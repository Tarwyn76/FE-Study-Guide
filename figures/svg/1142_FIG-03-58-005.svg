  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Fixed-film organisms consume substrate across gradients while biomass can slough away</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1142  •  FIG-03-58-005</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Conceptual biofilm and synthetic concentration profiles, not a calibrated diffusion–reaction solution. Plot distance starts at the liquid/film interface</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">and increases toward the media, opposite the left-to-right section direction. Attachment retains organisms; transport limitations and sloughing affect</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">active thickness. Sloughed biomass requires downstream solids separation.</text>
  </g>
 </g>
