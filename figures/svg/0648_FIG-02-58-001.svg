   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(100.800781 590.3385)"><ns0:tspan style="font-size: 10.000px">Counterflow example, no heat leak or shaft work, negligible KE/PE changes and constant heat capacities. C</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">h</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=C</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">c</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">=100 W/K, where</ns0:tspan></ns0:text>
