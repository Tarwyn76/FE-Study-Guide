  <ns0:g id="text_21">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.270312 656.640625)">Plan-view local Cartesian grid, coordinates in metres. Coordinate pairs explicitly ordered E,N. Azimuth uses east difference as first atan2 argument and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(183.884375 669.358125)">north difference as second, then normalized to0–360°. Large-area geodetic, projection and ground/grid corrections are omitted.</ns0:text>
  </ns0:g>
