   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.270312 656.640625)">Plan-view local Cartesian grid, coordinates in metres. Coordinate pairs explicitly ordered E,N. Azimuth uses east difference as first atan2 argument and</text>
