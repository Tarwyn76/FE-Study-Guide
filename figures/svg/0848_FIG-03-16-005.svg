   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">The curve-number model predicts runoff depth only after initial abstraction is exceeded</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0848  •  FIG-03-16-005</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(151.836719 650.142812)">Traditional NRCS/SCS event-depth model with explicitly chosen λ=I_a/S=0.20 and S=25400/CN−254 in millimetres. CN reflects the specified</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.010156 663.138438)">watershed/antecedent condition; it is not a universal material constant. Other initial-abstraction conventions require compatible calibration. Runoff</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(306.374219 675.855937)">depth does not give peak flow or timing without an additional response model.</text>
  </g>
 </g>
