  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Methods analysis separates useful handling from repeated searching and travel</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1247  •  FIG-03-73-005</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual method redesign with a defined tool location and reduced retrieval. No measured time saving is assigned. A method study documents the operation,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">analyzes motions, develops a feasible method, then evaluates quality, reach, force, repetition, and worker feedback. Fewer steps can shift effort or strain</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">and must be verified rather than assumed beneficial.</text>
  </g>
