  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1085  •  FIG-03-50-004</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Uses the ingestion example in1083 and an assigned hypothetical CSF, not an actual chemical toxicity value. The plotted quantity is modeled excess lifetime</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">risk, not a certainty or total background risk. Linear extrapolation assumptions and uncertainties must be assessed for any real chemical/application.</text>
  </g>
