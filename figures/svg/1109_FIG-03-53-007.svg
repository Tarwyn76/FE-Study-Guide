   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="192.354075" transform="rotate(-0 203.58 192.354075)">External nutrient load</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="192.354075" transform="rotate(-0 540 192.354075)">Algal growth</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="192.354075" transform="rotate(-0 876.42 192.354075)">Settling organic matter</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="465.318137" transform="rotate(-0 203.58 465.318137)">Internal nutrient release</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="465.318137" transform="rotate(-0 540 465.318137)">Low-oxygen sediment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="465.318137" transform="rotate(-0 876.42 465.318137)">Decomposition / O2 use</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="630.641825" transform="rotate(-0 540 630.641825)">Internal recycling can sustain loading after external inputs decline.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Nutrient enrichment can couple surface growth to deeper oxygen consumption</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1109  •  FIG-03-53-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual eutrophication feedback, not a quantitative lake model. External input drives growth; sinking organic matter can consume oxygen during</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">decomposition. Some sediment nutrients may be released under low-oxygen conditions and re-enter growth. Light, mixing, nutrient limitation, and sediment</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">chemistry determine whether these mechanisms dominate.</text>
  </g>
 </g>
