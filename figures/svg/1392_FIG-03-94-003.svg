  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual protection-layer map, not an instrumented-safety or relief-system design. Multiple labels do not prove independence or adequate capacity.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Relief, shutdown, detection, ignition control, and fire protection have distinct functions and must fit the actual hazard and required performance.</text>
  </g>
