  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="468" y="660.24" transform="rotate(-0 468 660.24)">Audit uses the 6 m beam and 12 kN load at x = 2 m. A negative unilateral-contact reaction signals loss of contact or an inconsistent assumed model.</text>
