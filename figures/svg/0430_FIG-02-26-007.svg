   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="584.6256" y="307.79925" transform="rotate(-0 584.6256 307.79925)">6Bᵧ − 2(12) = 6(4) − 24 = 0</text>
