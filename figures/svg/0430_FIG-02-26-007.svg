   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="584.6256" y="446.90325" transform="rotate(-0 584.6256 446.90325)">Positive upward roller force maintains contact</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="168.1056" y="516.45525" transform="rotate(-0 168.1056 516.45525)">Symmetry and geometry</text>
