   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="168.1056" y="377.35125" transform="rotate(-0 168.1056 377.35125)">Independent origin</text>
