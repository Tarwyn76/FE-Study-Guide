   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="168.1056" y="446.90325" transform="rotate(-0 168.1056 446.90325)">Contact feasibility</text>
