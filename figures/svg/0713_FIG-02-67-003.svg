   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="132.445" transform="rotate(-0 55.44 132.445)">A thermocouple measures a temperature difference between junctions</ns0:text>
  </ns0:g>
  <ns0:g id="text_11" transform="translate(0.000000 -75.974314)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.471875 650.00375)"><ns0:tspan font-size="10.000px">Conceptual pair with positive S</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">AB</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> and positive upper-terminal voltage for T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">m</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">&gt;T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ref</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">. Dissimilar sensing metals join at T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">m</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">; both instrument connections</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(105.882812 662.999375)"><ns0:tspan font-size="10.000px">are isothermal at T</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">ref</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> and use a common third metal. Cold-junction compensation is needed unless the reference temperature is known. Seebeck response is</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(454.385156 675.995)">generally nonlinear.</ns0:text>
  </ns0:g>
