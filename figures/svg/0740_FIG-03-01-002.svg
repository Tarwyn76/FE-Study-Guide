  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A steady mixer–separator balances total flow and each conserved component</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0740  •  FIG-03-01-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.635156 656.640625)">Steady nonreactive two-component control volume; all flows mol/s and compositions mole fractions. Accumulation is zero. Total balance is the sum of the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(210.178906 669.358125)">two component balances, so those three equations are not all independent. No separation energy model is specified.</text>
  </g>
