   <g id="text_9">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="663.706563" transform="rotate(-0 540 663.706563)">σx=80, σy=0, τxy=30 MPa → σ1=90, σ2=−10 MPa; σvM=95.39 MPa</text>
