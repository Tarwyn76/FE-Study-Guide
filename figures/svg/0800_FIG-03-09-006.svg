  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Angle of repose describes a free pile; hopper flow also depends on wall and powder properties</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0800  •  FIG-03-09-006</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(155.871875 656.640625)">Pile is an ideal right circular cone. Hopper is conceptual: angle of repose alone does not determine reliable discharge or mass flow. Wall friction, cohesive</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(227.275 669.358125)">strength, moisture, outlet geometry and consolidation require appropriate flow testing; the arch sketch is not a sized design.</text>
