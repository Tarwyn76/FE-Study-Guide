   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="820.8" y="422.735" transform="rotate(-0 820.8 422.735)">Cohesive arch may stop flow</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_7">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="121.865" transform="rotate(-0 59.4 121.865)">Angle of repose describes a free pile; hopper flow also depends on wall and powder properties</ns0:text>
  </ns0:g>
  <ns0:g id="text_8">
</ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(155.871875 656.640625)">Pile is an ideal right circular cone. Hopper is conceptual: angle of repose alone does not determine reliable discharge or mass flow. Wall friction, cohesive</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(227.275 669.358125)">strength, moisture, outlet geometry and consolidation require appropriate flow testing; the arch sketch is not a sized design.</ns0:text>
  </ns0:g>
