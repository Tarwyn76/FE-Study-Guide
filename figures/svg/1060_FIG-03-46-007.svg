   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="454.940412" transform="rotate(-0 540 454.940412)">Remediation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(835.178125 442.858787)">Retest +</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(842.237813 467.022037)">closure</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="619.16035" transform="rotate(-0 540 619.16035)">Rules of engagement specify targets, methods, limits, contacts, and stop conditions.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">An authorized penetration test closes with remediation and retesting</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1060  •  FIG-03-46-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">High-level authorized-assessment lifecycle. Evidence should be reproducible and protect sensitive data; findings describe impact and remediation. Retesting</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">checks whether the agreed fix works. Scope and consent precede probing, and testing pauses if agreed limits or stop conditions are reached.</text>
  </g>
