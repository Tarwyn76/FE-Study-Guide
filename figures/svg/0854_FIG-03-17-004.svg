  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.192969 656.640625)">Rectangular channel, fixed unit discharge q and kinetic correction α=1. Lower alternate depth is supercritical; upper alternate depth subcritical.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(101.591406 669.358125)">Alternate depths have equal specific energy, whereas hydraulic-jump sequent depths have equal momentum and lose energy. Bed elevation is excluded from E.</text>
