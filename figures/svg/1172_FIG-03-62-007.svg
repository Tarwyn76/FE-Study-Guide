   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="468.326475" transform="rotate(-0 876.42 468.326475)">Reproduce reported metric</text>
   </g>
   <g id="text_7">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="626.042337" transform="rotate(-0 540 626.042337)">Example holdout errors:[1,−1,2,−2] min →RMSE=√2.5=1.581 min</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Analytics validation preserves a holdout set and an executable record of the workflow</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1172  •  FIG-03-62-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative split and independent metric calculation, not an evaluated production model. Preprocessing and parameter choice must not learn from the held-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">out test. Chronological ordering matters for time-dependent prediction; other tasks need appropriate grouping/splitting. Reproducibility also needs</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">software versions, data provenance, and documented metric definitions.</text>
  </g>
