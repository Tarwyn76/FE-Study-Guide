   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="203.58" y="612.867737" transform="rotate(-0 203.58 612.867737)">Illustrative capture envelope</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="544.806" y="185.260625" transform="rotate(-0 544.806 185.260625)">Treatment system</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="919.674" y="183.329062" transform="rotate(-0 919.674 183.329062)">Verified discharge</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="607.284" y="542.65315" transform="rotate(-0 607.284 542.65315)">Extraction wells</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Pump-and-treat combines hydraulic capture with treatment of extracted groundwater</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1121  •  FIG-03-55-005</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual plan view plus surface treatment connections. Dashed capture envelope is illustrative, not calculated from a head field. Confirm capture with</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">hydraulic and chemical monitoring; a drawdown contour alone is insufficient. Treatment residuals and discharge requirements depend on contaminants. Slow</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">release from low-permeability zones can prolong cleanup.</text>
  </g>
 </g>
