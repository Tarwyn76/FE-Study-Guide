  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Synthetic IDF curves with assigned labels for teaching, not local meteorological estimates. For a rational-method comparison, duration is commonly matched</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">to time of concentration. Return period is an annual-exceedance convention, not a promise of one event per interval; nonstationarity and design criteria</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">matter.</text>
  </g>
 </g>
