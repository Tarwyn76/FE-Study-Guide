  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A fault tree distinguishes either-cause failure from simultaneous redundant-path failure</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1261  •  FIG-03-75-005</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Logical OR and AND junctions are explicitly labeled. Mission failure probabilities are assigned and all three basic events are independent. OR requires</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">subtracting the overlap; AND of pump failures gives.002. Shared causes, repair dynamics, or dependent events need a different calculation. The tree is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">simplified and does not demonstrate real-system reliability or protective performance.</text>
  </g>
