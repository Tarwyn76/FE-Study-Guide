  <g id="text_24">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Finite output range and bandwidth constrain an op-amp’s closed-loop response</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0975  •  FIG-03-34-006</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.15625 650.281875)">Illustrative open-loop static transfer; output swing limits are assumed and need not equal supply rails. Idealized hard clipping omits recovery dynamics.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.735156 662.999375)">Gain-bandwidth approximation assumes a dominant-pole voltage-feedback device; noise gain governs stability/BW and differs from signal gain in some</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(275.1375 675.716875)">circuits. Input common-mode range, CMRR, slew rate, load and settling are separate limits.</text>
  </g>
 </g>
