  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1278  •  FIG-03-78-001</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Axisymmetric shaft shown in axial section under tension. Lines illustrate redistribution rather than a solved stress field. Kt2 is assigned, not calculated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">from this drawn fillet geometry. Nominal area is the smaller section. Elastic concentration Kt differs from fatigue notch factor Kf; plasticity, size,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">surface finish, and loading affect practical assessment.</text>
  </g>
