  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Teaching energy model with assigned constant species heat capacities: CO2 .040, H2O .035, N2 .032 MJ/(kmol·K). No losses, no dissociation, negligible</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">kinetic energy. The estimate is not a high-temperature equilibrium prediction; real cp(T), dissociation, fuel composition, and air preheat alter Tad.</text>
