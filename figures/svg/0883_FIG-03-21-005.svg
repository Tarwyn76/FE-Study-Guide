   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(621.322594 252.215336)">SETTLING</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(603.149391 277.822289)">+ FILTRATION</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(839.850047 252.215336)">RECARBONATION</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(856.288016 277.822289)">/pH CONTROL</text>
   </g>
   <g id="text_5">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="434.268" y="151.306687" transform="rotate(-0 434.268 151.306687)">Ca(OH)₂ / Na₂CO₃</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="684.18" y="489.406625" transform="rotate(-0 684.18 489.406625)">CaCO₃ / Mg(OH)₂ solids</text>
   </g>
   <g id="text_7">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(287.875156 562.413828)">Example carbonate-hardness reaction:</text>
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(293.983125 597.454922)">Ca(HCO₃)₂+Ca(OH)₂→2CaCO₃↓+2H₂O</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Lime–soda softening precipitates selected hardness species before solids removal</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0883  •  FIG-03-21-005</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.649219 650.281875)">Conceptual chemical-softening train; lime addresses selected carbonate hardness and magnesium under appropriate chemistry, soda ash can address selected noncarbonate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.564062 662.999375)">calcium hardness. Displayed calcium reaction is atom balanced. CO₂ recarbonation/pH stabilization placement depends on plant design. No dosage, pH target, removal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(389.546875 675.716875)">guarantee or residual-management prescription is supplied.</text>
  </g>
 </g>
