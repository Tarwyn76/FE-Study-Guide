   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="146.788168" transform="rotate(-0 432 146.788168)">Engineering claim → define the parameter</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="227.153128" transform="rotate(-0 432 227.153128)">Write H₀ and H₁; choose direction before looking at results</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="307.518088" transform="rotate(-0 432 307.518088)">Choose significance level α</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="387.883048" transform="rotate(-0 432 387.883048)">Select z, t, chi-square, or F; check assumptions</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="468.248008" transform="rotate(-0 432 468.248008)">Compute the sample test statistic</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="548.612968" transform="rotate(-0 432 548.612968)">Find critical region or compute the p-value</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="628.977928" transform="rotate(-0 432 628.977928)">Reject or fail to reject H₀</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="709.342888" transform="rotate(-0 432 709.342888)">State what the decision means for the engineering claim</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="789.707848" transform="rotate(-0 432 789.707848)">Assess effect size and practical importance</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="844.316975" transform="rotate(-0 432 844.316975)">Failure to reject does not establish that H₀ is true. Statistical significance alone does not measure engineering importance.</text>
   </g>
  </g>
