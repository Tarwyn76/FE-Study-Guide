   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="38.88" y="46.8" transform="rotate(-0 38.88 46.8)">A hypothesis test starts with a claim and ends in context</text>
