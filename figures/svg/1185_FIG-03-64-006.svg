   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(168.285625 335.93525)">Common FCFS queue</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(205.102813 361.37025)">λ=8 jobs/hour</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="813.942" y="208.472537" transform="rotate(-0 813.942 208.472537)">Server1:μ=10/h</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="813.942" y="361.486937" transform="rotate(-0 813.942 361.486937)">Server2:μ=10/h</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="813.942" y="514.501337" transform="rotate(-0 813.942 514.501337)">Server3:μ=10/h</text>
   </g>
   <g id="text_5">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(331.749375 610.4679)">M/M/c per-server utilization=λ/(cμ)</text>
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(242.64 640.9899)">c=1:Wq=24.00 min; c=2:1.14 min; c=3:0.14 min</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A shared queue pools arrivals across multiple identical servers</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1185  •  FIG-03-64-006</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative one pooled queue with identical independent exponential servers and Poisson arrivals. Erlang-C waiting calculations require λ&lt;cμ and an</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">infinite buffer. Comparison holds total arrival rate and each server’s rate fixed. Dedicated queues, heterogeneous servers, priorities, blocking, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">scheduling policies can produce different results.</text>
  </g>
 </g>
