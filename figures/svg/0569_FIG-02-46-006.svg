  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.371875 656.640625)">Homologous points, comparable efficiency, same fluid density, geometrically unchanged machine. Curves are illustrative. Actual operating point also</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(317.120312 669.358125)">depends on the system curve; fan compressibility can limit simple scaling.</text>
  </g>
 </g>
