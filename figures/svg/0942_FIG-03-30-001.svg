  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="63.36" y="47.52" transform="rotate(-0 63.36 47.52)">Contract responsibility differs between design–bid–build and design–build delivery</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="63.36" y="840.672" transform="rotate(-0 63.36 840.672)">0942  •  FIG-03-30-001</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 783.193875)">Conceptual project-delivery relationships. In design–bid–build the owner has separate design and construction contracts; coordination between those parties</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 795.911375)">is not shown as a direct owner-equivalent contract. In design–build the owner contracts with a single delivery entity whose design/construction functions</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(63.36 808.628875)">coordinate internally. Actual agreements can vary.</text>
  </g>
 </g>
