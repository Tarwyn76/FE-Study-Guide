   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Harvard separates instruction and data paths; von Neumann shares them</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">1041  •  FIG-03-44-002</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 657.360625)">Architecture-level comparison. Shared von Neumann paths can contend for instruction/data transfers, while separate Harvard paths permit concurrent access.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 670.078125)">Many modern processors use a modified Harvard design with separate instruction/data caches and a unified lower-level memory system.</text>
  </g>
