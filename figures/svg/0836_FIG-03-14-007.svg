   <g id="text_1">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="155.170938" transform="rotate(-0 540 155.170938)">DEFINE SERVICE • Loads, life, environment</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="249.562937" transform="rotate(-0 540 249.562937)">SCREEN MATERIALS • Strength, stiffness, constructability</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="343.954937" transform="rotate(-0 540 343.954937)">SET TEST CRITERIA • Specimen, method, limits</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="438.346937" transform="rotate(-0 540 438.346937)">CHECK DURABILITY • Moisture, corrosion, fatigue, weather</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="532.738938" transform="rotate(-0 540 532.738938)">ACCEPT + DOCUMENT • Traceability, QA, conformance</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="991.764" y="284.063" transform="rotate(-0 991.764 284.063)">Iterate</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Material selection translates loads and exposure into verified performance and acceptance</text>
  </g>
  <g id="text_8">
</g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.069531 650.281875)">Conceptual decision sequence. Candidate selection balances service demands, exposure, durability, constructability, availability and lifecycle cost. Test criteria</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.389062 662.999375)">must represent the actual service and applicable specification. Failed durability or acceptance checks return the selection to earlier steps; document assumptions</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(481.432031 675.716875)">and verified properties.</text>
  </g>
 </g>
