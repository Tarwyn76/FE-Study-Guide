   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="553.990625" transform="rotate(-0 504 553.990625)">T₂/T₁=2; P₂/P₁=2 → v₂/v₁=1 → Δs=0.4977 kJ/(kg·K)</text>
