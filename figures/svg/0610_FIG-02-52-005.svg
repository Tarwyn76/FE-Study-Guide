  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0610  •  FIG-02-52-005</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(155.835156 656.640625)">Ideal gas with constant heat capacities. T and P are absolute. Both forms describe a state-property difference, even if the actual process is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(365.838281 669.358125)">irreversible; they do not alone determine heat transfer.</text>
