   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="449.094656" transform="rotate(-0 504 449.094656)">Air: c_p=1.005, c_v=0.718, R=0.287 kJ/(kg·K)</text>
