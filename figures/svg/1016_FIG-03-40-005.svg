     <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="558.430937" y="153.398438" transform="rotate(-0 558.430937 153.398438)">Carson estimate ±20 kHz</text>
    </g>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An FM tone produces Bessel-weighted sidebands around the carrier</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">1016  •  FIG-03-40-005</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">Sinusoidal FM, constant carrier amplitude; signed Bessel coefficients carry phase reversals, while this panel plots their magnitudes. Carson bandwidth is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 670.078125)">an approximate occupied-power rule, not a strict spectral cutoff. More distant sidebands exist; frequency deviation is not itself the occupied bandwidth.</text>
  </g>
 </g>
