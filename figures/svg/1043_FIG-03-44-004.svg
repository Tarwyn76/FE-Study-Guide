  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Cache indexing divides an address into tag, set index, and byte offset</text>
  </g>
  <g id="text_12" transform="translate(0.000000 -106.200000)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Data capacity excludes tags, valid bits, and replacement/dirty metadata. Direct tag=0x12345; two-way tag=0x2468A. A16-byte block requires4 offset bits.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Associativity changes the number of sets for fixed capacity and block size; it does not change byte-offset width.</text>
