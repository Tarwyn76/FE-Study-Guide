   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="871.614" y="216.67605" transform="rotate(-0 871.614 216.67605)">Current contribution</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="222.804" y="294.17685" transform="rotate(-0 222.804 294.17685)">Shared resource b1=4</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="554.418" y="294.17685" transform="rotate(-0 554.418 294.17685)">u1=2 profit/resource</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="871.614" y="294.17685" transform="rotate(-0 871.614 294.17685)">4×2=8</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="222.804" y="371.67765" transform="rotate(-0 222.804 371.67765)">x cap b2=2</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="554.418" y="371.67765" transform="rotate(-0 554.418 371.67765)">u2=1 profit/batch</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="871.614" y="371.67765" transform="rotate(-0 871.614 371.67765)">2×1=2</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="222.804" y="449.17845" transform="rotate(-0 222.804 449.17845)">y cap b3=3</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="554.418" y="449.17845" transform="rotate(-0 554.418 449.17845)">u3=0</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="871.614" y="449.17845" transform="rotate(-0 871.614 449.17845)">3×0=0</text>
   </g>
   <g id="text_13">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(397.06125 523.6719)">Dual:min4u1+2u2+3u3</text>
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(382.539375 554.1939)">u1+u2≥3; u1+u3≥2; u≥0</text>
   </g>
   <g id="text_14">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="669.812162" transform="rotate(-0 540 669.812162)">Primal optimum=dual optimum=10; shared-resource price2 valid for2≤b1≤5.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Dual prices quantify local marginal value while primal and dual objectives agree</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1176  •  FIG-03-63-004</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Continuous LP duality for the model in1173. The shared-resource RHS varies while product caps and profits are held fixed. Within2–5 its optimal value</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">is2b1+2; outside that interval the marginal price changes. Dual values are local model sensitivities, not market prices or guaranteed benefits under</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">simultaneous changes.</text>
  </g>
 </g>
