  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Four-bar closure connects link lengths, configuration angles, and a coupler point</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1266  •  FIG-03-76-003</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned planar crank-rocker geometry with ground adjacent to the shortest link and an upper assembly branch. Link lengths and computed coordinates close</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">exactly. Coupler point P is midpoint plus0.4 m normal offset. Grashof length inequality permits crank rotation for this topology; branch changes,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">transmission angle, collisions, and practical clearances need separate consideration.</text>
  </g>
