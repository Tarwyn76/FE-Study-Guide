  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned repetitive line, available operating time excludes breaks, target420 units/day, and all task times share seconds per unit. The ceiling is a lower</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">bound, not proof that three stations can satisfy arbitrary precedence or zoning constraints. In this example the serial chain permits the grouping shown</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">in1220.</text>
