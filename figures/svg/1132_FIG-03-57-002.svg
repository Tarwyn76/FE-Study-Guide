   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="236.072475" transform="rotate(-0 413.8425 236.072475)">Reagent / pH control</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="236.072475" transform="rotate(-0 666.1575 236.072475)">Precipitate forms</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="236.072475" transform="rotate(-0 918.4725 236.072475)">Solids separation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="429.823912" transform="rotate(-0 540 429.823912)">Example: Ca²⁺+CO3²⁻ →CaCO3(s)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(290.306156 552.874662)">Clarified water</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(241.906625 574.494412)">residual dissolved species</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(706.469406 552.874662)">Collected precipitate</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(726.933156 574.494412)">sludge handling</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Chemical precipitation converts dissolved species into solids for a later separation step</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1132  •  FIG-03-57-002</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative precipitation plus physical separation; formation of a solid does not by itself remove it from the water stream. Solubility, speciation,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">complexation, mixing, and nucleation govern residual concentration and kinetics. Reagent addition changes chemistry and may generate sludge. No achieved</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">drinking-water quality is assigned.</text>
  </g>
 </g>
