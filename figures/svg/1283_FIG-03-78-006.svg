  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1283  •  FIG-03-78-006</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Wide plate with a central through crack perpendicular to the applied tension, so a is half the total crack length. Assigned geometry factor1 represents an</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">ideal wide-plate limit; the drawing is schematic. Linear-elastic, small-scale yielding and appropriate plane-strain toughness conditions are needed for</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">KI/KIC assessment. The example does not exclude net-section yield, fatigue growth, or other failure modes.</text>
  </g>
