   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.386719 656.640625)">Conceptual comparison for common configurations. Additional drains, losses, reaction or entrainment require extra balances. Dominant duty depends on feed condition</text>
