<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">CAST quadrant mnemonic</title>
<desc id="svg-desc">Coordinate plane labeled with the positive trigonometric functions in each quadrant</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1400" height="1400" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">CAST — SIGNS BY QUADRANT</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Read counterclockwise from Quadrant IV: C → A → S → T.</text>
<line x1="130" y1="760" x2="1270" y2="760" stroke="#183B5B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="700" y1="1330" x2="700" y2="190" stroke="#183B5B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="980" cy="460" r="135" fill="#FAFBFC" stroke="#2A7F7F" stroke-width="5"/>
<text x="980" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#2A7F7F" text-anchor="middle">A</text>
<text x="980" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#172033" text-anchor="middle">ALL POSITIVE</text>
<text x="980" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#526274" text-anchor="middle">sin, cos, tan</text>
<circle cx="420" cy="460" r="135" fill="#FAFBFC" stroke="#2F6F9F" stroke-width="5"/>
<text x="420" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#2F6F9F" text-anchor="middle">S</text>
<text x="420" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#172033" text-anchor="middle">SINE POSITIVE</text>
<text x="420" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#526274" text-anchor="middle">sin, csc</text>
<circle cx="420" cy="1060" r="135" fill="#FAFBFC" stroke="#D39A22" stroke-width="5"/>
<text x="420" y="1055" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#D39A22" text-anchor="middle">T</text>
<text x="420" y="1115" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#172033" text-anchor="middle">TANGENT POSITIVE</text>
<text x="420" y="1146" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#526274" text-anchor="middle">tan, cot</text>
<circle cx="980" cy="1060" r="135" fill="#FAFBFC" stroke="#C85D32" stroke-width="5"/>
<text x="980" y="1055" font-family="DejaVu Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#C85D32" text-anchor="middle">C</text>
<text x="980" y="1115" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#172033" text-anchor="middle">COSINE POSITIVE</text>
<text x="980" y="1146" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" fill="#526274" text-anchor="middle">cos, sec</text>
<path d="M 1080 1120 C 1230 900 1230 520 1060 360 C 850 170 500 180 320 390" fill="none" stroke="#526274" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1180" y="1260" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#526274" text-anchor="start">IV</text>
<text x="1180" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#526274" text-anchor="start">I</text>
<text x="190" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#526274" text-anchor="start">II</text>
<text x="190" y="1260" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#526274" text-anchor="start">III</text>
</svg>