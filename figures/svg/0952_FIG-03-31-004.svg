  <g id="text_22" transform="translate(0.000000 -109.218203)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.478906 650.142812)">Thermal equilibrium, uniform nondegenerate material, complete ionization, uncompensated illustrative doping. Majority≈dopant is accurate here because</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.214062 662.860312)"><tspan style="font-size: 10.000px">dopant≫n</tspan><tspan style="font-size: 7.200px" dy="2.400px">i</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">. Exact charge neutrality solves a quadratic; values are not asserted as a universal300 K silicon intrinsic concentration. Mass action np=n</tspan><tspan style="font-size: 7.200px" dy="2.400px">i</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">²</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(364.99375 675.855937)">does not generally hold under nonequilibrium injection.</text>
