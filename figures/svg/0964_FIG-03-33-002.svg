  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.697656 650.313125)">Simplified β=100 active curves neglect Early effect and use a schematic0.2 V knee. Q is centered on the ideal resistive DC load line; usable swing is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.096875 663.030625)">slightly limited by saturation and other device constraints. An external AC load can change the AC load line. The diagram does not specify bias stability</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(399.665625 675.748125)">or a transistor safe-operating-area rating.</text>
  </g>
 </g>
