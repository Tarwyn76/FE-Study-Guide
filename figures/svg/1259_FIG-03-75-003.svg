   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="438.82195" transform="rotate(-0 203.58 438.82195)">Authorize / reject</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="438.82195" transform="rotate(-0 540 438.82195)">Implement if approved</text>
