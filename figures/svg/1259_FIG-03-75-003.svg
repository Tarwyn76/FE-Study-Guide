   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="438.82195" transform="rotate(-0 876.42 438.82195)">Verify → baseline v2</text>
   </g>
   <g id="text_7">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="608.782625" transform="rotate(-0 540 608.782625)">Record configuration, rationale, dependencies, test evidence, and released version.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Change control keeps the approved baseline traceable through an evaluated revision</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1259  •  FIG-03-75-003</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual engineering change workflow. Authorization here is a system-design process step, not a request for user permission in this figure task. Rejected</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">or deferred changes do not become the baseline. Configuration identification, controlled documents, status accounting, and verification preserve the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">relation between requirements, design, and tested product.</text>
  </g>
