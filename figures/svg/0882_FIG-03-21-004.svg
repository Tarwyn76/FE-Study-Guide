   <g id="text_1">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="178.1402" transform="rotate(-0 540 178.1402)">INTAKE • Raw-water source</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="265.577" transform="rotate(-0 540 265.577)">COAGULATE / FLOCCULATE • Destabilize particles; form flocs</text>
   </g>
   <g id="text_3">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="353.0138" transform="rotate(-0 540 353.0138)">SEDIMENTATION • Settle flocs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="440.4506" transform="rotate(-0 540 440.4506)">FILTRATION • Remove remaining particles</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="527.8874" transform="rotate(-0 540 527.8874)">DISINFECTION / CLEARWELL • Inactivate pathogens; contact time</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="615.3242" transform="rotate(-0 540 615.3242)">DISTRIBUTION • Deliver finished water</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(917.735531 372.686255)">Residuals</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(910.857797 392.90227)">to handling</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Conventional surface-water treatment combines particle removal and pathogen control</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0882  •  FIG-03-21-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.183594 716.305875)">Conceptual conventional surface-water train supported by EPA treatment guidance. Sequence/details vary with source water, contaminant objectives and system</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.748437 729.023375)">conditions; disinfection may occur at more than one point. Settled solids and filter-backwash residuals need handling. The diagram does not specify chemical dose,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(416.366406 741.740875)">contact-time credit or finished-water compliance.</text>
  </g>
 </g>
