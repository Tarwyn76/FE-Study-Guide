   <ns0:g id="text_1">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.428" y="248.182687" transform="rotate(-0 526.428 248.182687)">PROCESS</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(75.435359 152.855336)">Feed: 100 kg/s</ns0:text>
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.916453 178.462289)">T=20°C</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="521.9424" y="354.442812" transform="rotate(-0 521.9424 354.442812)">70 kg/s; T=80°C</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="512.9712" y="479.194687" transform="rotate(-0 512.9712 479.194687)">Bypass: 30 kg/s; T=20°C</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="584.074562" transform="rotate(-0 504 584.074562)">Product: 100 kg/s; T=[70(80)+30(20)]/100=62°C</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_6">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="119.775" transform="rotate(-0 55.44 119.775)">A bypass branch remixes with a processed branch to meet a product target</ns0:text>
  </ns0:g>
  <ns0:g id="text_7">
</ns0:g>
  <ns0:g id="text_8" transform="translate(0.000000 -45.879818)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.863281 650.142812)"><ns0:tspan font-size="10.000px">Thermal bypass example: constant c</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">p</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=4 kJ/(kg·K), identical material, no phase change or mixing heat, negligible KE/PE and heat loss at remixing. The</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(96.511719 663.138438)">process heater adds 70×4×(80−20)=16.8 MW. Product rise requires the same 100×4×(62−20)=16.8 MW. General mixing uses an enthalpy balance; temperature</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(411.861719 675.855937)">averaging needs these assumptions.</ns0:text>
  </ns0:g>
 </ns0:g>
