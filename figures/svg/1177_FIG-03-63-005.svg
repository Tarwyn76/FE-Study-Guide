  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Maximization convention: nonbasic z consumes one shared-resource unit and no product-cap capacity. At cz=1 its reduced cost is−1 and z=0 remains optimal;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">cz=2 permits tied substitutions for y. Plot separately varies only b1 in the original two-variable model. Sensitivity ranges and reduced-cost signs depend</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">on the solver/formulation convention.</text>
  </g>
