  <g id="text_25">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A house of quality translates customer priorities into technical response priorities</text>
  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1251  •  FIG-03-74-002</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned two-need, three-response QFD matrix. Weighted scores are5×[9,1,3]+3×[1,9,1]=[48,32,18], with no implied engineering units. Roof signs illustrate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">interactions between improvement directions, not measured correlations. This simplified house omits benchmarking, targets, and difficulty ratings; scores</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">inform discussion but do not override feasibility or mandatory requirements.</text>
  </g>
