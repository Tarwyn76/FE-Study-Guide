   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned double-acting cylinder. Pressure acts on full piston area at the cap and annular area on the rod side. Gauge pressures are referenced consistently</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">to ambient; seals, friction, acceleration, and side load are omitted. Retract comparison reverses pressure ports with the opposite port at0 gauge.</text>
