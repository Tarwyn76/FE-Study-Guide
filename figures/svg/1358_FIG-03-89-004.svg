   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="287.685" y="463.689487" transform="rotate(-0 287.685 463.689487)">DIRECTIONAL VALVE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="792.315" y="463.689487" transform="rotate(-0 792.315 463.689487)">PNEUMATIC CYLINDER</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="624.901087" transform="rotate(-0 540 624.901087)">F≈pA on the pressurized side; density and temperature affect mass flow and motion.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Pneumatic storage and pressure regulation precede the directional valve and actuator</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1358  •  FIG-03-89-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual compressed-air supply. Pneumatic pressure/volume dynamics differ from nearly incompressible hydraulic flow; exhaust back pressure and chamber</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">mass balance matter. Receiver isolation does not necessarily remove trapped actuator energy. No operating or pressure-rated hardware is specified.</text>
  </g>
