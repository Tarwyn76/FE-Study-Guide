  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1335  •  FIG-03-86-002</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Basic rating-life relation and assigned C/P=4 example. Survival curve is an illustrative Weibull shape1.5 normalized to90% at L10, not observed population</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">data. Rating life addresses rolling-contact fatigue under the rating model; contamination, lubrication, installation, and other failures can dominate.</text>
  </g>
