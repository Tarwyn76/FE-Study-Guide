   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="206.562555" transform="rotate(-0 540 206.562555)">Declare fuel / air basis and moisture / thermal boundary conditions</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="300.557115" transform="rotate(-0 540 300.557115)">Balance combustion atoms; determine usable heat with a consistent heating value</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="394.551675" transform="rotate(-0 540 394.551675)">Use psychrometrics for sensible / latent air-state changes and condensate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="488.546235" transform="rotate(-0 540 488.546235)">Sum equipment / envelope / ventilation loads under stated conditions</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="582.540795" transform="rotate(-0 540 582.540795)">Match heat duty to equipment performance, losses, controls, and operating limits</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">HVAC and combustion calculations connect source energy to air-state loads and equipment duty</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1382  •  FIG-03-92-007</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual integrated workflow. Fuel heat input and building useful heat duty differ by equipment losses; refrigeration loads and compressor input differ</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">by COP. Dry-air mass and fuel basis should remain visible through every conversion to avoid mixing energy and composition denominators.</text>
  </g>
