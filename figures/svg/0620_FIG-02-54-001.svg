  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(96.9625 590.3385)"><tspan font-size="10.000px">Positive heat/work magnitudes: Q</tspan><tspan font-size="6.800px" dy="2.400px">H</tspan><tspan font-size="10.000px" dy="-2.400px">=Q</tspan><tspan font-size="6.800px" dy="2.400px">L</tspan><tspan font-size="10.000px" dy="-2.400px">+W</tspan><tspan font-size="6.800px" dy="2.400px">in</tspan><tspan font-size="10.000px" dy="-2.400px">. Refrigerator performance uses useful Q</tspan><tspan font-size="6.800px" dy="2.400px">L</tspan><tspan font-size="10.000px" dy="-2.400px">; heat-pump performance uses useful Q</tspan><tspan font-size="6.800px" dy="2.400px">H</tspan><tspan font-size="10.000px" dy="-2.400px">.</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(267.220312 603.334125)"><tspan font-size="10.000px">COP</tspan><tspan font-size="6.800px" dy="2.400px">HP</tspan><tspan font-size="10.000px" dy="-2.400px">=COP</tspan><tspan font-size="6.800px" dy="2.400px">R</tspan><tspan font-size="10.000px" dy="-2.400px">+1 for the same device and operating conditions.</tspan></text>
