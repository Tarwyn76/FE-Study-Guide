  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned demand-cap forecast for product y, linked to the LP in1173–1177. Scenario range is not a statistical confidence interval. Prediction cannot</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">prescribe action without objective, resource limits, and costs. A chosen action feeds future observations; forecast error and changing constraints require</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">monitoring. No machine-learning model was trained here.</text>
  </g>
