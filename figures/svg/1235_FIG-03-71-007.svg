   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="842.778" y="580.33365" transform="rotate(-0 842.778 580.33365)">Force / repetition / ergonomics</text>
   </g>
   <g id="text_19">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="651.651425" transform="rotate(-0 540 651.651425)">Specify load, volume, route, frequency, access, and interaction before comparison.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="728.876287" transform="rotate(-0 540 728.876287)">Compare lifecycle cost and service while enforcing load and safety constraints.</text>
   </g>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Material-handling selection matches load and route characteristics to equipment capabilities</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1235  •  FIG-03-71-007</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Qualitative selection matrix, not equipment sizing or purchasing advice. Capability depends on actual dimensions, center of gravity, floor/route</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">conditions, traffic, and controls. A material-handling metric can combine distance and loads but does not capture all congestion, maintenance, labor, or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">safety effects.</text>
  </g>
 </g>
