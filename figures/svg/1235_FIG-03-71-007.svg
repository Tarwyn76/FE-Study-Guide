   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="174.744" y="425.33205" transform="rotate(-0 174.744 425.33205)">AGV or AMR</text>
   </g>
   <g id="text_11">
