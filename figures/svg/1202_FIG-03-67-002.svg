  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Equal-weight, trailing three-observation forecast, plotted at its target period. First forecast is period4; no future observations enter its window.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Assigned data are listed in the plot. Smoothing can lag a changing level; this example is not a selected or optimized forecasting model.</text>
