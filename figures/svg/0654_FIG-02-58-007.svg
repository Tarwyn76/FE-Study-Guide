   <g id="text_1">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="171.178688" transform="rotate(-0 504 171.178688)">Known inlet/outlet temperatures?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #26776f" x="270.7488" y="249.562937" transform="rotate(-0 270.7488 249.562937)">Yes</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="737.2512" y="249.562937" transform="rotate(-0 737.2512 249.562937)">Outlets unknown</text>
   </g>
   <g id="text_4">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(181.502209 372.019773)">LMTD method</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(177.843772 403.017664)">Q̇=UA F ΔT_lm</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(658.253884 373.667117)">Effectiveness–NTU</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(578.401931 399.27407)">NTU=UA/C_min; C_r=C_min/C_max</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="261.7776" y="563.098813" transform="rotate(-0 261.7776 563.098813)">Size area or check duty</text>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(623.446228 548.915414)">ε=f(NTU,C_r,geometry)</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(632.522166 577.801898)">Q̇=εC_min(T_hi−T_ci)</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Choose the exchanger method from the temperatures available</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0654  •  FIG-02-58-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.63125 656.640625)">Both methods also need stream energy balances and a compatible U and area. Select ε correlations or LMTD correction F for the actual geometry.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(169.846094 669.358125)">Phase-changing streams may require a different capacity-rate treatment; numerical iteration can couple either method to unknowns.</text>
  </g>
