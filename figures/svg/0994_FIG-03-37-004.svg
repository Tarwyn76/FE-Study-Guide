  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Current direction sets magnetic circulation, and Iℓ×B sets conductor-force direction</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0994  •  FIG-03-37-004</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.267187 716.305875)">Left: infinitely long straight wire with positive current toward the viewer; right-hand circulation is counterclockwise. Right: current in+x,uniform B in−z gives</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.759375 729.023375)">force+y. Dot/cross notation indicates out/into page. H in A/m differs from B=μH in tesla. Geometry and force/current arrow lengths are schematic; no realistic hand</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(426.5625 741.740875)">is needed to establish these exact directions.</text>
  </g>
