  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Flexible and rigid pavements use distinct structural surface layers over supporting materials</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0938  •  FIG-03-29-004</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(130.51875 650.281875)">Typical conceptual layer stacks, not mandatory construction assemblies. Layers and thicknesses depend on traffic, subgrade, environment, materials and drainage</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.390625 662.999375)">design; some projects omit or combine layers. Rigid pavement joints/load transfer and flexible-pavement mechanistic response are not detailed. Drainage arrows</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(379.042969 675.716875)">indicate a possible path, not a sized outlet or filter specification.</text>
  </g>
