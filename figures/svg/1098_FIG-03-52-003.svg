  <g id="text_2">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">The rational method estimates peak runoff for rainfall sustained over concentration time</text>
  </g>
  <g id="text_3">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1098  •  FIG-03-52-003</text>
  </g>
  <g id="text_4">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Illustrative developed watershed draining to one outlet, not an observed flood. SI coefficient applies to i in mm/h and A in hectares. Assumes suitable</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">small-catchment applicability, uniform intensity for at least tc, and an appropriate runoff coefficient. Peak rate is not total runoff volume;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">routing/storage and spatial variation are omitted.</text>
  </g>
