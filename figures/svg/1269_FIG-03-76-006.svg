  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Compound gearing multiplies stage ratios; planetary gearing uses speeds relative to the carrier</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1269  •  FIG-03-76-006</text>
  </g>
  <g id="text_15">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="75.6" y="561.6" transform="rotate(-0 75.6 561.6)">ωout/ωin=(20/40)(15/45)=+1/6</text>
  </g>
  <g id="text_16">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="75.6" y="587.52" transform="rotate(-0 75.6 587.52)">Two external meshes → same direction</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Left: two external meshes with intermediate gears rigidly sharing a shaft. Right: ideal simple planetary set, common module, sun20, planet15, ring50 teeth.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">Pitch radii are proportional to tooth counts and satisfy ring=sun+2planet. With the ring fixed and sun210 rpm, carrier60 rpm follows Willis’ relation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">Absolute planet spin is separate from carrier revolution; no torque or efficiency model is assumed.</text>
  </g>
