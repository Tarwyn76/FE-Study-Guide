   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="150.8472" y="240.494912" transform="rotate(-0 150.8472 240.494912)">Metals</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="393.9264" y="240.494912" transform="rotate(-0 393.9264 240.494912)">Metallic</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="747.0792" y="240.494912" transform="rotate(-0 747.0792 240.494912)">Conductive; often ductile; variable stiffness</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="150.8472" y="333.223712" transform="rotate(-0 150.8472 333.223712)">Ceramics</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="393.9264" y="333.223712" transform="rotate(-0 393.9264 333.223712)">Ionic / covalent</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="747.0792" y="333.223712" transform="rotate(-0 747.0792 333.223712)">Often stiff and heat resistant; brittle</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="150.8472" y="425.952513" transform="rotate(-0 150.8472 425.952513)">Polymers</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="393.9264" y="425.952513" transform="rotate(-0 393.9264 425.952513)">Covalent chains + secondary forces</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="747.0792" y="425.952513" transform="rotate(-0 747.0792 425.952513)">Often low density; lower service temperature</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="150.8472" y="518.681313" transform="rotate(-0 150.8472 518.681313)">Semiconductors</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="393.9264" y="518.681313" transform="rotate(-0 393.9264 518.681313)">Covalent with electronic structure effects</text>
