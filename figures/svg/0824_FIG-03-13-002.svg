   <ns0:g id="text_1">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(406.013906 150.769266)">ELIMINATE / MINIMIZE</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(238.442344 175.028484)">Remove hazardous chemistry; reduce hazardous inventory</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(467.064844 265.033266)">PASSIVE</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(279.355781 289.292484)">Containment, robust layout, compatible materials</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(471.720937 379.297266)">ACTIVE</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(295.074844 403.556484)">Detection, trips, automatic isolation or cooling</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(442.681875 493.561266)">PROCEDURAL</ns0:text>
    <ns0:text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(253.868906 517.820484)">Training, operating checks, permits, emergency actions</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_5">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="91.298" transform="rotate(-0 55.44 91.298)">Inherently safer design precedes added protection layers</ns0:text>
  </ns0:g>
  <ns0:g id="text_6">
</ns0:g>
  <ns0:g id="text_7" transform="translate(0.000000 -86.904967)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.499219 650.281875)">Conceptual design hierarchy. Substitution, moderation and simplification also support inherent safety. Layers supplement rather than excuse avoidable</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.665625 662.999375)">hazards. Independence, reliability, maintenance and human factors determine protection; a listed safeguard is not automatically an independent protection</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(490.322656 675.716875)">layer.</ns0:text>
  </ns0:g>
 </ns0:g>
