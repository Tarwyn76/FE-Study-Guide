   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(406.013906 150.769266)">ELIMINATE / MINIMIZE</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(238.442344 175.028484)">Remove hazardous chemistry; reduce hazardous inventory</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(467.064844 265.033266)">PASSIVE</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(279.355781 289.292484)">Containment, robust layout, compatible materials</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(471.720937 379.297266)">ACTIVE</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(295.074844 403.556484)">Detection, trips, automatic isolation or cooling</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(442.681875 493.561266)">PROCEDURAL</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(253.868906 517.820484)">Training, operating checks, permits, emergency actions</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Inherently safer design precedes added protection layers</text>
  </g>
  <g id="text_6">
</g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.499219 650.281875)">Conceptual design hierarchy. Substitution, moderation and simplification also support inherent safety. Layers supplement rather than excuse avoidable</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.665625 662.999375)">hazards. Independence, reliability, maintenance and human factors determine protection; a listed safeguard is not automatically an independent protection</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(490.322656 675.716875)">layer.</text>
  </g>
 </g>
