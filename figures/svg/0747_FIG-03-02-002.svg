   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0747  •  FIG-03-02-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.955469 650.281875)">Reactant A converted to products in an ideal steady reactor; separator returns all unreacted A and removes reaction products. Numbers are A component molar rates,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.915625 662.999375)">not total stream molar rates. A consumption is 100 mol/s in both unit and overall balances. Perfect recovery makes complete overall conversion possible in this ideal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(522.841406 675.716875)">model.</text>
  </g>
