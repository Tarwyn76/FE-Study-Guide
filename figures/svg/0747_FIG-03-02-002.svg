    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="588.722719" transform="rotate(-0 540 588.722719)">X_single=(250−150)/250=0.40; X_overall=(100−0)/100=1.00</text>
