  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(99.957031 656.501562)">Same section as851: n=0.025,A=5.760 m²,R=0.7862 m,S_f=S₀=0.001. Q≈6.206 m³/s and mean velocity≈1.077 m/s. Vertical offsets and slope are exaggerated;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(185.028906 669.497187)">EGL−water surface is velocity head for α=1. Uniform prismatic flow implies parallel lines and constant depth; SI coefficient is1.</text>
