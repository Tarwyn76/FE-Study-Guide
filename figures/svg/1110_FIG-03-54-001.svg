  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Schematic sections with impermeable lower boundary. A confined potentiometric level is pressure head plus elevation and may lie above the aquifer top</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">without the layer being unconfined. Unconfined saturated thickness changes with the water table. n is total porosity; ne is effective connected porosity</text>
