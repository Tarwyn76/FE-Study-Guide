  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A secondary impedance reflects to the primary by the square of turns ratio</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0695  •  FIG-02-64-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.783594 656.640625)">Ideal transformer at the same frequency. Voltage scales by a and input current by 1/a, so input impedance scales by a². Both resistance and reactance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(200.327344 669.358125)">reflect. Winding resistance, leakage impedance and magnetizing branch must be added separately for a nonideal model.</text>
  </g>
