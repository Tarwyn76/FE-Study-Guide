  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.620312 656.501562)">Steady radial cylinder with fixed inner-surface temperature, constant k/h, no radiation or contact resistance. Sphere critical radius is 2k/h. If the</text>
