  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned single-lap single-bolt example, threads excluded from shear plane, hole diameter assumed equal to bolt diameter for the net area. Plate widths are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">out-of-page; sketch is a side view. Edge tear-out, joint eccentricity, friction slip, clearances, and actual hole size require separate checks.</text>
  </g>
