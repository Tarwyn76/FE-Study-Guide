  <g id="text_26">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Tuning changes interact; qualitative tendencies are not universal guarantees</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0736  •  FIG-02-70-005</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.694531 650.281875)">These are common tendencies for suitable stable loops, not laws. Gain meanings depend on the chosen PID form. Integral action requires stability and available</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.539062 662.999375)">actuator authority to remove offset. Derivative filtering, noise, delay, saturation and nonlinear dynamics can reverse expected trends. Validate using the actual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(485.778906 675.716875)">loop model and tests.</text>
  </g>
