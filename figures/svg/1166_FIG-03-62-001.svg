   </g>
   <g id="text_19">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="602.214075" transform="rotate(-0 203.58 602.214075)">Raw records</text>
   </g>
   <g id="text_20">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="602.214075" transform="rotate(-0 540 602.214075)">Validate / normalize</text>
   </g>
   <g id="text_21">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="602.214075" transform="rotate(-0 876.42 602.214075)">Accepted dataset</text>
   </g>
   <g id="text_22">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="526.810625" transform="rotate(-0 540 526.810625)">Example completeness:95 populated values /100 expected=95%</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Engineering analytics starts with typed variables, consistent units, and traceable quality checks</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1166  •  FIG-03-62-001</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative engineering schema. Numeric identifiers are not measurements; timestamps need a shared zone/clock definition. Missing, duplicate, out-of-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">range, and inconsistent-unit records should be flagged rather than silently changed. The95% metric refers to one expected-field count, not a universal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">data-quality score; acceptance criteria are context-specific.</text>
  </g>
 </g>
