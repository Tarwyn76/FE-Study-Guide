  <ns0:g id="text_6">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.151562 656.640625)">Hypothetical index values, not current published prices or index data. Same equipment scope, currency/location and cost-index series; index escalation</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.783594 669.358125)">alone does not account for changed capacity, technology, installation, regional labor or exchange rates. Confirm comparable cost basis before scaling.</ns0:text>
