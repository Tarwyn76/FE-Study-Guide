</g>
  <g id="text_6" transform="translate(0.000000 -83.107944)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(142.085938 650.142812)"><tspan style="font-size: 10.000px">Metric units: I in mm/h,A in hectares,Q in m³/s; factor1/360 is the exact unit conversion. Intensity is from synthetic figure845 at duration t</tspan><tspan style="font-size: 7.200px" dy="2.400px">c</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">, not</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.141406 663.138438)">local design data. Assumes rainfall sufficiently long to involve the contributing area and a representative runoff coefficient. Peak-only method does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(388.792969 675.855937)">determine runoff volume or a full hydrograph.</text>
