  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(142.085938 650.142812)">Metric units: I in mm/h,A in hectares,Q in m³/s; factor1/360 is the exact unit conversion. Intensity is from synthetic figure845 at duration t_c, not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.141406 663.138438)">local design data. Assumes rainfall sufficiently long to involve the contributing area and a representative runoff coefficient. Peak-only method does not</text>
