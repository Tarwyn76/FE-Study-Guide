    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(320.194056 449.023773)"><ns0:tspan font-size="23.000px">t</ns0:tspan><ns0:tspan font-size="15.640px" dy="5.520px">c</ns0:tspan><ns0:tspan font-size="23.000px" dy="-5.520px">=30 min; I=60.49 mm/h</ns0:tspan></ns0:text>
    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(300.534447 480.661352)">10-year synthetic IDF example</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="580.358906" transform="rotate(-0 504 580.358906)"><ns0:tspan font-size="29.000px">Q</ns0:tspan><ns0:tspan font-size="19.720px" dy="6.960px">peak</ns0:tspan><ns0:tspan font-size="29.000px" dy="-6.960px">=C I A /360=1.311 m³/s</ns0:tspan></ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_4">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="101.422" transform="rotate(-0 55.44 101.422)">The rational method estimates peak runoff from a small catchment at its time of concentration</ns0:text>
  </ns0:g>
  <ns0:g id="text_5">
</ns0:g>
  <ns0:g id="text_6" transform="translate(0.000000 -43.180290)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(142.085938 650.142812)"><ns0:tspan font-size="10.000px">Metric units: I in mm/h,A in hectares,Q in m³/s; factor1/360 is the exact unit conversion. Intensity is from synthetic figure845 at duration t</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">c,</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> not</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.141406 663.138438)">local design data. Assumes rainfall sufficiently long to involve the contributing area and a representative runoff coefficient. Peak-only method does not</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(388.792969 675.855937)">determine runoff volume or a full hydrograph.</ns0:text>
  </ns0:g>
