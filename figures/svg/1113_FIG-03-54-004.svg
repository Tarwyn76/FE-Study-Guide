  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Steady confined radial-flow illustration with reference head30 m at radius500 m. Symmetric profile is a section through the well. Near-well radius is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">limited to0.2 m; actual well losses, partial penetration, leakage, boundaries, and transient storage are omitted. The plotted surface is potentiometric,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">not necessarily an unconfined water table.</text>
  </g>
 </g>
