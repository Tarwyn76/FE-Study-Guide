   <g id="text_1">
    <text style="font-size: 31px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(364.851094 281.82378)">PV=mRT</text>
    <text style="font-size: 31px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(381.377969 323.603545)">Pv=RT</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="220.536" y="158.007738" transform="rotate(-0 220.536 158.007738)">P: absolute pressure</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="643.464" y="158.007738" transform="rotate(-0 643.464 158.007738)">V: total volume</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="426.344737" transform="rotate(-0 432 426.344737)">m: gas mass   |   R: gas-specific constant   |   T: temperature in K</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="488.876537" transform="rotate(-0 432 488.876537)">Air: m=1 kg, R=0.287 kJ/(kg·K), T=300 K, P=100 kPa</text>
   </g>
   <g id="text_6">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="544.738437" transform="rotate(-0 432 544.738437)">V=mRT/P=0.861 m³</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="47.52" y="35.64" transform="rotate(-0 47.52 35.64)">The ideal-gas state equation uses absolute pressure and absolute temperature</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="47.52" y="630.504" transform="rotate(-0 47.52 630.504)">0585  •  FIG-02-49-001</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(108.667969 590.477562)">Ideal-gas approximation. R=R_universal/M, with consistent molar-mass units; it differs among gases. Use Kelvin, not Celsius, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(318.264063 603.473187)">absolute rather than gauge pressure. v=V/m.</text>
  </g>
