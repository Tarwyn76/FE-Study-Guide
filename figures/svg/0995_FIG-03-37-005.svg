   <g id="text_1">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="127.2096" y="190.498812" transform="rotate(-0 127.2096 190.498812)">N=200 turns</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(659.312719 191.511445)">ℓ=0.30 m; A=10⁻⁴ m²</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(672.042328 219.813867)">μ_r=1,000; I=0.5 A</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(725.85975 360.715477)">ℜ=ℓ/(μA)</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(660.431625 389.017898)">Φ=NI/ℜ≈41.888 µWb</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(640.887562 525.057406)">λ=NΦ≈8.37758 mWb·turn</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(672.376625 552.012094)">L=N²/ℜ≈16.755 mH</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A magnetic circuit relates ampere-turns, reluctance, flux, and linkage</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0995  •  FIG-03-37-005</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.879687 650.142812)">Linear homogeneous core, no air gap, constant cross section and permeability, negligible leakage/fringing. μ=μ₀μ_r with μ₀≈4π×10⁻⁷ H/m. Drawing shows a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.750781 663.138438)">few schematic turns, not the stated200-count winding. Flux arrows establish a positive reference; terminal polarity would follow the actual winding sense.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(236.473437 675.855937)">Saturation and core loss are omitted; B=Φ/A≈0.418879 T is a model result, not an assured operating limit.</text>
  </g>
 </g>
