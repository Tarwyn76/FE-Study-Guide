  <g id="text_24">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Power devices differ in control, conduction direction, and turn-off behavior</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">0977  •  FIG-03-35-001</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.232031 716.305875)">Functional symbols and positive current/voltage references, not ratings or complete device models. Conventional SCR gate cannot normally command turn-off. Power</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.771875 729.023375)">MOSFET channel can conduct either direction when on; body diode is omitted. IGBT reverse conduction usually needs a separate antiparallel diode. Gate voltage must be</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(301.157031 741.740875)">referenced to source/emitter and appropriate drive/protection provided; none is designed here.</text>
  </g>
