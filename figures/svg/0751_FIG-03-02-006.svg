  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.077344 656.501562)">Initially C_A=0; at t=0 the inlet steps to 1 mol/L. Equal constant inlet/outlet volumetric rates, constant V, complete mixing, no reaction. Outlet</text>
