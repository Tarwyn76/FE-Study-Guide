  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned jointly normal lead-time demands, equal lead-time windows, same z service factor, and no extra pooling delays. Pooling replaces two stocks with</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">one stock against the combined demand. At correlation1 the statistical benefit disappears. Separate location cycle-service probabilities and pooled system</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">cycle-service probability do not define the same fill-rate or joint-service event.</text>
  </g>
 </g>
