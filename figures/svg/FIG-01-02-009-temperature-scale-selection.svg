   <g id="text_1">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="100.182388" transform="rotate(-0 396 100.182388)">What does the equation require?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="204.676175" transform="rotate(-0 396 204.676175)">Absolute temperature T?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(665.816828 196.743714)">Use K</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(667.806438 214.264261)">or °R</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="583.3872" y="167.766638" transform="rotate(-0 583.3872 167.766638)">Yes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="432.036" y="268.509037" transform="rotate(-0 432.036 268.509037)">No</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(309.555078 322.671714)">Temperature difference ΔT</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(287.833906 340.192261)">Use a consistent degree-size pair</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(287.085391 439.441314)">Δ°F = 1.8 Δ°C    •    Δ°R = 1.8 ΔK</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(311.891016 456.961861)">ΔK = Δ°C    •    Δ°R = Δ°F</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="520.640975" transform="rotate(-0 396 520.640975)">Check the equation: a temperature value and a temperature difference are distinct.</text>
