  </ns0:g>
  <ns0:g id="text_9">
</ns0:g>
  <ns0:g id="text_10" transform="translate(0.000000 -69.530166)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.4625 650.281875)">Illustrative batch masses, not a complete mix design or specified yield. w/c uses effective mixing-water mass and cement mass; aggregate moisture/absorption and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(165.996094 662.999375)">water in admixtures require correction. Air is specified on a volume basis. If supplementary cementitious materials are included, distinguish w/c from</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(455.191406 675.716875)">water-to-cementitious ratio w/cm.</ns0:text>
