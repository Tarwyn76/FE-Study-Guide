  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0728  •  FIG-02-69-004</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.503906 656.640625)">Disturbance is injected after the controller and before the plant. The reference numerator contains C; the disturbance numerator does not. A disturbance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(189.132812 669.358125)">added directly to the output or to the measurement would have a different transfer path. Zero initial conditions are assumed.</text>
  </g>
