  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Engineered landfills manage leachate, gas, stormwater, and surrounding groundwater separately</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1161  •  FIG-03-61-003</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Schematic cross-section, not a permitted design or construction detail. Leachate pipes are above the liner; groundwater lies below, and stormwater is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">routed outside the waste area. Gas wells connect to separate handling. Cover/liner materials, drainage, stability, post-closure care, and monitoring</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">requirements depend on the actual landfill and applicable criteria.</text>
  </g>
