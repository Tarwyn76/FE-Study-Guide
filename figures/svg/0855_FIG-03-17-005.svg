   </g>
   <g id="text_4">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(222.904297 552.875758)">Suppressed rectangular weir: Q=C L H^(3/2)</text>
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(223.734375 586.569117)">L=2.0 m; C=1.84 m^0.5/s → Q=0.6047 m³/s</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A sharp-crested rectangular weir uses upstream head above the crest</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0855  •  FIG-03-17-005</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.961719 650.281875)">Teaching free-discharge example, SI handbook coefficient C=1.84. Crest length L is across the channel, out of the section plane. Head is measured upstream</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.919531 662.999375)">outside the local drawdown zone. Valid application depends on approach velocity, geometry, nappe ventilation and no submergence; drawn nappe shape is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(408.732031 675.716875)">schematic, not a computed trajectory.</text>
  </g>
