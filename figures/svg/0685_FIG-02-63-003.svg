   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.389844 656.3625)">Single-phase ideal correction at fixed 230 V RMS and 60 Hz. Capacitor reactive power is negative; Q_C here is its positive magnitude. The source supplies</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(247.089063 669.358125)">net Q=Q_load−Q_C. Corrected current falls, while an ideal capacitor consumes no average real power.</text>
