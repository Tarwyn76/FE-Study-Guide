  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1100  •  FIG-03-52-005</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic rainfall and assigned losses, not a fitted infiltration model. Bars are interval intensities; integrating their height over1-hour widths gives</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">depth. Initial abstraction is included in the assigned loss series and must not be counted again. Effective rainfall is input to a runoff transformation,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">not itself a discharge hydrograph.</text>
  </g>
 </g>
