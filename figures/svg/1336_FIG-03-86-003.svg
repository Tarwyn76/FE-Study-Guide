  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1336  •  FIG-03-86-003</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned coefficient example for a combined-load branch. X,Y,and threshold e must come from the applicable bearing data and Fa/C0; values here are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">specified for calculation and do not identify a real catalog bearing. V1 denotes inner-ring rotation under the handbook convention. A pure-radial branch</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">uses different coefficients.</text>
  </g>
