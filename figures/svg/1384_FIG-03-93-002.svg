  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned one-loop examples, KVL source−load drop=0 and KCL equal series currents. AC source phasor is120∠0° V RMS; impedance is inductive. Complex power</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">uses conjugate current under passive sign convention. A voltage or current peak value would require the appropriate factor of1/2.</text>
