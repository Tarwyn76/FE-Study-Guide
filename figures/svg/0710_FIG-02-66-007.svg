  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0710  •  FIG-02-66-007</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.997656 656.640625)">Preserve calibration traceability, environmental conditions and acquisition settings. Validation includes independent checks and justified handling of</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.903906 669.358125)">suspect data. Report units, corrections, uncertainty, coverage factor and relevant limitations; repeat the workflow when conditions or drift warrant it.</text>
