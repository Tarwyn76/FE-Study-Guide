   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(139.957812 650.281875)">Metric station notation; horizontal run is plan alignment distance for grade calculation. Plot vertical scale is exaggerated relative to station scale.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.050781 662.999375)">Existing-ground elevations are hypothetical. A tangent profile does not establish vertical-curve, drainage or sight-distance adequacy; those require</text>
