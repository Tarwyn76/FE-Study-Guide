   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned quarter-scale model, identical fluid kinematic viscosity and gravity, prototype speed2 m/s. The diagram lengths are schematic rather than exact</text>
