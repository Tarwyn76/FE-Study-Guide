    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="734.837887" transform="rotate(-0 540 734.837887)">Initial stock10; lot-for-lot replenishment; component lead time1 week</text>
   </g>
  </g>
  <g id="text_39">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">MRP explodes component demand, nets stock, then offsets the planned receipt by lead time</text>
  </g>
  <g id="text_40">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1212  •  FIG-03-68-005</text>
  </g>
  <g id="text_41">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Dependent demand is based on the parent assembly receipt in week4, assuming components are needed in that week. Gross need=20×2=40; net need=40−10=30. No</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">scheduled receipts, safety stock, scrap, or parent assembly lead-time offset is included. Planned receipt30 in week4 is released in week3. Projected</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">available is period-end inventory after demands and receipts.</text>
