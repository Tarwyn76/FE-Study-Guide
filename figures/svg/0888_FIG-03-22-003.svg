  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A pin-jointed truss carries a joint load through axial member forces to its supports</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0888  •  FIG-03-22-003</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.183594 656.501562)">Ideal three-member truss, frictionless pins, load10 kN downward only at B. Support A pin,C horizontal roller; A_x=0,A_y=C_y=5 kN. Member forces follow</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.020312 669.497187)">joint equilibrium; compression struts transfer vertical load and tie AC balances their horizontal components. No bending or self-weight included.</text>
  </g>
