  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">External flow builds boundary layers on a plate and around a cylinder</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0643  •  FIG-02-57-003</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.98125 656.640625)">Boundary-layer thicknesses/wake are qualitative, not predictions of separation angle. Blue denotes velocity layer and red thermal layer; their relative</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(237.214844 669.358125)">thickness depends on Pr. Plate characteristic length is distance from leading edge; cylinder uses diameter.</text>
  </g>
