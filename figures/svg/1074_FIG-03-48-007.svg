   <g id="text_1">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="181.97635" transform="rotate(-0 540 181.97635)">Continuous flow?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.400875 333.922725)">No → Batch</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.968688 356.814225)">Track elapsed time</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="804.33" y="345.368475" transform="rotate(-0 804.33 345.368475)">Yes:strong bulk mixing?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(499.199344 547.049925)">Yes →CMFR</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(495.633094 569.941425)">Cout=Cbulk</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(820.081297 547.409862)">No axial mixing</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(839.729578 569.029612)">→ideal PFR</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.354 547.7698)">Validate the idealization</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.94275 568.1178)">against actual mixing.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Choose a reactor idealization from operation and mixing assumptions</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1074  •  FIG-03-48-007</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual model selection, not a complete reactor-design procedure. Weak mixing alone does not establish plug flow; bypass, dead zones, dispersion and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">residence-time distribution may require a nonideal model. Reaction kinetics, operating cycle and boundary conditions are separate inputs.</text>
  </g>
