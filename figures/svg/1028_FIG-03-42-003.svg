  <g id="text_14">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">De Morgan’s laws move inversion between inputs and outputs</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1028  •  FIG-03-42-003</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">An input bubble denotes complementing that input. AND can be built by inverting NAND output; OR by inverting NOR output. Either NAND or NOR is functionally</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">complete. Equivalent networks assume ideal Boolean behavior, not equal physical propagation delays.</text>
  </g>
