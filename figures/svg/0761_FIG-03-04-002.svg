   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(151.365625 656.640625)">Hypothetical dilute solute, fixed T, ideal vapor. At P=100 kPa the marked equilibrium vapor mole fraction is 0.05. H has pressure units in this</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.150781 669.358125)">mole-fraction convention. Concentration, inverse or dimensionless Henry constants require different units and formulas; never substitute them unchanged.</ns0:text>
  </ns0:g>
 </ns0:g>
