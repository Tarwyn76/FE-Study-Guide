  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Henry’s law is a dilute-solute equilibrium relation with a defined convention</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0761  •  FIG-03-04-002</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(151.365625 656.640625)">Hypothetical dilute solute, fixed T, ideal vapor. At P=100 kPa the marked equilibrium vapor mole fraction is 0.05. H has pressure units in this</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.150781 669.358125)">mole-fraction convention. Concentration, inverse or dimensionless Henry constants require different units and formulas; never substitute them unchanged.</text>
  </g>
