  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A granular filter sends water downward in service and upward during backwash</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1128  •  FIG-03-56-005</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Simplified downflow granular filter with an upflow water backwash shown as a separate operating cycle. Real media gradation and air-scour arrangements</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">vary. Backwash must expand/clean media without unacceptable loss and sends residual solids to waste handling. Filtered effluent is not drawn as</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">simultaneous with the wash-water cycle.</text>
  </g>
