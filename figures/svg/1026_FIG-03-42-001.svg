   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">Eight-bit example: unsigned range0…255 and two’s-complement range−128…127. Hex digits preserve bit patterns but do not determine signedness. The most</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 670.078125)">significant signed bit has weight−128; sign extension preserves a signed value when increasing word width.</text>
