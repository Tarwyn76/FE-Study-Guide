   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(79.8625 590.477562)"><tspan style="font-size: 10.000px">Q</tspan><tspan style="font-size: 7.200px" dy="2.400px">H</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px"> and Q</tspan><tspan style="font-size: 7.200px" dy="2.400px">L</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px"> are positive heat magnitudes. Cyclic balance W</tspan><tspan style="font-size: 7.200px" dy="2.400px">net</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">=Q</tspan><tspan style="font-size: 7.200px" dy="2.400px">H</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">−Q</tspan><tspan style="font-size: 7.200px" dy="2.400px">L</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">. For these reservoirs η≤1−T</tspan><tspan style="font-size: 7.200px" dy="2.400px">L</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">/T</tspan><tspan style="font-size: 7.200px" dy="2.400px">H</tspan><tspan style="font-size: 10.000px" dy="-2.400px">​</tspan><tspan style="font-size: 10.000px">=0.50; the example’s 0.40 is</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(391.29375 603.473187)">below that limit.</text>
