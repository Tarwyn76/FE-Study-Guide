  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A shallow footing’s ultimate bearing capacity is distinct from its allowable pressure</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0931  •  FIG-03-28-004</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.099219 650.281875)">Conceptual strip footing, vertical centered load, level ground and representative general-shear mechanism. Displayed expression is a simplified gross</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.485937 662.999375)">ultimate bearing model; groundwater, shape, depth and load inclination may alter factors. Gross versus net allowable conventions must match; settlement</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(254.954687 675.716875)">may control below shear failure. No numerical safety factor or allowable pressure is recommended.</text>
  </g>
 </g>
