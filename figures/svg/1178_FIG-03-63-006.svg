  <g id="text_40">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Synthetic balanced transportation data; the displayed plan is one optimum and alternatives may tie. Each shipment is a source-to-demand arc; node</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">outflow−inflow equals assigned supply/demand. Assignment is the special unit-supply/unit-demand network. Costs and quantities have consistent illustrative</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">units; no real route travel times or capacities are implied.</text>
  </g>
