<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Physical quantity, dimension, and units hierarchy</title>
<desc id="svg-desc">Three-tier pyramid showing a physical quantity at the base, its dimension in the middle, and multiple valid unit examples at the top</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1450" fill="#FFFFFF"/>
<text x="70" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">QUANTITY → DIMENSION → UNITS</text>
<text x="70" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#526274" text-anchor="start">The same measurable property has one dimension and can be expressed in many units.</text>
<polygon points="120,1280 1680,1280 1450,960 350,960" fill="#DCEAF4" stroke="#183B5B" stroke-width="4"/>
<text x="900" y="1030" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#183B5B" text-anchor="middle">PHYSICAL QUANTITY</text>
<text x="900" y="1090" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="750" fill="#172033" text-anchor="middle">Length of the same beam</text>
<text x="900" y="1150" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#526274" text-anchor="middle">A measurable property of a particular object</text>
<rect x="425" y="1190" width="950" height="62" rx="31.0" fill="#183B5B" stroke="#183B5B" stroke-width="0" />
<text x="900.0" y="1231.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 m = 13.12 ft = 157.5 in = 4 × 10⁹ nm</text>
<polygon points="370,915 1430,915 1215,635 585,635" fill="#DFF0EA" stroke="#2A7F7F" stroke-width="4"/>
<text x="900" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#2A7F7F" text-anchor="middle">DIMENSION</text>
<text x="900" y="780" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#172033" text-anchor="middle">LENGTH  [L]</text>
<text x="900" y="845" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#526274" text-anchor="middle">The fundamental character of the quantity</text>
<polygon points="600,590 1200,590 1060,300 740,300" fill="#FFF1CF" stroke="#D39A22" stroke-width="4"/>
<text x="900" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#D39A22" text-anchor="middle">UNITS</text>
<text x="900" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#526274" text-anchor="middle">Agreed measurement references</text>
<circle cx="660" cy="515" r="52" fill="#FFFFFF" stroke="#D39A22" stroke-width="3"/>
<text x="660" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">m</text>
<circle cx="810" cy="515" r="52" fill="#FFFFFF" stroke="#D39A22" stroke-width="3"/>
<text x="810" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">ft</text>
<circle cx="960" cy="515" r="52" fill="#FFFFFF" stroke="#D39A22" stroke-width="3"/>
<text x="960" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">in</text>
<circle cx="1110" cy="515" r="52" fill="#FFFFFF" stroke="#D39A22" stroke-width="3"/>
<text x="1110" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033" text-anchor="middle">nm</text>
<line x1="900" y1="945" x2="900" y2="925" stroke="#526274" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="900" y1="620" x2="900" y2="600" stroke="#526274" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="130" y="1370" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#183B5B" text-anchor="start">ONE QUANTITY</text>
<text x="900" y="1370" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#2A7F7F" text-anchor="middle">ONE DIMENSION</text>
<text x="1670" y="1370" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#D39A22" text-anchor="end">MANY UNITS</text>
</svg>