  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Cyclones, fabric filters, and electrostatic precipitators collect particles by different forces</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1158  •  FIG-03-60-007</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Schematic mechanisms with gas entry/exit and collected-solids concepts. No universal micron cutoff or removal percentage is assigned. Cyclone performance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">depends on inertia/geometry; fabric filters on media/cake and pressure drop; ESP on charging, resistivity, fields, and flow. Collected dust requires safe</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">handling and system-specific design.</text>
  </g>
