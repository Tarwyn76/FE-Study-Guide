   <g id="text_1">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="179.519887" transform="rotate(-0 540 179.519887)">Characterize waste / compatibility</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(98.9475 378.361)">Physical</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(88.90375 398.709)">separation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(257.7765 378.361)">Chemical</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(251.229 398.709)">conversion</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(419.74925 378.361)">Biological</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(418.1705 398.709)">treatment</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(588.757 378.361)">Thermal</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(581.5745 398.709)">treatment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="785.106" y="388.535" transform="rotate(-0 785.106 388.535)">Stabilization</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(921.00875 378.361)">Secure</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(915.775 398.709)">disposal</text>
   </g>
   <g id="text_8">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="636.106625" transform="rotate(-0 540 636.106625)">Track treated streams, emissions, spent materials, and remaining hazards.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Hazardous-waste treatment follows waste properties and generates managed residuals</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1163  •  FIG-03-61-005</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Representative pathways, not a remedy prescription. Separation relocates mass; chemical/biological/thermal processes may transform constituents;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">stabilization reduces mobility without necessarily destroying hazard. Disposal is a managed endpoint rather than a treatment guarantee. Selection requires</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">characterization, treatability, residual handling, and applicable acceptance criteria.</text>
  </g>
 </g>
