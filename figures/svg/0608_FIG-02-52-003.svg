  </ns0:g>
  <ns0:g id="text_10" transform="translate(0.000000 -111.095070)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.404687 590.477562)"><ns0:tspan style="font-size: 10.000px">T</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">j</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px"> is the absolute boundary temperature where each heat transfer occurs. Entropy transfer by heat can be negative; entropy</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(159.514062 603.473187)">generation cannot. For a closed system remove mass-flow terms; for steady storage set the left side to zero.</ns0:text>
  </ns0:g>
