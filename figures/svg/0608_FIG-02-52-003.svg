  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.404687 590.477562)">T_j is the absolute boundary temperature where each heat transfer occurs. Entropy transfer by heat can be negative; entropy</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(159.514062 603.473187)">generation cannot. For a closed system remove mass-flow terms; for steady storage set the left side to zero.</text>
