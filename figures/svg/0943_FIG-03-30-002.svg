   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="719.3088" y="121.22275" transform="rotate(-0 719.3088 121.22275)">Crane swing exclusion</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="719.3088" y="379.282812" transform="rotate(-0 719.3088 379.282812)">Barrier + access control</text>
   </g>
   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="538.810687" transform="rotate(-0 504 538.810687)">Designated access route</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="216.9216" y="394.186812" transform="rotate(-0 216.9216 394.186812)">Excavation barrier</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="617.470875" transform="rotate(-0 504 617.470875)">Temporary erosion / sediment control at downslope boundary</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A construction-site plan separates access, excavation protection, and lifting hazard areas</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0943  •  FIG-03-30-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.525781 650.281875)">Conceptual site plan with hazard areas and a separate access route; not a dimensioned safety or erosion-control design. Excavation protection must suit</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.28125 662.999375)">soil, depth and loading under applicable provisions. Crane swing/crush zones require work-area control and communication. OSHA1926.652 and1926.1424</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(259.829687 675.716875)">provide context; the drawn buffers are not regulatory minimum distances or proof of compliance.</text>
  </g>
