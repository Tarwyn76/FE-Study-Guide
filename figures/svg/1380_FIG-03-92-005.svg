   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="222.410475" transform="rotate(-0 918.4725 222.410475)">Cold surface</text>
