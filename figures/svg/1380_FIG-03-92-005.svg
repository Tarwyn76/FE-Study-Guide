   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="415.044" y="484.169" transform="rotate(-0 415.044 484.169)">Convection 1/(hoA)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="789.912" y="484.169" transform="rotate(-0 789.912 484.169)">Radiation 1/(hrA)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="602.478" y="612.867737" transform="rotate(-0 602.478 612.867737)">Common surroundings T∞</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="691.030562" transform="rotate(-0 540 691.030562)">Cylinder: Rcond=ln(ro/ri)/(2πkL)  •  Plane wall: Rcond=L/(kA)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="115.846875" transform="rotate(-0 540 115.846875)">Parallel paths require the same terminal temperature reference.</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Thermal resistance depends on geometry; surface convection and radiation can act in parallel</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1380  •  FIG-03-92-005</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual thermal network. Convection and linearized radiation share a surface node; a parallel combination is valid only if their surroundings use the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">same reference temperature. If air and radiative surroundings differ, use separate sink nodes. Cylindrical geometry needs logarithmic conduction resistance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">and appropriate surface areas.</text>
  </g>
