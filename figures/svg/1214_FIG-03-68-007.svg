   <g id="text_1">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(148.439297 195.503037)">Process A</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.858984 224.753287)">40 units/h</text>
   </g>
   <g id="text_2">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(484.835938 195.503037)">Process B</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(482.278984 224.753287)">30 units/h</text>
   </g>
   <g id="text_3">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(821.115781 195.503037)">Process C</text>
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(818.698984 224.753287)">50 units/h</text>
   </g>
   <g id="text_4">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="380.088837" transform="rotate(-0 540 380.088837)">Sustained system capacity ≤ min(40,30,50)=30 units/h</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="465.318137" transform="rotate(-0 203.58 465.318137)">Identify constraint</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="465.318137" transform="rotate(-0 540 465.318137)">Exploit available time</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="465.318137" transform="rotate(-0 876.42 465.318137)">Subordinate upstream</text>
   </g>
   <g id="text_8">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="630.641825" transform="rotate(-0 540 630.641825)">Elevate the constraint → repeat analysis when the limiting resource changes</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A serial system cannot exceed the sustained capacity of its bottleneck</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1214  •  FIG-03-68-007</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned serial processes, one-for-one flow and no loss. The minimum is a capacity bound; downtime, variability, blocking, or starvation can reduce actual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">throughput. If process B rises to45 units/h, process A at40 becomes the capacity constraint. Local utilization increases at nonconstraints need not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">increase system throughput.</text>
  </g>
 </g>
