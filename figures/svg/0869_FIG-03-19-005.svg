  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.616406 650.281875)">Conceptual spillway/dam cross-section, elevations schematic and not to scale. Normal pool is below spillway crest; flood pool is above it. Reservoir head</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.932031 662.999375)">alone does not size a spillway or stilling basin; approach hydraulics, rating, tailwater, cavitation, debris, erosion and dam-safety design criteria</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(456.751562 675.716875)">require evaluation.</text>
  </g>
