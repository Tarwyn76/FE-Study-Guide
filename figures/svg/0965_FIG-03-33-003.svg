  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">The hybrid-π model linearizes a biased BJT around its operating point</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0965  •  FIG-03-33-003</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(231.657031 649.96)">Forward-active low-frequency hybrid-π model, v_π=v_b−v_e, controlled collector current g_m v_π flows C→E.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(98.753125 663.043125)">g_m=I_CQ/V_T,r_π=β/g_m,r_o≈V_A/I_CQ,β=100,V_A=100 V,T=300 K. Input/output capacitances omitted. Model is incremental and does not set DC bias by itself;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(354.329687 676.03875)">emitter reference is common, not necessarily earth ground.</text>
  </g>
