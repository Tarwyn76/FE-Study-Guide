  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1357  •  FIG-03-89-003</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Original functional hydraulic schematic, not a complete standardized valve-symbol drawing. Supply runs from pump to directional valve; working ports reach</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">opposite cylinder chambers; return and relief outlet go to tank. Flow-control box lies in the cap-port path. Valve position, ratings, filters, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">isolation details are not assigned.</text>
  </g>
