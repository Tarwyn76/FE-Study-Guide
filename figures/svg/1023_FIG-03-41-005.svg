  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">Three-dimensional binary cube shown as a2D projection; each edge changes exactly one bit. Hamming distance counts differing bits, not drawn Euclidean</text>
