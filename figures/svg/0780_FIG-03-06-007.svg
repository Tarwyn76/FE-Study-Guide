  </ns0:g>
  <ns0:g id="text_7">
</ns0:g>
  <ns0:g id="text_8" transform="translate(0.000000 -31.495004)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.1125 650.281875)">Tray vapor efficiency relative to the leaving-liquid equilibrium value, with nonzero denominator. Actual and equilibrium enrichment use the same entering</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.358594 662.999375)">vapor reference. Murphree efficiency is not automatically overall column efficiency or a stage-height ratio; liquid mixing, entrainment and flow patterns</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(457.607031 675.716875)">affect the relation.</ns0:text>
  </ns0:g>
