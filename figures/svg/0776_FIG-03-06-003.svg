  <ns0:g id="text_10">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(135.285156 656.640625)">Steady binary column, constant molar overflow, total condenser and partial reboiler. Saturated-liquid feed q=1. Reflux L=87.5 and rectifying vapor</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.880469 669.358125)">V=131.25 mol/s; stripping liquid L′=187.5 mol/s. Arrows show vapor to condenser and reboiler vapor back into the column. Heat duties are not assigned.</ns0:text>
