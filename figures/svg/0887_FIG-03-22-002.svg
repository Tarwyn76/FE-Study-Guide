  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Support restraint and member arrangement must both prevent structural mechanisms</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0887  •  FIG-03-22-002</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.909375 650.281875)">Ideal planar pin-jointed examples. Stable triangle has pin/roller supports; two horizontal-surface rollers leave horizontal rigid-body motion. Unbraced four-bar</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.480469 662.999375)">rectangle can shear internally despite externally adequate supports. Reaction/member counts are necessary bookkeeping but do not establish stability without geometry</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(481.032812 675.716875)">and connection checks.</text>
  </g>
