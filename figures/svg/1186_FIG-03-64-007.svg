  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1186  •  FIG-03-64-007</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Synthetic M/M/c cost comparison using the same pooled queue as1185. Waiting cost is per job-hour of queue residence, hence20 times Lq; it excludes service</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">time. The integer search is c=1–4. Service targets, overtime, reliability, equipment constraints, and uncertain demand can alter a real decision; the cost</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">minimum is not a universal staffing recommendation.</text>
  </g>
