   <g id="text_1">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(202.098359 436.758795)">P(A ∩ B) = 0</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(138.914141 459.67028)">If B occurs, A is impossible.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(598.224375 436.466608)">P(A ∩ B) = P(A)P(B)</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(619.171562 459.489655)">P(A | B) = P(A)</text>
   </g>
   <g id="text_3">
