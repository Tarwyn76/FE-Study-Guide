<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Right triangle and SOH CAH TOA</title>
<desc id="svg-desc">Right triangle labeled opposite, adjacent, and hypotenuse with sine cosine tangent ratios</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1700" height="1050" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">RIGHT-TRIANGLE TRIGONOMETRY</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Identify sides relative to θ before choosing a ratio.</text>
<polygon points="180,820 960,820 960,250" fill="#EAF2F8" fill-opacity="1" stroke="#183B5B" stroke-width="5" stroke-linejoin="round"/>
<rect x="900" y="760" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B5B" stroke-width="3" />
<path d="M 270 820 A 90 90 0 0 1 252 760" fill="none" stroke="#D39A22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="290" y="770" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#D39A22" text-anchor="start">θ</text>
<text x="570" y="865" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#183B5B" text-anchor="middle">b — ADJACENT</text>
<text x="1000" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#2F6F9F" text-anchor="start">a — OPPOSITE</text>
<text x="520" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#2A7F7F" text-anchor="middle">c — HYPOTENUSE</text>
<rect x="1080" y="250" width="520" height="170" rx="18" fill="#F6F9FB" stroke="#2F6F9F" stroke-width="3" />
<rect x="1080" y="250" width="520" height="62" rx="18" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="0" />
<text x="1105" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">SOH</text>
<text x="1105" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">sin θ = opposite / hypotenuse</text>
<rect x="1080" y="470" width="520" height="170" rx="18" fill="#F6F9FB" stroke="#2A7F7F" stroke-width="3" />
<rect x="1080" y="470" width="520" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="1105" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">CAH</text>
<text x="1105" y="575" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">cos θ = adjacent / hypotenuse</text>
<rect x="1080" y="690" width="520" height="170" rx="18" fill="#F6F9FB" stroke="#D39A22" stroke-width="3" />
<rect x="1080" y="690" width="520" height="62" rx="18" fill="#D39A22" stroke="#D39A22" stroke-width="0" />
<text x="1105" y="732" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">TOA</text>
<text x="1105" y="795" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">tan θ = opposite / adjacent</text>
</svg>