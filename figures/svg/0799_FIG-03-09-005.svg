    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="270.7488" y="597.598875" transform="rotate(-0 270.7488 597.598875)">Coarse underflow</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #235a78" x="369.432" y="174.767" transform="rotate(-0 369.432 174.767)">Fine overflow</text>
   </g>
   <g id="text_5">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="764.1648" y="121.774625" transform="rotate(-0 764.1648 121.774625)">SETTLING CLASSIFIER</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a23b34" x="916.6752" y="374.038875" transform="rotate(-0 916.6752 374.038875)">g</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235a78" x="755.1936" y="185.254875" transform="rotate(-0 755.1936 185.254875)">Fine overflow →</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="782.1072" y="582.694875" transform="rotate(-0 782.1072 582.694875)">Coarse discharge</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Hydrocyclone and settling classification separate particles by different settling behavior</text>
  </g>
  <g id="text_10">
</g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(137.840625 650.281875)">Hydrocyclone uses a centrifugal flow field: coarse/high-settling-velocity particles trend to the wall and underflow; fine particles trend toward inner</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.029687 662.999375)">overflow. Settling classifier uses gravity and liquid motion. Trajectories are qualitative, not CFD or a guaranteed sharp cut; density, size, shape, flow</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(423.944531 675.716875)">and bypass affect classification.</text>
  </g>
 </g>
