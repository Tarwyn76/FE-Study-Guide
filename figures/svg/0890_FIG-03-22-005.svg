   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0890  •  FIG-03-22-005</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.2875 650.281875)">Regular floor grid6 m by4 m, ideal one-way slab between horizontal beams. Tributary strips take half adjacent spans; highlighted interior-column area24 m²</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.703906 662.999375)">covers half bays in both directions. Load5 kN/m² excludes separately unassigned member self-weight. Actual continuous-frame reactions can differ from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(436.65 675.716875)">simple tributary allocation.</text>
  </g>
