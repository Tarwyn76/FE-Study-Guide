  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A reservoir stores the imbalance between inflows, withdrawals, and surface exchange</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0850  •  FIG-03-16-007</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.658594 650.281875)">Illustrative one-day reservoir balance with constant surface area, no seepage, bank-storage or other withdrawals. Surface precipitation/evaporation depths</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.433594 662.999375)">are multiplied by water-surface area, not watershed area. Positive storage change implies pool rise; equivalent level change is0.007 m for the chosen</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(491.263281 675.716875)">area.</text>
  </g>
