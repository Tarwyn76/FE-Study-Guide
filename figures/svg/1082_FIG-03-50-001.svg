   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="463.689487" transform="rotate(-0 876.42 463.689487)">Receptor</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="624.62515" transform="rotate(-0 540 624.62515)">Example:spill →soil leaching →groundwater →well →ingestion →resident</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Exposure requires a complete pathway connecting a source to a receptor</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1082  •  FIG-03-50-001</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Conceptual potential pathway rather than a finding of actual exposure. Presence of contamination alone does not quantify dose; contact, concentration,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">intake and timing matter. A missing link may make a pathway incomplete. Other routes include inhalation and dermal contact, with different dose models.</text>
  </g>
