  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="432" y="605.88" transform="rotate(-0 432 605.88)">Schematic carbon-12 nucleus: Z = 6, N = 6, A = 12. Cloud drawing is conceptual, not a classical electron orbit.</text>
  </g>
