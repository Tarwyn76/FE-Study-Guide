  <g id="text_17">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="38.88" y="32.4" transform="rotate(-0 38.88 32.4)">Atomic identity is determined by protons, not ionic charge</text>
  </g>
  <g id="text_18">
