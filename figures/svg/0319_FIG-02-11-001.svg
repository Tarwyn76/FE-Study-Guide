   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(171.781688 454.203244)">Nucleus: protons (+), neutrons (n)</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(138.687938 470.376056)">Cloud: schematic electron probability density</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="675.7344" y="148.593925" transform="rotate(-0 675.7344 148.593925)">Atomic number Z = proton count</text>
   </g>
   <g id="text_15">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(584.832056 277.855055)">Mass number A = Z + N</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(606.210572 298.07107)">N = neutron count</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(556.860181 430.225184)">Ionic charge = Z − electron count</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(577.606431 449.093466)">Neutral atom: electrons = Z</text>
   </g>
