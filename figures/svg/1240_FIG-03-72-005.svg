   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="376.596" y="646.48435" transform="rotate(-0 376.596 646.48435)">Avoid counting the same in-transit unit twice.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Multiechelon distribution places inventories between successive replenishment stages</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1240  •  FIG-03-72-005</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual two-warehouse-echelon network after the plant. Local installation inventory and echelon inventory have different boundaries: echelon stock</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">includes specified downstream stock and transit. Allocation, replenishment, transit times, and shortages interact across levels; independent local safety-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">stock optimization need not be a system optimum.</text>
  </g>
