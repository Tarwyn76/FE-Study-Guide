  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Original mixed fluid/energy/electrical prompt with assigned water density and gravitational acceleration. Overall efficiency already includes the stated</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">conversion losses, so applying another motor efficiency would double-count them. Handbook destination is a conceptual section name, not an asserted page</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">number.</text>
  </g>
