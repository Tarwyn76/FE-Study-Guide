      <tspan x="35.617188" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">b</tspan>
      <tspan x="111.882812" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">a</tspan>
      <tspan x="187.65625" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">b</tspan>
