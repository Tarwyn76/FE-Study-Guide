   <ns0:g id="text_7">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="583.230656" transform="rotate(-0 504 583.230656)"><ns0:tspan font-size="21.000px">V</ns0:tspan><ns0:tspan font-size="14.280px" dy="5.040px">ab</ns0:tspan><ns0:tspan font-size="21.000px" dy="-5.040px">=12 V; q=2 C → field work on a→b motion: W=qV</ns0:tspan><ns0:tspan font-size="14.280px" dy="5.040px">ab</ns0:tspan><ns0:tspan font-size="21.000px" dy="-5.040px">=24 J</ns0:tspan></ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_8">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="126.971" transform="rotate(-0 55.44 126.971)">Voltage is a signed potential difference between two nodes</ns0:text>
  </ns0:g>
  <ns0:g id="text_10">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.078906 656.501562)"><ns0:tspan font-size="10.000px">Potential difference equals external reversible work per unit positive charge moving b→a. The electric field does +q(V</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">a</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">−V</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">b</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">) work on a→b motion; the</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(294.973437 669.497187)">external quasi-static work has the opposite sign. One volt is one joule per coulomb.</ns0:text>
  </ns0:g>
 </ns0:g>
