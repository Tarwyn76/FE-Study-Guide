    <!-- $V_{ab}=V_a-V_b$ -->
    <g style="fill: #23313d" transform="translate(402.56 169.246)">
     <text>
      <tspan x="0" y="-0.671875" style="font-style: oblique; font-size: 32px; font-family: 'DejaVu Sans'; fill: #23313d">V</tspan>
