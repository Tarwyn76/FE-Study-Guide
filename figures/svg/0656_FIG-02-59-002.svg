      <ns0:tspan x="21.890625" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">a</ns0:tspan>
      <ns0:tspan x="35.617188" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">b</ns0:tspan>
      <ns0:tspan x="111.882812" y="4.578125" style="font-style: oblique; font-size: 22.4px; font-family: 'DejaVu Sans'; fill: #23313d">a</ns0:tspan>
