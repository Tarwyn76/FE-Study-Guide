    </g>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="583.230656" transform="rotate(-0 504 583.230656)">V_ab=12 V; q=2 C → field work on a→b motion: W=qV_ab=24 J</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Voltage is a signed potential difference between two nodes</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0656  •  FIG-02-59-002</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.078906 656.501562)">Potential difference equals external reversible work per unit positive charge moving b→a. The electric field does +q(V_a−V_b) work on a→b motion; the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(294.973437 669.497187)">external quasi-static work has the opposite sign. One volt is one joule per coulomb.</text>
  </g>
