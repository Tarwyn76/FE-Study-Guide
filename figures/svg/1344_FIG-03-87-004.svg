  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Same joint model as1343. Force magnitudes are plotted; compressive member force would be negative in a signed plot. Bolt curve becomes Fb=P after</text>
