  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Compacted asphalt contains an aggregate skeleton, binder films, and air voids</text>
  </g>
  <g id="text_5">
</g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(105.575781 650.142812)">Schematic cross-section, not a measured image or calibrated binder thickness. G_mb is bulk specific gravity of compacted mix; G_mm is theoretical maximum</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.623437 663.138438)">specific gravity without air voids. Their ratio estimates compacted air-void volume percentage. Binder content, aggregate absorption and compaction affect</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(448.63125 675.855937)">volumetric properties.</text>
  </g>
