   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b47722" x="629.5968" y="259.498938" transform="rotate(-0 629.5968 259.498938)">Reference surface A</text>
   </g>
   <g id="text_9">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="429.514687" transform="rotate(-0 504 429.514687)">I=dq/dt; J=I/A for uniform normal flow</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Conventional current follows positive charge; electrons drift oppositely</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0655  •  FIG-02-59-001</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(153.026562 656.640625)">Current is signed positive charge crossing the oriented reference surface per time. Electrons carry negative charge, so their drift is opposite</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(230.686719 669.358125)">conventional current in a metal. Uniform I=2 A transports 2 C of net positive-equivalent charge each second.</text>
  </g>
