  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1347  •  FIG-03-87-007</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned elastic in-plane fastener-group method: four equal fasteners at(±50,±40) mm. Arrows show total fastener reactions on the loaded plate; centroid</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">dot is not a fifth bolt. Moment-induced components are tangential. Equal stiffness, rigid plate, and no slip are assumed; capacity checks are separate.</text>
  </g>
