  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Slope analysis resolves slice forces along a trial slip surface and groundwater field</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0934  •  FIG-03-28-007</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(107.224219 650.281875)">Conceptual method-of-slices sketch. Slice weight W, total base normal force N=N′+U, and shear resistance depend on geometry and pore pressure. Inter-slice</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(125.569531 662.999375)">forces are omitted from this force locator and must be treated according to the selected equilibrium method. Stabilization options require analysis; the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(296.303125 675.716875)">trial surface is not a solved critical surface and no slope safety factor is calculated.</text>
  </g>
