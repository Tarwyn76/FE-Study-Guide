  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.672656 722.664625)">Conceptual comparison, not a universal design chart. Equilibrium limits and transport rates are distinct. Membranes encompass pressure-driven, solution-diffusion and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.266406 735.382125)">other mechanisms; the relevant driving force depends on the membrane/process. Reaction, nonideality, energy use and selectivity can alter method choice.</text>
  </g>
