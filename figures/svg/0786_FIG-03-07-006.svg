  <ns0:g id="text_25">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="130.301" transform="rotate(-0 59.4 130.301)">Separation methods use different phase contacts and equilibrium properties</ns0:text>
  </ns0:g>
  <ns0:g id="text_26">
</ns0:g>
  <ns0:g id="text_27">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.672656 722.664625)">Conceptual comparison, not a universal design chart. Equilibrium limits and transport rates are distinct. Membranes encompass pressure-driven, solution-diffusion and</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(147.266406 735.382125)">other mechanisms; the relevant driving force depends on the membrane/process. Reaction, nonideality, energy use and selectivity can alter method choice.</ns0:text>
  </ns0:g>
