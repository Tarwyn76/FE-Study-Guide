   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="722.628" y="476.523675" transform="rotate(-0 722.628 476.523675)">Automatic feedback</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="463.104" y="591.83635" transform="rotate(-0 463.104 591.83635)">Alarm / exception → informed human intervention</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Human-machine allocation preserves feedback and an explicit exception path</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1218  •  FIG-03-69-004</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual task allocation. Repeatability, workload, skill, response time, foreseeable failures, and recovery behavior guide allocation. A sensed feedback</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">loop is distinct from the operator’s exception path. Safety-critical functions require separate validated design; this block diagram assigns no protective</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">integrity or safe-state guarantee.</text>
  </g>
 </g>
