  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Teaching SYN-probe outcomes for an authorized lab; no scan was performed. Filtered is an inference about reachability under the probe conditions. Loss,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">rate limiting and intervening devices can alter observations. Only in-scope systems, permitted rates and agreed test windows belong in an actual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">assessment.</text>
  </g>
