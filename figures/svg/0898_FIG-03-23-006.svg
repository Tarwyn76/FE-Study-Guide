  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.539062 650.00375)">Same triangle as888, small-deformation linear elasticity, axial-only member strain. Real N_AB=N_BC=−8.333 kN,N_AC=+6.667 kN. Normalized virtual coefficients</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.245312 662.999375)">n_AB=n_BC=−5/6,n_AC=+2/3 per unit downward force. Inclined lengths5 m,bottom8 m. Use consistent force/length units; positive δ is in the downward virtual-load</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(516.501562 675.995)">direction.</text>
  </g>
