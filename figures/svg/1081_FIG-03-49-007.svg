     <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="131.42" y="201.030156" transform="rotate(-0 131.42 201.030156)">θ=1.09</text>
    </g>
   </g>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">An empirical temperature factor adjusts a reaction rate around20°C</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1081  •  FIG-03-49-007</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Illustrative empirical theta law, constant theta per curve. Temperature is in°C with differences relative to20°C. This relation is not the Arrhenius</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">equation and should not be extrapolated beyond a validated range. Species, microbial physiology and environmental conditions affect actual rates.</text>
  </g>
