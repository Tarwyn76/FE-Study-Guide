   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.717969 650.142812)">Horizontal layers, hydrostatic groundwater, no surcharge or seepage. Unsaturated suction is neglected above the water table, so u=0 there. Below WT,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.647656 662.860312)">effective-stress gradient is γ_sat−γ_w. Depth axis increases downward. Geometric layer sketch is schematic; stress curves follow the actual2 m water-table</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(487.857031 675.855937)">depth.</text>
  </g>
 </g>
