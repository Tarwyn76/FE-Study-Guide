   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative geometric population growth2%/year, not a demographic forecast. Planning rates are hypothetical daily averages, not design peaks or local</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">demand standards. Industrial use, infiltration/inflow, seasonal peaks, efficiency changes and uncertainty are omitted; avoid converting all average demands</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">directly into capacity.</text>
  </g>
