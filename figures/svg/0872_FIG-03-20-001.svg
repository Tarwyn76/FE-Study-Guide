   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(97.667187 650.142812)">Steady one-dimensional saturated Darcy flow in a homogeneous specimen, with head measured relative to a common datum. Q points from high to low hydraulic</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.423437 662.860312)"><ns0:tspan font-size="10.000px">head. Darcy flux q</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">D</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px"> is not pore-water speed; for effective porosity0.25, seepage velocity is q</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">D</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">/n</ns0:tspan><ns0:tspan font-size="6.800px" dy="2.400px">e</ns0:tspan><ns0:tspan font-size="10.000px" dy="-2.400px">=4×10⁻⁵ m/s. Linear laminar/Darcy assumptions must</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(491.619531 675.855937)">hold.</ns0:text>
