  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(97.667187 650.142812)">Steady one-dimensional saturated Darcy flow in a homogeneous specimen, with head measured relative to a common datum. Q points from high to low hydraulic</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.423437 662.860312)">head. Darcy flux q_D is not pore-water speed; for effective porosity0.25, seepage velocity is q_D/n_e=4×10⁻⁵ m/s. Linear laminar/Darcy assumptions must</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(491.619531 675.855937)">hold.</text>
