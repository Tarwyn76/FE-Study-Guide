   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative steady mass balance:1,000 kg dry solids/day enters and leaves in underflow. Neglecting overflow solids gives underflow25 m³/day and overflow75</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">m³/day. Concentrations are kg dry solids per m³, not mass percent without a density assumption. Real overflow carries some solids; capture and solids</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">loading affect design.</text>
