   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(193.057031 496.426975)">Yield=0.40 kg biomass-COD</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(198.342187 524.405475)">per kg substrate-COD used</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A substrate-equivalent balance distinguishes biomass production from oxidation and residual</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1139  •  FIG-03-58-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative common-COD-equivalent balance:100=10+36+54 kg COD/day. Biomass is expressed as its COD equivalent, not kilograms of dry cells; oxidized COD</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">represents oxygen-demand equivalent consumed, not kilograms of CO2. Endogenous decay and separate nutrient-element balances are omitted. Yield bases must</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">be stated before combining streams.</text>
  </g>
