   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(867.415219 394.035525)">Biomass</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(837.270844 416.927025)">36 kg COD/day</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(866.155219 574.373925)">Oxidized</text>
