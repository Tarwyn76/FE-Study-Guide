   </g>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Control flow combines sequence, decisions, iteration, and calls</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1065  •  FIG-03-47-005</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Left panel computes an absolute value for each item; the iteration condition is summarized as repeat for the next available item. Right function is defined</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">for nonnegative integers, with a terminating base case. Recursion stores active calls and is distinct from a constant-storage loop.</text>
  </g>
