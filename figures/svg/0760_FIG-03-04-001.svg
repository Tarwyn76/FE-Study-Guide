   <ns0:g id="text_2">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="220.858687" transform="rotate(-0 504 220.858687)">C: independent components • P: phases • F: independent intensive freedoms</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="320.21925" transform="rotate(-0 302.148 320.21925)">Conceptual case</ns0:text>
   </ns0:g>
