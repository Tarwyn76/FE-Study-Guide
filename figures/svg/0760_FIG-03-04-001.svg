   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="220.858687" transform="rotate(-0 504 220.858687)">C: independent components • P: phases • F: independent intensive freedoms</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="320.21925" transform="rotate(-0 302.148 320.21925)">Conceptual case</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="320.21925" transform="rotate(-0 616.14 320.21925)">C</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="320.21925" transform="rotate(-0 750.708 320.21925)">P</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="320.21925" transform="rotate(-0 885.276 320.21925)">F</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="384.80325" transform="rotate(-0 302.148 384.80325)">One component / one phase</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="384.80325" transform="rotate(-0 616.14 384.80325)">1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="384.80325" transform="rotate(-0 750.708 384.80325)">1</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="384.80325" transform="rotate(-0 885.276 384.80325)">2</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="449.38725" transform="rotate(-0 302.148 449.38725)">One component / two phases</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="449.38725" transform="rotate(-0 616.14 449.38725)">1</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="449.38725" transform="rotate(-0 750.708 449.38725)">2</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="449.38725" transform="rotate(-0 885.276 449.38725)">1</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="513.97125" transform="rotate(-0 302.148 513.97125)">Binary mixture / two phases</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="513.97125" transform="rotate(-0 616.14 513.97125)">2</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="513.97125" transform="rotate(-0 750.708 513.97125)">2</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="513.97125" transform="rotate(-0 885.276 513.97125)">2</text>
   </g>
   <g id="text_19">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="589.594437" transform="rotate(-0 504 589.594437)">At fixed C, adding one phase reduces F by one.</text>
   </g>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Gibbs phase rule counts independent intensive freedoms at nonreacting equilibrium</text>
  </g>
  <g id="text_21">
</g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.495312 650.281875)">Nonreacting equilibrium system with unrestricted temperature and pressure. Fixing T or P externally removes one available intensive freedom. Components</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.560937 662.999375)">are independent composition constituents, not automatically the count of all molecular species in a reacting system. No specific substance or phase</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(455.985156 675.716875)">diagram is implied.</text>
  </g>
 </g>
