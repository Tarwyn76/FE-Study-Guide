   <ns0:g id="text_15">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="513.97125" transform="rotate(-0 302.148 513.97125)">Binary mixture / two phases</ns0:text>
   </ns0:g>
   <ns0:g id="text_16">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="513.97125" transform="rotate(-0 616.14 513.97125)">2</ns0:text>
   </ns0:g>
   <ns0:g id="text_17">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="513.97125" transform="rotate(-0 750.708 513.97125)">2</ns0:text>
   </ns0:g>
   <ns0:g id="text_18">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="513.97125" transform="rotate(-0 885.276 513.97125)">2</ns0:text>
   </ns0:g>
   <ns0:g id="text_19">
    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="589.594437" transform="rotate(-0 504 589.594437)">At fixed C, adding one phase reduces F by one.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_20">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="87.697" transform="rotate(-0 55.44 87.697)">Gibbs phase rule counts independent intensive freedoms at nonreacting equilibrium</ns0:text>
  </ns0:g>
  <ns0:g id="text_21">
</ns0:g>
  <ns0:g id="text_22" transform="translate(0.000000 -40.485097)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.495312 650.281875)">Nonreacting equilibrium system with unrestricted temperature and pressure. Fixing T or P externally removes one available intensive freedom. Components</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.560937 662.999375)">are independent composition constituents, not automatically the count of all molecular species in a reacting system. No specific substance or phase</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(455.985156 675.716875)">diagram is implied.</ns0:text>
  </ns0:g>
 </ns0:g>
