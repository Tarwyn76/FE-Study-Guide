   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="384.80325" transform="rotate(-0 616.14 384.80325)">1</ns0:text>
   </ns0:g>
   <ns0:g id="text_9">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="384.80325" transform="rotate(-0 750.708 384.80325)">1</ns0:text>
   </ns0:g>
   <ns0:g id="text_10">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="384.80325" transform="rotate(-0 885.276 384.80325)">2</ns0:text>
   </ns0:g>
   <ns0:g id="text_11">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="302.148" y="449.38725" transform="rotate(-0 302.148 449.38725)">One component / two phases</ns0:text>
   </ns0:g>
   <ns0:g id="text_12">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="616.14" y="449.38725" transform="rotate(-0 616.14 449.38725)">1</ns0:text>
   </ns0:g>
   <ns0:g id="text_13">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="750.708" y="449.38725" transform="rotate(-0 750.708 449.38725)">2</ns0:text>
   </ns0:g>
   <ns0:g id="text_14">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="885.276" y="449.38725" transform="rotate(-0 885.276 449.38725)">1</ns0:text>
