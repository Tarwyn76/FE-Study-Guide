  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0782  •  FIG-03-07-002</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.678906 656.501562)">Solute-free flows L_s=10 and G_s=20 mol/s; equilibrium Y*=X and ideal constant carrier flows. Solute stripped is10(0.10−0.02)=20(0.04−0)=0.8 mol/s. The</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(268.297656 669.497187)">operating line is below equilibrium so transfer is liquid→gas. Ratios X,Y are not mole fractions.</text>
  </g>
