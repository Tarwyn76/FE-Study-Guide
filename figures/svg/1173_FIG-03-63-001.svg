    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(156.492375 230.6643)">Decision variables</text>
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(179.0205 261.1863)">x,y≥0 batches</text>
   </g>
   <g id="text_2">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(702.169875 230.6643)">Maximize profit</text>
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(736.91175 261.1863)">Z=3x+2y</text>
   </g>
   <g id="text_3">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(384.065 434.874425)">Shared resource:x+y≤4</text>
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(389.766719 467.939925)">Product caps:x≤2; y≤3</text>
   </g>
   <g id="text_4">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="621.091912" transform="rotate(-0 540 621.091912)">Optimal x=2,y=2 →Z=10 profit units</text>
   </g>
  </g>
  <g id="text_5" transform="translate(0 99.0000)">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">An optimization model states controllable quantities, an objective, and feasible operating limits</text>
  </g>
  <g id="text_7" transform="translate(0 -68.0000)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Continuous LP with assigned normalized batch resource consumption and profit coefficients, not a production plan. Variables are nonnegative real</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">quantities; integer batches would require a separate integrality condition. Coefficients, capacities, demand bounds, and objective units must match the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">intended decision. Same model is used in1174–1177 and1179.</text>
  </g>
