   <g id="text_4">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="150.2913" transform="rotate(-0 540 150.2913)">Surface overflow rate=Q/As</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="847.584" y="607.954813" transform="rotate(-0 847.584 607.954813)">Sludge withdrawal</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A clarifier separates settleable solids while clarified water crosses the effluent weir</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1127  •  FIG-03-56-004</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Rectangular clarifier section, not to scale. Surface overflow rate uses plan area rather than water depth or effluent-weir length. Ideal discrete settling</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">theory compares particle settling velocity with Q/As; flocculent/hindered settling and solids loading need additional evaluation. Inlet energy, short-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">circuiting, and weir hydraulics are omitted.</text>
  </g>
 </g>
