  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Maximum AC load power requires a complex-conjugate impedance match</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0682  •  FIG-02-62-007</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.169531 656.531875)">Linear Thévenin network, sinusoidal steady state and R_th&gt;0, with freely adjustable complex load. P_max=|V_th,rms|²/(4R_th). For a load constrained to be</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(259.945312 669.58875)">purely resistive, the optimal R_L is |Z_th| instead; conjugate matching is not maximum efficiency.</text>
  </g>
