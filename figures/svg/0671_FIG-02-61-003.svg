  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An inductor relates current to flux linkage and stores magnetic energy</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0671  •  FIG-02-61-003</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(179.891406 656.640625)">Ideal linear inductor, fixed L, passive current reference. Flux linkage λ is in weber-turns, L in henrys. For a magnetic material with</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(279.735156 669.358125)">saturation/hysteresis, constant L and the simple quadratic energy relation may not apply.</text>
  </g>
