  <g id="text_18">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A pseudo-random generator is deterministic once its algorithm and seed are fixed</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1190  •  FIG-03-65-004</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Toy linear congruential generator with a complete16-state cycle. Uniform marginal coverage does not establish independence or adequate statistical quality.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">Modern simulation uses suitable generators with recorded seeds/versions; ordinary reproducible PRNGs are not cryptographic randomness. Connecting points</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">indicates generation order, not a continuous distribution.</text>
  </g>
