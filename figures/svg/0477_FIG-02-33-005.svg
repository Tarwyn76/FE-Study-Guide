   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(608.171737 151.059656)">m₁=2 kg; m₂=3 kg</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(616.142362 175.318875)">a₁ = +a; a₂ = −a</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(557.328769 199.578094)">(upward axis on both masses)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(609.808925 315.605547)">T − m₁g = m₁a</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(609.808925 345.255703)">m₂g − T = m₂a</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(563.179237 484.596469)">a = (m₂−m₁)g/(m₁+m₂)</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(620.659394 514.246625)">= 1.962 m/s²</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(619.777675 543.896781)">T = 23.544 N</text>
