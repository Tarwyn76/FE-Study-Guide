  <g id="text_18">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Traversal order follows the chosen search rule and neighbor ordering</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1066  •  FIG-03-47-006</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">BFS uses a FIFO frontier; DFS uses recursion or a stack and marks visited vertices. The graph has a cycle, so visited-state handling matters. Tree</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">traversals are respectively left-root-right, root-left-right, and left-right-root. Different neighbor order can change graph visitation order.</text>
  </g>
