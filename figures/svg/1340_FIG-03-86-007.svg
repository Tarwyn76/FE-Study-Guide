  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1340  •  FIG-03-86-007</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">Original schematic damage montage, not photographs or a diagnostic standard. Spalls, dents, discoloration, edge loading, and mounting marks can have</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">overlapping causes. Confirm mechanisms with inspection and operating history rather than treating one visual pattern as proof.</text>
  </g>
