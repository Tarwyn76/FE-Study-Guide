  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.955469 716.305875)">AACE18R-97 process-industry guidance,2020 sample. Definition bands are indicative; maturity of specific deliverables determines class. Accuracy bands describe</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(142.438281 729.023375)">typical80% intervals after suitable contingency, not guaranteed limits. Preparation effort is qualitative here; project-specific risk analysis determines expected</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(452.470312 741.740875)">accuracy. See README source link.</text>
  </g>
