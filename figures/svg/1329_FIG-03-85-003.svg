  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned thin spherical shell under uniform internal gauge pressure, remote from openings. The drawing is a hemisphere side view, with pressure resultant</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">acting over projected circular area. Equal biaxial stress is a property of spherical symmetry, not a cylindrical-shell hoop result.</text>
