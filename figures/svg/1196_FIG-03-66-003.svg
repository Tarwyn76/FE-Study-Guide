  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Activity-on-node deterministic network: D waits for both B and C; F waits for D and E. Earliest-start calculations take the latest predecessor finish;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">backward pass uses earliest successor late start. Total float: A0,B0,C2,D0,E5,F0 days. No resource leveling, calendars, lags, or uncertainty is included;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">red nodes/arcs identify the critical route.</text>
  </g>
