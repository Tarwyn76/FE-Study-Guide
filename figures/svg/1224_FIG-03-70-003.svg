  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Separate assigned examples: daily demand determines takt; kanban calculation uses30 units/h, replenishment lead time2 h,10 units/container, and10%</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">allowance on expected lead-time demand. Takt is not actual cycle time. Seven containers authorize70 units in the illustrated loop; card count depends on</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">replenishment reliability and the defined boundary.</text>
  </g>
