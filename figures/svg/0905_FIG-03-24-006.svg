   <g id="text_5">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="136.89675" transform="rotate(-0 504 136.89675)">Residual ΣM_J=+20 kN·m → balance −20 kN·m</text>
   </g>
   <g id="text_6">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="569.4465" transform="rotate(-0 504 569.4465)">Distributed corrections: JA −8, JB −4, JC −8 kN·m</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A moment-distribution joint balances residual moment in proportion to member stiffness</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0905  •  FIG-03-24-006</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.3875 650.281875)">All far ends fixed during distribution; equal EI and lengths4,8,4 m give stiffness ratios1:0.5:1 and distribution factors0.4,0.2,0.4. End moments at J use</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.321875 662.999375)">one common rotational sign. Sum of corrections cancels residual. For prismatic members with far ends fixed, carry-over factor is1/2; pinned far ends</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(410.435156 675.716875)">instead alter stiffness and carry-over.</text>
  </g>
