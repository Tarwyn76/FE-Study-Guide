  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Transition labels are input/output; output1 is asserted when the final1 of101 arrives. After detection the machine retains suffix1, permitting overlap.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Reset enters S0. The state table and example trace use the same transition rules; implementation registers/gates are not specified.</text>
  </g>
