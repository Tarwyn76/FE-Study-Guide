  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1031  •  FIG-03-42-006</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">Decoder/encoder bit strings are ordered D3 D2 D1 D0. The encoder requires exactly one asserted input; invalid or multiple inputs need a valid signal or a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">priority encoder. Full-adder input000 gives(S,Cout)=(0,0),011 gives(0,1),111 gives(1,1). No storage is present.</text>
  </g>
