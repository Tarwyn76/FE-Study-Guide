   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.928438 189.105525)">Loads / geometry</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.260938 211.997025)">Strength, stiffness</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(482.537812 189.105525)">Environment</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.872813 211.997025)">Temperature, corrosion</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(789.949687 189.105525)">Life / failure modes</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(771.290156 211.997025)">Fatigue, creep, fracture</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(92.07 435.021525)">Manufacturing feasibility</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.244063 457.913025)">Process, tolerance</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(442.892812 435.021525)">Compare alternatives</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(440.585156 457.913025)">Lifecycle cost / supply</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(783.217969 435.021525)">Verify chosen design</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(764.031094 457.913025)">Test and trace properties</text>
   </g>
   <g id="text_7">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="619.436287" transform="rotate(-0 540 619.436287)">Candidate property data → constraints → tradeoffs → verified material / process pair</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Mechanical material selection screens hard constraints before comparing life and cost</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1291  •  FIG-03-79-007</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual selection workflow rather than a particular material recommendation. Strength and stiffness differ; thermal and chemical environment can change</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">durability. Cost comparisons include manufacturing, inspection, maintenance, and end of life over one common boundary. Verification includes property</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">provenance, geometry, failure modes, manufacturing effects, and appropriate uncertainty or safety factors.</text>
  </g>
 </g>
