  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1125  •  FIG-03-56-002</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Steady-state example for the same measured constituent at both boundaries, equal water flows and negligible accumulation. Removal means disappearance from</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">the measured water stream through separation or reaction, not destruction of all mass. Sludge, emissions, reaction products, and changing storage require</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">their own balance terms.</text>
  </g>
