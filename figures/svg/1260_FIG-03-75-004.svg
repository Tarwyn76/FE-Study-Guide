  <g id="text_27">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">FMEA identifies effects and actions; an RPN is only one prioritization aid</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1260  •  FIG-03-75-004</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned illustrative1–10 rating convention. RPN values96,90,60 are products of ordinal scores, not calibrated failure probabilities or expected monetary</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">losses. Equal RPNs can conceal different severity and detection. Actions need an owner and verified effect; no rating reduction or risk acceptance is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">claimed before evidence.</text>
  </g>
