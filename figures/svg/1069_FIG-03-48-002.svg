  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">A constituent control volume balances transported mass, reaction, and accumulation</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1069  •  FIG-03-48-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Well-mixed control volume, first-order loss kC, and mass-only source W. Accumulation is d(VC)/dt; it becomes V dC/dt only when V is constant. If</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">inlet/outlet water flows differ, the associated water-volume balance must also be satisfied. Consistent concentration/flow units are required.</text>
  </g>
