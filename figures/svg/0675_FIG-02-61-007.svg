  <g id="text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">RL rise and decay share the time constant τ=L/R</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0675  •  FIG-02-61-007</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.819531 656.640625)">First-order ideal RL circuit. Decay requires a maintained closed R–L path after the source is removed, such as an SPDT return path. Opening an energized</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(220.115625 669.358125)">ideal inductor without a discharge path does not produce this benign exponential. Inductor current is continuous.</text>
  </g>
 </g>
