  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1342  •  FIG-03-87-002</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Same assigned screw as1341. Unwrapped triangle is vertically exaggerated; printed dimensions define the true lead angle. Thread-only lowering torque</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">Fdm/2×(μ−tanλ)/(1+μtanλ) is positive here; collar increases resisting torque. Self-locking is a static friction model, not a guaranteed anti-backdrive</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">safety device.</text>
  </g>
