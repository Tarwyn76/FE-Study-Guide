  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.321094 656.640625)">Steady common-area series wall, no generation or contact resistance. The films are conceptual resistance drops, not linear temperature distributions in</text>
