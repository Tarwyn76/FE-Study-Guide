   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="103.078" transform="rotate(-0 55.44 103.078)">A composite wall divides the temperature drop according to resistance</ns0:text>
  </ns0:g>
  <ns0:g id="text_30">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.321094 656.640625)">Steady common-area series wall, no generation or contact resistance. The films are conceptual resistance drops, not linear temperature distributions in</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(266.114062 669.358125)">the actual fluids. Layer A/B have constant k. Interface temperatures follow the same heat rate.</ns0:text>
  </ns0:g>
 </ns0:g>
