   <g id="text_2">
    <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="167.58" y="307.24625" transform="rotate(-0 167.58 307.24625)">A</text>
   </g>
   <g id="text_3">
    <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="436.716" y="192.98225" transform="rotate(-0 436.716 192.98225)">D</text>
   </g>
   <g id="text_4">
    <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="436.716" y="431.44625" transform="rotate(-0 436.716 431.44625)">U</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.952813 520.223117)">Instantaneous selectivity=r_D/r_U</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(171.0875 546.358508)">D desired; U undesired</text>
   </g>
   <g id="text_6">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="755.1936" y="132.538437" transform="rotate(-0 755.1936 132.538437)">SERIES</text>
   </g>
   <g id="text_7">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="629.5968" y="292.066312" transform="rotate(-0 629.5968 292.066312)">A</text>
   </g>
   <g id="text_8">
    <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="791.0784" y="292.066312" transform="rotate(-0 791.0784 292.066312)">D</text>
   </g>
   <g id="text_9">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="925.6464" y="291.514437" transform="rotate(-0 925.6464 291.514437)">U</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(734.51725 460.473406)">A→D→U</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(596.776625 487.428094)">Residence time controls D survival.</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Parallel reactions compete for reactant; series reactions can consume the desired intermediate</text>
  </g>
  <g id="text_12">
</g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(128.15625 650.281875)">Conceptual one-to-one reaction networks. Yield tracks desired product relative to feed or stoichiometric maximum; define its denominator. Selectivity</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.159375 662.999375)">compares desired and undesired production on a stated molar basis. For a series reaction, D may rise then fall with time; maximum conversion of A need not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(459.151563 675.716875)">maximize D yield.</text>
  </g>
 </g>
