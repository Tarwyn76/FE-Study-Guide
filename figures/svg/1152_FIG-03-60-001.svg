  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Ideal-gas volume fraction equals mole fraction for this conversion. Molecular weight is g/mol, pressure Pa, R=8.314462618 Pa·m³/(mol·K), and absolute</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">temperature K. The ppm/ppb basis, temperature, pressure, and wet/dry basis must match. This is not a concentration limit or exposure assessment.</text>
