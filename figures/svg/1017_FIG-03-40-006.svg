   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="195.190875" transform="rotate(-0 666.1575 195.190875)">Sampler</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="195.190875" transform="rotate(-0 918.4725 195.190875)">Quantizer</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="161.5275" y="393.910875" transform="rotate(-0 161.5275 393.910875)">Encoder</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="413.8425" y="393.910875" transform="rotate(-0 413.8425 393.910875)">Channel</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="393.910875" transform="rotate(-0 666.1575 393.910875)">Decoder</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(851.11875 382.465125)">Reconstruction</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(897.537656 405.356625)">filter</text>
   </g>
   <g id="text_9">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="554.266562" transform="rotate(-0 540 554.266562)">8 bits/sample × 8,000 samples/s =64 kbit/s (before framing/coding)</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">PCM samples, quantizes, encodes, then reconstructs the received signal</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">1017  •  FIG-03-40-006</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 651.001875)">Idealized PCM chain. Anti-alias filtering precedes sampling; a decoder/DAC followed by reconstruction filtering restores an analog approximation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 663.719375)">Quantization causes error even without channel errors. The64 kbit/s example excludes overhead and requires an input bandwidth below4 kHz with practical</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 676.436875)">transition margin.</text>
  </g>
 </g>
