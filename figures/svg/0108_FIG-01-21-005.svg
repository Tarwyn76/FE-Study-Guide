   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="137.348975" transform="rotate(-0 396 137.348975)">Simplify algebra — Expand, divide, factor, or split the integrand</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="219.774575" transform="rotate(-0 396 219.774575)">Check a reference table — Identify a standard antiderivative</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="302.200175" transform="rotate(-0 396 302.200175)">Try substitution — Inner derivative is present or can be supplied</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="384.625775" transform="rotate(-0 396 384.625775)">Try integration by parts — Product: one factor simplifies when differentiated</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="467.051375" transform="rotate(-0 396 467.051375)">Use identities — Rewrite trigonometric products or powers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="549.476975" transform="rotate(-0 396 549.476975)">Try trig substitution — Radicals involving a² ± x² or x² − a²</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="631.902575" transform="rotate(-0 396 631.902575)">Use partial fractions — Proper rational function with factored denominator</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="714.328175" transform="rotate(-0 396 714.328175)">Use numerical methods — Definite integral; elementary form unavailable or impractical</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="396" y="779.581775" transform="rotate(-0 396 779.581775)">At each step: if a method succeeds, stop and verify by differentiating. This is a heuristic, not a rigid rule.</text>
   </g>
  </g>
