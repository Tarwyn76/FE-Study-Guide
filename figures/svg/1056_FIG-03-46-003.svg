    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="651.94915" transform="rotate(-0 540 651.94915)">Allow required traffic; evaluate direction, service, state, and identity.</text>
