  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Hypothetical ingestion exposure, not a recommended intake or site risk assessment. Noncancer averaging uses exposure duration; cancer averaging uses the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">assigned70-year lifetime for this example. Values are assumptions, not universal exposure defaults. Route-specific absorption and life-stage variation are</text>
