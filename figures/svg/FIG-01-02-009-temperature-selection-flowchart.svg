<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Temperature scale selection flowchart</title>
<desc id="svg-desc">Decision tree for choosing absolute or relative temperature scales and applying the 1.8 degree-size factor</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1180" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">CHOOSING A TEMPERATURE SCALE</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Ask what the equation requires before inserting a temperature.</text>
<polygon points="900,190 1160,320 900,450 640,320" fill="#EAF2F8" fill-opacity="1" stroke="#2F6F9F" stroke-width="4" stroke-linejoin="round"/>
<text x="900" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#172033" text-anchor="middle">BARE T IN AN EQUATION?</text>
<rect x="80" y="540" width="560" height="230" rx="18" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="3" />
<rect x="80" y="540" width="560" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="105" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">YES — USE ABSOLUTE</text>
<text x="105" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">SI: kelvin (K)</text>
<text x="105" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">USCS: degree Rankine (°R)</text>
<polygon points="1060,515 1320,645 1060,775 800,645" fill="#FFF5DB" fill-opacity="1" stroke="#D39A22" stroke-width="4" stroke-linejoin="round"/>
<text x="1060" y="635" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#172033" text-anchor="middle">ΔT ONLY?</text>
<rect x="1220" y="870" width="500" height="210" rx="18" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="3" />
<rect x="1220" y="870" width="500" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="1245" y="912" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">YES — MATCH PAIRS</text>
<text x="1245" y="975" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Δ°C ↔ ΔK</text>
<text x="1245" y="1018" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Δ°F ↔ Δ°R</text>
<rect x="80" y="870" width="650" height="210" rx="18" fill="#FDF0E9" stroke="#C85D32" stroke-width="3" />
<rect x="80" y="870" width="650" height="62" rx="18" fill="#C85D32" stroke="#C85D32" stroke-width="0" />
<text x="105" y="912" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">CROSSING DEGREE SIZES</text>
<text x="105" y="975" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Use factor 1.8</text>
<text x="105" y="1018" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Δ°F = 1.8 Δ°C</text>
<path d="M 700 390 C 460 470 380 480 360 530" fill="none" stroke="#2A7F7F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="560" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#2A7F7F" text-anchor="start">YES</text>
<path d="M 1040 390 C 1120 440 1080 480 1060 510" fill="none" stroke="#D39A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1100" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#D39A22" text-anchor="start">NO</text>
<path d="M 1180 730 C 1350 790 1460 800 1470 860" fill="none" stroke="#2A7F7F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1360" y="795" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#2A7F7F" text-anchor="start">YES</text>
<path d="M 940 730 C 760 810 500 800 430 860" fill="none" stroke="#C85D32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="710" y="790" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#C85D32" text-anchor="start">NO</text>
</svg>