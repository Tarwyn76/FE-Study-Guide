  </ns0:g>
  <ns0:g id="text_7">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="93.366" transform="rotate(-0 55.44 93.366)">Differential leveling transfers elevation through instrument height and a foresight</ns0:text>
  </ns0:g>
  <ns0:g id="text_8">
</ns0:g>
  <ns0:g id="text_9">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.455469 656.640625)">Conceptual drawing not to vertical scale. Backsight is read on known benchmark; foresight on turning point. HI is line-of-sight elevation, not tripod</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.849219 669.358125)">height. Balanced sight distances help reduce systematic instrument/curvature/refraction errors; multiple setups use new backsights and closure checks.</ns0:text>
  </ns0:g>
