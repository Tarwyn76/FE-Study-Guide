    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(297.255859 546.477461)"><ns0:tspan font-size="25.000px">Elevation</ns0:tspan><ns0:tspan font-size="17.000px" dy="6.000px">TP</ns0:tspan><ns0:tspan font-size="25.000px" dy="-6.000px">=HI−FS=100.550 m</ns0:tspan></ns0:text>
