  <g id="text_8">
</g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.455469 656.640625)">Conceptual drawing not to vertical scale. Backsight is read on known benchmark; foresight on turning point. HI is line-of-sight elevation, not tripod</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(121.849219 669.358125)">height. Balanced sight distances help reduce systematic instrument/curvature/refraction errors; multiple setups use new backsights and closure checks.</text>
