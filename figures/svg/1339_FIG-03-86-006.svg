  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Illustrative bearing with downward eccentricity and counterclockwise shaft rotation. Gap decreases on the left toward the bottom, where hydrodynamic</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">pressure can support load. Relative pressure sketch is qualitative, with a cavitated divergent region; no Reynolds-equation solution, film capacity, or</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">thermal result is claimed.</text>
  </g>
 </g>
