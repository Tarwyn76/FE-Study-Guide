   <g id="text_2">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="179.55" y="383.898012" transform="rotate(-0 179.55 383.898012)">Secondary sludge</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="283.627025" transform="rotate(-0 540 283.627025)">Thickening</text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="900.45" y="283.627025" transform="rotate(-0 900.45 283.627025)">Digestion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="203.58" y="563.684537" transform="rotate(-0 203.58 563.684537)">Dewatering</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="563.684537" transform="rotate(-0 540 563.684537)">Final management</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="876.42" y="563.684537" transform="rotate(-0 876.42 563.684537)">Verified reuse / disposal</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="94.53955" transform="rotate(-0 540 94.53955)">Liquid returns require a separate plant-load balance.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Treatment-plant solids pass through concentration, stabilization, and dewatering</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1145  •  FIG-03-59-001</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Representative solids train, not a mandatory process order. Thickening reduces water volume; digestion stabilizes some organics; dewatering produces cake</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">and a liquid residual. Return liquors can carry substantial nitrogen/phosphorus loads and require accounting. Final management depends on product quality,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">treatment, local conditions, and applicable requirements.</text>
  </g>
 </g>
