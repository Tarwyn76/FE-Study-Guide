  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">Original mechanical connection schematics. Torque creates contact forces on key or spline flanks and coupling elements. Axial retention and alignment are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">separate functions. Flexible elements permit limited specified displacement; a diagram does not determine rated torque or permissible misalignment.</text>
  </g>
