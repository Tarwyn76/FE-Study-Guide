   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">A well-mixed room approaches steady concentration through ventilation and first-order removal</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1156  •  FIG-03-60-005</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Constant-volume, equal inlet/exhaust, perfect-mixing model with constant generation and first-order removal. Ventilation rate Q/V and removal k add</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">to1.5/hour. Outdoor concentration is assigned zero for the example. Short-circuiting, localized source exposure, deposition reversibility, and changing</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">sources are omitted; this is not an exposure-limit calculation.</text>
  </g>
 </g>
