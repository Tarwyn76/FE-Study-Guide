  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Assigned compression spring D30 mm,d3 mm. Wahl factor combines curvature and direct shear. The wire section is enlarged separately, not to coil scale.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">Hookean spring behavior does not by itself guarantee stress acceptability or fatigue life; material and cycle information are required.</text>
