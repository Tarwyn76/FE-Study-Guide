   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.38 183.857125)">TRANSMITTER</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.21 205.420875)">→ DCS control</text>
   </g>
   <g id="text_3">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.00125 402.449125)">SEPARATE SENSOR</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.26375 424.012875)">→ safety logic</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(882.01825 183.857125)">ALARM</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(866.40825 205.420875)">→ operator</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(861.87325 402.449125)">SHUTDOWN</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(885.522 424.012875)">VALVE</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="761.076" y="115.151" transform="rotate(-0 761.076 115.151)">Independent relief route</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="558.40675" transform="rotate(-0 540 558.40675)">Separate safety sensor / logic / final element when credited as independent protection</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Regulatory control, shutdown logic, alarm response, and relief have different functions</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0827  •  FIG-03-13-005</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.952344 650.281875)">Conceptual architecture. A PLC label alone does not establish a safety instrumented function; independence, integrity, proof testing and common-cause risks must be</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.530469 662.999375)">evaluated. Alarm protection requires an effective operator response within available time. DCS normal control and safety protection must not be double-counted;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(448.639844 675.716875)">relief requires separate engineering.</text>
  </g>
 </g>
