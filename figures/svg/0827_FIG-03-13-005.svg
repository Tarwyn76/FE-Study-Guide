   <ns0:g id="text_1">
    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(495.736297 307.755617)">PROCESS</ns0:text>
    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(506.203094 338.753508)">VESSEL</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.38 183.857125)">TRANSMITTER</ns0:text>
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.21 205.420875)">→ DCS control</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.00125 402.449125)">SEPARATE SENSOR</ns0:text>
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(124.26375 424.012875)">→ safety logic</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(882.01825 183.857125)">ALARM</ns0:text>
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(866.40825 205.420875)">→ operator</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(861.87325 402.449125)">SHUTDOWN</ns0:text>
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(885.522 424.012875)">VALVE</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="761.076" y="115.151" transform="rotate(-0 761.076 115.151)">Independent relief route</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="558.40675" transform="rotate(-0 540 558.40675)">Separate safety sensor / logic / final element when credited as independent protection</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_8">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="81.917" transform="rotate(-0 59.4 81.917)">Regulatory control, shutdown logic, alarm response, and relief have different functions</ns0:text>
  </ns0:g>
  <ns0:g id="text_9">
</ns0:g>
  <ns0:g id="text_10" transform="translate(0.000000 -74.940218)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(122.952344 650.281875)">Conceptual architecture. A PLC label alone does not establish a safety instrumented function; independence, integrity, proof testing and common-cause risks must be</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.530469 662.999375)">evaluated. Alarm protection requires an effective operator response within available time. DCS normal control and safety protection must not be double-counted;</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(448.639844 675.716875)">relief requires separate engineering.</ns0:text>
  </ns0:g>
 </ns0:g>
