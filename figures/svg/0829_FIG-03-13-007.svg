   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="181.0368" y="274.402938" transform="rotate(-0 181.0368 274.402938)">HH trip → isolate feed</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="539.8848" y="135.574875" transform="rotate(-0 539.8848 135.574875)">Inert gas</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="853.8768" y="234.658937" transform="rotate(-0 853.8768 234.658937)">Normal cooling / TIC</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="844.9056" y="473.122937" transform="rotate(-0 844.9056 473.122937)">Emergency cooling</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="826.9632" y="169.799" transform="rotate(-0 826.9632 169.799)">Relief → safe system</text>
   </g>
   <g id="text_8">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="578.554688" transform="rotate(-0 504 578.554688)">Procedures • inspection • proof testing • emergency response</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A reactor uses prevention, automatic protection, and consequence mitigation in layers</text>
  </g>
  <g id="text_10">
</g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(112.692187 650.281875)">Conceptual layered protection, not a complete safety design. HH high-high trip should use suitably independent sensing/logic/final elements when credited.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.897656 662.999375)">Inerting must suit the hazard; relief and containment mitigate selected consequences. Cooling systems may share utilities or failure causes and cannot</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(381.345312 675.716875)">automatically be counted as independent layers.</text>
  </g>
 </g>
