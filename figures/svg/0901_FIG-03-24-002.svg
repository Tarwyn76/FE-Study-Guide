  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A column may buckle about its weak axis even when its strong-axis inertia is large</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0901  •  FIG-03-24-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.525 656.757812)">Original sharp-cornered fabricated I-section, not a published rolled W designation. I_x and I_y are centroidal section moments; r=√(I/A). Bending/buckling</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(181.240625 669.753438)">about an axis means lateral deflection perpendicular to it. Axis labels are section coordinates, not different end-restraint factors.</text>
  </g>
