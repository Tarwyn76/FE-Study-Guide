   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="324.576" y="116.25475" transform="rotate(-0 324.576 116.25475)">y</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(633.580106 187.004203)">Illustrative I-section</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(650.417841 215.306625)"><tspan font-size="21.000px">d=300; b</tspan><tspan font-size="14.280px" dy="5.040px">f</tspan><tspan font-size="21.000px" dy="-5.040px">=150</tspan></text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(637.929403 244.193109)"><tspan font-size="21.000px">t</tspan><tspan font-size="14.280px" dy="5.040px">f</tspan><tspan font-size="21.000px" dy="-5.040px">=12; t</tspan><tspan font-size="14.280px" dy="5.040px">w</tspan><tspan font-size="21.000px" dy="-5.040px">=8 mm</tspan></text>
   </g>
   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(666.545184 365.391445)">A=5808 mm²</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(566.832919 393.693867)"><tspan font-size="21.000px">r</tspan><tspan font-size="14.280px" dy="5.040px">x</tspan><tspan font-size="21.000px" dy="-5.040px">=123.59 mm; r</tspan><tspan font-size="14.280px" dy="5.040px">y</tspan><tspan font-size="21.000px" dy="-5.040px">=34.12 mm</tspan></text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(91.3248 194.191055)">x-axis bend</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(91.3248 214.40707)">y deflection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(553.040725 519.811281)">Buckling about y → x deflection</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(553.7376 546.765969)"><tspan font-size="20.000px">Compare K</tspan><tspan font-size="13.600px" dy="4.800px">xL</tspan><tspan font-size="20.000px" dy="-4.800px">/r</tspan><tspan font-size="13.600px" dy="4.800px">x</tspan><tspan font-size="20.000px" dy="-4.800px"> and K</tspan><tspan font-size="13.600px" dy="4.800px">yL</tspan><tspan font-size="20.000px" dy="-4.800px">/r</tspan><tspan font-size="13.600px" dy="4.800px">y</tspan></text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="94.467241" transform="rotate(-0 55.44 94.467241)">A column may buckle about its weak axis even when its strong-axis inertia is large</text>
  </g>
  <g id="text_8">
   </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(119.525 568.413793)"><tspan font-size="10.000px">Original sharp-cornered fabricated I-section, not a published rolled W designation. I</tspan><tspan font-size="6.800px" dy="2.400px">x</tspan><tspan font-size="10.000px" dy="-2.400px"> and I</tspan><tspan font-size="6.800px" dy="2.400px">y</tspan><tspan font-size="10.000px" dy="-2.400px"> are centroidal section moments; r=√(I/A). Bending/buckling</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(181.241 581.409419)">about an axis means lateral deflection perpendicular to it. Axis labels are section coordinates, not different end-restraint factors.</text>
  </g>
