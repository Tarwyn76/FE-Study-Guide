  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Dewatering devices separate a solids-rich cake from a liquid residual</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1148  •  FIG-03-59-004</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Mechanism sketches, not manufacturer drawings or internal flow designs. Each produces cake plus a liquid residual; polymer use, capture efficiency, cake</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">dryness, energy, and maintainability vary. Centrate/filtrate retains dissolved material and some suspended solids. Device selection needs feed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">characterization and testing; no performance ranking is implied.</text>
  </g>
