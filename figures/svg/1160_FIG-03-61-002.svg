   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="535.194" y="285.80755" transform="rotate(-0 535.194 285.80755)">Transfer / sorting</text>
   </g>
   <g id="text_4">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="910.062" y="189.0698" transform="rotate(-0 910.062 189.0698)">Materials recovery</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="910.062" y="314.7602" transform="rotate(-0 910.062 314.7602)">Composting</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="910.062" y="440.4506" transform="rotate(-0 910.062 440.4506)">Waste-to-energy</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="910.062" y="566.141" transform="rotate(-0 910.062 566.141)">Landfill</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(390.135938 650.881125)">Routes / facilities are conceptual;</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(288.842344 673.772625)">separate organics collection can bypass mixed transfer.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Collection and transfer connect neighborhoods to distinct processing facilities</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1160  •  FIG-03-61-002</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Network sketch, not a vehicle-routing solution. Distances, demand, capacity, travel time, traffic, and collection windows are not assigned. Source-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">separated materials may go directly to appropriate facilities. Transfer consolidates loads; sorting changes stream destinations rather than eliminating</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">mass. Downstream residues require further routing.</text>
  </g>
 </g>
