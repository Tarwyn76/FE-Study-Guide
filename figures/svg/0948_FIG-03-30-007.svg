  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.714062 716.305875)">Original illustrative drawing-coordination graphic for a slab; quantity14.4 m³ matches947. A–A denotes the section cut; detail bubble1 references a separate detail</text>
