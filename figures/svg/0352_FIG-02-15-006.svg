   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="164.6784" y="143.718263" transform="rotate(-0 164.6784 143.718263)">PHOTOSYNTHESIS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(106.2434 310.588281)">CO₂ + H₂O + light</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(91.571681 328.108828)">→ organic matter + O₂</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(88.139884 345.629374)">Stores chemical energy</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="426.7584" y="143.718263" transform="rotate(-0 426.7584 143.718263)">AEROBIC DEGRADATION</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(360.024728 310.588281)">Organic matter + O₂</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(348.220119 328.108828)">→ CO₂ + H₂O + biomass</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(349.771994 345.629374)">Releases usable energy</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="688.8384" y="143.718263" transform="rotate(-0 688.8384 143.718263)">ANAEROBIC DIGESTION</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(601.051838 310.588281)">Organic matter, without O₂</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(610.878009 328.108828)">→ CH₄ + CO₂ + biomass</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(572.134963 345.629374)">Example: methanogenic conversion</text>
   </g>
