  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">The coupler instantaneous center lies where the two velocity-normal lines intersect</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1265  •  FIG-03-76-002</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Same four-bar geometry as1266, at crank angle60°. Extending the crank and rocker directions locates the coupler/ground instantaneous center. It can lie</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">outside the physical link and moves as the configuration changes. A point at the center has zero velocity only at that instant; its acceleration need not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">vanish. Speed-ratio statement applies to the coupler’s instantaneous rotation.</text>
  </g>
