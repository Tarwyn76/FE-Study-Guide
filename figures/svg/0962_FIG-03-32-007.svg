   <g id="text_1">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(370.028594 146.693547)">ASSUME DEVICE STATES</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(344.3075 176.343703)">Off / conducting / breakdown</text>
   </g>
   <g id="text_2">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(353.097188 275.861547)">SOLVE THE LINEAR CIRCUIT</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(317.926406 305.511703)">Replace each state with its model</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(386.164219 405.029547)">VERIFY INEQUALITIES</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(297.294531 434.679703)">Check currents and terminal voltages</text>
   </g>
   <g id="text_4">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="564.202562" transform="rotate(-0 504 564.202562)">All consistent → accept; any inconsistent → revise assumed states</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A piecewise-linear solution is valid only when every assumed device state is consistent</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0962  •  FIG-03-32-007</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.071094 650.281875)">Conceptual nonlinear-device analysis using stipulated piecewise-linear models. For ideal diode: off requires i=0,v≤0; on requires v=0,i≥0 under</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.298437 662.999375)">anode-to-cathode reference. Constant-drop or Zener models have their own inequalities. Equality can admit either adjacent state at a boundary; a linear</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(379.265625 675.716875)">solution alone does not validate the assumptions.</text>
  </g>
 </g>
