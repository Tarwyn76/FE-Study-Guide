   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="666.1575" y="236.348412" transform="rotate(-0 666.1575 236.348412)">Aerobic</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="918.4725" y="236.348412" transform="rotate(-0 918.4725 236.348412)">Clarifier</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="466.14595" transform="rotate(-0 540 466.14595)">Internal nitrate recycle</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="472.716" y="613.419612" transform="rotate(-0 472.716 613.419612)">RAS →anaerobic inlet</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="924.48" y="634.451" transform="rotate(-0 924.48 634.451)">WAS:removes P</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="165.132" y="137.430138" transform="rotate(-0 165.132 137.430138)">PAO storage / P release</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="405.432" y="137.982012" transform="rotate(-0 405.432 137.982012)">NO3⁻→N2</text>
   </g>
   <g id="text_10">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(612.242719 126.620262)">NH4⁺→NO3⁻</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(627.961078 148.240013)">P uptake</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A nutrient-removal train combines zone cycling with recycle and controlled solids wasting</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1144  •  FIG-03-58-007</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Conceptual three-zone train: nitrate recycle supports anoxic denitrification, while PAO cycling plus solids wasting exports phosphorus. Nitrate/oxygen</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">entering the anaerobic zone can impair its function; actual configurations may add RAS denitrification. Nitrogen removal also needs carbon and adequate</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">nitrifying solids age. Hydraulic sizing and removal efficiencies are not assigned.</text>
  </g>
 </g>
