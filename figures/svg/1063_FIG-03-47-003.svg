  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Sorting and searching costs depend on the algorithm and its assumptions</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1063  •  FIG-03-47-003</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Binary-search example seeks10 in a sorted array. Quicksort expected complexity assumes suitable randomized/average partitioning; hash expected constant</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">lookup depends on collisions/load. Bubble sort without an early-exit optimization remains quadratic even on sorted input. Auxiliary memory costs are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">separate.</text>
  </g>
