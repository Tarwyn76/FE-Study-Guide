  <ns0:g id="text_21">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="109.877" transform="rotate(-0 55.44 109.877)">A hyetograph separates total rainfall from assumed abstractions and effective rainfall</ns0:text>
  </ns0:g>
  <ns0:g id="text_22">
</ns0:g>
  <ns0:g id="text_23" transform="translate(0.000000 -73.389709)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.060937 650.281875)">Hypothetical constant-capacity loss model, no initial-abstraction term. Intensity is multiplied by interval duration to obtain depth. The displayed</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(164.004687 662.999375)">effective rainfall can serve as a runoff-model input, but timing of resulting streamflow requires a response/routing model; it is not equal</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(413.835156 675.716875)">instantaneously to outlet discharge.</ns0:text>
  </ns0:g>
 </ns0:g>
