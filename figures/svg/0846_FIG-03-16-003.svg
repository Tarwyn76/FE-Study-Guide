   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0846  •  FIG-03-16-003</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.060937 650.281875)">Hypothetical constant-capacity loss model, no initial-abstraction term. Intensity is multiplied by interval duration to obtain depth. The displayed</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(164.004687 662.999375)">effective rainfall can serve as a runoff-model input, but timing of resulting streamflow requires a response/routing model; it is not equal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(413.835156 675.716875)">instantaneously to outlet discharge.</text>
  </g>
