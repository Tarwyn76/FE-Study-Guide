   <g id="text_1">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="232.539237" transform="rotate(-0 504 232.539237)">Oxidation:Zn(s) →Zn²⁺(aq)+2e⁻</text>
   </g>
   <g id="text_2">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="391.018437" transform="rotate(-0 504 391.018437)">Reduction:Cu²⁺(aq)+2e⁻ →Cu(s)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="568.624437" transform="rotate(-0 504 568.624437)">Net:Zn(s)+Cu²⁺(aq) →Zn²⁺(aq)+Cu(s)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="144.274625" transform="rotate(-0 504 144.274625)">Zn:0 →+2   •   Cu:+2 →0</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="43.56" transform="rotate(-0 55.44 43.56)">Electron balance combines oxidation and reduction into a net reaction</text>
  </g>
  <g id="text_6">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1077  •  FIG-03-49-003</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 723.456625)">Two electrons cancel when the half-reactions are added. Atoms and charge are balanced: total aqueous charge+2 on each side. Zinc is oxidized and acts as</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 736.174125)">the reducing agent; Cu²⁺ is reduced and acts as the oxidizing agent. Reaction spontaneity depends on thermodynamic conditions not assigned here.</text>
  </g>
