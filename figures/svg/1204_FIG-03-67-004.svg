    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="538.387431" transform="rotate(-0 540 538.387431)">MAE / MAD=mean|e|=5 units; bias=mean e=2.5 units</text>
   </g>
   <g id="text_22">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="645.965762" transform="rotate(-0 540 645.965762)">MSE=37.5 units²; RMSE=6.124 units; MAPE=4.470%</text>
   </g>
   <g id="text_23">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="727.837537" transform="rotate(-0 540 727.837537)">MAPE=100 mean(|e|/|Y|); every actual value here is nonzero.</text>
   </g>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Forecast error metrics measure different aspects of the same residuals</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1204  •  FIG-03-67-004</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Errors use actual minus forecast, so positive bias means underforecasting. MAD here means mean absolute forecast error, not median absolute deviation. MSE</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">and RMSE penalize large errors more strongly; MAPE is unsuitable when actual values are zero and can distort comparisons near zero. Four observations</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">illustrate formulas rather than model validation.</text>
  </g>
