   <ns0:g id="text_3">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(788.608537 509.755477)">PLANT</ns0:text>
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(780.902522 538.057898)">L=10 m</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="132.538437" transform="rotate(-0 504 132.538437)">Geometric similarity: V∝L³; area∝L²; A/V∝1/L</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_5">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="93.528" transform="rotate(-0 55.44 93.528)">Geometric scale-up cannot preserve every hydrodynamic and heat-transfer ratio at once</ns0:text>
  </ns0:g>
  <ns0:g id="text_6">
</ns0:g>
  <ns0:g id="text_7" transform="translate(0.000000 -98.608998)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.588281 650.281875)">Sizes are conceptual; drawn vessels are not to a common physical scale. For the same fluid Re=UL/ν and Fr=U²/(gL): preserving Re requires U∝L⁻¹, while</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.534375 662.999375)">preserving Fr requires U∝L^0.5. Both cannot remain fixed across scale. Heat-transfer area per volume decreases; mixing, kinetics, mass transfer and heat</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.617188 675.716875)">removal must be assessed.</ns0:text>
  </ns0:g>
 </ns0:g>
