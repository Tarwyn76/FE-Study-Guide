   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(416.110012 509.755477)">PILOT</ns0:text>
    <ns0:text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(410.792747 538.057898)">L=1 m</ns0:text>
