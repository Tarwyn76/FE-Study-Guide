  <g id="text_16">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A shift register moves serial bits and can load parallel data through input multiplexers</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1034  •  FIG-03-43-002</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Common rising-edge clock; all MUXes share the Load selector (connection omitted). Shift example: initial Q0 Q1 Q2 Q3=0000, serial inputs1,0,1,1</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">produce1000,0100,1010,1101. Each clock captures old previous-stage data, not a bit rippling through all stages in one edge.</text>
  </g>
