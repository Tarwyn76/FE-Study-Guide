   <g id="text_15">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(338.772656 650.881125)">Load=1:Di=Pi  •  Load=0: D0=SI, Di=Q(i−1)</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(345.996562 673.772625)">SI:1,0,1,1 → Q0…Q3:1000,0100,1010,1101</text>
