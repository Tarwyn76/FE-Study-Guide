  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Activated sludge recycles biomass while wasting excess solids to control the solids inventory</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0884  •  FIG-03-21-006</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(109.192969 650.281875)">Conceptual suspended-growth biological process after appropriate upstream treatment. RAS returns settled biomass; WAS removes excess solids. Aeration supplies oxygen</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.922656 662.999375)">and mixing. Hydraulic residence time and solids retention time are different; this layout alone gives neither a treatment capacity nor removal efficiency. Clarifier</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(418.372656 675.716875)">solids losses and residual treatment also matter.</text>
  </g>
 </g>
