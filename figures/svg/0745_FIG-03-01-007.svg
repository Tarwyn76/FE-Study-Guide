   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="154.1232" y="438.346937" transform="rotate(-0 154.1232 438.346937)">Mass or molar?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="387.3744" y="438.346937" transform="rotate(-0 387.3744 438.346937)">Check independence</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="620.6256" y="438.346937" transform="rotate(-0 620.6256 438.346937)">Common reference</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="853.8768" y="438.346937" transform="rotate(-0 853.8768 438.346937)">State sign convention</text>
   </g>
   <g id="text_9">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="553.990625" transform="rotate(-0 504 553.990625)">Validate conservation, units, physical feasibility, and degrees of freedom.</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Solve material flows before using properties to close the process energy balance</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0745  •  FIG-03-01-007</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.414062 656.640625)">A sequential workflow is convenient when material and energy balances decouple. Coupled temperature-dependent reaction, equilibrium or separation models</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.595312 669.358125)">may need simultaneous iteration. State assumptions and property sources; do not combine inconsistent mass/molar enthalpy units or reference states.</text>
  </g>
