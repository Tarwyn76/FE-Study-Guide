   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #a23b34" transform="translate(165.91795 154.049125)">PSV-101</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #a23b34" transform="translate(116.98545 175.612875)">To safe relief system</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(265.570312 544.929406)">Solid:process pipe  •  Dashed:instrument signal</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(163.073437 571.884094)">Isolation valves on process lines; outlet level control through LV-101</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A vessel P&amp;ID links level measurement to an outlet valve and separates the relief path</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0817  •  FIG-03-12-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(141.241406 650.281875)">Teaching P&amp;ID with simplified symbols: LT level transmitter, LIC indicating level controller, LV control valve, PSV pressure safety valve. High level</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(114.133594 662.999375)">should command more discharge for the chosen service. Relief route has no depicted block valve. Tagging/symbols are illustrative and do not constitute an</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(376.479688 675.716875)">ISA-compliant construction drawing or relief sizing.</text>
  </g>
