  <g id="text_7">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Capture efficiency and device removal determine stack and fugitive emissions separately</text>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1153  •  FIG-03-60-002</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned uncontrolled emission factor and efficiencies, not AP-42 values for a real process. Overall removal is0.90×0.95=0.855; total emission=A</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">EF(1−overall removal). Stack emission excludes uncaptured fugitive mass. Captured/removed mass must enter another stream or reaction balance. Factors are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">estimates, not compliance limits.</text>
  </g>
