   <g id="text_6">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="609.058562" transform="rotate(-0 540 609.058562)">Fugitive=5.00; total atmospheric emission=7.25 kg/hour</text>
