  <g id="text_23">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="47.52" transform="rotate(-0 59.4 47.52)">Layout types organize flow around sequence, function, product families, or a stationary product</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1231  •  FIG-03-71-003</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Four conceptual layouts, not to scale. Product layouts follow a repeated route; process layouts group similar functions; cells combine operations for a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">product family; fixed-position layouts bring resources to a stationary product. Real layouts must also account for access, safety, buffers, utilities, and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">changing mix.</text>
  </g>
 </g>
