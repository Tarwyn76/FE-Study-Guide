   <g id="text_1">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="504" y="187.452514" transform="rotate(-0 504 187.452514)">L_b: distance between effective lateral / torsional restraints</text>
   </g>
   <g id="text_2">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(257.911875 414.169687)">Compression flange lateral displacement</text>
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(289.434375 446.515312)">+ cross-section twist (exaggerated)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="568.894625" transform="rotate(-0 504 568.894625)">Check yielding, lateral-torsional buckling, and local buckling as applicable</text>
   </g>
  </g>
  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">An unbraced compression flange can move laterally while a beam twists</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0910  •  FIG-03-25-004</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(133.755469 650.142812)">Schematic projection of a major-axis-bent I-beam; separate I-section sketches identify the shape. End lines represent effective bracing stations, not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.845312 662.860312)">proof of brace stiffness/strength. L_b is not automatically the full support span. Load height, moment gradient, restraint and section properties</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(341.721875 675.855937)">influence lateral-torsional buckling; no buckling load is assigned.</text>
  </g>
