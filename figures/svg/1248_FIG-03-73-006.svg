   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1248  •  FIG-03-73-006</text>
  </g>
  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 783.193875)">Assigned cycles and rating for one repeatable task. A rating above100% normalizes a faster-than-standard observed performance upward. The two allowance</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 795.911375)">conventions are alternatives, not cumulative adjustments:15% of normal job time differs from15% of the workday. Sampling adequacy, outlier treatment, task</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 808.628875)">method, and allowance basis must be established for actual standards.</text>
  </g>
