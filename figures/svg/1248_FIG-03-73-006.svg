   <g id="text_10">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="581.215975" transform="rotate(-0 540 581.215975)">15% of job time:ST=NT(1+0.15)=2.53 min</text>
