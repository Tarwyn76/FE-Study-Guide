   <g id="text_9">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="455.746437" transform="rotate(-0 540 455.746437)">Normal time NT=mean observed time × rating=2.0×1.10=2.20 min</text>
