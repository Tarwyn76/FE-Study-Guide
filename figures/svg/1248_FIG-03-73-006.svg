   <g id="text_11">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="694.486375" transform="rotate(-0 540 694.486375)">15% of workday:ST=NT/(1−0.15)=2.588 min</text>
