  <g id="text_4">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Buoyancy carries warmer fluid upward in natural convection</text>
  </g>
  <g id="text_5">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0645  •  FIG-02-57-005</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(111.389062 656.640625)">Hot surfaces in a cooler fluid with gravity downward; thermal expansion lowers the density of warm fluid, producing an upward plume. Direction can reverse</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(314.665625 669.358125)">for a cold surface. Natural-convection correlations commonly use Ra=Gr·Pr.</text>
  </g>
