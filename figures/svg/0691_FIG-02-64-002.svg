  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.076562 656.640625)">Right-handed axes: +x right, +y up, +z out of page. L points along conventional current. Right-hand fingers follow I L then curl toward B; thumb indicates</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(297.554688 669.358125)">−z. Reversing current or B reverses force. The wire segment is perpendicular to B.</text>
  </g>
