    <g style="fill: #23313d" transform="translate(695.696 213.958)">
     <text>
      <tspan x="0" y="-0.671875" style="font-weight: 700; font-size: 32px; font-family: 'DejaVu Sans'; fill: #23313d">F</tspan>
