      <tspan x="61.140625" y="-0.671875" style="font-style: oblique; font-size: 32px; font-family: 'DejaVu Sans'; fill: #23313d">I</tspan>
     </text>
    </g>
   </g>
   <g id="text_5">
    <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(687.09975 344.617687)">+y × +x = −z</text>
