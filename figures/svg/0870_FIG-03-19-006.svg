   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(104.242969 650.281875)">Hypothetical operating-elevation bands, distinct from869. Freeboard106−104=2 m is the static difference in this example, not a recommended margin. Design</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(117.920312 662.999375)">must consider waves, settlement, flood routing, operational reserves, overtopping and applicable dam-safety criteria. Schematic does not size spillway or</ns0:text>
