  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(113.689062 656.3625)">Same material/geometry example as914. a=A_s f_y/(0.85f′c b), M_n=A_s f_y(d−a/2). Yielding of tension reinforcement was checked by strain compatibility;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.526562 669.358125)">without it, substitute actual f_s and solve equilibrium. Force arrows depict magnitudes in a section-resultant diagram; dimensions are schematic.</text>
