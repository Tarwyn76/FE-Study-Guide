<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Gravity g versus conversion constant g sub c</title>
<desc id="svg-desc">Side-by-side comparison of local gravitational acceleration and the USCS conversion constant</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1080" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">g AND g_c ARE NOT THE SAME THING</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">The same familiar number can describe two completely different quantities.</text>
<rect x="80" y="220" width="690" height="650" rx="18" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="3" />
<rect x="80" y="220" width="690" height="62" rx="18" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="0" />
<text x="105" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">g — LOCAL GRAVITY</text>
<text x="105" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">What: gravitational acceleration</text>
<text x="105" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Typical Earth value: 32.174 ft/s²</text>
<text x="105" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Varies with location: YES</text>
<text x="105" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Physical quantity: acceleration</text>
<text x="105" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Used in SI and USCS: YES</text>
<rect x="1030" y="220" width="690" height="650" rx="18" fill="#FDF0F0" stroke="#B94747" stroke-width="3" />
<rect x="1030" y="220" width="690" height="62" rx="18" fill="#B94747" stroke="#B94747" stroke-width="0" />
<text x="1055" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">g_c — UNIT CONSTANT</text>
<text x="1055" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">What: lbm–lbf conversion factor</text>
<text x="1055" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Fixed value: 32.174 lbm·ft/(lbf·s²)</text>
<text x="1055" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Varies with location: NO</text>
<text x="1055" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Nature: bookkeeping constant</text>
<text x="1055" y="497" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Used in SI: NEVER</text>
<rect x="705" y="390" width="390" height="260" rx="28" fill="#FFF5DB" stroke="#D39A22" stroke-width="4" />
<text x="900" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#D39A22" text-anchor="middle">32.174</text>
<text x="900" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033" text-anchor="middle">SAME NUMBER</text>
<text x="900" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="800" fill="#B94747" text-anchor="middle">≠</text>
<text x="900" y="615" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#B94747" text-anchor="middle">NOT THE SAME THING</text>
</svg>