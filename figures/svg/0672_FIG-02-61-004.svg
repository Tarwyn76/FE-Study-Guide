   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.066406 656.3625)"><ns0:tspan style="font-size: 10.000px">No mutual inductance is assumed. Series branches carry the same current; parallel branches share voltage. Individual stored energies add as Σ½L</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">ki</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">k</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">².</ns0:tspan></ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(172.357031 669.358125)"><ns0:tspan style="font-size: 10.000px">Equivalent terminal energy ½L</ns0:tspan><ns0:tspan style="font-size: 7.200px" dy="2.400px">eqI</ns0:tspan><ns0:tspan style="font-size: 10.000px" dy="-2.400px">​</ns0:tspan><ns0:tspan style="font-size: 10.000px">² requires compatible initial currents and excludes independently stored circulating-mode energy.</ns0:tspan></ns0:text>
  </ns0:g>
 </ns0:g>
