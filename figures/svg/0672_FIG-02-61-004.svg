  <g id="text_9">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Uncoupled inductors add in series and reciprocally in parallel</text>
  </g>
  <g id="text_10">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0672  •  FIG-02-61-004</text>
  </g>
  <g id="text_11">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(120.066406 656.3625)">No mutual inductance is assumed. Series branches carry the same current; parallel branches share voltage. Individual stored energies add as Σ½L_ki_k².</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(172.357031 669.358125)">Equivalent terminal energy ½L_eqI² requires compatible initial currents and excludes independently stored circulating-mode energy.</text>
  </g>
