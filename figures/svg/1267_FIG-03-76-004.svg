  <g id="text_11">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">A slider-crank converts rotation into reciprocating displacement with stroke2r</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1267  •  FIG-03-76-004</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned in-line slider-crank, right-hand slider branch, r1 m and l3 m. Positive displacement is rightward from the crank pivot; positive crank angle is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">counterclockwise. vB is the time derivative of the exact slider position with ω2 rad/s. Guide lines denote the slider constraint, not friction or load</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">capacity. Stroke is max x−min x=2r.</text>
  </g>
