   <g id="text_1">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="176.698562" transform="rotate(-0 540 176.698562)">DEFINE DUTY + STREAMS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(129.10425 351.242437)">PUMP</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(77.65425 367.41525)">Q + head → hydraulics</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.477062 383.588062)">NPSH / materials</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(300.777375 351.242437)">EXCHANGER</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(269.663625 367.41525)">Heat duty + ΔT → area</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(269.223 383.588062)">Fouling / pressure drop</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(507.739875 351.242437)">VESSEL</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(460.22175 367.41525)">Inventory / hold-up → V</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(471.338625 383.588062)">Pressure / corrosion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(693.92175 351.242437)">REACTOR</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(644.552062 367.41525)">Kinetics + conversion → V</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(655.878 383.588062)">Heat removal / mixing</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(879.802687 351.242437)">SEPARATOR</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(827.53425 367.41525)">Split + equilibrium → contact</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(846.840187 383.588062)">Hydraulics / selectivity</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="555.370875" transform="rotate(-0 540 555.370875)">ITERATE: safety • operation • environment • cost • mechanical design</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Process duty determines equipment size, then constraints refine the design</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0818  •  FIG-03-12-003</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.464062 656.640625)">Conceptual sizing path. Duty-based calculations and engineering constraints must be iterated with equipment/vendor performance and process interactions. Examples are</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.104687 669.358125)">representative inputs, not complete mechanical-design equations; pressure-vessel, relief, materials and applicable code requirements require separate evaluation.</text>
  </g>
 </g>
