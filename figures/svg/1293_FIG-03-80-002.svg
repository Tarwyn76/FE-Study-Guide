   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1293  •  FIG-03-80-002</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned laminar flat-plate quartic-profile approximation, U∞10 m/s andν1.5×10⁻⁵ m²/s. Width of each plotted profile is an explanatory scaled velocity, not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">an actual downstream displacement of the fluid. Height is physical millimeters. The profile satisfies no slip, external velocity, and zero edge gradient;</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">its wall-shear coefficient is approximate rather than exact Blasius.</text>
  </g>
