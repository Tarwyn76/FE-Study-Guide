   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(146.157031 656.640625)">Ideal step closure of initially unenergized circuits. At t=0⁺ a zero-voltage capacitor behaves as a short and a zero-current inductor as an open; nonzero initial</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(282.492969 669.358125)">states require appropriate source equivalents. Long-time DC applies only after stable transients decay.</ns0:text>
  </ns0:g>
 </ns0:g>
