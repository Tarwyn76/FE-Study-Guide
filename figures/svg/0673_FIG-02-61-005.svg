  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0673  •  FIG-02-61-005</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(146.157031 656.640625)">Ideal step closure of initially unenergized circuits. At t=0⁺ a zero-voltage capacitor behaves as a short and a zero-current inductor as an open; nonzero initial</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(282.492969 669.358125)">states require appropriate source equivalents. Long-time DC applies only after stable transients decay.</text>
  </g>
