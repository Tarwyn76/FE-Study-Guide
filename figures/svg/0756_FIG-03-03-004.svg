  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0756  •  FIG-03-03-004</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.845312 656.640625)">Basis 1 mol methane; dry ideal air modeled as O₂+3.76N₂. Complete combustion, no dissociation, fuel nitrogen or other gases. Theoretical air is 9.52 mol and actual</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(180.776562 669.358125)">air 11.424 mol. CO could appear under incomplete combustion and would require a separate oxygen/carbon balance; it is zero in this example.</text>
  </g>
