  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(140.327344 650.281875)">Conceptual PFD; stream2 includes fresh plus recycle after mixing. Reaction is chosen to conserve total molar flow for this illustrative bookkeeping. Pump raises</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.389062 662.999375)">pressure and heater changes temperature; actual equipment conditions need a complete stream table, composition and energy balance. Instrument loops belong on the</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(526.171875 675.716875)">P&amp;ID.</text>
  </g>
