   </g>
   <g id="text_2">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="165.132" y="253.01875" transform="rotate(-0 165.132 253.01875)">Arrivals</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(847.176312 240.30125)">Throughput</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(855.063812 265.73625)">30 units/h</text>
   </g>
   <g id="text_4">
    <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="561.530987" transform="rotate(-0 540 561.530987)">WIP=TH×FT → FT=120/30=4 h</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="662.87875" transform="rotate(-0 540 662.87875)">Same boundary, same population, stable long-run averages</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">Little's law connects work in process, throughput, and average flow time</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1216  •  FIG-03-69-002</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned stable production flow without loss or hidden off-system queues. WIP counts units inside the chosen boundary and flow time spans their entry to</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">exit. Little’s law is not a deterministic individual-unit time guarantee. Reducing inventory without preserving flow can starve equipment; variability and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">release rules matter.</text>
  </g>
