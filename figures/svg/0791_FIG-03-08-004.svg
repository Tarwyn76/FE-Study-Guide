  <ns0:g id="text_21">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(136.239062 656.640625)">Illustrative piecewise linear drying law under constant gas conditions. X decreases during drying; the plotted horizontal axis increases to the right.</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(165.69375 669.358125)">Initial warm-up is omitted. Real falling-rate curves are material dependent; equilibrium and critical moisture are not the same quantity.</ns0:text>
  </ns0:g>
