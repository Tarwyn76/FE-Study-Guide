  <g id="text_7">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0907  •  FIG-03-25-001</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(95.228125 656.501562)">Conceptual design sequence. LRFD compares factored demand to φR_n; ASD compares service-level demand to R_n/Ω. Applicable limit states depend on member,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.248437 669.497187)">connection, loading, section slenderness and restraint. No strength factors, current-code adequacy or complete state list are implied by the flowchart.</text>
  </g>
