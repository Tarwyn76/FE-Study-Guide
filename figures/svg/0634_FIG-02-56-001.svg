  </g>
  <g id="text_8" transform="translate(0.000000 -30.547111)">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(116.086719 590.616625)">The internal resistance is a scale estimate, not an exact geometry-independent circuit element. Small Bi means small internal</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(162.246875 603.334125)">temperature variation relative to the surface-to-fluid drop; Bi&lt;0.1 commonly supports lumped capacitance.</text>
  </g>
