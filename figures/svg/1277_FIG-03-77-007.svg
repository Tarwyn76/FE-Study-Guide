   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1277  •  FIG-03-77-007</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned speed-independent frequency bands and excitation orders1,2,3. Dots mark crossings of order lines with nominal30 and60 Hz modes. Band intersections</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">define speed intervals rather than single prohibited speeds. Actual resonant amplitude depends on forcing, damping, mode participation, and speed-dependent</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">dynamics; a real rotor may have changing natural frequencies.</text>
  </g>
 </g>
