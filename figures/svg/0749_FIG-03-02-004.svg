    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="248.182687" transform="rotate(-0 400.8312 248.182687)">REACTOR</text>
   </g>
   <g id="text_2">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="714.8232" y="248.182687" transform="rotate(-0 714.8232 248.182687)">SEPARATOR</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="817.992" y="563.37475" transform="rotate(-0 817.992 563.37475)">PURGE: p=0.10</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b47722" x="495.0288" y="493.546812" transform="rotate(-0 495.0288 493.546812)">RECYCLE: fraction 1−p</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="145.510875" transform="rotate(-0 145.152 145.510875)">Fresh inert: 10 mol/s</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="364.378812" transform="rotate(-0 504 364.378812)">Purge and recycle have identical composition.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="279.72" y="578.002813" transform="rotate(-0 279.72 578.002813)">Steady inert out in purge = 10 mol/s</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">A purge removes inert material that otherwise accumulates in a recycle loop</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0749  •  FIG-03-02-004</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(126.376562 650.281875)">Inert is nonreactive and assumed absent from the main product; all fresh inert leaves by purge. For purge fraction p=0.10, separator overhead inert is</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(118.26875 662.999375)">10/p=100 mol/s and recycled inert is 90 mol/s. Ideal homogeneous purge split has equal compositions in purge/recycle. With no purge or other exit, fresh</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(389.036719 675.716875)">inert accumulates; steady state is impossible.</text>
  </g>
 </g>
