</g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(96.460938 656.501562)"><tspan font-size="10.000px">Wet-basis moisture is0.20 kg water/kg wet material (20%); dry-basis is0.25 kg water/kg dry solid (25%). Conversion X</tspan><tspan font-size="6.800px" dy="2.400px">db</tspan><tspan font-size="10.000px" dy="-2.400px">=X</tspan><tspan font-size="6.800px" dy="2.400px">wb</tspan><tspan font-size="10.000px" dy="-2.400px">/(1−X</tspan><tspan font-size="6.800px" dy="2.400px">wb</tspan><tspan font-size="10.000px" dy="-2.400px">), X</tspan><tspan font-size="6.800px" dy="2.400px">wb</tspan><tspan font-size="10.000px" dy="-2.400px">=X</tspan><tspan font-size="6.800px" dy="2.400px">db</tspan><tspan font-size="10.000px" dy="-2.400px">/(1+X</tspan><tspan font-size="6.800px" dy="2.400px">db</tspan><tspan font-size="10.000px" dy="-2.400px">).</tspan></text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(311.386719 669.497187)">State the basis whenever reporting moisture; dry-basis values may exceed1.</text>
  </g>
