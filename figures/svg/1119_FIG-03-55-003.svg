  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.317563)">Linear instantaneous equilibrium sorption with rho_b=1.6 kg/L, Kd=0.5 L/kg, effective porosity0.25, and100-day travel time. R is dimensionless. Front</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.313188)">positions are schematic, with no dispersion, decay, or nonequilibrium exchange. Seepage velocity, not Darcy flux, sets the unretarded water-front speed.</text>
