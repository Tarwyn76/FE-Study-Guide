  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.097875)">Assigned Lewis form factor under the σ=Wt/(bmY) convention, where m is module in mm. The cantilever sketch is conceptual; the tooth root is the bending-</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.815375)">critical region. Dynamic, overload, load distribution, fatigue, and contact-stress factors are omitted. A different diametral-pitch convention requires its</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.532875)">matching form factor.</text>
  </g>
