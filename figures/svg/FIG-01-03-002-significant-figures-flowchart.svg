<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1390" viewBox="0 0 1900 1390" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Significant digit identification flowchart</title>
<desc id="svg-desc">Decision flowchart for determining whether a digit is significant</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1900" height="1390" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">IS THIS DIGIT SIGNIFICANT?</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Classify zeros by position; every nonzero digit is significant.</text>
<polygon points="950,180 1210,300 950,420 690,300" fill="#EAF2F8" fill-opacity="1" stroke="#2F6F9F" stroke-width="4" stroke-linejoin="round"/>
<text x="950" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="middle">IS THE DIGIT NONZERO?</text>
<rect x="90" y="495" width="500" height="190" rx="18" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="3" />
<rect x="90" y="495" width="500" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="115" y="537" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">YES</text>
<text x="115" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">SIGNIFICANT</text>
<path d="M 700 350 C 560 420 360 420 340 485" fill="none" stroke="#2A7F7F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="560" y="405" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#2A7F7F" text-anchor="start">YES</text>
<polygon points="1180,485 1410,600 1180,715 950,600" fill="#FFF5DB" fill-opacity="1" stroke="#D39A22" stroke-width="4" stroke-linejoin="round"/>
<text x="1180" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#172033" text-anchor="middle">ZERO — WHERE IS IT?</text>
<path d="M 1110 380 C 1190 430 1180 455 1180 480" fill="none" stroke="#D39A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1190" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="800" fill="#D39A22" text-anchor="start">NO</text>
<rect x="60" y="880" width="410" height="250" rx="18" fill="#FAFBFC" stroke="#B94747" stroke-width="3" />
<rect x="60" y="880" width="410" height="62" rx="18" fill="#B94747" stroke="#B94747" stroke-width="0" />
<text x="85" y="922" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">LEADING ZERO</text>
<text x="85" y="985" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Before first nonzero digit</text>
<text x="85" y="1028" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">NOT SIGNIFICANT</text>
<rect x="510" y="880" width="410" height="250" rx="18" fill="#FAFBFC" stroke="#2A7F7F" stroke-width="3" />
<rect x="510" y="880" width="410" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="535" y="922" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">SANDWICHED ZERO</text>
<text x="535" y="985" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Between nonzero digits</text>
<text x="535" y="1028" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">SIGNIFICANT</text>
<rect x="960" y="880" width="410" height="250" rx="18" fill="#FAFBFC" stroke="#2A7F7F" stroke-width="3" />
<rect x="960" y="880" width="410" height="62" rx="18" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="0" />
<text x="985" y="922" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">TRAILING + DECIMAL</text>
<text x="985" y="985" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">After decimal and nonzero</text>
<text x="985" y="1028" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">SIGNIFICANT</text>
<rect x="1410" y="880" width="410" height="250" rx="18" fill="#FAFBFC" stroke="#C85D32" stroke-width="3" />
<rect x="1410" y="880" width="410" height="62" rx="18" fill="#C85D32" stroke="#C85D32" stroke-width="0" />
<text x="1435" y="922" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">TRAILING WHOLE NUMBER</text>
<text x="1435" y="985" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">No decimal shown</text>
<text x="1435" y="1028" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">AMBIGUOUS</text>
<path d="M 1180 715 C 1180 800 265 800 265 870" fill="none" stroke="#526274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1180 715 C 1180 800 715 800 715 870" fill="none" stroke="#526274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1180 715 C 1180 800 1165 800 1165 870" fill="none" stroke="#526274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1180 715 C 1180 800 1615 800 1615 870" fill="none" stroke="#526274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="320" y="1230" width="1260" height="90" rx="14" fill="#EDF4F8" stroke="#183B5B" stroke-width="2" />
<text x="950" y="1287" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#183B5B" text-anchor="middle">Use scientific notation to make intended significance unambiguous.</text>
</svg>