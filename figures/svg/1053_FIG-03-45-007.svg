  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Packet size12000 bits; each link100 km at2e8 m/s. Full packet must arrive before forwarding (store-and-forward); endpoint processing and retransmissions</text>
