  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(110.763281 656.640625)">Hypothetical curves X*=aφ/(1−0.5φ), with a=0.03,0.06,0.12; not experimental data for named materials. Free moisture is actual minus equilibrium moisture</text>
