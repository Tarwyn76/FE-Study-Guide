   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="168.69525" transform="rotate(-0 145.152 168.69525)">Modification</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="168.69525" transform="rotate(-0 400.8312 168.69525)">Main role</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="168.69525" transform="rotate(-0 759.6792 168.69525)">Condition / tradeoff</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="248.18325" transform="rotate(-0 145.152 248.18325)">Reheat</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="248.18325" transform="rotate(-0 400.8312 248.18325)">More turbine expansion work</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="248.18325" transform="rotate(-0 759.6792 248.18325)">Additional heat input; η gain not automatic</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="327.67125" transform="rotate(-0 145.152 327.67125)">Regeneration</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="327.67125" transform="rotate(-0 400.8312 327.67125)">Recover exhaust heat for preheating</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="327.67125" transform="rotate(-0 759.6792 327.67125)">Useful if exhaust is hotter than compressed stream</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="407.15925" transform="rotate(-0 145.152 407.15925)">Intercooling</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="407.15925" transform="rotate(-0 400.8312 407.15925)">Reduce compression work</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="407.15925" transform="rotate(-0 759.6792 407.15925)">More heat rejection; often paired with regeneration</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="486.64725" transform="rotate(-0 145.152 486.64725)">Temperature limits</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="486.64725" transform="rotate(-0 400.8312 486.64725)">Constrain peak T and component stress</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="486.64725" transform="rotate(-0 759.6792 486.64725)">Materials/cooling and environmental limits</text>
   </g>
   <g id="text_16">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="578.27875" transform="rotate(-0 504 578.27875)">Compare net work, thermal efficiency, losses, and practical constraints together.</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Cycle modifications change work and heat requirements in different ways</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">0619  •  FIG-02-53-007</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.378125 656.640625)">Qualitative map. Effects depend on the complete cycle and pressure/temperature choices; a modification that increases specific work does not necessarily</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.298437 669.358125)">increase thermal efficiency.</text>
  </g>
