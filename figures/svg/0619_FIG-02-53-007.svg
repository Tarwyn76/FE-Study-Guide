   <ns0:g id="text_1">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="168.69525" transform="rotate(-0 145.152 168.69525)">Modification</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="168.69525" transform="rotate(-0 400.8312 168.69525)">Main role</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="168.69525" transform="rotate(-0 759.6792 168.69525)">Condition / tradeoff</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="248.18325" transform="rotate(-0 145.152 248.18325)">Reheat</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="248.18325" transform="rotate(-0 400.8312 248.18325)">More turbine expansion work</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="248.18325" transform="rotate(-0 759.6792 248.18325)">Additional heat input; η gain not automatic</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="327.67125" transform="rotate(-0 145.152 327.67125)">Regeneration</ns0:text>
   </ns0:g>
   <ns0:g id="text_8">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="327.67125" transform="rotate(-0 400.8312 327.67125)">Recover exhaust heat for preheating</ns0:text>
   </ns0:g>
   <ns0:g id="text_9">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="327.67125" transform="rotate(-0 759.6792 327.67125)">Useful if exhaust is hotter than compressed stream</ns0:text>
   </ns0:g>
   <ns0:g id="text_10">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="407.15925" transform="rotate(-0 145.152 407.15925)">Intercooling</ns0:text>
   </ns0:g>
   <ns0:g id="text_11">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="407.15925" transform="rotate(-0 400.8312 407.15925)">Reduce compression work</ns0:text>
   </ns0:g>
   <ns0:g id="text_12">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="407.15925" transform="rotate(-0 759.6792 407.15925)">More heat rejection; often paired with regeneration</ns0:text>
   </ns0:g>
   <ns0:g id="text_13">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="145.152" y="486.64725" transform="rotate(-0 145.152 486.64725)">Temperature limits</ns0:text>
   </ns0:g>
   <ns0:g id="text_14">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="400.8312" y="486.64725" transform="rotate(-0 400.8312 486.64725)">Constrain peak T and component stress</ns0:text>
   </ns0:g>
   <ns0:g id="text_15">
    <ns0:text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="759.6792" y="486.64725" transform="rotate(-0 759.6792 486.64725)">Materials/cooling and environmental limits</ns0:text>
   </ns0:g>
   <ns0:g id="text_16">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="578.27875" transform="rotate(-0 504 578.27875)">Compare net work, thermal efficiency, losses, and practical constraints together.</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_17">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="106.917" transform="rotate(-0 55.44 106.917)">Cycle modifications change work and heat requirements in different ways</ns0:text>
  </ns0:g>
  <ns0:g id="text_19">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(115.378125 656.640625)">Qualitative map. Effects depend on the complete cycle and pressure/temperature choices; a modification that increases specific work does not necessarily</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.298437 669.358125)">increase thermal efficiency.</ns0:text>
  </ns0:g>
 </ns0:g>
