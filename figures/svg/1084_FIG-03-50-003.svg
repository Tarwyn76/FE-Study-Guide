  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="770.616" transform="rotate(-0 55.44 770.616)">1084  •  FIG-03-50-003</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 717.097875)">Synthetic quotients for compatible oral exposures and a common endpoint, not measured risks for named contaminants. Summation must respect toxicological</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 729.815375)">grouping, route and duration. HI&gt;1 indicates potential concern needing evaluation, not certainty of harm; HI≤1 does not prove zero risk for all possible</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 742.532875)">effects.</text>
  </g>
