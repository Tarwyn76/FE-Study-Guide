  <g id="text_21">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="43.56" transform="rotate(-0 59.4 43.56)">An OC curve shows the probability of accepting a lot at each defect fraction</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="770.616" transform="rotate(-0 59.4 770.616)">1255  •  FIG-03-74-006</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 717.054125)">Assigned single-sampling binomial model, large lot or negligible sampling fraction, independent identically distributed defect classifications. At</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 729.859125)">illustrative good qualityp=.01 producer rejection risk isα; at poor qualityp=.10 consumer acceptance risk isβ. These points are assigned, not an adopted</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 742.576625)">standard plan. Finite-lot sampling without replacement can require a hypergeometric OC curve.</text>
  </g>
