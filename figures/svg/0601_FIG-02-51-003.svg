   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="161.977" transform="rotate(-0 55.44 161.977)">A nozzle converts enthalpy to speed; a diffuser reverses the trade</ns0:text>
  </ns0:g>
  <ns0:g id="text_8">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.371875 656.640625)">Adiabatic, no shaft work, negligible elevation change. For typical subsonic operation pressure falls in a nozzle and rises in a diffuser; area trends can</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(301.032812 669.358125)">reverse for supersonic flow. h must be converted to J/kg in the speed calculation.</ns0:text>
  </ns0:g>
