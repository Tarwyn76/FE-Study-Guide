  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(131.371875 656.640625)">Adiabatic, no shaft work, negligible elevation change. For typical subsonic operation pressure falls in a nozzle and rises in a diffuser; area trends can</text>
