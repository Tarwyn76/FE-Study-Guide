<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Standard angle trigonometric table</title>
<desc id="svg-desc">Color-coded exact sine and cosine values showing the square-root pattern</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1120" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">STANDARD ANGLES — THE SQUARE-ROOT PATTERN</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Sine rises from √0/2 to √4/2; cosine is the same sequence reversed.</text>
<rect x="120" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="250.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">θ</text>
<rect x="380" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="510.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">0°</text>
<rect x="640" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="770.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">30°</text>
<rect x="900" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="1030.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">45°</text>
<rect x="1160" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="1290.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">60°</text>
<rect x="1420" y="250" width="260" height="170" rx="0" fill="#183B5B" stroke="#183B5B" stroke-width="2" />
<text x="1550.0" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">90°</text>
<rect x="120" y="420" width="260" height="170" rx="0" fill="#2F6F9F" stroke="#2F6F9F" stroke-width="2" />
<text x="250.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">sin θ</text>
<rect x="380" y="420" width="260" height="170" rx="0" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="2" />
<text x="510.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√0/2</text>
<rect x="640" y="420" width="260" height="170" rx="0" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="2" />
<text x="770.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√1/2</text>
<rect x="900" y="420" width="260" height="170" rx="0" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="2" />
<text x="1030.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√2/2</text>
<rect x="1160" y="420" width="260" height="170" rx="0" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="2" />
<text x="1290.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√3/2</text>
<rect x="1420" y="420" width="260" height="170" rx="0" fill="#EAF2F8" stroke="#2F6F9F" stroke-width="2" />
<text x="1550.0" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√4/2</text>
<rect x="120" y="590" width="260" height="170" rx="0" fill="#D39A22" stroke="#D39A22" stroke-width="2" />
<text x="250.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">cos θ</text>
<rect x="380" y="590" width="260" height="170" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2" />
<text x="510.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√4/2</text>
<rect x="640" y="590" width="260" height="170" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2" />
<text x="770.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√3/2</text>
<rect x="900" y="590" width="260" height="170" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2" />
<text x="1030.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√2/2</text>
<rect x="1160" y="590" width="260" height="170" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2" />
<text x="1290.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√1/2</text>
<rect x="1420" y="590" width="260" height="170" rx="0" fill="#FFF5DB" stroke="#D39A22" stroke-width="2" />
<text x="1550.0" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√0/2</text>
<rect x="120" y="760" width="260" height="170" rx="0" fill="#2A7F7F" stroke="#2A7F7F" stroke-width="2" />
<text x="250.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">tan θ</text>
<rect x="380" y="760" width="260" height="170" rx="0" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="2" />
<text x="510.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">0</text>
<rect x="640" y="760" width="260" height="170" rx="0" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="2" />
<text x="770.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">1/√3</text>
<rect x="900" y="760" width="260" height="170" rx="0" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="2" />
<text x="1030.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">1</text>
<rect x="1160" y="760" width="260" height="170" rx="0" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="2" />
<text x="1290.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">√3</text>
<rect x="1420" y="760" width="260" height="170" rx="0" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="2" />
<text x="1550.0" y="860" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#172033" text-anchor="middle">undefined</text>
<path d="M 380 850 C 700 970 1150 970 1420 850" fill="none" stroke="#2F6F9F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="900" y="1030" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#2F6F9F" text-anchor="middle">same values — reverse order</text>
</svg>