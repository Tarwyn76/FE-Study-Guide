    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="485.266437" transform="rotate(-0 540 485.266437)">Cycle=12.5 min; payload=24 loose m³; effective fraction=50/60</text>
   </g>
   <g id="text_7">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="569.998375" transform="rotate(-0 540 569.998375)">Q=24(60/12.5)(50/60)=96 loose m³ per clock hour</text>
