   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Earthmoving output follows cycle time, payload, and effective working time</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="700.56" transform="rotate(-0 59.4 700.56)">0944  •  FIG-03-30-003</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(134.065625 650.281875)">Hypothetical repeating truck cycle; spot time is added separately. Effective fraction is50 productive minutes per60-minute clock hour. Payload is loose volume, so</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(123.232031 662.999375)">bank/compacted quantity requires consistent swell/shrink factors. Fleet matching, queuing, road grade, haul speed and loading limits can change production; this is a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(461.950781 675.716875)">single-cycle teaching estimate.</text>
  </g>
