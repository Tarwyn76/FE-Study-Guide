  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">One-dimensional saturated homogeneous Darcy flow. Positive flow is from the higher head on the left toward lower head on the right; vector form is q=−K</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">grad(h). Hydraulic gradient is dimensionless. q is volumetric flux per total section area; v is an average pore-water velocity, not every local pore speed.</text>
  </g>
