  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 723.456625)">Same closed-ground spring as1321. Assigned40–100 N cycle stays below an illustrative5 mm solid-contact margin. L0/D is a slenderness descriptor, not a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 736.174125)">universal buckling threshold; end restraint and guidance matter. Fatigue life is not inferred without material endurance and surface information.</text>
