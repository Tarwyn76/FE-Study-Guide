   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="432.072" y="103.85925" transform="rotate(-0 432.072 103.85925)">INCORRECT FORM</text>
   </g>
   <g id="text_5">
    <!-- $[2\pi\sqrt{Lg}]=\mathsf{L}/\mathsf{T}$ -->
    <g style="fill: #23313d" transform="translate(494.728 155.02824)">
     <text>
      <tspan x="0" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">[</tspan>
      <tspan x="6.242188" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
      <tspan x="60.619858" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">]</tspan>
      <tspan x="69.979233" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="86.50267" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="95.416733" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="100.807358" y="-0.04" style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">T</tspan>
      <tspan x="16.421875" y="-0.04" style="font-style: oblique; font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">π</tspan>
      <tspan x="39.549545" y="-0.328125" style="font-style: oblique; font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="48.463608" y="-0.328125" style="font-style: oblique; font-size: 16px; font-family: 'DejaVu Sans'; fill: #23313d">g</tspan>
      <tspan x="26.054688" y="0.038125" style="font-size: 10.830249px; font-family: 'STIXSizeOneSym'; fill: #23313d">√</tspan>
     </text>
     <rect x="37.549545" y="-17" width="23.070312" height="1"/>
    </g>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="550.008" y="195.463775" transform="rotate(-0 550.008 195.463775)">Length / time, not time</text>
   </g>
   <g id="text_7">
    <text style="font-size: 32px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a23b34" x="360" y="161.4664" transform="rotate(-0 360 161.4664)">≠</text>
   </g>
   <g id="text_8">
    <!-- $T_p=2\pi\sqrt{L/g}$ -->
    <g style="fill: #23313d" transform="translate(296.475 341.3424)">
     <text>
      <tspan x="0" y="-0.255625" style="font-style: oblique; font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">T</tspan>
      <tspan x="61.87207" y="-0.255625" style="font-style: oblique; font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">π</tspan>
      <tspan x="92.202393" y="-0.375" style="font-style: oblique; font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="110.977295" y="-0.375" style="font-style: oblique; font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">g</tspan>
      <tspan x="12.827637" y="3.189688" style="font-style: oblique; font-size: 14.7px; font-family: 'DejaVu Sans'; fill: #23313d">p</tspan>
      <tspan x="26.824219" y="-0.255625" style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="48.51123" y="-0.255625" style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
      <tspan x="103.9021" y="-0.375" style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="74.515137" y="-0.005625" style="font-size: 14.214343px; font-family: 'STIXSizeOneSym'; fill: #23313d">√</tspan>
     </text>
     <rect x="89.577393" y="-21.375" width="37.35498" height="1.3125"/>
    </g>
   </g>
   <g id="text_9">
    <!-- $[\sqrt{L/g}]=\sqrt{\mathsf{L}/(\mathsf{L}\mathsf{T}^{-2})}=\mathsf{T}$ -->
    <g style="fill: #23313d" transform="translate(275.4 389.049)">
     <text>
      <tspan x="0" y="-0.75625" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">[</tspan>
      <tspan x="26.786118" y="-1.125" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="43.236313" y="-0.75625" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">]</tspan>
      <tspan x="52.010727" y="-0.75625" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="81.003448" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="89.360382" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">/</tspan>
      <tspan x="94.414093" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">(</tspan>
      <tspan x="100.266144" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="108.623077" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">T</tspan>
      <tspan x="133.817657" y="-0.521875" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">)</tspan>
      <tspan x="144.467072" y="-0.75625" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">=</tspan>
      <tspan x="159.957794" y="-0.75625" style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">T</tspan>
      <tspan x="5.852051" y="-0.584375" style="font-size: 10.152284px; font-family: 'STIXSizeOneSym'; fill: #23313d">√</tspan>
      <tspan x="18.429184" y="-1.125" style="font-style: oblique; font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">L</tspan>
      <tspan x="31.839828" y="-1.125" style="font-style: oblique; font-size: 15px; font-family: 'DejaVu Sans'; fill: #23313d">g</tspan>
      <tspan x="67.50145" y="-2.021875" style="font-size: 10.944162px; font-family: 'STIXSizeOneSym'; fill: #23313d">√</tspan>
      <tspan x="117.92923" y="-6.264063" style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #23313d">−</tspan>
      <tspan x="126.727081" y="-6.264063" style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #23313d">2</tspan>
     </text>
     <rect x="16.554184" y="-16.125" width="26.682129" height="0.9375"/>
     <rect x="79.128448" y="-19.125" width="62.41626" height="0.9375"/>
