<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Pendulum period dimensional check</title>
<desc id="svg-desc">Incorrect and corrected pendulum period formulas compared by dimensional analysis</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F9F"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B94747"/></marker>
</defs>
<rect width="1800" height="1180" fill="#FFFFFF"/>
<text x="70" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="800" fill="#183B5B" text-anchor="start">DIMENSIONAL CHECK — PENDULUM PERIOD</text>
<text x="70" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#526274" text-anchor="start">Both sides of a physical equation must have the same dimensions.</text>
<rect x="90" y="210" width="720" height="420" rx="18" fill="#FDF0F0" stroke="#B94747" stroke-width="3" />
<rect x="90" y="210" width="720" height="62" rx="18" fill="#B94747" stroke="#B94747" stroke-width="0" />
<text x="115" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">PROPOSED FORM</text>
<text x="115" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Tₚ = 2π√(Lg)</text>
<text x="115" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Left side: [Tₚ] = T</text>
<text x="115" y="401" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Right side: √(L·L/T²) = L/T</text>
<text x="900" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="88" font-weight="800" fill="#B94747" text-anchor="middle">≠</text>
<rect x="990" y="210" width="720" height="420" rx="18" fill="#FDF0F0" stroke="#B94747" stroke-width="3" />
<rect x="990" y="210" width="720" height="62" rx="18" fill="#B94747" stroke="#B94747" stroke-width="0" />
<text x="1015" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">DIMENSION MISMATCH</text>
<text x="1015" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">T</text>
<text x="1015" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">L/T</text>
<text x="1015" y="401" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#172033" text-anchor="start">Not homogeneous → cannot be correct</text>
<rect x="170" y="760" width="1460" height="250" rx="22" fill="#E8F4F1" stroke="#2A7F7F" stroke-width="4" />
<text x="900" y="830" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="#2A7F7F" text-anchor="middle">CORRECTED FORM</text>
<text x="900" y="895" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="800" fill="#172033" text-anchor="middle">Tₚ = 2π√(L/g)</text>
<text x="900" y="955" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="650" fill="#172033" text-anchor="middle">√(L ÷ L/T²) = √(T²) = T</text>
<text x="1530" y="925" font-family="DejaVu Sans, Arial, sans-serif" font-size="66" font-weight="800" fill="#2A7F7F" text-anchor="middle">✓</text>
</svg>