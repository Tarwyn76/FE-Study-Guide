  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(127.038281 656.640625)">Torque and angular speed must refer to the same shaft; positive power magnitude when torque acts with the rotation. n is revolutions per minute, not</text>
