    <ns0:text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="179.182563" transform="rotate(-0 540 179.182563)">REPRESENTATIVE SAMPLING</ns0:text>
   </ns0:g>
   <ns0:g id="text_2">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(170.183125 338.757406)">SLUMP</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(143.115938 365.712094)">Consistency</ns0:text>
   </ns0:g>
   <ns0:g id="text_3">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(471.73125 338.757406)">AIR CONTENT</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(444.454687 365.712094)">Air volume fraction</ns0:text>
   </ns0:g>
   <ns0:g id="text_4">
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(808.85125 338.757406)">UNIT WEIGHT</ns0:text>
    <ns0:text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(809.96375 365.712094)">Fresh density</ns0:text>
   </ns0:g>
   <ns0:g id="text_5">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="200.376" y="543.226813" transform="rotate(-0 200.376 543.226813)">MOLD + IDENTIFY</ns0:text>
   </ns0:g>
   <ns0:g id="text_6">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="540" y="543.226813" transform="rotate(-0 540 543.226813)">CURE / CONDITION</ns0:text>
   </ns0:g>
   <ns0:g id="text_7">
    <ns0:text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="879.624" y="543.226813" transform="rotate(-0 879.624 543.226813)">COMPRESSION TEST</ns0:text>
   </ns0:g>
  </ns0:g>
  <ns0:g id="text_8">
   <ns0:text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="101.152" transform="rotate(-0 59.4 101.152)">Concrete testing follows the sample through fresh properties and hardened strength</ns0:text>
  </ns0:g>
  <ns0:g id="text_9">
</ns0:g>
  <ns0:g id="text_10" transform="translate(0.000000 -38.156309)">
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.641406 650.281875)">Conceptual workflow; fresh tests are performed on representative samples and strength specimens are made under the prescribed method. Slump measures consistency, not</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(153.123437 662.999375)">strength directly. Air method suitability, sample handling, curing, specimen geometry, age and loading conditions affect results; use the governing project</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.508594 675.716875)">specification and current test procedures.</ns0:text>
  </ns0:g>
 </ns0:g>
