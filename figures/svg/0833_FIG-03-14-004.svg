   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="59.4" y="39.6" transform="rotate(-0 59.4 39.6)">Concrete testing follows the sample through fresh properties and hardened strength</text>
  </g>
  <g id="text_9">
</g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(102.641406 650.281875)">Conceptual workflow; fresh tests are performed on representative samples and strength specimens are made under the prescribed method. Slump measures consistency, not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(153.123437 662.999375)">strength directly. Air method suitability, sample handling, curing, specimen geometry, age and loading conditions affect results; use the governing project</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(435.508594 675.716875)">specification and current test procedures.</text>
  </g>
