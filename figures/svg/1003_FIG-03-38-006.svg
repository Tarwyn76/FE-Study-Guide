  <g id="text_13">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23313d" x="55.44" y="39.6" transform="rotate(-0 55.44 39.6)">Load matching removes reflection; open and short loads reflect completely</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="55.44" y="700.56" transform="rotate(-0 55.44 700.56)">1003  •  FIG-03-38-006</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 657.360625)">All cases use a lossless 50 Ω line. Open and short reflections have equal incident magnitude but opposite voltage phase. Matched-load ΓL=0 does not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(55.44 670.078125)">guarantee that the source itself is matched; source reflection is a separate boundary condition.</text>
  </g>
