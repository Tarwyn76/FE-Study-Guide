  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59636c" x="59.4" y="840.672" transform="rotate(-0 59.4 840.672)">1048  •  FIG-03-45-002</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 789.552625)">OSI-to-TCP/IP alignment is conceptual, not a one-to-one implementation mapping. Segment terminology applies to TCP; UDP uses datagrams. Ethernet FCS is a</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(59.4 802.270125)">link-layer trailer; physical transmission carries encoded symbols/bits. Header sizes, IPv6 extension headers, and tunneling are omitted.</text>
  </g>
