    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.932" y="150.341912" transform="rotate(-0 526.932 150.341912)">Typical equilibrium response</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.5664" y="150.341912" transform="rotate(-0 852.5664 150.341912)">Does K change?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="178.3656" y="237.919113" transform="rotate(-0 178.3656 237.919113)">Add reactant</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.932" y="237.919113" transform="rotate(-0 526.932 237.919113)">Toward its consumption</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.5664" y="237.919113" transform="rotate(-0 852.5664 237.919113)">No, if T fixed</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="178.3656" y="325.496312" transform="rotate(-0 178.3656 325.496312)">Increase pressure by compression</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.932" y="325.496312" transform="rotate(-0 526.932 325.496312)">Toward fewer gas moles, if unequal</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.5664" y="325.496312" transform="rotate(-0 852.5664 325.496312)">No, if T fixed</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="178.3656" y="413.073513" transform="rotate(-0 178.3656 413.073513)">Increase temperature</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.932" y="413.073513" transform="rotate(-0 526.932 413.073513)">Toward the endothermic direction</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.5664" y="413.073513" transform="rotate(-0 852.5664 413.073513)">Yes</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="178.3656" y="500.650713" transform="rotate(-0 178.3656 500.650713)">Add catalyst</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="526.932" y="500.650713" transform="rotate(-0 526.932 500.650713)">Faster approach; same equilibrium</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="852.5664" y="500.650713" transform="rotate(-0 852.5664 500.650713)">No</text>
