  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23313d" x="504" y="605.88" transform="rotate(-0 504 605.88)">Other conditions held appropriately fixed. Inert-gas effects depend on constant pressure versus constant volume; no gas-mole difference → no compression shift.</text>
