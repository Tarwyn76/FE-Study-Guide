   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(105.921875 590.616625)">Closed-process illustrative exergy destruction relative to environment T₀. Exergy is not separately conserved: full exergy balances</ns0:text>
   <ns0:text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #23313d" transform="translate(145.833594 603.334125)">include storage and transfer. Destruction is not energy disappearing or necessarily a separate waste-heat stream.</ns0:text>
