<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">FIG-01-02-007</title><desc id="desc">Three rows showing Newton's second law in three unit systems with unit annotations. g_c circled in row 3.</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Newton’s Second Law in Three Unit Systems</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">The physics is unchanged; only the unit bookkeeping differs</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="110" y="190" width="1380" height="175" rx="18" fill="#EAF2F8" stroke="#2878B5" stroke-width="3"/><text x="250" y="245" fill="#2878B5" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">SI</text><text x="790" y="248" fill="#19324A" font-size="39" font-weight="750" text-anchor="middle" dominant-baseline="middle">F = ma</text><text x="790" y="315" fill="#19324A" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">N = kg·m/s²</text><rect x="110" y="410" width="1380" height="175" rx="18" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="3"/><text x="250" y="465" fill="#1B8A8A" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">USCS · slug</text><text x="790" y="468" fill="#19324A" font-size="39" font-weight="750" text-anchor="middle" dominant-baseline="middle">F = ma</text><text x="790" y="535" fill="#19324A" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">lbf = slug·ft/s²</text><rect x="110" y="630" width="1380" height="175" rx="18" fill="#FFF7E6" stroke="#D8782C" stroke-width="3"/><text x="250" y="685" fill="#D8782C" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">USCS · lbm</text><text x="790" y="688" fill="#19324A" font-size="39" font-weight="750" text-anchor="middle" dominant-baseline="middle">F = ma / g_c</text><text x="790" y="755" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">lbf = (lbm·ft/s²) / [lbm·ft/(lbf·s²)]</text><circle cx="993" cy="690" r="55" fill="none" stroke="#C84A4A" stroke-width="5"/><line x1="1060" y1="690" x2="1390" y2="810" stroke="#C84A4A" stroke-width="4" marker-end="url(#arrow-red)"/><rect x="1090" y="790" width="400" height="90" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="1290" y="835" fill="#C84A4A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">g_c: bookkeeping factor, not physics</text><text x="1564" y="912" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-007</text></svg>