<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">FIG-01-02-003</title><desc id="desc">Two-column dimensional check diagram for pendulum period equation showing the mismatch and the corrected form</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Dimensional Check: Pendulum Period</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Compare the dimensions on both sides before trusting an equation</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="90" y="190" width="650" height="310" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="415" y="228" fill="#C84A4A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">PROPOSED FORM</text><text x="415" y="311" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">[Tₚ] = T</text><text x="415" y="363" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">[2π√(Lg)] = √(L·L/T²)</text><text x="415" y="415" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">= L/T</text><text x="800" y="350" fill="#C84A4A" font-size="86" font-weight="800" text-anchor="middle" dominant-baseline="middle">≠</text><rect x="860" y="190" width="650" height="310" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="1185" y="228" fill="#C84A4A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">DIMENSION MISMATCH</text><text x="1185" y="315" fill="#19324A" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">Left side:  T</text><text x="1185" y="363" fill="#19324A" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">Right side:  L/T</text><text x="1185" y="411" fill="#19324A" font-size="26" font-weight="500" text-anchor="middle" dominant-baseline="middle">The equation cannot be correct.</text><rect x="245" y="620" width="1110" height="200" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="800" y="658" fill="#3A8D5D" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">CORRECTED FORM</text><text x="800" y="710" fill="#19324A" font-size="30" font-weight="500" text-anchor="middle" dominant-baseline="middle">Tₚ = 2π√(L/g)</text><text x="800" y="766" fill="#19324A" font-size="30" font-weight="500" text-anchor="middle" dominant-baseline="middle">[2π√(L/g)] = √(L ÷ L/T²) = √(T²) = T</text><circle cx="1330" cy="720" r="44" fill="#3A8D5D" stroke="#FFFFFF" stroke-width="4"/><text x="1330" y="720" fill="#FFFFFF" font-size="44" font-weight="900" text-anchor="middle" dominant-baseline="middle">✓</text><text x="1564" y="892" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-003</text></svg>