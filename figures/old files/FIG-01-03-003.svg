    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Catastrophic Cancellation</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Subtracting nearby values magnifies lost precision</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="480" y="165" width="640" height="75" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="800" y="202" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">SAME EXPRESSION:  Q = (A − B) / C</text><rect x="100" y="280" width="650" height="430" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="425" y="318" fill="#3A8D5D" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">FULL PRECISION</text><text x="425" y="426" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">A − B = 5.1600</text><text x="425" y="484" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">C = 0.015 401 7</text><text x="425" y="542" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">Q = 335.04</text><text x="425" y="600" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">FINAL = 335</text><rect x="850" y="280" width="650" height="430" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="1175" y="318" fill="#C84A4A" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">PREMATURE ROUNDING</text><text x="1175" y="426" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">Round intermediates to 2 sig figs</text><text x="1175" y="484" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">A − B ≈ 5.2   ·   C ≈ 0.015</text><text x="1175" y="542" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">Q ≈ 346.7</text><text x="1175" y="600" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">FINAL = 347</text><text x="800" y="770" fill="#657786" font-size="24" font-weight="800" text-anchor="middle" dominant-baseline="middle">SAME EXPRESSION</text><line x1="715" y1="785" x2="885" y2="785" stroke="#244B6B" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="545" y="830" width="510" height="85" rx="16" fill="#C84A4A" stroke="#C84A4A" stroke-width="2"/><text x="800" y="872" fill="#FFFFFF" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">3.5% ERROR</text><text x="1564" y="932" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-03-003</text></svg>