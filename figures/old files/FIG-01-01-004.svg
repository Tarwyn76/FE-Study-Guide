    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Axial Stress Setup</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Keep force and area units consistent before calculating stress</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="400" y="250" width="360" height="420" rx="4" fill="#EAF2F8" stroke="#244B6B" stroke-width="5"/><line x1="420" y1="285" x2="740" y2="285" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="343" x2="740" y2="343" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="401" x2="740" y2="401" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="459" x2="740" y2="459" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="517" x2="740" y2="517" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="575" x2="740" y2="575" stroke="#C6D9E8" stroke-width="2"/><line x1="420" y1="633" x2="740" y2="633" stroke="#C6D9E8" stroke-width="2"/><line x1="580" y1="160" x2="580" y2="240" stroke="#C84A4A" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="580" y="175" fill="#C84A4A" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">840 kN</text><line x1="580" y1="845" x2="580" y2="690" stroke="#C84A4A" stroke-width="5" marker-end="url(#arrow-red)"/><text x="580" y="809.5" fill="#C84A4A" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">840 kN</text><line x1="400" y1="700" x2="760" y2="700" stroke="#19324A" stroke-width="3"/><text x="580" y="715" fill="#657786" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Rectangular cross-section</text><rect x="970" y="265" width="470" height="310" rx="16" fill="#FFF7E6" stroke="#E2A72E" stroke-width="2"/><text x="1205" y="303" fill="#D8782C" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">AREA CONVERSION</text><text x="1205" y="390" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">1 mm = 10⁻³ m</text><text x="1205" y="438" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">1 mm² = (10⁻³ m)²</text><text x="1205" y="486" fill="#19324A" font-size="28" font-weight="500" text-anchor="middle" dominant-baseline="middle">1 mm² = 10⁻⁶ m²</text><rect x="970" y="620" width="470" height="130" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1205" y="658" fill="#3A8D5D" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">Stress:  σ = F / A</text><text x="1205" y="703" fill="#19324A" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Use N with m² → Pa</text><line x1="790" y1="465" x2="950" y2="420" stroke="#E2A72E" stroke-width="4" marker-end="url(#arrow-amber)"/><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-01-004</text></svg>