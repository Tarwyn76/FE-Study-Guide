e="#B8C7D3" stroke-width="2"/><text x="945" y="390" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">3 mechanical</text><rect x="1140" y="330" width="390" height="120" rx="0" fill="#FFF4E6" stroke="#D8782C" stroke-width="3"/><text x="1335" y="390" fill="#C84A4A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">Over-determined</text><rect x="100" y="450" width="260" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="230" y="510" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">Mass unit</text><rect x="360" y="450" width="390" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="555" y="510" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">kilogram (kg)</text><rect x="750" y="450" width="390" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="945" y="510" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">slug</text><rect x="1140" y="450" width="390" height="120" rx="0" fill="#FFF4E6" stroke="#D8782C" stroke-width="3"/><text x="1335" y="510" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">pound-mass (lbm)</text><rect x="100" y="570" width="260" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="230" y="630" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">Force unit</text><rect x="360" y="570" width="390" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="555" y="630" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">newton (N)</text><rect x="750" y="570" width="390" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="945" y="630" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">pound-force (lbf)</text><rect x="1140" y="570" width="390" height="120" rx="0" fill="#FFF4E6" stroke="#D8782C" stroke-width="3"/><text x="1335" y="630" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">pound-force (lbf)</text><rect x="100" y="690" width="260" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="230" y="750" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">Newton’s 2nd law</text><rect x="360" y="690" width="390" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="555" y="750" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">F = ma</text><rect x="750" y="690" width="390" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="945" y="750" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">F = ma</text><rect x="1140" y="690" width="390" height="120" rx="0" fill="#FFF4E6" stroke="#D8782C" stroke-width="3"/><text x="1335" y="750" fill="#19324A" font-size="23" font-weight="550" text-anchor="middle" dominant-baseline="middle">F = ma / g_c</text><rect x="980" y="825" width="510" height="90" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="1235" y="870" fill="#C84A4A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">WARNING: lbm/lbf needs g_c</text><text x="1564" y="932" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-005</text></svg>