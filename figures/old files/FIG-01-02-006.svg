<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">FIG-01-02-006</title><desc id="desc">Two comparison boxes for g and g_c showing name, variability, units, and nature with warning text between them</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">g versus g_c</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">The same familiar number represents two fundamentally different quantities</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="100" y="210" width="540" height="500" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="370" y="248" fill="#2878B5" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">g — GRAVITATIONAL ACCELERATION</text><text x="370" y="391" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Meaning: local free-fall acceleration</text><text x="370" y="449" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Typical value: ≈ 32.174 ft/s²</text><text x="370" y="507" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Varies: yes, with location and altitude</text><text x="370" y="565" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Nature: measured physical quantity</text><rect x="960" y="210" width="540" height="500" rx="16" fill="#FFF7E6" stroke="#D8782C" stroke-width="2"/><text x="1230" y="248" fill="#D8782C" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">g_c — CONVERSION CONSTANT</text><text x="1230" y="391" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Meaning: unit-system conversion factor</text><text x="1230" y="449" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Value: 32.174 lbm·ft/(lbf·s²)</text><text x="1230" y="507" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Varies: no, by unit definition</text><text x="1230" y="565" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Nature: bookkeeping constant</text><circle cx="800" cy="430" r="115" fill="#FFF2F2" stroke="#C84A4A" stroke-width="4"/><text x="800" y="385" fill="#C84A4A" font-size="23" font-weight="800" text-anchor="middle" dominant-baseline="middle">SAME NUMBER</text><text x="800" y="415" fill="#C84A4A" font-size="23" font-weight="800" text-anchor="middle" dominant-baseline="middle">32.174</text><text x="800" y="445" fill="#C84A4A" font-size="23" font-weight="800" text-anchor="middle" dominant-baseline="middle">NOT THE</text><text x="800" y="475" fill="#C84A4A" font-size="23" font-weight="800" text-anchor="middle" dominant-baseline="middle">SAME THING</text><line x1="640" y1="430" x2="680" y2="430" stroke="#C84A4A" stroke-width="4"/><line x1="920" y1="430" x2="960" y2="430" stroke="#C84A4A" stroke-width="4"/><rect x="390" y="785" width="820" height="85" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="800" y="827" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">g describes nature;  g_c reconciles units.</text><text x="1564" y="892" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-006</text></svg>