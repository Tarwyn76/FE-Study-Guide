    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">CAST Sign Convention</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Read counterclockwise from Quadrant IV: C → A → S → T</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><line x1="360" y1="560" x2="1240" y2="560" stroke="#19324A" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="800" y1="990" x2="800" y2="120" stroke="#19324A" stroke-width="4" marker-end="url(#arrow-navy)"/><circle cx="1040" cy="330" r="82" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="4"/><text x="1040" y="320" fill="#3A8D5D" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="middle">A</text><text x="1040" y="396.5" fill="#3A8D5D" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">ALL positive</text><text x="1040" y="423.5" fill="#3A8D5D" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">sin · cos · tan</text><circle cx="560" cy="330" r="82" fill="#EAF2F8" stroke="#2878B5" stroke-width="4"/><text x="560" y="320" fill="#2878B5" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="middle">S</text><text x="560" y="396.5" fill="#2878B5" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">SINE positive</text><text x="560" y="423.5" fill="#2878B5" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">csc positive</text><circle cx="560" cy="790" r="82" fill="#FFF7E6" stroke="#D8782C" stroke-width="4"/><text x="560" y="780" fill="#D8782C" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="middle">T</text><text x="560" y="856.5" fill="#D8782C" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">TANGENT positive</text><text x="560" y="883.5" fill="#D8782C" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">cot positive</text><circle cx="1040" cy="790" r="82" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="4"/><text x="1040" y="780" fill="#7B5BA7" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="middle">C</text><text x="1040" y="856.5" fill="#7B5BA7" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">COSINE positive</text><text x="1040" y="883.5" fill="#7B5BA7" font-size="20" font-weight="650" text-anchor="middle" dominant-baseline="middle">sec positive</text><text x="660" y="185" fill="#657786" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle">II</text><text x="940" y="185" fill="#657786" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle">I</text><text x="660" y="935" fill="#657786" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle">III</text><text x="940" y="935" fill="#657786" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle">IV</text><path d="M 1130 760 C 1270 520 1210 290 1065 260" fill="none" stroke="#244B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-navy)" stroke-dasharray="9 7"/><path d="M 940 220 C 750 120 520 235 490 390" fill="none" stroke="#244B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-navy)" stroke-dasharray="9 7"/><text x="1564" y="972" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-11-003</text></svg>