<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FIG-01-13-002</title><desc id="desc">Side-by-side diagram showing tip-to-tail and parallelogram methods of vector addition producing the same resultant</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Two Methods of Vector Addition</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Both constructions produce the same resultant R = A + B</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><text x="400" y="190" fill="#2878B5" font-size="28" font-weight="800" text-anchor="middle" dominant-baseline="middle">TIP-TO-TAIL</text><line x1="150" y1="760" x2="480" y2="500" stroke="#2878B5" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="295" y="600" fill="#2878B5" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text><line x1="480" y1="500" x2="720" y2="250" stroke="#1B8A8A" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="625" y="355" fill="#1B8A8A" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">B</text><line x1="150" y1="760" x2="720" y2="250" stroke="#7B5BA7" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="460" y="477" fill="#7B5BA7" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">R</text><text x="400" y="835" fill="#657786" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">Place B at the head of A</text><line x1="800" y1="165" x2="800" y2="875" stroke="#B8C7D3" stroke-width="2" stroke-dasharray="10 8"/><text x="1200" y="190" fill="#1B8A8A" font-size="28" font-weight="800" text-anchor="middle" dominant-baseline="middle">PARALLELOGRAM</text><line x1="930" y1="760" x2="1250" y2="520" stroke="#2878B5" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="1090" y="675" fill="#2878B5" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text><line x1="930" y1="760" x2="1080" y2="360" stroke="#1B8A8A" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="980" y="540" fill="#1B8A8A" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">B</text><line x1="930" y1="760" x2="1400" y2="120" stroke="#7B5BA7" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="1195" y="415" fill="#7B5BA7" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">R</text><line x1="1250" y1="520" x2="1400" y2="120" stroke="#1B8A8A" stroke-width="3" stroke-dasharray="9 7"/><line x1="1080" y1="360" x2="1400" y2="120" stroke="#2878B5" stroke-width="3" stroke-dasharray="9 7"/><text x="1200" y="835" fill="#657786" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">A and B share a tail</text><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-13-002</text></svg>