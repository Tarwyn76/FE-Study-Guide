    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Complex Plane (Argand Diagram)</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">A complex number has rectangular components and a polar magnitude and angle</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><line x1="150" y1="700" x2="1450" y2="700" stroke="#19324A" stroke-width="4" marker-end="url(#arrow-navy)"/><line x1="520" y1="850" x2="520" y2="170" stroke="#19324A" stroke-width="4" marker-end="url(#arrow-navy)"/><text x="1440" y="740" fill="#19324A" font-size="22" font-weight="800" text-anchor="end" dominant-baseline="middle">REAL AXIS</text><text x="555" y="185" fill="#19324A" font-size="22" font-weight="800" text-anchor="start" dominant-baseline="middle">IMAGINARY AXIS</text><line x1="520" y1="290" x2="1120" y2="290" stroke="#B8C7D3" stroke-width="3" stroke-dasharray="10 8"/><line x1="1120" y1="290" x2="1120" y2="700" stroke="#B8C7D3" stroke-width="3" stroke-dasharray="10 8"/><line x1="520" y1="700" x2="1120" y2="290" stroke="#7B5BA7" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="795" y="461" fill="#7B5BA7" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">r = |z|</text><line x1="520" y1="700" x2="1120" y2="700" stroke="#2878B5" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="820" y="735" fill="#2878B5" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">a</text><line x1="1120" y1="700" x2="1120" y2="290" stroke="#1B8A8A" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="1168" y="495" fill="#1B8A8A" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle">jb</text><circle cx="1120" cy="290" r="11" fill="#C84A4A" stroke="#FFFFFF" stroke-width="3"/><text x="1148" y="275" fill="#C84A4A" font-size="30" font-weight="800" text-anchor="start" dominant-baseline="middle">z = a + jb</text><path d="M 635 700 A 115 115 0 0 0 614 634" fill="none" stroke="#D8782C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="632" fill="#D8782C" font-size="33" font-weight="800" text-anchor="middle" dominant-baseline="middle">θ</text><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-12-001</text></svg>