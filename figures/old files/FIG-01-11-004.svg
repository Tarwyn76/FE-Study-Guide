  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Right-Triangle Relationships</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Define opposite and adjacent relative to the selected angle θ</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><polygon points="260,760 1120,760 1120,250" fill="#EAF2F8" stroke="#244B6B" stroke-width="5" stroke-linejoin="round"/><path d="M 1065 760 V 705 H 1120" fill="none" stroke="#19324A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 350 760 A 90 90 0 0 1 337 708" fill="none" stroke="#D8782C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="710" fill="#D8782C" font-size="35" font-weight="800" text-anchor="middle" dominant-baseline="middle">θ</text><text x="690" y="805" fill="#2878B5" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">b · adjacent</text><text x="1170" y="505" fill="#1B8A8A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1170 505)">a · opposite</text><text x="670" y="455" fill="#7B5BA7" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(-30 670 455)">c · hypotenuse</text><rect x="1220" y="250" width="300" height="130" rx="16" fill="#EEF8F6" stroke="#1B8A8A" stroke-width="2"/><text x="1370" y="288" fill="#1B8A8A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">SOH</text><text x="1370" y="333" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">sin θ = a/c</text><rect x="1220" y="430" width="300" height="130" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="1370" y="468" fill="#2878B5" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">CAH</text><text x="1370" y="513" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">cos θ = b/c</text><rect x="1220" y="610" width="300" height="130" rx="16" fill="#FFF7E6" stroke="#D8782C" stroke-width="2"/><text x="1370" y="648" fill="#D8782C" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">TOA</text><text x="1370" y="693" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">tan θ = a/b</text><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-11-004</text></svg>