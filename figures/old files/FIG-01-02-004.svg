<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc"><title id="title">FIG-01-02-004</title><desc id="desc">Three-step flowchart for unit conversion by factor-label method with a decision branch at the cancellation step</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Factor-Label Method</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Units guide the setup and reveal an inverted conversion factor</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="90" y="230" width="285" height="145" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="232.5" y="268" fill="#19324A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">1 · WRITE UNITS</text><text x="232.5" y="320.5" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Start → target</text><line x1="385" y1="302.5" x2="450" y2="302.5" stroke="#244B6B" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="465" y="230" width="285" height="145" rx="16" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="2"/><text x="607.5" y="268" fill="#19324A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">2 · SET UP FRACTIONS</text><text x="607.5" y="307" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Put unwanted unit</text><text x="607.5" y="334" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">opposite itself</text><line x1="760" y1="302.5" x2="825" y2="302.5" stroke="#244B6B" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="840" y="230" width="285" height="145" rx="16" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="2"/><text x="982.5" y="268" fill="#19324A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">3 · CANCEL UNITS</text><text x="982.5" y="307" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Cross out matching</text><text x="982.5" y="334" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">numerator/denominator</text><polygon points="1305,197 1500,302 1305,407 1110,302" fill="#FFF7E6" stroke="#E2A72E" stroke-width="3" stroke-linejoin="round"/><text x="1305" y="289" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">Do all unwanted</text><text x="1305" y="315" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">units cancel?</text><line x1="1135" y1="302" x2="1115" y2="302" stroke="#244B6B" stroke-width="4" marker-end="url(#arrow-navy)"/><rect x="1060" y="650" width="400" height="115" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1260" y="688" fill="#3A8D5D" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">COMPUTE</text><text x="1260" y="725.5" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Use the remaining target unit</text><line x1="1305" y1="407" x2="1260" y2="638" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1335" y="520" fill="#3A8D5D" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><rect x="160" y="650" width="500" height="115" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="410" y="688" fill="#C84A4A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">INVERT THE FACTOR</text><text x="410" y="725.5" fill="#19324A" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">Return to Step 2</text><path d="M 1170 382 V 600 H 720 V 707 H 660" fill="none" stroke="#C84A4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="1138" y="520" fill="#C84A4A" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">NO</text><text x="1564" y="852" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-004</text></svg>