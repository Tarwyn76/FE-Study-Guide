<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FIG-01-12-002</title><desc id="desc">Conversion diagram between rectangular and polar forms of a complex number showing the right-triangle relationship</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Rectangular ↔ Polar Conversion</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">The same right triangle supports both conversion directions</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><polygon points="260,750 960,750 960,260" fill="#EAF2F8" stroke="#244B6B" stroke-width="5" stroke-linejoin="round"/><path d="M 905 750 V 695 H 960" fill="none" stroke="#19324A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="795" fill="#2878B5" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">a · real</text><text x="1020" y="515" fill="#1B8A8A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 1020 515)">b · imaginary</text><text x="600" y="470" fill="#7B5BA7" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(-35 600 470)">r</text><path d="M 375 750 A 115 115 0 0 1 354 684" fill="none" stroke="#D8782C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="680" fill="#D8782C" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="middle">θ</text><rect x="1080" y="220" width="420" height="245" rx="16" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="2"/><text x="1290" y="258" fill="#7B5BA7" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">RECTANGULAR → POLAR</text><text x="1290" y="335.5" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">r = √(a² + b²)</text><text x="1290" y="385.5" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">θ = arctan(b/a)</text><rect x="1080" y="540" width="420" height="245" rx="16" fill="#EEF8F6" stroke="#1B8A8A" stroke-width="2"/><text x="1290" y="578" fill="#1B8A8A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">POLAR → RECTANGULAR</text><text x="1290" y="655.5" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">a = r cos θ</text><text x="1290" y="705.5" fill="#19324A" font-size="27" font-weight="500" text-anchor="middle" dominant-baseline="middle">b = r sin θ</text><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-12-002</text></svg>