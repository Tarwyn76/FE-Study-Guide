    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Standard-Angle Trigonometric Values</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">The sine square-root pattern runs upward; cosine reverses it</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="140" y="230" width="260" height="120" rx="0" fill="#244B6B" stroke="#FFFFFF" stroke-width="2"/><text x="270" y="290" fill="#FFFFFF" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">ANGLE</text><rect x="400" y="230" width="330" height="120" rx="0" fill="#1B8A8A" stroke="#FFFFFF" stroke-width="2"/><text x="565" y="290" fill="#FFFFFF" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">sin θ</text><rect x="730" y="230" width="330" height="120" rx="0" fill="#2878B5" stroke="#FFFFFF" stroke-width="2"/><text x="895" y="290" fill="#FFFFFF" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">cos θ</text><rect x="1060" y="230" width="330" height="120" rx="0" fill="#244B6B" stroke="#FFFFFF" stroke-width="2"/><text x="1225" y="290" fill="#FFFFFF" font-size="27" font-weight="800" text-anchor="middle" dominant-baseline="middle">tan θ</text><rect x="140" y="350" width="260" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="270" y="410" fill="#19324A" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="middle">0°</text><rect x="400" y="350" width="330" height="120" rx="0" fill="#DDF2EF" stroke="#B8C7D3" stroke-width="2"/><text x="565" y="410" fill="#1B8A8A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√0/2 = 0</text><rect x="730" y="350" width="330" height="120" rx="0" fill="#DCEAF4" stroke="#B8C7D3" stroke-width="2"/><text x="895" y="410" fill="#2878B5" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√4/2 = 1</text><rect x="1060" y="350" width="330" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="1225" y="410" fill="#19324A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">0</text><rect x="140" y="470" width="260" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="270" y="530" fill="#19324A" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="middle">30°</text><rect x="400" y="470" width="330" height="120" rx="0" fill="#E8F6F5" stroke="#B8C7D3" stroke-width="2"/><text x="565" y="530" fill="#1B8A8A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√1/2 = 1/2</text><rect x="730" y="470" width="330" height="120" rx="0" fill="#EAF2F8" stroke="#B8C7D3" stroke-width="2"/><text x="895" y="530" fill="#2878B5" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√3/2</text><rect x="1060" y="470" width="330" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="1225" y="530" fill="#19324A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">1/√3</text><rect x="140" y="590" width="260" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="270" y="650" fill="#19324A" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="middle">45°</text><rect x="400" y="590" width="330" height="120" rx="0" fill="#DDF2EF" stroke="#B8C7D3" stroke-width="2"/><text x="565" y="650" fill="#1B8A8A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√2/2</text><rect x="730" y="590" width="330" height="120" rx="0" fill="#DCEAF4" stroke="#B8C7D3" stroke-width="2"/><text x="895" y="650" fill="#2878B5" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√2/2</text><rect x="1060" y="590" width="330" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="1225" y="650" fill="#19324A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">1</text><rect x="140" y="710" width="260" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="270" y="770" fill="#19324A" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="middle">60°</text><rect x="400" y="710" width="330" height="120" rx="0" fill="#E8F6F5" stroke="#B8C7D3" stroke-width="2"/><text x="565" y="770" fill="#1B8A8A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√3/2</text><rect x="730" y="710" width="330" height="120" rx="0" fill="#EAF2F8" stroke="#B8C7D3" stroke-width="2"/><text x="895" y="770" fill="#2878B5" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√1/2 = 1/2</text><rect x="1060" y="710" width="330" height="120" rx="0" fill="#FFFFFF" stroke="#B8C7D3" stroke-width="2"/><text x="1225" y="770" fill="#19324A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√3</text><rect x="140" y="830" width="260" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="270" y="890" fill="#19324A" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="middle">90°</text><rect x="400" y="830" width="330" height="120" rx="0" fill="#DDF2EF" stroke="#B8C7D3" stroke-width="2"/><text x="565" y="890" fill="#1B8A8A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√4/2 = 1</text><rect x="730" y="830" width="330" height="120" rx="0" fill="#DCEAF4" stroke="#B8C7D3" stroke-width="2"/><text x="895" y="890" fill="#2878B5" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">√0/2 = 0</text><rect x="1060" y="830" width="330" height="120" rx="0" fill="#F4F7FA" stroke="#B8C7D3" stroke-width="2"/><text x="1225" y="890" fill="#19324A" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="middle">undefined</text><rect x="390" y="970" width="360" height="70" rx="16" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="2"/><text x="570" y="1005" fill="#1B8A8A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">sin:  √0/2 → √4/2</text><rect x="780" y="970" width="360" height="70" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="960" y="1005" fill="#2878B5" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">cos:  √4/2 → √0/2</text><text x="1564" y="1052" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-11-002</text></svg>