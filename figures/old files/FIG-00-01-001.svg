AF7" stroke="#7B5BA7" stroke-width="2"/><text x="728" y="543" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">2C</text><text x="728" y="625.5" fill="#19324A" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Method</text><rect x="806" y="505" width="118" height="205" rx="16" fill="#FFFFFF" stroke="#7B5BA7" stroke-width="2"/><text x="865" y="543" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">2D</text><text x="865" y="614" fill="#19324A" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Worked</text><text x="865" y="637" fill="#19324A" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Example</text><rect x="943" y="505" width="118" height="205" rx="16" fill="#F0EAF7" stroke="#7B5BA7" stroke-width="2"/><text x="1002" y="543" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">2E</text><text x="1002" y="625.5" fill="#19324A" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Checkpoint</text><rect x="1080" y="505" width="118" height="205" rx="16" fill="#FFFFFF" stroke="#7B5BA7" stroke-width="2"/><text x="1139" y="543" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">2F</text><text x="1139" y="625.5" fill="#19324A" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Transfer</text><rect x="350" y="785" width="900" height="105" rx="16" fill="#FFF7E6" stroke="#E2A72E" stroke-width="2"/><text x="800" y="823" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">L3 — Assessment</text><rect x="350" y="910" width="900" height="105" rx="16" fill="#F3F5F7" stroke="#657786" stroke-width="2"/><text x="800" y="948" fill="#19324A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="midd