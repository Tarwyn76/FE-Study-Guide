ddle">1</text><text x="497.5" y="290" fill="#C84A4A" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">25%</text><line x1="775" y1="348" x2="775" y2="434" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><circle cx="775" cy="333" r="27" fill="#C84A4A" stroke="#FFFFFF" stroke-width="3"/><text x="775" y="334" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">2</text><text x="775" y="290" fill="#C84A4A" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">50%</text><line x1="1052.5" y1="348" x2="1052.5" y2="434" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><circle cx="1052.5" cy="333" r="27" fill="#C84A4A" stroke="#FFFFFF" stroke-width="3"/><text x="1052.5" y="334" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">3</text><text x="1052.5" y="290" fill="#C84A4A" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">75%</text><line x1="1330" y1="348" x2="1330" y2="434" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><circle cx="1330" cy="333" r="27" fill="#C84A4A" stroke="#FFFFFF" stroke-width="3"/><text x="1330" y="334" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">4</text><text x="1330" y="290" fill="#C84A4A" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle">100%</text><rect x="420" y="760" width="760" height="90" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="800" y="805" fill="#19324A" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">Checkpoint rhythm: verify time, question position, and pace</text><text x="1564" y="932" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-00-02-001</text></svg>