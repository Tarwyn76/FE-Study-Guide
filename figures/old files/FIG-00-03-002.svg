<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">FIG-00-03-002</title><desc id="desc">Three sequential boxes labeled Classify, Navigate, Verify with internal checklists and connecting arrows</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Three-Pass Handbook Lookup</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Move from the problem statement to a verified handbook result</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="110" y="250" width="360" height="210" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="290" y="288" fill="#2878B5" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">1 · CLASSIFY</text><text x="290" y="342" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Identify topic</text><text x="290" y="373" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Name target quantity</text><text x="290" y="404" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">List known units</text><rect x="585" y="250" width="360" height="210" rx="16" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="2"/><text x="765" y="288" fill="#1B8A8A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">2 · NAVIGATE</text><text x="765" y="342" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Open likely section</text><text x="765" y="373" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Scan headings</text><text x="765" y="404" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Locate equation/table</text><rect x="1060" y="250" width="360" height="210" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1240" y="288" fill="#3A8D5D" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">3 · VERIFY</text><text x="1240" y="342" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Check definitions</text><text x="1240" y="373" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Confirm units</text><text x="1240" y="404" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Test reasonableness</text><line x1="470" y1="355" x2="570" y2="355" stroke="#244B6B" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="945" y1="355" x2="1045" y2="355" stroke="#244B6B" stroke-width="5" marker-end="url(#arrow-navy)"/><polygon points="765,565 940,650 765,735 590,650" fill="#FFF7E6" stroke="#E2A72E" stroke-width="3" stroke-linejoin="round"/><text x="765" y="624" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">Does the result</text><text x="765" y="650" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">match the question</text><text x="765" y="676" fill="#19324A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">and units?</text><line x1="1240" y1="460" x2="880" y2="585" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1040" y="530" fill="#3A8D5D" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><rect x="1090" y="730" width="340" height="100" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1260" y="780" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">USE THE RESULT</text><line x1="940" y1="650" x2="1080" y2="760" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1035" y="685" fill="#3A8D5D" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><path d="M 590 650 H 350 V 470 H 290" fill="none" stroke="#C84A4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="450" y="620" fill="#C84A4A" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">NO — RECLASSIFY</text><text x="1564" y="902" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-00-03-002</text></svg>