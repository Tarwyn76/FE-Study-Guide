    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">SI Derived-Unit Tree</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Base units combine through physical definitions to form named derived units</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="220" y="170" width="160" height="90" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="300" y="215" fill="#19324A" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">kg</text><rect x="420" y="170" width="160" height="90" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="500" y="215" fill="#19324A" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">m</text><rect x="620" y="170" width="160" height="90" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="700" y="215" fill="#19324A" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">s</text><text x="500" y="295" fill="#2878B5" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">BASE UNITS</text><rect x="260" y="350" width="480" height="100" rx="16" fill="#EEF8F6" stroke="#1B8A8A" stroke-width="2"/><text x="500" y="400" fill="#19324A" font-size="32" font-weight="700" text-anchor="middle" dominant-baseline="middle">F = ma</text><line x1="300" y1="260" x2="500" y2="340" stroke="#1B8A8A" stroke-width="3" marker-end="url(#arrow-teal)"/><line x1="500" y1="260" x2="500" y2="340" stroke="#1B8A8A" stroke-width="3" marker-end="url(#arrow-teal)"/><line x1="700" y1="260" x2="500" y2="340" stroke="#1B8A8A" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="430" y="500" width="180" height="90" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="520" y="545" fill="#19324A" font-size="35" font-weight="700" text-anchor="middle" dominant-baseline="middle">N</text><line x1="500" y1="450" x2="520" y2="490" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><line x1="520" y1="590" x2="320" y2="670" stroke="#7B5BA7" stroke-width="3" marker-end="url(#arrow-purple)"/><line x1="520" y1="590" x2="800" y2="670" stroke="#D8782C" stroke-width="3" marker-end="url(#arrow-amber)"/><rect x="80" y="680" width="400" height="100" rx="16" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="2"/><text x="280" y="730" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Pressure = F / A</text><rect x="190" y="825" width="180" height="85" rx="16" fill="#FFFFFF" stroke="#7B5BA7" stroke-width="2"/><text x="280" y="867" fill="#19324A" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle">Pa</text><line x1="280" y1="780" x2="280" y2="815" stroke="#7B5BA7" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="560" y="680" width="400" height="100" rx="16" fill="#F7F4FB" stroke="#D8782C" stroke-width="2"/><text x="760" y="730" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Work = Fd</text><rect x="670" y="825" width="180" height="85" rx="16" fill="#FFFFFF" stroke="#D8782C" stroke-width="2"/><text x="760" y="867" fill="#19324A" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle">J</text><line x1="760" y1="780" x2="760" y2="815" stroke="#D8782C" stroke-width="3" marker-end="url(#arrow-amber)"/><rect x="1040" y="680" width="400" height="100" rx="16" fill="#F7F4FB" stroke="#C84A4A" stroke-width="2"/><text x="1240" y="730" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Power = W / t</text><rect x="1150" y="825" width="180" height="85" rx="16" fill="#FFFFFF" stroke="#C84A4A" stroke-width="2"/><text x="1240" y="867" fill="#19324A" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle">W</text><line x1="1240" y1="780" x2="1240" y2="815" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><line x1="960" y1="825" x2="1140" y2="730" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><text x="1564" y="952" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-002</text></svg>