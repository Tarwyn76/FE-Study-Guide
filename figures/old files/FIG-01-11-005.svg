<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">FIG-01-11-005</title><desc id="desc">General triangle with all sides and angles labeled showing the law of sines annotation</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">General Triangle and the Law of Sines</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Each side is paired with the sine of its opposite angle</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><polygon points="270,760 1240,760 850,220" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="5" stroke-linejoin="round"/><text x="235" y="790" fill="#C84A4A" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle">A</text><text x="1275" y="790" fill="#C84A4A" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle">B</text><text x="850" y="180" fill="#C84A4A" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle">C</text><text x="755" y="805" fill="#2878B5" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle">c</text><text x="1080" y="455" fill="#1B8A8A" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(54 1080 455)">a</text><text x="520" y="455" fill="#D8782C" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(-48 520 455)">b</text><rect x="390" y="850" width="820" height="100" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="800" y="900" fill="#19324A" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">a / sin A   =   b / sin B   =   c / sin C</text><text x="1564" y="972" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-11-005</text></svg>