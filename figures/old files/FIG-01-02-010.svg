  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Universal Gas Constant R</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Choose the form whose units match the rest of the equation</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><rect x="100" y="190" width="680" height="270" rx="16" fill="#EAF2F8" stroke="#2878B5" stroke-width="2"/><text x="440" y="228" fill="#2878B5" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">SI · ENERGY</text><text x="440" y="301" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">8.314 462 618 J/(mol·K)</text><text x="440" y="343" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle"></text><text x="440" y="385" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Energy and thermodynamic work</text><rect x="820" y="190" width="680" height="270" rx="16" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="2"/><text x="1160" y="228" fill="#1B8A8A" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">SI · PRESSURE–VOLUME</text><text x="1160" y="301" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">8.314 462 618 Pa·m³/(mol·K)</text><text x="1160" y="343" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle"></text><text x="1160" y="385" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">pV calculations in SI</text><rect x="100" y="535" width="680" height="270" rx="16" fill="#FFF7E6" stroke="#D8782C" stroke-width="2"/><text x="440" y="573" fill="#D8782C" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">USCS</text><text x="440" y="646" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">1,545.35 ft·lbf/(lbmol·°R)</text><text x="440" y="688" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle"></text><text x="440" y="730" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">US customary engineering work</text><rect x="820" y="535" width="680" height="270" rx="16" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="2"/><text x="1160" y="573" fill="#7B5BA7" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">CHEMISTRY</text><text x="1160" y="646" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">0.082 057 366 L·atm/(mol·K)</text><text x="1160" y="688" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle"></text><text x="1160" y="730" fill="#19324A" font-size="24" font-weight="500" text-anchor="middle" dominant-baseline="middle">Gas-law calculations using L and atm</text><text x="800" y="860" fill="#657786" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Same constant · different unit packages</text><text x="1564" y="892" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-010</text></svg>