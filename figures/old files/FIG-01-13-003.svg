    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Dot Product Geometry</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">The dot product scales one vector by the component of the other along it</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><line x1="260" y1="700" x2="1250" y2="700" stroke="#2878B5" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="755" y="740" fill="#2878B5" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text><line x1="260" y1="700" x2="870" y2="250" stroke="#1B8A8A" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="545" y="443" fill="#1B8A8A" font-size="31" font-weight="700" text-anchor="middle" dominant-baseline="middle">B</text><line x1="870" y1="250" x2="870" y2="700" stroke="#B8C7D3" stroke-width="3" stroke-dasharray="10 8"/><line x1="260" y1="660" x2="870" y2="660" stroke="#D8782C" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="565" y="630" fill="#D8782C" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="middle">|B| cos θ</text><path d="M 410 700 A 150 150 0 0 0 365 590" fill="none" stroke="#7B5BA7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="580" fill="#7B5BA7" font-size="34" font-weight="800" text-anchor="middle" dominant-baseline="middle">θ</text><path d="M 815 700 V 645 H 870" fill="none" stroke="#19324A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1010" y="240" width="470" height="180" rx="16" fill="#F7F4FB" stroke="#7B5BA7" stroke-width="2"/><text x="1245" y="278" fill="#7B5BA7" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="middle">SCALAR RESULT</text><text x="1245" y="327" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">A · B = |A||B| cos θ</text><text x="1245" y="369" fill="#19324A" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="middle">No direction</text><text x="565" y="790" fill="#D8782C" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">Projection of B onto A</text><text x="1564" y="872" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-13-003</text></svg>