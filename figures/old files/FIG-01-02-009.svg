<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">FIG-01-02-009</title><desc id="desc">Decision flowchart for choosing temperature scale based on equation type and degree size</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Choosing a Temperature Scale</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Start with the role temperature plays in the equation</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><polygon points="800,155 1010,245 800,335 590,245" fill="#EAF2F8" stroke="#2878B5" stroke-width="3" stroke-linejoin="round"/><text x="800" y="232" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">Does the equation</text><text x="800" y="258" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">use bare T?</text><rect x="1030" y="430" width="460" height="115" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1260" y="468" fill="#3A8D5D" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">USE AN ABSOLUTE SCALE</text><text x="1260" y="505.5" fill="#19324A" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="middle">K for SI  ·  °R for USCS</text><line x1="955" y1="245" x2="1260" y2="420" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1115" y="305" fill="#3A8D5D" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><polygon points="560,485 770,575 560,665 350,575" fill="#FFF7E6" stroke="#E2A72E" stroke-width="3" stroke-linejoin="round"/><text x="560" y="562" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">Is the term only</text><text x="560" y="588" fill="#19324A" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">ΔT?</text><line x1="650" y1="325" x2="590" y2="480" stroke="#C84A4A" stroke-width="4" marker-end="url(#arrow-red)"/><text x="590" y="400" fill="#C84A4A" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">NO</text><rect x="760" y="760" width="620" height="115" rx="16" fill="#E8F6F5" stroke="#1B8A8A" stroke-width="2"/><text x="1070" y="798" fill="#1B8A8A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">USE EITHER SCALE IN A MATCHED PAIR</text><text x="1070" y="835.5" fill="#19324A" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="middle">Δ°C = ΔK   ·   Δ°F = Δ°R</text><line x1="680" y1="630" x2="930" y2="750" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="820" y="672" fill="#3A8D5D" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><rect x="90" y="760" width="510" height="115" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="345" y="798" fill="#C84A4A" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">CROSSING DEGREE SIZES?</text><text x="345" y="835.5" fill="#19324A" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="middle">Apply the factor 1.8</text><line x1="450" y1="650" x2="350" y2="750" stroke="#C84A4A" stroke-width="4" marker-end="url(#arrow-red)"/><text x="330" y="690" fill="#C84A4A" font-size="18" font-weight="800" text-anchor="middle" dominant-baseline="middle">NO / CONVERT</text><text x="1564" y="902" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-02-009</text></svg>