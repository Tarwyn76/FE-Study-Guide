<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="910" viewBox="0 0 1600 910" role="img" aria-labelledby="title desc"><title id="title">FIG-01-03-002</title><desc id="desc">Decision flowchart for classifying whether a digit is significant based on its position</desc><defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244B6B"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878B5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B8A8A"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3A8D5D"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E2A72E"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84A4A"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5BA7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19324A" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,Segoe UI,DejaVu Sans,Arial,sans-serif} .thin{font-weight:400}</style>
  </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="80" y="62" fill="#102432" font-size="36" font-weight="750" text-anchor="start" dominant-baseline="middle">Is This Digit Significant?</text><text x="80" y="102" fill="#657786" font-size="21" font-weight="500" text-anchor="start" dominant-baseline="middle">Use the digit’s value and position to classify it</text><line x1="80" y1="128" x2="1520" y2="128" stroke="#B8C7D3" stroke-width="2"/><polygon points="800,140 1010,215 800,290 590,215" fill="#EAF2F8" stroke="#2878B5" stroke-width="3" stroke-linejoin="round"/><text x="800" y="202" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Is the digit</text><text x="800" y="228" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">nonzero?</text><rect x="1080" y="360" width="370" height="100" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="1265" y="410" fill="#3A8D5D" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">SIGNIFICANT</text><line x1="980" y1="215" x2="1265" y2="350" stroke="#3A8D5D" stroke-width="4" marker-end="url(#arrow-green)"/><text x="1100" y="260" fill="#3A8D5D" font-size="19" font-weight="800" text-anchor="middle" dominant-baseline="middle">YES</text><polygon points="570,375 765,450 570,525 375,450" fill="#FFF7E6" stroke="#E2A72E" stroke-width="3" stroke-linejoin="round"/><text x="570" y="450" fill="#19324A" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle">Where is the zero?</text><line x1="700" y1="280" x2="610" y2="375" stroke="#C84A4A" stroke-width="4" marker-end="url(#arrow-red)"/><text x="630" y="325" fill="#C84A4A" font-size="19" font-weight="800" text-anchor="middle" dominant-baseline="middle">NO</text><rect x="80" y="690" width="330" height="160" rx="16" fill="#FFF2F2" stroke="#C84A4A" stroke-width="2"/><text x="245" y="728" fill="#C84A4A" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">LEADING</text><text x="245" y="773.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">Not significant</text><text x="245" y="802.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">0.0042 → zeros ignored</text><line x1="570" y1="525" x2="245" y2="680" stroke="#C84A4A" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="450" y="690" width="330" height="160" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="615" y="728" fill="#3A8D5D" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">SANDWICHED</text><text x="615" y="773.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">Significant</text><text x="615" y="802.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">1002 → both zeros count</text><line x1="570" y1="525" x2="615" y2="680" stroke="#3A8D5D" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="820" y="690" width="330" height="160" rx="16" fill="#EDF7F0" stroke="#3A8D5D" stroke-width="2"/><text x="985" y="728" fill="#3A8D5D" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">TRAILING + DECIMAL</text><text x="985" y="773.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">Significant</text><text x="985" y="802.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">2.300 → zeros count</text><line x1="570" y1="525" x2="985" y2="680" stroke="#3A8D5D" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="1190" y="690" width="330" height="160" rx="16" fill="#FFF7E6" stroke="#D8782C" stroke-width="2"/><text x="1355" y="728" fill="#D8782C" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">TRAILING · WHOLE</text><text x="1355" y="773.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">Ambiguous</text><text x="1355" y="802.5" fill="#19324A" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">1500 → use notation</text><line x1="570" y1="525" x2="1355" y2="680" stroke="#D8782C" stroke-width="3" marker-end="url(#arrow-amber)"/><text x="570" y="580" fill="#E2A72E" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">ZERO</text><text x="1564" y="882" fill="#657786" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">FIG-01-03-002</text></svg>