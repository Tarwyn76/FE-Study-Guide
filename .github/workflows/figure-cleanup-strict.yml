name: Full strict figure validation 0000-1403

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/cleanup_figures_strict.py
      - .github/workflows/figure-cleanup-strict.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-strict-figure-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
          fetch-depth: 0

      - name: Restore all canonical figures from main
        run: |
          git fetch origin main
          git checkout origin/main -- figures/png figures/svg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow numpy

      - name: Verify canonical figure structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          pat = re.compile(r"^(\d{4})_(FIG-\d{2}-\d{2}-\d{3})\.(png|svg)$", re.I)
          sets = {}
          for ext in ("png", "svg"):
              found = {}
              for p in (root / "figures" / ext).glob(f"*.{ext}"):
                  m = pat.fullmatch(p.name)
                  if m:
                      found[int(m.group(1))] = m.group(2).upper()
              sets[ext] = found
          expected = set(range(1404))
          for ext in ("png", "svg"):
              missing = sorted(expected - set(sets[ext]))
              extra = sorted(set(sets[ext]) - expected)
              if missing or extra or len(sets[ext]) != 1404:
                  raise SystemExit(f"{ext}: count={len(sets[ext])} missing={missing} extra={extra}")
          mismatches = [i for i in sorted(expected) if sets["png"][i] != sets["svg"][i]]
          if mismatches:
              raise SystemExit(f"PNG/SVG figure-ID mismatches: {mismatches}")
          print("Canonical structure PASS: 1404 PNG/SVG pairs, indices 0000-1403")
          PY

      - name: Run strict cleanup for all figures
        run: |
          python tools/cleanup_figures_strict.py --start 0 --end 1403

      - name: Run current-standards validation for all figures
        run: |
          python tools/validate_figures_current.py

      - name: Commit regenerated canonical assets and validation reports if needed
        run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figures/png figures/svg meta
          if git diff --cached --quiet; then
            echo "Full strict validation passed with no regenerated asset changes."
            exit 0
          fi
          git commit -m "Full strict validation figures 0000-1403"
          git push origin HEAD:figure-cleanup-strict
