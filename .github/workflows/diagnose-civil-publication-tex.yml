name: Diagnose civil publication TeX
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - .github/workflows/diagnose-civil-publication-tex.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: python tools/build_publication.py --route civil
      - name: Generate intermediate LaTeX
        run: |
          pandoc "build/publication/fe-study-guide-civil.md"             --from "markdown-yaml_metadata_block+tex_math_dollars+fenced_divs+bracketed_spans"             --metadata-file "build/publication/fe-study-guide-civil.yaml"             --resource-path=.             --top-level-division=chapter             --toc             -t latex             -o build/publication/civil-debug.tex
      - name: Show failing TeX region
        run: |
          nl -ba build/publication/civil-debug.tex | sed -n '33895,33955p'
          echo "--- suspicious left/right outside inline math ---"
          grep -n -E '^[[:space:]]*(=|\\left|\\right)' build/publication/civil-debug.tex | head -200 || true
