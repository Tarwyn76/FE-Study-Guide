name: Final targeted figure revalidation

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/revalidate_final_reviews.py
      - .github/workflows/revalidate-final-reviews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow numpy
      - run: python tools/revalidate_final_reviews.py
      - run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/figure-final-targeted-revalidation.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record final targeted figure revalidation"
            git push origin HEAD:figure-cleanup-strict
          fi
