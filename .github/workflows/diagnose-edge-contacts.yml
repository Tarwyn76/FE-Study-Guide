name: Diagnose figure edge contacts

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/diagnose_edge_contacts.py
      - .github/workflows/diagnose-edge-contacts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow numpy
      - id: diag
        continue-on-error: true
        run: python tools/diagnose_edge_contacts.py
      - run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/figure-edge-contact-diagnostic.csv meta/figure-edge-contact-diagnostic.md
          if ! git diff --cached --quiet; then
            git commit -m "Diagnose figure edge-contact review cases"
            git push origin HEAD:figure-cleanup-strict
          fi
      - if: steps.diag.outcome == 'failure'
        run: exit 1
