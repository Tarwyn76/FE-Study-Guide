name: Content release-readiness audit
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/content_release_readiness.py
      - .github/workflows/content-release-readiness.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python tools/content_release_readiness.py
      - name: Commit appendix and review artifacts
        run: |
          git config user.name "ChatGPT FE Release Prep"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appendices/formula-register.md appendices/chapter-appendix-crosswalk.md meta/release-readiness
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add content release-readiness review and appendix traceability"
          git push origin HEAD:figure-cleanup-strict
