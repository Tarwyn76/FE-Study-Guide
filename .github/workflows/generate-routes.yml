name: Generate and audit FE routes
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/generate_routes.py
      - tools/audit_routes.py
      - .github/workflows/generate-routes.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: generate-fe-routes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - name: Generate routes
        run: python tools/generate_routes.py
      - name: Audit routes
        run: python tools/audit_routes.py .
      - name: Commit generated routes
        run: |
          git config user.name "ChatGPT Route Builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add routes/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate complete FE study routes"
          git pull --rebase origin figure-cleanup-strict
          git push origin HEAD:figure-cleanup-strict
