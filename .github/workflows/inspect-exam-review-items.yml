name: Inspect exam review items
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/inspect_exam_review_items.py
      - .github/workflows/inspect-exam-review-items.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - run: python tools/inspect_exam_review_items.py
