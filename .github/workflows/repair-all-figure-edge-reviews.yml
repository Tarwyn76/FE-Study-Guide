name: Repair remaining figure edge reviews

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/repair_all_figure_edge_reviews.py
      - .github/workflows/repair-all-figure-edge-reviews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow numpy
      - name: Repair all current edge reviews adaptively
        run: python tools/repair_all_figure_edge_reviews.py
      - name: Revalidate entire corpus
        id: validate
        continue-on-error: true
        run: python tools/validate_figures_current.py
      - name: Commit all repairs and validation reports
        run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figures/png figures/svg meta/figure-edge-repair-current.csv meta/figure-current-standards-validation.csv meta/figure-current-standards-validation.md
          if ! git diff --cached --quiet; then
            git commit -m "Repair remaining figure edge reviews"
            git push origin HEAD:figure-cleanup-strict
          fi
      - name: Print final validation status
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open("meta/figure-current-standards-validation.csv",encoding="utf-8-sig")))
          p=sum(r["status"]=="PASS" for r in rows)
          r=sum(r["status"]=="REVIEW" for r in rows)
          f=sum(r["status"]=="FAIL" for r in rows)
          print(f"FINAL PASS={p} REVIEW={r} FAIL={f}")
          PY
