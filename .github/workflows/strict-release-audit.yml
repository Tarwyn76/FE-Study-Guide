name: Strict FE release audit
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/run_release_audit.py
      - .github/workflows/strict-release-audit.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyyaml
      - name: Run strict master release audit
        run: |
          set +e
          python tools/run_release_audit.py . | tee strict-release-audit.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > .strict-release-audit-exit-code
          exit 0
      - name: Print manuscript hard errors
        if: always()
        run: |
          if [ -f tools/validation/technical-audit/Technical-Audit-Issues.csv ]; then
            python -c "import csv; p='tools/validation/technical-audit/Technical-Audit-Issues.csv'; f=open(p,encoding='utf-8-sig',newline=''); [print(r) for r in csv.DictReader(f) if r.get('severity') in ('CRITICAL','ERROR')]"
          fi
      - name: Print warning and review summary
        if: always()
        run: |
          if [ -f tools/validation/technical-audit/Technical-Audit-Issues.csv ]; then
            python -c "import csv,collections; p='tools/validation/technical-audit/Technical-Audit-Issues.csv'; rows=list(csv.DictReader(open(p,encoding='utf-8-sig',newline=''))); cats=collections.Counter((r['severity'],r['category']) for r in rows if r['severity'] in ('WARNING','REVIEW')); print('CATEGORY_COUNTS'); [print(k[0],k[1],v) for k,v in sorted(cats.items(), key=lambda x:(x[0][0],-x[1],x[0][1]))]; print('SAMPLES'); [print(r['severity'],r['category'],r['chapter'],r['section'],r['message']) for r in rows if r['severity'] in ('WARNING','REVIEW')][:80]"
          fi
      - name: Upload release audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-release-audit
          path: |
            strict-release-audit.log
            .strict-release-audit-exit-code
            audit-results
            tools/validation/technical-audit
      - name: Enforce release gate
        run: |
          if [ "$(cat .strict-release-audit-exit-code)" != "0" ]; then
            echo "Strict release audit has blockers"
            exit 1
          fi
