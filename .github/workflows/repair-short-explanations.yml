name: Repair short FE explanations
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/repair_short_explanations.py
      - .github/workflows/repair-short-explanations.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Repair short explanations
        run: python tools/repair_short_explanations.py
      - name: Run technical audit
        run: |
          python -m pip install pyyaml
          python tools/technical_audit_all_layers.py --root . --out tools/validation/technical-audit
      - name: Print remaining short-explanation counts
        run: |
          python -c "import csv,collections; r=list(csv.DictReader(open('tools/validation/technical-audit/Technical-Audit-Issues.csv',encoding='utf-8-sig'))); c=collections.Counter(x['category'] for x in r if x['category'] in ('assessment_explanation_short','worked_example_short_solution')); print(c)"
      - name: Commit repairs
        run: |
          git config user.name "ChatGPT FE Cleanup"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add layer-1-substrate layer-3-tracks/chemical
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expand short worked examples and assessment explanations"
          git push origin HEAD:figure-cleanup-strict
