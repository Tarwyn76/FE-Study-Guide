name: Reconcile Layer-1 Handbook verification
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/reconcile_handbook_verification.py
      - .github/workflows/reconcile-handbook-verification.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - run: python tools/reconcile_handbook_verification.py
      - run: python tools/technical_audit_all_layers.py --root . --out tools/validation/technical-audit
      - name: Show source review counts
        run: python -c "import csv,collections; r=list(csv.DictReader(open('tools/validation/technical-audit/Technical-Audit-Issues.csv',encoding='utf-8-sig'))); print(collections.Counter((x['severity'],x['category']) for x in r if x['category'] in ('handbook_claim_unverified','handbook_memorize_claim_unverified','source_split_unresolved')))"
      - name: Commit verified ledger
        run: |
          git config user.name "ChatGPT FE Cleanup"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/ledger.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile verified Layer-1 Handbook references"
          git push origin HEAD:figure-cleanup-strict
