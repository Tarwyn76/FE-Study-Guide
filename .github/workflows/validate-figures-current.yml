name: Validate all figures against current standards

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/validate_figures_current.py
      - .github/workflows/validate-figures-current.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow numpy

      - name: Validate all canonical figures
        id: validate
        continue-on-error: true
        run: python tools/validate_figures_current.py

      - name: Commit validation reports
        run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/figure-current-standards-validation.csv meta/figure-current-standards-validation.md
          if ! git diff --cached --quiet; then
            git commit -m "Revalidate all figures against current standards"
            git push origin HEAD:figure-cleanup-strict
          fi

      - name: Enforce validation result
        if: steps.validate.outcome == 'failure'
        run: exit 1
