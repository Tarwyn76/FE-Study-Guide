name: Build and audit Environmental practice exams A-B
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - tools/build_environmental_practice_exams.py
      - .github/workflows/build-environmental-practice-exams.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: figure-cleanup-strict, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyyaml
      - name: Build Environmental A and B
        run: python tools/build_environmental_practice_exams.py
      - name: Audit exams and print findings
        run: |
          set +e
          python tools/technical_audit_exams.py . --outdir audit-results/exams --allow-incomplete
          rc=$?
          latest=$(ls -1t audit-results/exams/Exam-Audit-Issues*.csv | head -1)
          cat "$latest"
          echo "$rc" > audit-results/exams/.audit-exit-code
          exit 0
      - name: Commit Environmental exam pair
        run: |
          git config user.name "ChatGPT Exam Builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appendices/practice-exams/environmental-practice-a.yaml appendices/practice-exams/environmental-practice-a.md
          git add appendices/practice-exams/environmental-practice-b.yaml appendices/practice-exams/environmental-practice-b.md
          git add audit-results/exams
          if [ "$(cat audit-results/exams/.audit-exit-code)" != "0" ]; then echo "Audit has blockers"; exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Environmental practice exams A and B"
          git push origin HEAD:figure-cleanup-strict
