name: Fix figure text edge contacts

on:
  push:
    branches:
      - figure-cleanup-strict
    paths:
      - tools/fix_text_edge_contacts.py
      - .github/workflows/fix-text-edge-contacts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg
      - run: python tools/fix_text_edge_contacts.py
      - run: |
          git config user.name "ChatGPT Figure QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figures/png figures/svg meta/figure-text-edge-padding-fixes.csv
          if ! git diff --cached --quiet; then
            git commit -m "Pad text-edge figures to prevent clipping"
            git push origin HEAD:figure-cleanup-strict
          fi
