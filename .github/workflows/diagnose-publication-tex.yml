name: Diagnose publication TeX failure
on:
  push:
    branches: [figure-cleanup-strict]
    paths:
      - .github/workflows/diagnose-publication-tex.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figure-cleanup-strict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: python tools/build_publication.py --route chemical
      - name: Generate intermediate LaTeX
        run: |
          pandoc "build/publication/fe-study-guide-chemical.md" \
            --from "markdown-yaml_metadata_block+raw_tex+tex_math_dollars+tex_math_single_backslash+fenced_divs+bracketed_spans" \
            --metadata-file "build/publication/fe-study-guide-chemical.yaml" \
            --resource-path=. \
            --top-level-division=chapter \
            --toc \
            -t latex \
            -o build/publication/chemical-debug.tex
      - name: Scan suspicious TeX patterns
        run: |
          echo "--- escaped-star math patterns ---"
          grep -n -E '\\[\^_]\\\\\*' build/publication/chemical-debug.tex | head -200 || true
          echo "--- escaped dollar before TeX command ---"
          grep -n -E '\\\$\\\\(left|right|frac|dfrac|tfrac|sqrt|boxed|sum|int|begin|end|text|lim|lvert|rvert|vec|mathbf|mathrm|pi|theta|alpha|beta|gamma|rho|sigma|mu|Delta)' build/publication/chemical-debug.tex | head -300 || true
          echo "--- literal tag commands ---"
          grep -n -F '\\tag{' build/publication/chemical-debug.tex | head -200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: chemical-publication-debug-tex
          path: build/publication/chemical-debug.tex
          retention-days: 7
