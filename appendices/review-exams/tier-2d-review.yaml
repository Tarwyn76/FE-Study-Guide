items:
- id: T2D-Q001
  source_chapter: 02-41
  source_question: 9
  source_category: conceptual
  requires_concepts:
  - FLUID-2D-041-02
  prompt: What is the most likely error if **fluid pressure** is used without checking state, geometry, flow regime, or property
    assumptions?
  solution: The equation or property may be applied outside its valid model. Identify the state/geometry/regime first, then
    apply **fluid pressure**.
