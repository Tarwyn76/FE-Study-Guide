items:
- id: T1A-Q001
  source_chapter: 01-02
  source_question: 17
  source_category: calculation
  requires_concepts:
  - MATH-1A-002-03
  prompt: "A mass of $180 \\text{ lbm}$ rests on a frictionless horizontal surface.\n    (a) What is its weight at standard\
    \ gravity, in lbf?\n    (b) A horizontal force of $45 \\text{ lbf}$ is applied. Find the\n    acceleration in ft/s² using\
    \ the $g_c$ method.\n    (c) Repeat using the slug method.\n    (d) Verify using the force-to-weight ratio shortcut."
  solution: '**


    (a) At standard gravity, $g/g_c = 1$ numerically:


    $$F_W = \frac{mg}{g_c} = \frac{(180)(32.174)}{32.174} = \boxed{180 \text{ lbf}}$$


    (b) $g_c$ method:


    $$a = \frac{Fg_c}{m} = \frac{(45)(32.174)}{180} = \frac{1{,}447.8}{180} = \boxed{8.043 \text{ ft/s}^2}$$


    (c) Slug method:


    $$m = \frac{180}{32.174} = 5.594 \text{ slug} \qquad a = \frac{45}{5.594} = \boxed{8.045 \text{ ft/s}^2}$$


    (d) Ratio shortcut: applied force over weight is $45/180 = 0.250$, so


    $$a = (0.250)(32.174) = \boxed{8.044 \text{ ft/s}^2} \;\checkmark$$


    Three methods, one answer to three figures.'
- id: T1A-Q002
  source_chapter: 01-03
  source_question: 11
  source_category: calculation
  requires_concepts:
  - MATH-1A-003-02
  prompt: "Perform each calculation and round to the appropriate number of\n    significant figures:\n    (a) $3.61 \\times\
    \ 10^4 \\times 1.8 \\times 10^{-2}$\n    (b) $\\dfrac{4.728}{0.042}$\n    (c) $18.34 + 5.2 + 0.846$\n    (d) $1{,}280.0\
    \ - 976.3$\n    (e) $(6.4 \\times 10^3)(8.21 \\times 10^{-2}) \\div 1.8$\n    (f) $14.82 + 0.003 - 5.7$"
  solution: '**

    (a) Mantissas: $3.61 \times 1.8 = 6.498$. Exponents: $4 + (-2) = 2$.

    Result $= 6.498 \times 10^2$. Limiting: 2 sig figs (from 1.8).

    $\boxed{6.5 \times 10^2}$


    (b) $4.728 \div 0.042 = 112.57...$. Limiting: 2 sig figs (from 0.042).

    $\boxed{110}$ or $1.1 \times 10^2$.


    (c) Decimal-place rule. $18.34$ (hundredths), $5.2$ (tenths), $0.846$

    (thousandths). Limiting: tenths from $5.2$. Sum $= 24.386 \rightarrow

    \boxed{24.4}$


    (d) $1{,}280.0 - 976.3 = 303.7$. Both to tenths → $\boxed{303.7}$.


    (e) $(6.4 \times 10^3)(8.21 \times 10^{-2}) = 526.4$, then $\div 1.8 =

    292.4...$. Limiting: 2 sig figs (from 6.4 and 1.8) → $\boxed{290}$ or $2.9

    \times 10^2$.


    (f) $14.82 + 0.003 - 5.7$. Tenths from $5.7$ is limiting. $= 9.123

    \rightarrow \boxed{9.1}$.'
- id: T1A-Q003
  source_chapter: 01-01
  source_question: 3
  source_category: conceptual
  requires_concepts:
  - MATH-1A-001-02
  prompt: "Explain the reasoning behind the direction rule for scientific notation:\n   why does moving the decimal point\
    \ left produce a *larger* exponent?"
  solution: '** Because the value of the number doesn''t change — only its

    representation. Moving the decimal left makes the mantissa *smaller*, so the

    exponent must grow *larger* to compensate and preserve the product. Small

    mantissa, big exponent. Understanding it this way removes the need to

    memorize a direction. (§1.3)'
- id: T1A-Q004
  source_chapter: 01-02
  source_question: 10
  source_category: conceptual
  requires_concepts:
  - MATH-1A-002-04
  prompt: "Explain the difference between converting a temperature *value* and\n    converting a temperature *difference*.\
    \ Why do the offsets cancel in a\n    difference?"
  solution: '** A **value** must account for the offset between zero points: $100 \;

    ^\circ\text{C} = 373.15 \text{ K}$. A **difference** does not, because both

    endpoints shift by the same offset and the shift cancels in the subtraction:


    $$(T_2 + 273.15) - (T_1 + 273.15) = T_2 - T_1$$


    So $\Delta T$ of 80 °C is $\Delta T$ of 80 K. Crossing degree *sizes* still

    requires the 1.8, since that concerns degree size rather than zero point.

    (§2.7)'
- id: T1A-Q005
  source_chapter: 01-02
  source_question: 4
  source_category: conceptual
  requires_concepts:
  - MATH-1A-002-01
  prompt: "State the principle of dimensional homogeneity. Explain why it is necessary\n   but not sufficient for an equation\
    \ to be correct."
  solution: '** Every term in a physically valid equation must have the same dimensions;

    you cannot add a length to a time. **Necessary**, because a dimensionally

    inhomogeneous equation is certainly wrong. **Not sufficient**, because a

    missing factor of 2, a wrong sign, or a wrong dimensionless coefficient all

    pass the dimensional test cleanly. It catches one whole class of error and is

    silent about another. (§2.4)'
- id: T1A-Q006
  source_chapter: 01-03
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1A-003-01
  prompt: "Explain catastrophic cancellation. Why is the relative error in a\n   difference large when two nearly equal numbers\
    \ are subtracted?"
  solution: '** When two nearly equal numbers are subtracted, their absolute errors

    (which haven''t changed) become a large fraction of the small result. Example:

    $1{,}254.3 \pm 0.1$ minus $1{,}251.7 \pm 0.1$ gives $2.6 \pm 0.2$ — the

    absolute error is unchanged at 0.1 for each term, but the relative error in

    the result is $0.2/2.6 \approx 8\%$, whereas the inputs had relative errors of

    $0.1/1{,}253 \approx 0.008\%$. The cancellation of the large parts leaves the

    small errors dominant. (§3.6)'
- id: T1A-Q007
  source_chapter: 01-01
  source_question: 32
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-001-01
  prompt: "Which of these expressions is a correct calculator entry for\n    $\\dfrac{a+b}{c+d}$?\n    A) `a + b / c + d`\n\
    \    B) `(a + b) / c + d`\n    C) `a + b / (c + d)`\n    D) `(a + b) / (c + d)`"
  solution: 'D — `(a + b) / (c + d)`.** The fraction bar groups the entire numerator

    and the entire denominator, so both need parentheses. (A) computes

    $a + \frac{b}{c} + d$. (B) and (C) each parenthesize one side and leave the

    other exposed, which is the half-remembered version of the habit and still

    gives a wrong answer. (§1.2)'
- id: T1A-Q008
  source_chapter: 01-03
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-003-02
  prompt: "When should an intermediate result in a multi-step calculation be rounded?\n    A) After each step, to three significant\
    \ figures\n    B) After each step, to four significant figures\n    C) Never; carry full precision and round only the\
    \ final answer\n    D) Before the step that involves a subtraction"
  solution: 'C — Never; carry full precision and round only the final answer.** This

    is the fundamental rule of §3.6. Early rounding compounds. (§3.6)'
- id: T1A-Q009
  source_chapter: 01-01
  source_question: 9
  source_category: conceptual
  requires_concepts:
  - MATH-1A-001-02
  prompt: "Scientific notation, order of operations, and orders of magnitude are\n   *not* in the Handbook. What does that\
    \ fact obligate you to do, and what\n   does it tell you about how NCEES thinks about this material?"
  solution: '** It obligates you to know that material cold, because there is no page

    to turn to. What it tells you about NCEES''s thinking: these are exactly the

    "basic theories, conversions, formulas, and definitions examinees are

    expected to know" that the Handbook''s introduction says have been

    deliberately omitted. The omission is a statement that this material is

    considered prerequisite to engineering, not part of engineering reference.

    (§As the Handbook States It, 00-03 §0.2)'
- id: T1A-Q010
  source_chapter: 01-02
  source_question: 32
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-002-04
  prompt: "Which equation requires temperature on an absolute scale?\n    A) $q = kA \\, \\Delta T / L$\n    B) $\\delta =\
    \ \\alpha_T L \\, \\Delta T$\n    C) $\\eta = 1 - T_L / T_H$\n    D) All temperature equations accept any scale"
  solution: 'C — $\eta = 1 - T_L/T_H$.** Temperature appears as a **ratio**, which

    requires both values on an absolute scale. (A) and (B) use only $\Delta T$, so

    either scale in the correct pair works. (D) is the misconception this question

    exists to test. (§2.7)'
- id: T1A-Q011
  source_chapter: 01-01
  source_question: 18
  source_category: calculation
  requires_concepts:
  - MATH-1A-001-03
  prompt: "Express each with the most natural single prefix:\n    (a) $0.00047$ F\n    (b) $8{,}200{,}000$ Ω\n    (c) $0.000000015$\
    \ s\n    (d) $3{,}400$ N\n    (e) $0.025$ m"
  solution: '**

    (a) $0.00047 \text{ F} = 4.7 \times 10^{-4} \text{ F} = 470 \times 10^{-6}

    \text{ F} = \boxed{470 \text{ µF}}$

    (b) $8{,}200{,}000 \; \Omega = 8.2 \times 10^6 \; \Omega = \boxed{8.2

    \text{ M}\Omega}$

    (c) $0.000000015 \text{ s} = 1.5 \times 10^{-8} \text{ s} = 15 \times

    10^{-9} \text{ s} = \boxed{15 \text{ ns}}$

    (d) $3{,}400 \text{ N} = 3.4 \times 10^3 \text{ N} = \boxed{3.4 \text{ kN}}$

    (e) $0.025 \text{ m} = 25 \times 10^{-3} \text{ m} = \boxed{25 \text{ mm}}$


    Parts (a) and (c) require engineering notation as an intermediate step,

    because the scientific-notation exponent isn''t a multiple of three.'
- id: T1A-Q012
  source_chapter: 01-02
  source_question: 20
  source_category: calculation
  requires_concepts:
  - MATH-1A-002-03
  prompt: "An open tank contains a fluid of density $55 \\text{ lbm/ft}^3$ to a depth\n    of $22 \\text{ ft}$, at standard\
    \ gravity.\n    (a) Specific weight in lbf/ft³.\n    (b) Gage pressure at the bottom in lbf/ft².\n    (c) The same in\
    \ psi.\n    (d) Verify by converting to SI."
  solution: '**


    (a) $SW = \dfrac{\rho g}{g_c} = \dfrac{(55)(32.174)}{32.174} = \boxed{55.0 \text{ lbf/ft}^3}$


    (b) $p = SW \cdot h = (55.0)(22) = \boxed{1{,}210 \text{ lbf/ft}^2}$


    (c) $\dfrac{1{,}210}{144} = \boxed{8.40 \text{ psi}}$


    (d) SI check:


    $$\rho = 55 \times \frac{0.4536}{0.02832} = 881.1 \text{ kg/m}^3 \qquad h = 22 \times 0.3048 = 6.706 \text{ m}$$


    $$p = \rho g h = (881.1)(9.807)(6.706) = 57{,}930 \text{ Pa} = 57.9 \text{ kPa}$$


    $$8.40 \text{ psi} \times 6.895 = 57.9 \text{ kPa} \;\checkmark$$'
- id: T1A-Q013
  source_chapter: 01-01
  source_question: 22
  source_category: calculation
  requires_concepts:
  - MATH-1A-001-02
  prompt: "A circular pipe has an inside diameter of $150 \\text{ mm}$. Water flows\n    through it at an average velocity\
    \ of $2.4 \\text{ m/s}$. The area of a\n    circle is $\\pi D^2 / 4$.\n    (a) Find the cross-sectional area in m².\n\
    \    (b) Find the volumetric flow rate in m³/s.\n    (c) Convert to L/s, given $1 \\text{ m}^3 = 1{,}000 \\text{ L}$.\n\
    \    (d) Check your answer for physical reasonableness."
  solution: '**


    (a) $D = 150 \text{ mm} = 0.150 \text{ m}$


    $$A = \frac{\pi D^2}{4} = \frac{\pi (0.150)^2}{4} = \frac{\pi (0.0225)}{4} = \frac{0.070686}{4} = 1.767 \times 10^{-2}
    \text{ m}^2$$


    (b)


    $$Q_v = Av = (1.767 \times 10^{-2})(2.4) = 4.241 \times 10^{-2} \text{ m}^3/\text{s}$$


    Three significant figures: $\boxed{4.24 \times 10^{-2} \text{ m}^3/\text{s}}$


    (c)


    $$4.241 \times 10^{-2} \frac{\text{m}^3}{\text{s}} \times \frac{1{,}000 \text{ L}}{1 \text{ m}^3} = \boxed{42.4 \text{
    L/s}}$$


    (d) **Physical check.** A 150 mm pipe is roughly a 6-inch water main. Water at

    2.4 m/s is a normal design velocity for such a line — municipal systems

    typically run somewhere in the 1 to 3 m/s range. And 42.4 L/s works out to

    about 670 gallons per minute, a sensible flow for a 6-inch main. Everything

    reconciles. ✓


    *Note:* $\pi$ was carried at full calculator precision and rounded only at

    the end. Truncating to 3.14 at the start would have shifted the result

    slightly — not enough to matter here, but the habit matters when a

    calculation runs longer.'
- id: T1A-Q014
  source_chapter: 01-03
  source_question: 19
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-003-02
  prompt: "The result of $136.4 + 2.08 + 0.004$ should be reported as:\n    A) $138.484$\n    B) $138.5$\n    C) $138.48$\n\
    \    D) $138$"
  solution: 'B — $138.5$.**

    $136.4 + 2.08 + 0.004 = 138.484$. The limiting term is $136.4$, known to the

    tenths place. Sum rounds to tenths: $138.5$. (§3.4)'
- id: T1A-Q015
  source_chapter: 01-03
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1A-003-02
  prompt: "A rectangular beam cross-section has width $b = 75 \\text{ mm}$ and height\n    $h = 120 \\text{ mm}$. The moment\
    \ of inertia is $I = bh^3/12$.\n    (a) Compute $I$ in mm⁴, carrying full precision.\n    (b) Express the result in m⁴.\n\
    \    (c) How many significant figures are justified? Explain."
  solution: '**

    (a) $I = \dfrac{(75)(120)^3}{12} = \dfrac{75 \times 1{,}728{,}000}{12} = \dfrac{129{,}600{,}000}{12} = \boxed{10{,}800{,}000
    \text{ mm}^4} = 1.08 \times 10^7 \text{ mm}^4$


    (b) Converting: $(10^{-3})^4 = 10^{-12}$ m⁴/mm⁴:


    $$1.08 \times 10^7 \times 10^{-12} = \boxed{1.08 \times 10^{-5} \text{ m}^4}$$


    (c) The inputs $b = 75$ mm and $h = 120$ mm each have **two significant

    figures** (both are exact whole numbers with no decimal, so most conservatively

    two, though in context they might be three). The formula $h^3/12$ involves a

    cube — the third power amplifies relative error. With inputs at two to three

    significant figures, three significant figures in the result is justified.

    The answer $1.08 \times 10^7$ has three, which is appropriate. (§3.5)'
- id: T1A-Q016
  source_chapter: 01-01
  source_question: 14
  source_category: calculation
  requires_concepts:
  - MATH-1A-001-03
  prompt: "Convert each to decimal form:\n    (a) $6.02 \\times 10^{23}$\n    (b) $1.6 \\times 10^{-19}$\n    (c) $3.25 \\\
    times 10^4$\n    (d) $8 \\times 10^{-1}$"
  solution: '**

    (a) $6.02 \times 10^{23} = 602{,}000{,}000{,}000{,}000{,}000{,}000{,}000$

    (b) $1.6 \times 10^{-19} = 0.00000000000000000016$

    (c) $3.25 \times 10^4 = 32{,}500$

    (d) $8 \times 10^{-1} = 0.8$'
- id: T1A-Q017
  source_chapter: 01-01
  source_question: 26
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-001-03
  prompt: "The quantity $1 \\text{ mm}^3$ is equal to:\n    A) $10^{-3} \\text{ m}^3$\n    B) $10^{-6} \\text{ m}^3$\n   \
    \ C) $10^{-9} \\text{ m}^3$\n    D) $10^{-12} \\text{ m}^3$"
  solution: 'C — $10^{-9} \text{ m}^3$.** The prefix exponent multiplies by the

    power: $(10^{-3})^3 = 10^{-9}$. (A) treats the prefix as unaffected by

    cubing, which is the error itself. (B) is the *squared* conversion, and it''s

    the most tempting wrong answer because $10^{-6}$ is correct for mm² and gets

    misremembered as the general prefix-to-power factor. (D) doubles the cube.

    (§1.4, §1.5)'
- id: T1A-Q018
  source_chapter: 01-02
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1A-002-01
  prompt: "Test each equation for dimensional homogeneity and state whether it can be\n    correct. If not, suggest a correction.\n\
    \    (a) $v = at^2$, where $v$ is velocity, $a$ acceleration, $t$ time\n    (b) $KE = \\tfrac{1}{2}mv^2$\n    (c) $p =\
    \ \\rho g h^2$\n    (d) $F = \\dfrac{mv^2}{r}$, where $r$ is a radius"
  solution: '**


    (a) $[v] = LT^{-1}$. $[at^2] = LT^{-2} \cdot T^2 = L$.

    $LT^{-1} \ne L$ — **not homogeneous, cannot be correct.**

    Correction: $v = at$, giving $LT^{-2} \cdot T = LT^{-1}$ ✓


    (b) $[KE] = ML^2T^{-2}$. $[mv^2] = M \cdot L^2T^{-2} = ML^2T^{-2}$ ✓

    **Homogeneous.** (Note this is the SI form; in USCS with lbm you need

    $/2g_c$.)


    (c) $[p] = ML^{-1}T^{-2}$. $[\rho g h^2] = ML^{-3} \cdot LT^{-2} \cdot L^2 =

    MT^{-2}$.

    $ML^{-1}T^{-2} \ne MT^{-2}$ — **not homogeneous.**

    Correction: $p = \rho g h$, giving $ML^{-3} \cdot LT^{-2} \cdot L =

    ML^{-1}T^{-2}$ ✓


    (d) $[F] = MLT^{-2}$. $\left[\dfrac{mv^2}{r}\right] = \dfrac{M \cdot L^2T^{-2}}{L} = MLT^{-2}$ ✓

    **Homogeneous.** (Centripetal force — you''ll meet it in Tier 2C.)'
- id: T1A-Q019
  source_chapter: 01-02
  source_question: 22
  source_category: calculation
  requires_concepts:
  - MATH-1A-002-02
  prompt: "A heat engine operates between reservoirs at $340 \\; ^\\circ\\text{C}$ and\n    $45 \\; ^\\circ\\text{C}$.\n \
    \   (a) The maximum thermal efficiency, using $\\eta = 1 - T_L/T_H$.\n    (b) The incorrect result from using Celsius\
    \ values directly.\n    (c) The percentage-point error introduced."
  solution: '**


    (a) Convert to absolute:


    $$T_H = 340 + 273.15 = 613.2 \text{ K} \qquad T_L = 45 + 273.15 = 318.2 \text{ K}$$


    $$\eta = 1 - \frac{318.2}{613.2} = 1 - 0.5189 = 0.4811$$


    $$\boxed{\eta = 48.1\%}$$


    (b) Using Celsius directly:


    $$\eta_{\text{wrong}} = 1 - \frac{45}{340} = 1 - 0.1324 = 0.8676 = \boxed{86.8\%}$$


    (c) $86.8 - 48.1 = \boxed{38.7 \text{ percentage points}}$


    Nearly a factor of two, and 86.8% looks like a plausible efficiency to anyone

    not checking. This is exactly the trap from §2.7.'
- id: T1A-Q020
  source_chapter: 01-02
  source_question: 26
  source_category: multiple-choice
  requires_concepts:
  - MATH-1A-002-03
  prompt: "Which statement about $g_c$ is correct?\n    A) It varies with altitude\n    B) It is fixed by definition and does\
    \ not vary with location\n    C) It equals local gravitational acceleration\n    D) It appears in SI equations as well\
    \ as USCS"
  solution: 'B.** Fixed by definition and does not vary with location. (A) and (C)

    describe $g$. (D) is wrong — SI is coherent and never needs $g_c$. (§2.6.3)'
