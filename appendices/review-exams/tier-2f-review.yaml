- id: T2F-Q003
  source_chapter: 02-69
  source_question: 9
  source_category: conceptual
  requires_concepts:
  - CTRL-2F-069-02
  prompt: What is a likely engineering error if **control block diagram** is used without checking its assumptions, reference,
    bandwidth, or calibration basis?
  solution: The numerical calculation may be valid algebraically but represent the wrong measurand, dynamic model, signal
    band, or control configuration. Establish the model and references first. For **Transfer Functions and Feedback Control
    Fundamentals**, apply this check specifically through **§69.2 Block Diagrams, Summing Junctions, and Signal Flow**, including
    that section's stated assumptions and reference quantities.
