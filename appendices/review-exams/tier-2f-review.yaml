items:
- id: T2F-Q001
  source_chapter: 02-69
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - CTRL-2F-069-05
  prompt: 'Which statement best describes **closed-loop characteristic equation**?

    A) Its meaning depends on a defined measurement/control model and assumptions

    B) It is independent of calibration and dynamics

    C) It replaces physical validation

    D) It is always a static scalar'
  solution: '**A.** Measurement and control quantities are meaningful only with their stated reference, dynamic model, signal
    conditions, and assumptions. For **Transfer Functions and Feedback Control Fundamentals**, apply this check specifically
    through **§69.2 Block Diagrams, Summing Junctions, and Signal Flow**, including that section''s stated assumptions and
    reference quantities.'
