- id: T1C-Q030
  source_chapter: 01-16
  source_question: 17
  source_category: calculation
  requires_concepts:
  - MATH-1C-016-01
  prompt: "Evaluate:\n    (a) $\\displaystyle\\lim_{x\\to 0}\\frac{\\sin 7x}{x}$\n    (b) $\\displaystyle\\lim_{x\\to 0}\\\
    frac{\\sin 3x}{\\sin 8x}$\n    (c) $\\displaystyle\\lim_{\\theta\\to 0}\\frac{\\theta}{\\tan\\theta}$\n    (d) $\\displaystyle\\\
    lim_{\\theta\\to 0}\\frac{1-\\cos 2\\theta}{\\theta}$"
  solution: '**


    (a) $\dfrac{\sin 7x}{x} = 7\cdot\dfrac{\sin 7x}{7x} \to 7(1) = \boxed{7}$


    (b) Force both arguments to match their denominators:


    $$\frac{\sin 3x}{\sin 8x} = \frac{\frac{\sin 3x}{3x}\cdot 3x}{\frac{\sin 8x}{8x}\cdot 8x} \to \frac{(1)(3x)}{(1)(8x)}
    = \boxed{\frac{3}{8} = 0.375}$$


    (c) $\tan\theta = \dfrac{\sin\theta}{\cos\theta}$, so


    $$\frac{\theta}{\tan\theta} = \frac{\theta\cos\theta}{\sin\theta} = \frac{\theta}{\sin\theta}\cdot\cos\theta \to (1)(1)
    = \boxed{1}$$


    (using that $\frac{\theta}{\sin\theta}$ is the reciprocal of the standard

    limit, hence also 1).


    (d) Substitute $u = 2\theta$, so $\theta = u/2$ and $u \to 0$:


    $$\frac{1-\cos 2\theta}{\theta} = \frac{1-\cos u}{u/2} = 2\cdot\frac{1-\cos u}{u} \to 2(0) = \boxed{0}$$'
- id: T1C-Q031
  source_chapter: 01-24
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1C-024-04
  prompt: 'A lamina occupies $0\le x\le2$, $0\le y\le1$ and has

    $\rho_A=1+x$ in consistent mass-per-area units. Find total mass and center of

    mass.'
  solution: 'Mass:


    $$M=\int_0^2\int_0^1(1+x)\,dy\,dx

    =\left[x+\frac{x^2}{2}\right]_0^2=\boxed{4}.$$


    Then


    $$\bar x=\frac1{4}\int_0^2x(1+x)dx

    =\frac14\left(2+\frac83\right)

    =\boxed{\frac76},$$


    and symmetry in $y$ gives


    $$\boxed{\bar y=\frac12}.$$'
- id: T1C-Q032
  source_chapter: 01-17
  source_question: 17
  source_category: calculation
  requires_concepts:
  - MATH-1C-017-01
  prompt: "Find the equations of the tangent and normal lines:\n    (a) $y = x^2 - 3x$ at $x = 2$\n    (b) $y = e^{-x}$ at\
    \ $x = 0$\n    (c) $y = \\ln x$ at $x = 1$"
  solution: '**


    **(a)** $y(2) = 4 - 6 = -2$; $y'' = 2x - 3$, so $y''(2) = 1$


    Tangent: $y + 2 = 1(x-2) \implies \boxed{y = x - 4}$


    Normal: slope $-1$, so $y + 2 = -1(x-2) \implies \boxed{y = -x}$


    Check both pass through $(2,-2)$: $2-4 = -2$ ✓; $-2$ ✓


    **(b)** $y(0) = 1$; $y'' = -e^{-x}$, so $y''(0) = -1$


    Tangent: $y - 1 = -1(x-0) \implies \boxed{y = 1 - x}$


    Normal: slope $+1$, so $\boxed{y = x + 1}$


    **(c)** $y(1) = 0$; $y'' = \frac1x$, so $y''(1) = 1$


    Tangent: $y - 0 = 1(x-1) \implies \boxed{y = x - 1}$


    Normal: slope $-1$, so $y = -(x-1) \implies \boxed{y = 1 - x}$'
- id: T1C-Q033
  source_chapter: 01-19
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1C-019-04
  prompt: "Integrate by substitution:\n    (a) $\\displaystyle\\int 3x^2\\left(x^3-4\\right)^7 dx$\n    (b) $\\displaystyle\\\
    int\\frac{2x}{x^2+5}\\,dx$\n    (c) $\\displaystyle\\int \\sin x\\cos^4 x\\,dx$\n    (d) $\\displaystyle\\int e^{4t}\\\
    ,dt$\n    (e) $\\displaystyle\\int\\frac{\\ln x}{x}\\,dx$"
  solution: '**


    (a) $u = x^3-4$, $du = 3x^2dx$: $\int u^7du =

    \boxed{\frac{\left(x^3-4\right)^8}{8} + C}$


    (b) $u = x^2+5$, $du = 2x\,dx$: $\int\frac{du}{u} =

    \boxed{\ln\left(x^2+5\right) + C}$ (the argument is always positive, so the

    absolute value is unnecessary here)


    (c) $u = \cos x$, $du = -\sin x\,dx$: $-\int u^4du =

    \boxed{-\frac{\cos^5 x}{5} + C}$


    (d) $u = 4t$, $du = 4\,dt$: $\frac{1}{4}\int e^u du =

    \boxed{\frac{1}{4}e^{4t} + C}$


    (e) $u = \ln x$, $du = \frac{dx}{x}$: $\int u\,du =

    \boxed{\frac{\left(\ln x\right)^2}{2} + C}$'
