  prompt: "Find the Taylor series for $f(x) = \\sqrt{x}$ centred at $a = 4$, through the\n    quadratic term. Use it to estimate\
    \ $\\sqrt{4.3}$ and compare with the exact\n    value."
  solution: "$1 - \\frac{0.04}{2} + \\frac{0.0016}{24} = \\mathbf{0.9800667}$.\n    First omitted term $\\frac{(0.2)^6}{720}\
    \ = 8.9\\times10^{-8}$.\n    True value $0.98006658$, actual error $8.9\\times10^{-8}$ — at the bound, as\n    expected\
    \ when the following term is negligible ✓"
- id: T1C-Q020
  source_chapter: 01-20
  source_question: 25
  source_category: calculation
  requires_concepts:
  - MATH-1C-020-05
  prompt: "For a triangle of base $b$ and height $h$ with its base on the $x$-axis and\n    its apex directly above the left\
    \ end:\n    (a) Find $A$ by integration.\n    (b) Find $\\bar{x}$ and $\\bar{y}$ by integration.\n    (c) Verify against\
    \ the tabulated triangle centroid."
  solution: '**


    Place the apex above the left end, so the hypotenuse runs from $(0,h)$ down to

    $(b,0)$:


    $$y = h\left(1 - \frac{x}{b}\right)$$


    **(a)**


    $$A = \int_0^b h\left(1-\frac{x}{b}\right)dx = h\left[x - \frac{x^2}{2b}\right]_0^b = h\left(b - \frac{b}{2}\right) =
    \boxed{\frac{bh}{2}}$$


    **(b)**


    $$Q_y = \int_0^b x\,h\left(1-\frac{x}{b}\right)dx = h\left[\frac{x^2}{2} - \frac{x^3}{3b}\right]_0^b = h\left(\frac{b^2}{2}
    - \frac{b^2}{3}\right) = \frac{hb^2}{6}$$


    $$\bar{x} = \frac{hb^2/6}{bh/2} = \boxed{\frac{b}{3}}$$


    $$Q_x = \int_0^b\frac{y}{2}(y)\,dx = \frac{h^2}{2}\int_0^b\left(1-\frac{x}{b}\right)^2 dx$$


    Substituting $u = 1 - \frac{x}{b}$, $du = -\frac{dx}{b}$, limits $u = 1$ to $0$:


    $$= \frac{h^2}{2}(b)\int_0^1 u^2 du = \frac{h^2 b}{2}\cdot\frac{1}{3} = \frac{bh^2}{6}$$


    $$\bar{y} = \frac{bh^2/6}{bh/2} = \boxed{\frac{h}{3}}$$


    **(c)** The tabulated triangle centroid lies one third of the way from each side

    toward the opposite vertex. Measuring from the left edge, $\bar{x} = \frac{b}{3}$ ✓

    Measuring from the base, $\bar{y} = \frac{h}{3}$ ✓ Both match.'
- id: T1C-Q021
  source_chapter: 01-27
  source_question: 5
  source_category: conceptual
  requires_concepts:
