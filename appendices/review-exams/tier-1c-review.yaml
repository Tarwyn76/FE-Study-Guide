  prompt: Use the chapter's $p$-test to classify $\displaystyle\int_1^\infty x^{-2}\,dx$ and, if it converges, give its value.
  solution: For $\int_1^\infty x^{-p}\,dx$, the chapter gives convergence for $p>1$ with value $1/(p-1)$. Here $p=2$, so the
    integral converges to $\boxed{1}$.
