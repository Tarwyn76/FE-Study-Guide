- id: T1C-Q001
  source_chapter: 01-26
  source_question: 24
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-026-06
  prompt: "Which weight pattern corresponds to composite Simpson's rule?\nA) 1,1,1,1,1  \nB) 1,2,2,2,1  \nC) 1,4,2,4,1  \n\
    D) 1,3,3,1."
  solution: "**C.** Simpson's composite weights alternate 4 and 2 between endpoint\n    weights of 1. (§26.6)"
- id: T1C-Q002
  source_chapter: 01-18
  source_question: 17
  source_category: calculation
  requires_concepts:
  - MATH-1C-018-02
  prompt: "A 5.0 m ladder leans against a vertical wall. The base is pulled away from\n    the wall at 0.40 m/s.\n    (a)\
    \ How fast is the top descending when the base is 3.0 m from the wall?\n    (b) What happens to that rate as the base\
    \ approaches 5.0 m, and what does\n    that tell you about the model?"
  solution: '** Let $x$ be the base distance from the wall and $y$ the height of the top.


    **Relating equation:** $x^2 + y^2 = 25$ (fixed ladder length).


    **Differentiate with respect to $t$:**


    $$2x\frac{dx}{dt} + 2y\frac{dy}{dt} = 0 \implies \frac{dy}{dt} = -\frac{x}{y}\cdot\frac{dx}{dt}$$


    (a) At $x = 3.0$ m: $y = \sqrt{25-9} = 4.0$ m. With $\frac{dx}{dt} = +0.40$ m/s:


    $$\frac{dy}{dt} = -\frac{3.0}{4.0}(0.40) = \boxed{-0.30 \text{ m/s}}$$


    The top descends at 0.30 m/s. Negative ✓


    (b) As $x \to 5.0$ m, $y \to 0$ and the factor $\frac{x}{y}$ grows without

    bound, so $\frac{dy}{dt} \to -\infty$. The model predicts the top falling at

    unbounded speed.


    That is physically impossible, so the model has broken down. The idealization

    that fails is the assumption that the ladder''s top stays in contact with the

    wall while the base moves at constant speed — near the end the ladder separates

    from the wall and simply falls under gravity. This is the same lesson as the

    pile-driving model in Chapter 01-15 and the extraneous roots in Chapter 01-07:

    the mathematics returns an answer the physics rejects, and recognizing the

    domain of validity is part of the engineering.'
- id: T1C-Q003
  source_chapter: 01-26
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-026-03
  prompt: Why does a sign-changing bracket require continuity before it guarantees a root?
  solution: "Opposite signs alone do not prevent a discontinuous jump over zero. Continuity\n   is the hypothesis that forces\
    \ the function to pass through every intermediate\n   value. (§26.3)"
- id: T1C-Q004
  source_chapter: 01-27
  source_question: 24
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-027-07
  prompt: "Which test case is most likely to expose an inequality-boundary defect?\nA) a typical middle-range value  \nB)\
    \ a random decimal value  \nC) a value exactly equal to the threshold  \nD) a very large unrelated value."
  solution: "**C.** Exact threshold values expose incorrect `<` versus `<=` choices.\n    (§27.7)"
- id: T1C-Q005
  source_chapter: 01-22
  source_question: 7
  source_category: conceptual
  requires_concepts:
  - MATH-1C-022-03
  prompt: Why must the endpoints of an interval of convergence be tested separately?
  solution: "The ratio test yields $L = 1$ at both endpoints by construction, since the\n   radius is defined by $L = 1$.\
    \ Each endpoint produces a specific numerical series\n   requiring its own test, and the two frequently behave differently."
- id: T1C-Q006
  source_chapter: 01-24
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-024-03
  prompt: 'How is average value over a region related to total accumulation? Why does the

    average have the same units as the integrand?'
  solution: 'Average value equals total accumulated field divided by region area or volume.

    Dividing units such as $(\mathrm K)(\mathrm{m^2})$ by $\mathrm{m^2}$ returns K,

    so the average has the field''s units. (§24.3)'
- id: T1C-Q007
  source_chapter: 01-22
  source_question: 27
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-022-02
  prompt: "The ratio test applied to $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^3}$\n    gives $L = 1$. This means:\n\
    \    A) the series diverges\n    B) the series converges\n    C) the test is inconclusive and another test is needed\n\
    \    D) the series converges conditionally"
  solution: '**C** — The alternating-series test requires alternating signs as well as decreasing term magnitude and a zero
    term limit.'
- id: T1C-Q008
  source_chapter: 01-20
  source_question: 37
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-020-05
  prompt: "The parallel axis theorem states:\n    A) $I = \\bar{I} - Ad^2$\n    B) $I = \\bar{I} + Ad^2$\n    C) $I = \\bar{I}\
    \ + Ad$\n    D) $\\bar{I} = I + Ad^2$"
  solution: 'B — $I = \bar{I} + Ad^2$.** The transfer term is added and $d$ is squared. Choice

    A has the sign backwards, which would make some second moments negative. Choice C

    omits the square. Choice D has the roles of $I$ and $\bar{I}$ reversed, which would

    make the centroidal axis the maximum rather than the minimum. (§20.7)'
- id: T1C-Q009
  source_chapter: 01-25
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-025-02
  prompt: "Explain why dividing by $q(y)$ while separating variables can lose an\n   equilibrium solution."
  solution: "If $q(y_*)=0$, then $y=y_*$ may be a constant solution. Dividing by $q(y)$\n   excludes that value from the algebra,\
    \ so it must be checked first. (§25.2)"
- id: T1C-Q010
  source_chapter: 01-21
  source_question: Worked Example 7
  source_category: calculation
  requires_concepts:
  - MATH-1C-021-02
  prompt: Evaluate $\displaystyle\int_0^{\pi/2}\sin^2 x\,dx$ using the power-reduction identity, and give the exact result.
  solution: 'Use $\sin^2x=(1-\cos2x)/2$: $\int_0^{\pi/2}\sin^2x\,dx=\tfrac12[x-\tfrac12\sin2x]_0^{\pi/2}=\boxed{\pi/4}$.'
- id: T1C-Q011
  source_chapter: 01-18
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-018-02
  prompt: "Why must endpoints be checked in the closed-interval method, when the\n   derivative tests do not apply there?\
    \ Give a physical situation where the\n   optimum is at a boundary."
  solution: '** The derivative tests locate *interior* extrema. On a closed interval the

    absolute extremum may occur at a boundary where the function is still rising or

    falling — the interval simply stops. Physically, a constrained design often

    performs best at the edge of its allowable range: maximum flow at the maximum

    allowable pump speed, maximum stress at a support, maximum load at the rated

    limit. (§18.4)'
- id: T1C-Q012
  source_chapter: 01-24
  source_question: 24
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-024-06
  prompt: 'For cylindrical coordinates, the volume element is:

    A) $dr\,d\theta\,dz$  B) $r\,dr\,d\theta\,dz$

    C) $r^2\sin\theta\,dr\,d\theta\,dz$  D) $dx\,dy\,dz/r$.'
  solution: '**B.** Cylindrical coordinates inherit the polar factor $r$ and add $dz$.'
- id: T1C-Q013
  source_chapter: 01-27
  source_question: 16
  source_category: calculation
  requires_concepts:
  - MATH-1C-027-06
  prompt: "A loop begins with `count = 0` and increments `count` once for each valid\n    measurement. After processing 12\
    \ measurements, what bounds must the invariant\n    place on `count`?"
  solution: "After 12 processed measurements,\n\n    $$\\boxed{0\\le\\texttt{count}\\le12}.$$\n\n    (§27.7)"
- id: T1C-Q014
  source_chapter: 01-17
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-017-02
  prompt: "Give an engineering example of a function with a genuine corner, and\n   explain what the corner means physically."
  solution: '** Several valid answers. A shear diagram has a corner (in fact a jump in

    the diagram itself, and a corner in the moment diagram) at every concentrated

    load. A stress–strain curve has a corner at the yield point where the slope

    drops abruptly from the elastic modulus to the much smaller plastic slope. A

    saturating control signal has corners at the saturation limits.


    Physically the corner means the *rate* changes abruptly — the material''s

    stiffness, or the system''s responsiveness, switches to a different value at

    that threshold. The derivative genuinely does not exist there, and a model

    that smooths it over is hiding real behaviour. (§17.4)'
- id: T1C-Q015
  source_chapter: 01-20
  source_question: 9
  source_category: conceptual
  requires_concepts:
  - MATH-1C-020-01
  prompt: "Explain why a surface-of-revolution integral uses $dL$ while a volume integral\n   uses $dx$."
  solution: '** A volume slice is a plate of **thickness** $dx$ measured perpendicular to

    its face, so its volume is (face area)$\times dx$. A surface band follows the

    **surface**, whose width is measured along the slant, so it is

    (circumference)$\times dL$. Worked Example 8 quantifies the difference: on a cone

    of radius 2 and height 4, using $dx$ gives 25.1 against the correct 28.1, an 11%

    understatement. The steeper the curve, the larger the discrepancy. (§20.5)'
- id: T1C-Q016
  source_chapter: 01-17
  source_question: 28
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-017-02
  prompt: "A function that is continuous at $x = a$ is:\n    A) necessarily differentiable at $a$\n    B) not necessarily\
    \ differentiable at $a$\n    C) necessarily discontinuous somewhere else\n    D) necessarily equal to its limit at every\
    \ other point"
  solution: 'B — not necessarily differentiable at $a$.** Continuity is the weaker

    condition. $\lvert x - a\rvert$ is continuous at $a$ with a corner there, so

    no derivative exists. The implication runs the other way: differentiable

    $\Rightarrow$ continuous. (§17.4)'
- id: T1C-Q017
  source_chapter: 01-18
  source_question: 29
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-018-03
  prompt: "$\\displaystyle\\lim_{x\\to 0}\\frac{e^{3x}-1}{x}$ equals:\n    A) $0$\n    B) $1$\n    C) $3$\n    D) Does not\
    \ exist"
  solution: 'C — 3.** Form $\frac{0}{0}$ ✓ L''Hôpital gives

    $\lim_{x\to 0}\frac{3e^{3x}}{1} = 3$. Choice B is the answer you would get by

    dropping the chain rule factor. (§18.8)'
- id: T1C-Q018
  source_chapter: 01-26
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1C-026-03
  prompt: Starting at $x_0=0.7000$, perform two Newton iterations for $f(x)=\cos x-x$.
  solution: "For $f(x)=\\cos x-x$,\n\n    $$f'(x)=-\\sin x-1.$$\n\n    Starting at $x_0=0.7000$:\n\n    $$x_1\n    =0.7000-\\\
    frac{\\cos0.7-0.7}{-\\sin0.7-1}\n    =\\boxed{0.73943650},$$\n\n    $$x_2\n    =x_1-\\frac{\\cos x_1-x_1}{-\\sin x_1-1}\n\
    \    =\\boxed{0.73908516}.$$\n\n    The root is already stable to about six decimal places. (§26.3)\n\n16.\n\n    $$h'(1.5)=4(1.5)^3-6(1.5)=4.5,$$\n\
    \n    $$h''(1.5)=12(1.5)^2-6=21.$$\n\n    Therefore\n\n    $$x_1=1.5-\\frac{4.5}{21}\n    =\\boxed{1.28571429}.$$\n\n\
    \    (§26.4)\n\n17.\n\n    $$\\lambda=\\frac{38-20}{50-20}=\\frac{18}{30}=0.6,$$\n\n    $$y=1.40+0.6(2.15-1.40)\n    =1.40+0.45\n\
    \    =\\boxed{1.85}.$$\n\n    (§26.5)"
- id: T1C-Q019
  source_chapter: 01-22
  source_question: 17
  source_category: calculation
  requires_concepts:
