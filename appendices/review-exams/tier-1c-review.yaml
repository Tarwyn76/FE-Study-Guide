  prompt: "If $g(t)=5\\cos3t$ and $\\pm3j$ are not characteristic roots, a suitable\n    particular trial begins as:\n   \
    \ A) $A\\cos3t+B\\sin3t$  B) $Ae^{3t}$  C) $At^3$  D) $A/t$."
  solution: "**A.** Sinusoidal forcing requires both sine and cosine in the ordinary trial.\n    (§25.5)"
- id: T1C-Q023
  source_chapter: 01-23
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1C-023-05
  prompt: "For $f(x,y) = x^2y - y^3$ at $(3, 1)$: find $\\nabla f$, the maximum rate of\n    increase, and the directional\
    \ derivative toward $(3, 5)$."
  solution: "$f_x = 2xy = 6$; $f_y = x^2 - 3y^2 = 9 - 3 = 6$. So\n    $\\nabla f = 6\\hat{\\imath} + 6\\hat{\\jmath}$,\n \
    \   $\\lvert\\nabla f\\rvert = 6\\sqrt{2} = \\mathbf{8.49}$.\n    Toward $(3,5)$ the direction is $\\langle 0,4\\rangle$,\
    \ unit vector\n    $\\langle 0,1\\rangle$, so $D_{\\mathbf{u}}f = \\mathbf{6.00}$. Check:\n    $6.00 \\le 8.49$ ✓"
- id: T1C-Q024
  source_chapter: 01-23
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1C-023-01
  prompt: "State the two defining properties of the gradient, and explain why it must be\n   perpendicular to the level curves."
  solution: "It points in the direction of steepest increase, and its magnitude is that\n   maximum rate. Along a level curve\
    \ $f$ does not change, so the direction of\n   greatest change must be perpendicular to it."
- id: T1C-Q025
  source_chapter: 01-16
  source_question: 28
  source_category: multiple-choice
  requires_concepts:
  - MATH-1C-016-04
  prompt: "The function $f(x) = \\dfrac{x-2}{x^2-4}$ has:\n    A) A removable discontinuity at $x = 2$ and an infinite one\
    \ at $x = -2$\n    B) Infinite discontinuities at both $x = 2$ and $x = -2$\n    C) A jump discontinuity at $x = 2$\n\
    \    D) No discontinuities"
  solution: 'A.** Factor the denominator: $x^2 - 4 = (x-2)(x+2)$.


    $$\frac{x-2}{(x-2)(x+2)} = \frac{1}{x+2} \quad (x \ne 2)$$


    At $x = 2$ the factor cancels, the limit is $\frac{1}{4}$, and the

    discontinuity is **removable**. At $x = -2$ nothing cancels, the form is

    $\frac{-4}{0}$, and the discontinuity is **infinite**. (§16.9)'
- id: T1C-Q026
  source_chapter: 01-19
