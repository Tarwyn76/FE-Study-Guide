    (§19.4)'
- id: T1C-Q027
  source_chapter: 01-21
  source_question: 1
  source_category: conceptual
  requires_concepts:
  - MATH-1C-021-01
  prompt: Starting from the product rule in differential form, derive the integration-by-parts identity $\int u\,dv=uv-\int
    v\,du$. In one sentence, state the practical rule for choosing $u$.
  solution: The chapter writes the product rule as $d(uv)=u\,dv+v\,du$. Integrating gives $uv=\int u\,dv+\int v\,du$, so rearrangement
    yields $\int u\,dv=uv-\int v\,du$. The practical choice is to make $u$ the factor that becomes simpler when differentiated
    while leaving $dv$ as something that can be integrated.
- id: T1C-Q028
  source_chapter: 01-21
  source_question: p-test
  source_category: calculation
  requires_concepts:
