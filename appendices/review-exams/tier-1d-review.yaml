  prompt: Evaluate the hypergeometric probability in Question 15.
  solution: "Numerically,\n\n    $$\n    P_a\n    =\n    \\boxed{0.7513\\text{ approximately}}.\n    $$\n\n17.\n\n    $$\\\
    alpha=1-0.95=\\boxed{0.05}.$$ Thus the producer’s risk is five percent for the stated acceptance probability.\n\n18.\n\
    \n    $$\\beta=\\boxed{0.08}.$$ Thus the consumer’s risk is eight percent at the stated poor-quality lot condition."
- id: T1D-Q038
  source_chapter: 01-31
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1D-031-03
  prompt: Why does replacing $\sigma$ with $s$ change the standard normal statistic into a $t$ statistic?
  solution: "$s$ is itself random. Its uncertainty makes the standardized sample mean more\n   variable than when the true\
    \ population $\\sigma$ is known; Student's $t$\n   captures that extra uncertainty. (§31.3)"
