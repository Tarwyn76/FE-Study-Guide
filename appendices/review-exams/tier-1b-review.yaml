items:
- id: T1B-Q001
  source_chapter: 01-05
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-005-03
  prompt: "Why does a logarithmic equation potentially produce extraneous solutions?\n   What check eliminates them?"
  solution: '** When you combine logarithms and solve the resulting polynomial, you may get solutions that make the original
    logarithm argument zero or negative. Those solutions are algebraically valid for the polynomial but physically invalid
    for the logarithm, which is only defined for positive arguments. They''re called extraneous solutions, and checking means
    substituting back into the *original* equation (before any log laws were applied) and verifying all log arguments are
    positive. (§5.7)'
- id: T1B-Q002
  source_chapter: 01-15
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-015-04
  prompt: "Which infinite geometric series diverges?\n    A) $a_1 = 10$, $r = 0.95$\n    B) $a_1 = 10$, $r = -0.5$\n    C)\
    \ $a_1 = 10$, $r = 1.05$\n    D) $a_1 = 100$, $r = 0.01$"
  solution: 'C — $a_1 = 10$, $r = 1.05$.** Only this option has

    $\lvert r\rvert \ge 1$. Note that A converges despite $r$ being very close to

    1 — the sum is $10/0.05 = 200$, large but finite. B converges with an

    alternating sign: $10/1.5 = 6.67$. (§15.5)'
- id: T1B-Q003
  source_chapter: 01-06
  source_question: 21
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-006-01
  prompt: "$f(x) = x^5 - 3x^3 + x$ is:\n    A) Even\n    B) Odd\n    C) Neither even nor odd\n    D) Both even and odd"
  solution: 'B — Odd.** $f(-x) = (-x)^5 - 3(-x)^3 + (-x) = -x^5 + 3x^3 - x =

    -(x^5 - 3x^3 + x) = -f(x)$. All terms have odd powers, so the function is

    odd. (§6.4)'
- id: T1B-Q004
  source_chapter: 01-13
  source_question: 17
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-013-01
  prompt: "The magnitude of $\\vec{A}\\times\\vec{B}$ equals:\n    A) $AB\\cos\\theta$\n    B) $AB\\sin\\theta$\n    C) $\\\
    vec{A}\\cdot\\vec{B}$\n    D) $\\lvert\\vec{A}\\rvert + \\lvert\\vec{B}\\rvert$"
  solution: 'B — $AB\sin\theta$.** The magnitude of the cross product is

    $\lvert\vec{A}\rvert\lvert\vec{B}\rvert\sin\theta$. (A) is the dot product

    formula. (§13.5)'
- id: T1B-Q005
  source_chapter: 01-13
  source_question: 3
  source_category: conceptual
  requires_concepts:
  - MATH-1B-013-02
  prompt: "The dot product of two vectors equals zero. What does this tell you about\n   their geometric relationship?"
  solution: '** Two non-zero vectors with zero dot product are perpendicular

    ($\theta = 90°$, since $\cos 90° = 0$). If either vector is the zero vector,

    no geometric conclusion follows. (§13.4)'
- id: T1B-Q006
  source_chapter: 01-11
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1B-011-03
  prompt: "Find exact values using identities:\n    (a) $\\cos(105°)$ using $105° = 60° + 45°$\n    (b) $\\sin(15°)$ using\
    \ $15° = 45° - 30°$\n    (c) $\\sin(2\\theta)$ when $\\sin\\theta = 3/5$ and $\\theta$ is in Q I"
  solution: '**


    (a) $\cos(105°) = \cos(60°+45°) = \cos 60°\cos 45° - \sin 60°\sin 45°$

    $= (1/2)(\sqrt{2}/2) - (\sqrt{3}/2)(\sqrt{2}/2) = (\sqrt{2} - \sqrt{6})/4$


    (b) $\sin(15°) = \sin(45°-30°) = \sin 45°\cos 30° - \cos 45°\sin 30°$

    $= (\sqrt{2}/2)(\sqrt{3}/2) - (\sqrt{2}/2)(1/2) = (\sqrt{6}-\sqrt{2})/4$


    (c) In Q I with $\sin\theta = 3/5$: $\cos\theta = 4/5$ (Pythagorean).

    $\sin(2\theta) = 2\sin\theta\cos\theta = 2(3/5)(4/5) = 24/25$'
- id: T1B-Q007
  source_chapter: 01-06
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-006-01
  prompt: What is the horizontal line test, and what does it determine?
  solution: '** The horizontal line test determines whether a function is one-to-one.

    A function is one-to-one iff no horizontal line crosses its graph more than

    once. This matters because a function has an inverse only if it''s one-to-one.

    (§6.3)'
- id: T1B-Q008
  source_chapter: 01-13
  source_question: 11
  source_category: calculation
  requires_concepts:
  - MATH-1B-013-03
  prompt: "Compute the cross products:\n    (a) $\\vec{A} = 2\\hat{\\imath} + \\hat{\\jmath} - \\hat{k}$ and\n        $\\\
    vec{B} = \\hat{\\imath} - 2\\hat{\\jmath} + 3\\hat{k}$\n    (b) $\\vec{A} = 3\\hat{\\imath} + 0\\hat{\\jmath} + 0\\hat{k}$\
    \ and\n        $\\vec{B} = 0\\hat{\\imath} + 4\\hat{\\jmath} + 0\\hat{k}$\n    (c) Verify (b) using the unit vector cyclic\
    \ rule."
  solution: '**


    (a) $\vec{A}\times\vec{B} = \begin{vmatrix}\hat{\imath}&\hat{\jmath}&\hat{k}\\

    2&1&-1\\1&-2&3\end{vmatrix}$


    $\hat{\imath}$: $(1)(3)-(-1)(-2) = 3-2 = 1$


    $\hat{\jmath}$: $-[(2)(3)-(-1)(1)] = -[6+1] = -7$


    $\hat{k}$: $(2)(-2)-(1)(1) = -4-1 = -5$


    $\vec{A}\times\vec{B} = \boxed{\hat{\imath} - 7\hat{\jmath} - 5\hat{k}}$


    Check: $(\hat{\imath}-7\hat{\jmath}-5\hat{k})\cdot(2\hat{\imath}+\hat{\jmath}

    -\hat{k}) = 2-7+5 = 0$ ✓ (perpendicular to $\vec{A}$)


    $(\hat{\imath}-7\hat{\jmath}-5\hat{k})\cdot(\hat{\imath}-2\hat{\jmath}+3\hat{k})

    = 1+14-15 = 0$ ✓ (perpendicular to $\vec{B}$)


    (b) $\vec{A}\times\vec{B} = \begin{vmatrix}\hat{\imath}&\hat{\jmath}&\hat{k}\\

    3&0&0\\0&4&0\end{vmatrix}$


    $\hat{\imath}$: $(0)(0)-(0)(4) = 0$


    $\hat{\jmath}$: $-[(3)(0)-(0)(0)] = 0$


    $\hat{k}$: $(3)(4)-(0)(0) = 12$


    $\vec{A}\times\vec{B} = \boxed{12\hat{k}}$


    (c) Cyclic rule: $\vec{A} = 3\hat{\imath}$, $\vec{B} = 4\hat{\jmath}$.


    $\hat{\imath}\times\hat{\jmath} = \hat{k}$, so $3\hat{\imath}\times 4\hat{\jmath}

    = 12(\hat{\imath}\times\hat{\jmath}) = 12\hat{k}$ ✓'
- id: T1B-Q009
  source_chapter: 01-09
  source_question: 25
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-009-02
  prompt: "For $\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1$, the asymptotes are:\n    A) $y = \\pm\\tfrac{3}{4}x$  B) $y = \\\
    pm\\tfrac{4}{3}x$\n    C) $y = \\pm\\tfrac{9}{16}x$  D) $y = \\pm 3x$"
  solution: 'B — $y = \pm\tfrac{4}{3}x$.** $a = 3$, $b = 4$, and for the horizontal

    form the asymptote slopes are $\pm b/a = \pm\tfrac{4}{3}$. (A) inverts the

    ratio; (C) uses the squares instead of the roots. (§9.7)'
- id: T1B-Q010
  source_chapter: 01-14
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-014-04
  prompt: "Derive the characteristic equation $\\det(A - \\lambda I) = 0$ starting\n   from $A\\mathbf{v} = \\lambda\\mathbf{v}$.\
    \ State clearly where the\n   singularity requirement enters."
  solution: '** Start from $A\mathbf{v} = \lambda\mathbf{v}$ with $\mathbf{v} \ne

    \mathbf{0}$.


    Move everything to one side: $A\mathbf{v} - \lambda\mathbf{v} = \mathbf{0}$.


    Insert the identity so both terms have a matrix acting on $\mathbf{v}$:

    $A\mathbf{v} - \lambda I\mathbf{v} = \mathbf{0}$.


    Factor: $(A - \lambda I)\mathbf{v} = \mathbf{0}$.


    This is a homogeneous system. **The singularity requirement enters here:** a

    homogeneous system has a nonzero solution only if its coefficient matrix is

    singular. Since we require $\mathbf{v} \ne \mathbf{0}$, we must have

    $(A - \lambda I)$ singular, which means


    $$\det(A - \lambda I) = 0$$


    If $(A - \lambda I)$ were nonsingular, the only solution would be

    $\mathbf{v} = \mathbf{0}$, which is excluded by definition. (§14.9)'
- id: T1B-Q011
  source_chapter: 01-12
  source_question: 12
  source_category: calculation
  requires_concepts:
  - MATH-1B-012-01
  prompt: "Convert to rectangular form:\n    (a) $z = 4\\angle 120°$\n    (b) $z = 3\\angle(-150°)$\n    (c) $z = 2\\angle\
    \ 45°$"
  solution: '**


    (a) $4\cos120° + 4j\sin120° = 4(-1/2) + 4j(\sqrt{3}/2) = \boxed{-2 + 2\sqrt{3}\,j}$


    (b) $3\cos(-150°) + 3j\sin(-150°) = 3(-\sqrt{3}/2) + 3j(-1/2) =

    \boxed{-\frac{3\sqrt{3}}{2} - \frac{3}{2}j}$


    (c) $2\cos45° + 2j\sin45° = 2(\sqrt{2}/2) + 2j(\sqrt{2}/2) =

    \boxed{\sqrt{2} + \sqrt{2}\,j}$'
- id: T1B-Q012
  source_chapter: 01-04
  source_question: 14
  source_category: calculation
  requires_concepts:
  - MATH-1B-004-01
  prompt: "Solve each equation for the specified variable:\n    (a) $\\dfrac{1}{R_T} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}$,\
    \ for $R_T$\n    (b) $\\eta = 1 - \\dfrac{T_L}{T_H}$, for $T_H$\n    (c) $V_{out} = V_{in} \\dfrac{R_2}{R_1 + R_2}$, for\
    \ $R_2$\n    (d) $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$, for $C$"
  solution: '**


    (a) Multiply both sides by $R_T R_1 R_2$:

    $R_1 R_2 = R_T R_2 + R_T R_1 = R_T(R_1 + R_2)$


    $$\boxed{R_T = \frac{R_1 R_2}{R_1 + R_2}}$$


    (b) $\eta = 1 - T_L/T_H \Rightarrow T_L/T_H = 1 - \eta \Rightarrow$


    $$\boxed{T_H = \frac{T_L}{1 - \eta}}$$


    (c) $V_{out}(R_1 + R_2) = V_{in}R_2 \Rightarrow V_{out}R_1 = V_{in}R_2 -

    V_{out}R_2 = R_2(V_{in} - V_{out})$


    $$\boxed{R_2 = \frac{V_{out}R_1}{V_{in} - V_{out}}}$$


    (d) $f_r = \dfrac{1}{2\pi\sqrt{LC}} \Rightarrow 2\pi\sqrt{LC} = \dfrac{1}{f_r}

    \Rightarrow \sqrt{LC} = \dfrac{1}{2\pi f_r} \Rightarrow LC =

    \dfrac{1}{4\pi^2 f_r^2} \Rightarrow$


    $$\boxed{C = \frac{1}{4\pi^2 f_r^2 L}}$$'
- id: T1B-Q013
  source_chapter: 01-05
  source_question: 14
  source_category: calculation
  requires_concepts:
  - MATH-1B-005-01
  prompt: "Use logarithm laws to write as a single logarithm:\n    (a) $2\\log x - \\frac{1}{2}\\log y + 3\\log z$\n    (b)\
    \ $\\frac{1}{3}(\\ln a - 2\\ln b)$"
  solution: '**


    (a) $2\log x - \frac{1}{2}\log y + 3\log z = \log x^2 - \log y^{1/2} + \log z^3 = \boxed{\log\dfrac{x^2 z^3}{\sqrt{y}}}$


    (b) $\dfrac{1}{3}(\ln a - 2\ln b) = \dfrac{1}{3}\ln\dfrac{a}{b^2} = \boxed{\ln\left(\dfrac{a}{b^2}\right)^{1/3}}$ or equivalently
    $\ln\sqrt[3]{a/b^2}$'
- id: T1B-Q014
  source_chapter: 01-07
  source_question: 14
  source_category: calculation
  requires_concepts:
  - MATH-1B-007-03
  prompt: "A quadratic has roots $r_1 = 3$ and $r_2 = -\\frac{1}{2}$ and leading\n    coefficient $2$.\n    (a) Write the\
    \ polynomial in factored form, then expanded.\n    (b) Verify using Vieta's formulas."
  solution: '**


    (a) $P(x) = 2(x-3)(x+\frac{1}{2}) = 2(x-3)\cdot\frac{1}{2}(2x+1) = (x-3)(2x+1)$


    Expanded: $2x^2 + x - 6x - 3 = \boxed{2x^2 - 5x - 3}$


    (b) Sum: $3 + (-1/2) = 5/2 = -b/a = 5/2$ ✓


    Product: $3 \times (-1/2) = -3/2 = c/a = -3/2$ ✓'
- id: T1B-Q015
  source_chapter: 01-09
  source_question: 15
  source_category: calculation
  requires_concepts:
  - MATH-1B-009-03
  prompt: "Find the equation of the parabola:\n    (a) Vertex $(0,0)$, focus $(0,-3)$\n    (b) Vertex $(2,-1)$, opening right,\
    \ passing through $(6, 3)$\n    (c) Focus $(0, 5)$, directrix $y = -5$"
  solution: '**


    (a) Focus below the vertex, so vertical axis with $p = -3$:


    $$x^2 = 4(-3)y \implies \boxed{x^2 = -12y}$$


    (b) Opens right from vertex $(2,-1)$: $(y+1)^2 = 4p(x-2)$. Through $(6,3)$:


    $$(3+1)^2 = 4p(6-2) \implies 16 = 16p \implies p = 1$$


    $$\boxed{(y+1)^2 = 4(x-2)}$$


    Focus $(3,-1)$, directrix $x = 1$. *Check at $(6,3)$:* $16 = 4(4)$ ✓


    (c) The vertex is halfway between focus and directrix, at $(0,0)$, and

    $p = 5$:


    $$\boxed{x^2 = 20y}$$'
- id: T1B-Q016
  source_chapter: 01-15
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-015-02
  prompt: "Given a sequence $5, 15, 45, 135, \\ldots$, describe the test you would\n   run to decide whether it is arithmetic,\
    \ geometric, or neither."
  solution: '** Compute both the successive difference and the successive ratio, then

    check whether either is constant across more than one pair.


    Differences: $15-5 = 10$, $45-15 = 30$. Not constant → not arithmetic.


    Ratios: $15/5 = 3$, $45/15 = 3$, $135/45 = 3$. Constant → **geometric** with

    $r = 3$.


    Checking two pairs rather than one matters: a single pair cannot distinguish

    the two patterns. (§15.3, §15.4)'
- id: T1B-Q017
  source_chapter: 01-04
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-004-02
  prompt: "An absolute value equation $\\lvert f(x) \\rvert = k$ has two cases.\n   For what value of $k$ does it have exactly\
    \ one solution? For what\n   values has it no solution?"
  solution: '** When $k = 0$, $\lvert f(x) \rvert = 0$ has exactly one solution (the

    value where $f(x) = 0$, because the two cases both give $f(x) = 0$). When

    $k < 0$, there is no solution — absolute value is never negative. (§4.5)'
- id: T1B-Q018
  source_chapter: 01-11
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-011-03
  prompt: "Derive the formula $\\cos(2\\theta) = \\cos^2\\theta - \\sin^2\\theta$ from the\n   sum formula for cosine. Show\
    \ every step."
  solution: '** Starting from $\cos(\alpha + \beta) = \cos\alpha\cos\beta -

    \sin\alpha\sin\beta$, set $\alpha = \beta = \theta$:


    $$\cos(2\theta) = \cos\theta\cos\theta - \sin\theta\sin\theta = \cos^2\theta - \sin^2\theta$$


    Alternative forms follow from the Pythagorean identity: replace $\sin^2\theta

    = 1 - \cos^2\theta$ to get $2\cos^2\theta - 1$, or replace $\cos^2\theta = 1

    - \sin^2\theta$ to get $1 - 2\sin^2\theta$. (§11.8)'
- id: T1B-Q019
  source_chapter: 01-10
  source_question: 10
  source_category: calculation
  requires_concepts:
  - MATH-1B-010-01
  prompt: "Convert:\n    (a) $2.5 \\text{ ft}^2$ to in²\n    (b) $750 \\text{ mm}^2$ to cm²\n    (c) $0.5 \\text{ ft}^3$ to\
    \ gallons\n    (d) $200 \\text{ mL}$ to in³"
  solution: '**


    (a) $2.5 \times 144 = \boxed{360 \text{ in}^2}$


    (b) $1 \text{ cm} = 10 \text{ mm}$, so $1 \text{ cm}^2 = 100 \text{ mm}^2$.

    $750/100 = \boxed{7.50 \text{ cm}^2}$


    (c) $0.5 \times 7.481 = \boxed{3.74 \text{ gal}}$


    (d) $200 \text{ mL} \div 16.39 \text{ mL/in}^3 = \boxed{12.20 \text{ in}^3}$'
- id: T1B-Q020
  source_chapter: 01-07
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-007-03
  prompt: "The sum of the roots of $3x^2 - 7x + 4 = 0$ is:\n    A) $4/3$\n    B) $7/3$\n    C) $-7/3$\n    D) $-4/3$"
  solution: 'B — $7/3$.** By Vieta''s, sum of roots $= -b/a = -(-7)/3 = 7/3$.

    (§7.5)'
- id: T1B-Q021
  source_chapter: 01-08
  source_question: 19
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-008-01
  prompt: "A unique solution to a system in 4 unknowns requires how many\n    independent equations?\n    A) 2\n    B) 3\n\
    \    C) 4\n    D) 5"
  solution: 'C — 4.** A unique solution needs as many independent equations as

    unknowns. Fewer leaves degrees of freedom; more is permissible but redundant.

    (§8.1, §8.6)'
- id: T1B-Q022
  source_chapter: 01-12
  source_question: 22
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-012-02
  prompt: "$e^{j\\pi/2}$ equals:\n    A) $-1$\n    B) $1$\n    C) $j$\n    D) $-j$"
  solution: 'C — $j$.** $e^{j\pi/2} = \cos(\pi/2) + j\sin(\pi/2) = 0 + j(1) = j$.

    Geometrically: angle $\pi/2 = 90°$ lands at the top of the unit circle,

    which is the point $j$. (§12.4)'
- id: T1B-Q023
  source_chapter: 01-14
  source_question: 21
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-014-03
  prompt: "$(AB)^{-1}$ equals:\n    A) $A^{-1}B^{-1}$\n    B) $B^{-1}A^{-1}$\n    C) $(BA)^{-1}$\n    D) $A^{-1}B$"
  solution: 'B — $B^{-1}A^{-1}$.** Order reverses, same as with the transpose.

    Verify: $(AB)(B^{-1}A^{-1}) = A(BB^{-1})A^{-1} = AIA^{-1} = AA^{-1} = I$ ✓

    Choice A fails this test. (§14.6)'
- id: T1B-Q024
  source_chapter: 01-08
  source_question: 12
  source_category: calculation
  requires_concepts:
  - MATH-1B-008-01
  prompt: "Classify each system **without** fully solving it, and justify:\n    (a) $3x - 6y = 9$ and $-x + 2y = -3$\n   \
    \ (b) $2x + 4y = 8$ and $x + 2y = 6$\n    (c) $x - y = 4$ and $2x + y = 11$"
  solution: '**


    (a) Multiply the second equation by $-3$: $3x - 6y = 9$ — **identical** to

    the first, constants included. Same line. **Consistent and dependent**,

    infinitely many solutions.


    (b) Multiply the second equation by $2$: $2x + 4y = 12$. Left side matches

    the first equation; right side does not ($12 \ne 8$). Same slope, different

    intercept. **Inconsistent**, no solution.


    (c) The coefficient ratios differ — $1:-1$ against $2:1$ — so the lines have

    different slopes and must cross exactly once. **Consistent and independent**.

    Solving confirms $(5, 1)$, but the classification did not require it.'
- id: T1B-Q025
  source_chapter: 01-14
  source_question: 13
  source_category: calculation
  requires_concepts:
  - MATH-1B-014-03
  prompt: "Solve using the matrix inverse. Verify your answer in the original\n    equations.\n\n    $$\\begin{aligned} 3x\
    \ + 2y &= 7 \\\\ x + 4y &= 9\\end{aligned}$$"
  solution: '**


    $$A = \begin{bmatrix} 3 & 2 \\ 1 & 4\end{bmatrix} \qquad \mathbf{b} = \begin{bmatrix} 7 \\ 9\end{bmatrix}$$


    $$\det A = (3)(4) - (2)(1) = 12 - 2 = 10 \ne 0 \quad \text{→ unique solution}$$


    $$A^{-1} = \frac{1}{10}\begin{bmatrix} 4 & -2 \\ -1 & 3\end{bmatrix}$$


    $$x = \tfrac{1}{10}\big[(4)(7) + (-2)(9)\big] = \tfrac{1}{10}(28 - 18) = \tfrac{10}{10} = 1$$


    $$y = \tfrac{1}{10}\big[(-1)(7) + (3)(9)\big] = \tfrac{1}{10}(-7 + 27) = \tfrac{20}{10} = 2$$


    $$\boxed{x = 1, \quad y = 2}$$


    **Verify:** $3(1) + 2(2) = 3 + 4 = 7$ ✓ and $1 + 4(2) = 1 + 8 = 9$ ✓'
- id: T1B-Q026
  source_chapter: 01-04
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-004-03
  prompt: "The interval $[-3, 7)$ corresponds to which inequality?\n    A) $-3 \\le x \\le 7$\n    B) $-3 < x < 7$\n    C)\
    \ $-3 \\le x < 7$\n    D) $-3 < x \\le 7$"
  solution: 'C — $-3 \le x < 7$.** Bracket at $-3$ means included ($\le$);

    parenthesis at $7$ means excluded ($<$). (§4.7)'
- id: T1B-Q027
  source_chapter: 01-05
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-005-02
  prompt: "If $e^{-t/\\tau} = 0.368$, then $t$ equals:\n    A) $0$\n    B) $\\tau/e$\n    C) $\\tau$\n    D) $5\\tau$"
  solution: 'C — $\tau$.** $e^{-\tau/\tau} = e^{-1} = 1/e \approx 0.368$. The value

    $e^{-1}$ is by definition the value at exactly one time constant. (§5.3)'
- id: T1B-Q028
  source_chapter: 01-06
  source_question: 13
  source_category: calculation
  requires_concepts:
  - MATH-1B-006-01
  prompt: "Describe the transformations applied to the parent function, then state\n    the domain and range:\n    (a) $f(x)\
    \ = (x - 3)^2 + 4$\n    (b) $g(x) = -2\\lvert x + 1 \\rvert - 3$\n    (c) $h(x) = 3e^{-2x}$\n    (d) $p(x) = \\ln(x +\
    \ 5) - 2$"
  solution: '**


    (a) $f(x) = (x-3)^2 + 4$: parent $x^2$, shift right 3, shift up 4.

    Domain: $\mathbb{R}$. Range: $[4, +\infty)$ (vertex at $(3,4)$).


    (b) $g(x) = -2|x+1| - 3$: parent $|x|$, shift left 1, stretch vertically

    by 2, reflect across $x$-axis, shift down 3.

    Domain: $\mathbb{R}$. Range: $(-\infty, -3]$ (vertex at $(-1, -3)$,

    opening downward).


    (c) $h(x) = 3e^{-2x}$: parent $e^x$, reflect across $y$-axis (making

    $e^{-x}$), compress horizontally by 2 (making $e^{-2x}$), stretch

    vertically by 3.

    Domain: $\mathbb{R}$. Range: $(0, +\infty)$.


    (d) $p(x) = \ln(x+5) - 2$: parent $\ln x$, shift left 5, shift down 2.

    Domain: $x + 5 > 0 \Rightarrow x > -5$, so $(-5, +\infty)$.

    Range: $\mathbb{R}$.'
- id: T1B-Q029
  source_chapter: 01-15
  source_question: 13
  source_category: calculation
  requires_concepts:
  - MATH-1B-015-04
  prompt: "Determine whether each infinite geometric series converges. If it does,\n    find its sum.\n    (a) $18 + 6 + 2\
    \ + \\cdots$\n    (b) $5 - 10 + 20 - 40 + \\cdots$\n    (c) $9 - 3 + 1 - \\tfrac13 + \\cdots$\n    (d) $4 + 4.4 + 4.84\
    \ + \\cdots$"
  solution: '**


    (a) $r = 6/18 = 1/3$. $\lvert r\rvert < 1$ → **converges**.


    $$S_\infty = \frac{18}{1 - 1/3} = \frac{18}{2/3} = \boxed{27}$$


    (b) $r = -10/5 = -2$. $\lvert r\rvert = 2 \ge 1$ → **diverges**. No sum.


    (c) $r = -3/9 = -1/3$. $\lvert r\rvert < 1$ → **converges**.


    $$S_\infty = \frac{9}{1 - (-1/3)} = \frac{9}{4/3} = \boxed{6.75}$$


    (d) $r = 4.4/4 = 1.1$. $\lvert r\rvert \ge 1$ → **diverges**. No sum.'
- id: T1B-Q030
  source_chapter: 01-10
  source_question: 16
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-010-03
  prompt: "A composite area has two components: Area 1 = 400 mm² with centroid at\n    $\\bar{y}_1 = 20$ mm, and Area 2 =\
    \ 600 mm² with centroid at $\\bar{y}_2\n    = 50$ mm. The composite centroid $\\bar{y}$ is:\n    A) 35 mm\n    B) 38 mm\n\
    \    C) 40 mm\n    D) 42 mm"
  solution: 'B — 38 mm.** $\bar{y} = (400 \times 20 + 600 \times 50)/(400+600) =

    (8{,}000 + 30{,}000)/1{,}000 = 38{,}000/1{,}000 = 38$ mm. The larger area

    (600 mm²) at $y = 50$ pulls the centroid above the simple average of 35 mm.

    (§10.3)'
- id: T1B-Q031
  source_chapter: 01-07
  source_question: 5
  source_category: conceptual
  requires_concepts:
  - MATH-1B-007-01
  prompt: What does a root of multiplicity 2 look like on a graph, and why?
  solution: '** A root of multiplicity 2 means $(x-r)^2$ divides the polynomial. Near

    $r$, $P(x) \approx C(x-r)^2$ — a parabola shape. Since the square is never

    negative, the sign of $P$ doesn''t change across $r$. The graph touches the

    $x$-axis at $r$ and bounces back without crossing. (§7.7)'
- id: T1B-Q032
  source_chapter: 01-11
  source_question: 25
  source_category: multiple-choice
  requires_concepts:
  - MATH-1B-011-05
  prompt: "A 400 N force at 25° above horizontal has a vertical component of\n    approximately:\n    A) $169$ N\n    B) $363$\
    \ N\n    C) $219$ N\n    D) $345$ N"
  solution: 'A — $169$ N.** $F_y = 400\sin(25°) = 400(0.4226) = 169.0$ N. Note:

    $400\cos(25°) = 362.5$ N is the horizontal component (choice B). (§11.11,

    Worked Example 2)'
