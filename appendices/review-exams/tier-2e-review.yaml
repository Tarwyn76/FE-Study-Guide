items:
- id: T2E-Q001
  source_chapter: 02-65
  source_question: 23
  source_category: multiple-choice
  requires_concepts:
  - ELEC-2E-065-05
  prompt: 'Which statement is most accurate for **induction-machine slip**?

    A) It must be used with its defined reference and assumptions

    B) It is independent of topology and frequency

    C) It always represents a scalar DC quantity

    D) It replaces conservation laws'
  solution: '**A.** The chapter treats **induction-machine slip** as valid only with the required reference directions, circuit
    topology, frequency/state assumptions, and units.'
- id: T2E-Q002
  source_chapter: 02-61
  source_question: 9
  source_category: conceptual
  requires_concepts:
  - ELEC-2E-061-02
  prompt: What is a common analysis error involving **capacitor energy and combination**?
  solution: Applying **capacitor energy and combination** without checking topology, reference direction, steady/transient
    condition, RMS/peak basis, or machine/circuit assumptions can produce a formally calculated but physically wrong result.
