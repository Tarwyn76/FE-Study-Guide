- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-01
  prompt: During a verification review of a automation-panel system, which action best satisfies professional engineering
    obligations?
  choices:
  - protect public health, safety, and welfare
  - protect schedule first
  - conceal material hazards
  - approve outside competence
  answer: A
  solution: '**A.** Public welfare is the engineer''s paramount obligation. This result applies to the stated verification
    review of a automation-panel system.'
  id: ECE-A-Q018
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-02
  prompt: During a verification review of a digital-controller system, which action best satisfies professional
    engineering obligations?
  choices:
  - hide it if profitable
  - ignore it
  - transfer it to a vendor
  - disclose a material conflict of interest
  answer: D
  solution: '**D.** Material conflicts must be disclosed to affected parties. This result applies to the stated
    verification review of a digital-controller system.'
  id: ECE-A-Q019
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-03
  prompt: During a commissioning review of a motor-drive system, which action best satisfies professional engineering
    obligations?
  choices:
  - avoid peer review
  - accept all assignments
  - practice only within competence
  - seal any work requested
  answer: C
  solution: '**C.** Engineers must perform services only in areas of competence. This result applies to the stated
    commissioning review of a motor-drive system.'
  id: ECE-A-Q020
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
