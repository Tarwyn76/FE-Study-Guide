  prompt: During a design review of a data-acquisition system, find the magnitude of z=4+j4.
  choices:
  - '8.000'
  - '0.000'
  - '16.00'
  - '5.657'
  answer: D
  solution: '**D.** |z|=sqrt(4²+4²)=5.657. This result applies to the stated design review of a data-acquisition
