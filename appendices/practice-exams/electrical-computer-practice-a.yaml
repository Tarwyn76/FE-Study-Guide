  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-02
  prompt: During a verification review of a sensor-interface system, a normal variable has μ=10, σ=2. Find z for
    x=14.
  choices:
  - '1.000'
  - '4.000'
  - '7.000'
  - '2.000'
  answer: D
  solution: '**D.** z=(14-10)/2=2. This result applies to the stated verification review of a sensor-interface system.'
  id: ECE-A-Q015
