- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-01
  prompt: During a verification review of a power-distribution system, independent packet error probability is 0.10.
    For 5 packets, find probability of no errors.
  choices:
  - '0.590'
  - '0.410'
  - '0.000'
  - '0.500'
  answer: A
  solution: '**A.** P=(1-p)^n=0.590. This result applies to the stated verification review of a power-distribution
    system.'
  id: ECE-A-Q014
