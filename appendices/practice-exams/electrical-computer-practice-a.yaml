- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-01
  prompt: During a commissioning review of a data-acquisition system, a replacement cost of $15,000 occurs in 5
    years at 7%. Find present worth.
  choices:
  - $10694.8
  - $15000.0
  - $21038.3
  - $11111.1
  answer: A
  solution: '**A.** P=F/(1.07)^5=$10694.8. This result applies to the stated commissioning review of a data-acquisition
    system.'
  id: ECE-A-Q022
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-02
  prompt: During a commissioning review of a industrial-network system, $10,000 invested at 6% for 4 years grows
    to what future worth?
  choices:
  - $10000.0
  - $7920.9
  - $12400.0
  - $12624.8
  answer: D
  solution: '**D.** F=P(1+i)^n=$12624.8. This result applies to the stated commissioning review of a industrial-network
    system.'
