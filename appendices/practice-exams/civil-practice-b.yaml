- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-006-07
  prompt: During a field-verification review for a slope stabilization project, for equal-service mutually exclusive
    alternatives, which present-worth rule is appropriate?
  choices:
  - Select the greatest initial cost
  - Select the longest life regardless of value
  - Select the smallest annual interest rate
  - Select the greatest net present worth
  answer: D
  solution: '**D.** Use consistent cash-flow signs and choose the greatest net present worth. This result applies
    to the stated field-verification review for a slope stabilization project.'
