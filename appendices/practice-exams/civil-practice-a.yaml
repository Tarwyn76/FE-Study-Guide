  prompt: During a feasibility review for a stormwater basin project, a vehicle travels 25 m/s, perception-reaction
    time 2.5 s, braking deceleration 3.4 m/s². Find stopping sight distance.
  choices:
  - 154.4 m
  - 62.50 m
