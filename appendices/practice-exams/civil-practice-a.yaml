- knowledge_area: Mathematics and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-02
  prompt: During a design review for a stormwater basin project, independent defect probability is 0.17 for each
    of 5 samples. Find the probability of zero defects.
  choices:
  - '0.606'
  - '0.000'
  - '0.850'
  - '0.394'
  answer: D
  solution: '**D.** P(0)=(1-p)^n=0.394. This result applies to the stated design review for a stormwater basin project.'
  id: CIV-A-Q002
- knowledge_area: Mathematics and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-03
  prompt: During a design review for a water-main extension project, a measurement is normal with μ=50 and σ=6.
    Find the z-score for x=62.
  choices:
  - '0.500'
  - '4.000'
  - '2.000'
  - '1.000'
  answer: C
  solution: '**C.** z=(x-μ)/σ=2.000. This result applies to the stated design review for a water-main extension
    project.'
