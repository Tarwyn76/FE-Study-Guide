  - 0.062 s⁻¹
  answer: A
  solution: '**A.** k₂/k₁=exp[-E_a/R(1/T₂−1/T₁)], giving k₂=0.619 s⁻¹. This is the governing result for the ofit
    review of a process-water treatment unit project.'
  id: CHEM-B-Q085
