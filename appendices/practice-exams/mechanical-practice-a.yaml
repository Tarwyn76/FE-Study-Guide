- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-001-01
  prompt: During a design review of a shaft assembly, for y=2x²+3x, find dy/dx at x=2.
  choices:
  - '7'
  - '8'
  - '15'
  - '11'
  answer: D
  solution: '**D.** dy/dx=4x+3=11.'
  id: MEC-A-Q001
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-001-02
  prompt: During a design review of a HVAC unit, evaluate ∫_0^3 2x dx.
  choices:
  - '12'
  - '9'
  - '4.500'
  - '6'
  answer: B
  solution: '**B.** Integral=x², giving 9.'
  id: MEC-A-Q002
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-001-03
  prompt: During a design review of a machine frame, solve 5x-7=18.
  choices:
  - '2.2'
  - '11'
  - '25'
  - '5'
  answer: D
  solution: '**D.** 5x=25, so x=5.'
  id: MEC-A-Q003
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-002-01
  prompt: During a design review of a gearbox, for matrix [[3,2],[1,5]], find the determinant.
  choices:
  - '15'
  - '13'
  - '17'
  - '7'
  answer: B
  solution: '**B.** det=3(5)-2(1)=13.'
  id: MEC-A-Q004
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-002-02
  prompt: During a design review of a pressure vessel, if f(t)=6e^(0.5t), find df/dt.
  choices:
  - 6.5e^(0.5t)
  - 0.5e^(0.5t)
  - 6e^(3t)
  - 3e^(0.5t)
  answer: D
  solution: '**D.** Differentiate: 6(0.5)e^(0.5t).'
  id: MEC-A-Q005
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-002-03
  prompt: During a design review of a test stand, a line through (1,4) and (5,16) has slope
  choices:
  - '12'
  - '3'
  - '2'
  - '4'
  answer: B
  solution: '**B.** m=(16-4)/(5-1)=3.'
  id: MEC-A-Q006
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-01
  prompt: During a design review of a fan system, a dimension is normally distributed with mean 20 mm and σ=2 mm. The z-score
    at 24 mm is
  choices:
  - '1'
  - '4'
  - '12'
  - '2'
  answer: D
  solution: '**D.** z=(24-20)/2=2.'
  id: MEC-A-Q007
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-02
  prompt: During a performance check of a pump skid, for independent events A and B, P(A∩B) equals
  choices:
  - 1-P(A)
  - P(A)P(B)
  - P(A)+P(B)
  - P(A)-P(B)
  answer: B
  solution: '**B.** Independence gives the product rule.'
  id: MEC-A-Q008
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-03
  prompt: During a performance check of a shaft assembly, a sample of n=64 has population σ=8. The standard error of the mean
    is
  choices:
  - '0.125'
  - '8'
  - '64'
  - '1'
  answer: D
  solution: '**D.** SE=σ/√n=8/8=1.'
  id: MEC-A-Q009
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-04
  prompt: During a performance check of a HVAC unit, a component fails with probability 0.05 independently. Probability 4
    components all survive is
  choices:
  - '0.800'
  - '0.815'
  - '0.185'
  - '0.000'
  answer: B
  solution: '**B.** P=0.95^4=0.815.'
  id: MEC-A-Q010
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-01
  prompt: During a performance check of a machine frame, a design calculation reveals a credible hazard to users. The engineer
    should first
  choices:
  - protect schedule
  - hide the calculation
  - wait for failure
  - protect health, safety, and welfare
  answer: D
  solution: '**D.** Public safety is paramount.'
