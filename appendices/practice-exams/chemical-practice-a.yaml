  prompt: During a design-basis review of a batch reactor project, for y=x²+3x, evaluate dy/dx at x=3.
  choices:
  - '6'
  - 6 under an invalid assumption
  - '18'
  - '9'
  answer: D
  solution: '**D.** dy/dx=2x+3=9. This result applies to the stated design-basis review of a batch reactor project.'
