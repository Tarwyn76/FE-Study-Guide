  prompt: During a economic-screening review of a pilot evaporator project, a fail-closed control valve is preferred
    when loss of air should
  choices:
  - Drive the valve closed
  - Drive the valve fully open
  - Freeze controller output only
  - Increase process pressure
  answer: A
  solution: '**A.** Fail action is selected so loss of utility moves the process toward its safer state. This result
