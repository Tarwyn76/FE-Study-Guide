  prompt: During a design-basis review of a pilot evaporator project, solve 3x + 2 = 11.
  choices:
  - '3.000'
  - '4.000'
  - '2.000'
  - '3.667'
  answer: A
  solution: '**A.** Rearrange: x=(11-2)/3=3.000. This result applies to the stated design-basis review of a pilot
    evaporator project.'
