  prompt: During a startup review of a polymerization line project, feedforward control acts primarily on
  choices:
  - Only past error
  - Unmeasured noise only
  - Final product inspection only
  - Measured disturbances
  answer: D
  solution: '**D.** Feedforward uses measured disturbances to anticipate their effect. This result applies to the
    stated startup review of a polymerization line project.'
  id: CHEM-A-Q098
