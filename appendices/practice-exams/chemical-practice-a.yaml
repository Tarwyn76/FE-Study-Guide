  prompt: During a debottlenecking review of a wastewater neutralization unit project, a future cost of $10,000
    occurs in 5 years at 8%/yr. Find present worth?
  choices:
  - $6805.8
  - $14693.3
  - $7142.9
  - $10000.0
  answer: A
  solution: '**A.** P=F/(1+i)^n=10000/1.08^5=$6805.8. This result applies to the stated debottlenecking review of
    a wastewater neutralization unit project.'
  id: CHEM-A-Q085
- knowledge_area: Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-01
  prompt: During a debottlenecking review of a compressed-gas system project, $5,000 is invested at 6% annually
    for 5 years. Find future worth?
  choices:
  - $6500.0
  - $3736.3
  - $5000.0
  - $6691.1
  answer: D
  solution: '**D.** F=P(1+i)^n=5000(1.06)^5=$6691.1. This result applies to the stated debottlenecking review of
    a compressed-gas system project.'
  id: CHEM-A-Q086
- knowledge_area: Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-04
  prompt: During a debottlenecking review of a distillation section project, when comparing mutually exclusive alternatives
    with equal service, the preferred present-worth alternative is generally the one with
  choices:
  - The longest life regardless of value
  - The smallest interest rate written in its proposal
  - The greatest net present worth
  - The largest initial cost
  answer: C
  solution: '**C.** For consistent sign convention and equal service, maximize net present worth. This result applies
    to the stated debottlenecking review of a distillation section project.'
  id: CHEM-A-Q087
