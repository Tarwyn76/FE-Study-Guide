- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-031-01
  prompt: During a design-basis review of a compressed-gas system project, a vector has magnitude 4 at 60°. Find
    its x-component.
  choices:
  - '3.464'
  - '4.000'
  - '6.928'
  - '2.000'
  answer: D
  solution: '**D.** Vx=V cosθ=4cos(60°)=2.000. This result applies to the stated design-basis review of a compressed-gas
    system project.'
  id: CHEM-A-Q006
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-04
  prompt: During a design-basis review of a distillation section project, each trial independently fails with probability
    0.10. For 4 trials, find the probability of no failures?
  choices:
  - '0.656'
  - '0.344'
  - '0.000'
  - '0.400'
  answer: A
  solution: '**A.** P(no failures)=(1-0.10)^4=0.656. This result applies to the stated design-basis review of a
    distillation section project.'
  id: CHEM-A-Q007
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-05
  prompt: During a design-basis review of a polymerization line project, a normal variable has μ=50 and σ=6. What
    z-score corresponds to x=56?
  choices:
  - '0.500'
  - '2.000'
  - '5.000'
  - '1.000'
  answer: D
  solution: '**D.** z=(x-μ)/σ=(56-50)/6=1.000. This result applies to the stated design-basis review of a polymerization
    line project.'
  id: CHEM-A-Q008
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-029-02
  prompt: During a design-basis review of a feed-preparation system project, calculate the sample mean of [4, 6,
    8, 12].
  choices:
  - '6.500'
  - '30.00'
  - '7.500'
  - '8.500'
  answer: C
  solution: '**C.** Mean=sum/n=30/4=7.500. This result applies to the stated design-basis review of a feed-preparation
    system project.'
  id: CHEM-A-Q009
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-029-03
  prompt: During a design-basis review of a product-drying line project, given P(A)=0.4, P(B)=0.5, and P(A∩B)=0.2,
    find P(B|A).
  choices:
  - '0.700'
  - '0.500'
  - '0.400'
  - '0.200'
  answer: B
  solution: '**B.** P(B|A)=P(A∩B)/P(A)=0.2/0.4=0.500. This result applies to the stated design-basis review of a
    product-drying line project.'
  id: CHEM-A-Q010
