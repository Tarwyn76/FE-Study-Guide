  prompt: During a design-basis review of a wastewater neutralization unit project, evaluate log_4(9).
  choices:
  - '1.585'
  - '2.197'
  - '2.250'
  - '0.954'
  answer: A
  solution: '**A.** Use change of base: ln(9)/ln(4)=1.585. This result applies to the stated design-basis review
