  question_type: multiple-choice
  requires_concepts:
  - CHE-3-013-03
  prompt: During a startup review of a feed-preparation system project, cascade control uses a secondary loop mainly
    to
  choices:
  - Replace the primary controller
  - Guarantee zero process dead time
  - Reject fast secondary disturbances before they propagate
  - Eliminate all sensors
  answer: C
  solution: '**C.** A faster inner loop suppresses disturbances before they strongly affect the primary variable.
    This result applies to the stated startup review of a feed-preparation system project.'
  id: CHEM-A-Q099
