items:
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1B-004-03
  prompt: A mechanical engineer is conducting a separate redesign study for a robotic fixture. In that separate case, a line
    through (1,4) and (5,16) has slope
  choices:
  - '12'
  - '3'
  - '2'
  - '4'
  answer: B
  solution: '**B.** m=(16-4)/(5-1)=3.'
  id: MEC-B-Q001
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-01
  prompt: A mechanical engineer is conducting a separate redesign study for a thermal loop. In that separate case, for y=2x²+3x,
    find dy/dx at x=2.
  choices:
  - '7'
  - '8'
  - '15'
  - '11'
  answer: D
  solution: '**D.** dy/dx=4x+3=11.'
  id: MEC-B-Q002
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-02
  prompt: A mechanical engineer is conducting a separate redesign study for a rotating machine. In that separate case, evaluate
    ∫_0^3 2x dx.
  choices:
  - '12'
  - '9'
  - '4.500'
  - '6'
  answer: B
  solution: '**B.** Integral=x², giving 9.'
  id: MEC-B-Q003
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-03
  prompt: A mechanical engineer is conducting a separate redesign study for a drive train. In that separate case, solve 5x-7=18.
  choices:
  - '2.2'
  - '11'
  - '25'
  - '5'
  answer: D
  solution: '**D.** 5x=25, so x=5.'
  id: MEC-B-Q004
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-04
  prompt: A mechanical engineer is conducting a separate redesign study for a piping module. In that separate case, for matrix
    [[3,2],[1,5]], find the determinant.
  choices:
  - '15'
  - '13'
  - '17'
  - '7'
  answer: B
  solution: '**B.** det=3(5)-2(1)=13.'
  id: MEC-B-Q005
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-01
  prompt: A mechanical engineer is conducting a separate redesign study for a instrumented rig. In that separate case, if
    f(t)=6e^(0.5t), find df/dt.
  choices:
  - 6.5e^(0.5t)
  - 0.5e^(0.5t)
  - 6e^(3t)
  - 3e^(0.5t)
  answer: D
  solution: '**D.** Differentiate: 6(0.5)e^(0.5t).'
  id: MEC-B-Q006
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-02
  prompt: A mechanical engineer is conducting a separate redesign study for a air-handling assembly. In that separate case,
    a line through (1,4) and (5,16) has slope
  choices:
  - '12'
  - '3'
  - '2'
  - '4'
  answer: B
  solution: '**B.** m=(16-4)/(5-1)=3.'
  id: MEC-B-Q007
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-030-06
  prompt: A mechanical engineer is conducting a independent calculation check for a compressor package. In that separate case,
    increasing sample size, all else equal, generally makes a confidence interval
  choices:
  - invalid
  - narrower
  - wider
  - unchanged always
  answer: B
  solution: '**B.** Standard error falls as sample size rises.'
  id: MEC-B-Q008
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-030-07
  prompt: A mechanical engineer is conducting a independent calculation check for a robotic fixture. In that separate case,
    a dimension is normally distributed with mean 20 mm and σ=2 mm. The z-score at 24 mm is
  choices:
  - '1'
  - '4'
  - '12'
  - '2'
  answer: D
  solution: '**D.** z=(24-20)/2=2.'
  id: MEC-B-Q009
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-031-01
  prompt: A mechanical engineer is conducting a independent calculation check for a thermal loop. In that separate case, for
    independent events A and B, P(A∩B) equals
  choices:
  - 1-P(A)
  - P(A)P(B)
  - P(A)+P(B)
  - P(A)-P(B)
  answer: B
  solution: '**B.** Independence gives the product rule.'
  id: MEC-B-Q010
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-031-02
  prompt: A mechanical engineer is conducting a independent calculation check for a rotating machine. In that separate case,
    a sample of n=64 has population σ=8. The standard error of the mean is
  choices:
  - '0.125'
  - '8'
  - '64'
  - '1'
  answer: D
  solution: '**D.** SE=σ/√n=8/8=1.'
  id: MEC-B-Q011
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-06
  prompt: A mechanical engineer is conducting a independent calculation check for a drive train. In that separate case, a
    released drawing contains a material error. The engineer should
  choices:
  - conceal it
  - correct it and notify affected parties
  - ignore it
  - delete records
  answer: B
  solution: '**B.** Material errors must be addressed.'
  id: MEC-B-Q012
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-07
  prompt: A mechanical engineer is conducting a independent calculation check for a piping module. In that separate case,
    a design calculation reveals a credible hazard to users. The engineer should first
  choices:
  - protect schedule
  - hide the calculation
  - wait for failure
  - protect health, safety, and welfare
  answer: D
  solution: '**D.** Public safety is paramount.'
  id: MEC-B-Q013
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-002-01
  prompt: A mechanical engineer is conducting a independent calculation check for a instrumented rig. In that separate case,
    an engineer has a financial interest in a supplier under evaluation. The engineer should
  choices:
  - destroy bid records
  - disclose the conflict
  - conceal it
  - select the supplier automatically
  answer: B
  solution: '**B.** Material conflicts require disclosure.'
  id: MEC-B-Q014
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-002-02
  prompt: A mechanical engineer is conducting a independent calculation check for a air-handling assembly. In that separate
    case, a request is outside an engineer's competence. The proper response is to
  choices:
  - approve anyway
  - copy an unrelated design
  - avoid review
  - obtain qualified assistance or decline
  answer: D
  solution: '**D.** Practice must remain within competence.'
  id: MEC-B-Q015
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-06
  prompt: A mechanical engineer is conducting a new validation exercise for a compressor package. In that separate case, for
    equal-service mutually exclusive alternatives, present-worth analysis generally selects
  choices:
  - lowest salvage value
  - greatest net present worth
  - largest first cost
  - longest life only
  answer: B
  solution: '**B.** Use consistent assumptions and select greatest net PW.'
  id: MEC-B-Q016
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-07
  prompt: A mechanical engineer is conducting a new validation exercise for a robotic fixture. In that separate case, fixed
    cost is $50,000 and contribution margin is $10/unit. Break-even volume is
  choices:
  - 500 units
  - 50 units
  - 50000 units
  - 5000 units
  answer: D
  solution: '**D.** Q=F/(p-v)=50000/10.'
  id: MEC-B-Q017
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-01
  prompt: A mechanical engineer is conducting a new validation exercise for a thermal loop. In that separate case, depreciation
    primarily represents
  choices:
  - salvage paid annually
  - allocation of asset cost over its useful life
  - cash revenue
  - loan principal only
  answer: B
  solution: '**B.** Depreciation allocates capital cost for accounting/tax purposes.'
  id: MEC-B-Q018
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-02
  prompt: A mechanical engineer is conducting a new validation exercise for a rotating machine. In that separate case, a future
    overhaul costs $40,000 in 5 years. At 6%, find present worth.
  choices:
  - $40000
  - $53529.0
  - $30769.2
  - $29890.3
  answer: D
  solution: '**D.** P=F/(1.06)^5=$29890.3.'
  id: MEC-B-Q019
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-03
  prompt: A mechanical engineer is conducting a new validation exercise for a drive train. In that separate case, a machine
    costs $90,000 and saves $18,000 per year ignoring time value. Simple payback is
  choices:
  - 18 years
  - 5 years
  - 2 years
  - 4 years
  answer: B
  solution: '**B.** 90000/18000=5 years.'
  id: MEC-B-Q020
