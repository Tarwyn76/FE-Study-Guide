  question_type: multiple-choice
  requires_concepts:
  - ELEC-2E-060-02
  prompt: A mechanical engineer is conducting a alternate operating case for a compressor package. In that separate case,
    two 6 Ω resistors in parallel have equivalent resistance
  choices:
  - 6 Ω
  - 12 Ω
  - 1 Ω
  - 3 Ω
  answer: D
  solution: '**D.** For equal resistors, R_eq=R/2=6 Ω/2=3 Ω.'
