- knowledge_area: Engineering Sciences
  question_type: multiple-choice
  requires_concepts:
  - IND-3-069-05
  prompt: An industrial engineer is conducting a independent verification for a electronics factory. In that independent scenario,
    which physical principle best explains why increasing required work at fixed available power increases completion time?
  choices:
  - power = work/time
  - Hooke's law
  - ideal gas law
  - Ohm's law only
  answer: A
  solution: '**A.** Rearrange P=W/t to t=W/P.'
  id: IND-B-Q008
- knowledge_area: Engineering Sciences
  question_type: multiple-choice
  requires_concepts:
  - IND-3-069-06
  prompt: An industrial engineer is conducting a independent verification for a regional fulfillment hub. In that independent
    scenario, a workstation processes 48 parts in 6 h. What is average throughput?
  choices:
  - 288 parts/h
  - 8 parts/h
  - 6 parts/h
  - 42 parts/h
  answer: B
  solution: '**B.** Throughput=48/6=8 parts/h.'
  id: IND-B-Q009
- knowledge_area: Engineering Sciences
  question_type: multiple-choice
  requires_concepts:
  - IND-3-069-07
  prompt: An industrial engineer is conducting a independent verification for a field-service network. In that independent
    scenario, a 20 N force moves an object 4 m in its direction. How much work is done?
  choices:
  - 24 J
  - 160 J
  - 80 J
  - 5 J
  answer: C
  solution: '**C.** W=Fd=80 J.'
  id: IND-B-Q010
- knowledge_area: Engineering Sciences
  question_type: multiple-choice
  requires_concepts:
  - IND-3-062-01
  prompt: An industrial engineer is conducting a independent verification for a packaging line. In that independent scenario,
    a 2 kW machine operates for 3 h. How much energy does it use?
  choices:
  - 0.667 kWh
  - 5 kWh
  - 9 kWh
  - 6 kWh
  answer: D
  solution: '**D.** Energy=power×time=6 kWh.'
