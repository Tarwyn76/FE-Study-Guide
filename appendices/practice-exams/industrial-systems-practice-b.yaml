- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-05
  prompt: An industrial engineer is conducting a new process redesign for a electronics factory. In that independent scenario,
    a project costs $80,000 and returns $20,000 per year with no time-value adjustment. Simple payback is
  choices:
  - 4 years
  - 2 years
  - 5 years
  - 16 years
  answer: A
  solution: '**A.** 80,000/20,000=4 years.'
  id: IND-B-Q016
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-06
  prompt: An industrial engineer is conducting a new process redesign for a regional fulfillment hub. In that independent
    scenario, if annual fixed cost is $60,000 and contribution margin is $15/unit, break-even volume is
  choices:
  - 60000 units
  - 4000 units
  - 900 units
  - 15 units
  answer: B
  solution: '**B.** Q=F/(p-v)=60000/15=4000.'
  id: IND-B-Q017
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-005-07
  prompt: An industrial engineer is conducting a new process redesign for a field-service network. In that independent scenario,
