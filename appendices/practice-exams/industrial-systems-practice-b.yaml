- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-02
  prompt: An industrial engineer is conducting a separate optimization study for a regional fulfillment hub. In that independent
    scenario, a line passes through (2,5) and (6,17). Find its slope.
  choices:
  - '3'
  - '2'
  - '4'
  - '12'
  answer: A
  solution: '**A.** m=(17-5)/(6-2)=3.'
  id: IND-B-Q001
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-03
  prompt: An industrial engineer is conducting a separate optimization study for a field-service network. In that independent
    scenario, for f(x)=x³-2x²+7x, evaluate f'(x) at x=6.
  choices:
  - '36'
  - '91'
  - '97'
  - '87'
  answer: B
  solution: '**B.** f''(x)=3x²-4x+7=91.'
  id: IND-B-Q002
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-04
  prompt: An industrial engineer is conducting a separate optimization study for a packaging line. In that independent scenario,
    a triangular response profile has base 6 and height 6. Find its area.
  choices:
  - '9.000'
  - '12'
  - '18.00'
  - '36'
  answer: C
  solution: '**C.** A=bh/2=18.00.'
  id: IND-B-Q003
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-019-05
  prompt: An industrial engineer is conducting a separate optimization study for a clinic intake system. In that independent
    scenario, for matrix [[2,3],[1,4]], find the determinant.
  choices:
  - '11'
  - '8'
  - '-5'
  - '5'
  answer: D
  solution: '**D.** det=2(4)-3(1)=5.'
  id: IND-B-Q004
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-001-01
  prompt: An industrial engineer is conducting a separate optimization study for a spare-parts center. In that independent
