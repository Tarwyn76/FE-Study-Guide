  prompt: During a improvement study at a maintenance operation, a replacement cost of $50,000 occurs in 4 years. At 7%, find
    present worth.
  choices:
  - $50000
  - $65539.8
  - $39062.5
  - $38144.8
  answer: D
  solution: '**D.** P=F/(1.07)^4=$38144.8.'
