- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-02
  prompt: During a planning meeting at a assembly plant, annual savings are $12,000 for 5 years at 6%. Find present worth.
  choices:
