- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1A-001-01
  prompt: During a capacity review at a distribution center, for f(x)=x³-2x²+7x, evaluate f'(x) at x=2.
  choices:
  - '17'
  - '7'
  - '4'
  - '11'
  answer: D
  solution: '**D.** f''(x)=3x²-4x+7=11.'
