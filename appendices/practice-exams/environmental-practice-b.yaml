- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-03
  prompt: An environmental engineer is checking a separate mass-balance or reactor case using only the stated process
    data. During a operations review of a site-cleanup system, at steady state, Q=3 m³/s enters at 20 mg/L and exits
    at 8 mg/L. Find contaminant removal rate in mg·m³/s per L-equivalent basis.
  choices:
  - '18.00'
  - '36.00'
  - '60.00'
  - '24.00'
  answer: B
  solution: '**B.** Steady mass balance gives removal=Q(Cin-Cout)=36.00 in consistent flow-concentration units.
