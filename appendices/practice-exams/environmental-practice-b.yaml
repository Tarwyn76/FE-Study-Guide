  choices:
  - 1296.0 kg/day
  - 5184.0 kg/day
  - 2592.0 kg/day
  - 30.00 kg/day
  answer: C
  solution: '**C.** Load=Q C ×86.4=2592.0 kg/day. This result applies to the stated operations review of a solid-waste
