- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-06
  prompt: An environmental engineer is checking a separate mass-balance or reactor case using only the stated process
    data. During a operations review of a detention system, a first-order contaminant decays with k=0.2 day⁻¹ for
    5 days. Find C/C0.
  choices:
  - '2.718'
  - '0.368'
  - '0.632'
  - '1.000'
  answer: B
  solution: '**B.** C/C0=e^(-kt)=0.368. This result applies to the stated operations review of a detention system.'
  id: ENV-B-Q022
- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-07
  prompt: An environmental engineer is checking a separate mass-balance or reactor case using only the stated process
    data. During a operations review of a aquifer system, a completely mixed flow reactor assumes the effluent concentration
    is
  choices:
  - equal to the reactor concentration
  - always zero
  - equal to influent concentration
  - independent of mixing
  answer: A
  solution: '**A.** Ideal CSTR mixing makes tank and effluent concentrations equal. This result applies to the stated
    operations review of a aquifer system.'
  id: ENV-B-Q023
- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-01
  prompt: An environmental engineer is checking a separate mass-balance or reactor case using only the stated process
    data. During a operations review of a air-control system, residence time for an ideal tank of volume V with
    flow Q is
  choices:
  - Q/V
  - VQ
  - 1/(VQ)
  - V/Q
  answer: D
  solution: '**D.** Hydraulic residence time is volume divided by flow. This result applies to the stated operations
    review of a air-control system.'
  id: ENV-B-Q024
- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
