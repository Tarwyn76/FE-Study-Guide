- knowledge_area: Health Hazards and Risk Assessment
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-050-06
  prompt: A risk assessor is reviewing a separate exposure scenario before documenting the risk characterization.
    During a sampling review of a river-basin system, a hazard quotient below 1 generally suggests
  choices:
  - automatic regulatory compliance
  - noncancer adverse effects are not expected at the evaluated exposure
  - zero risk of every kind
  - certain carcinogenicity
  answer: B
  solution: '**B.** HQ<1 is commonly interpreted as below the reference-dose benchmark. This result applies to the
    stated sampling review of a river-basin system.'
