- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1B-004-03
  prompt: A consulting engineer is independently checking the calculation method before it is used in a design memorandum.
    During a design review of a activated-sludge system, solve 3x+5=20.
  choices:
  - '25'
  - '5'
  - '3'
  - '15'
  answer: B
  solution: '**B.** 3x=15, so x=5. This result applies to the stated design review of a activated-sludge system.'
  id: ENV-B-Q001
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-01
  prompt: A consulting engineer is independently checking the calculation method before it is used in a design memorandum.
    During a design review of a detention system, evaluate log10(1000).
  choices:
  - '3.000'
  - '2.000'
  - '10.00'
  - '1000'
  answer: A
  solution: '**A.** 10³=1000, so log10(1000)=3. This result applies to the stated design review of a detention system.'
  id: ENV-B-Q002
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-02
  prompt: A consulting engineer is independently checking the calculation method before it is used in a design memorandum.
    During a design review of a aquifer system, for a 2×2 matrix [[a,b],[c,d]], the determinant is
  choices:
  - ac-bd
  - ab-cd
  - a+b+c+d
  - ad-bc
  answer: D
  solution: '**D.** det=ad-bc. This result applies to the stated design review of a aquifer system.'
  id: ENV-B-Q003
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-03
  prompt: A consulting engineer is independently checking the calculation method before it is used in a design memorandum.
    During a design review of a air-control system, for y=2x²+3x, find dy/dx at x=4.
  choices:
  - '25.65'
  - '16'
  - '19'
  - '11'
  answer: C
  solution: '**C.** dy/dx=4x+3=19. This result applies to the stated design review of a air-control system.'
  id: ENV-B-Q004
- knowledge_area: Mathematics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1C-016-04
  prompt: A consulting engineer is independently checking the calculation method before it is used in a design memorandum.
    During a design review of a solid-waste system, evaluate ∫_0^2 2x dx.
  choices:
  - '6.000'
  - '4.000'
  - '2.000'
  - '5.400'
  answer: B
  solution: '**B.** Integral=x², so result=4.000. This result applies to the stated design review of a solid-waste
