- knowledge_area: Environmental Chemistry
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-049-06
  prompt: A laboratory engineer is evaluating a separate chemistry case under the stated equilibrium or reaction
    conditions. During a operations review of a reclaimed-water system, if ion product exceeds Ksp, a sparingly
    soluble salt is thermodynamically driven toward
  choices:
  - infinite solubility
