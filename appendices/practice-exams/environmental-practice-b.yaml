- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-030-06
  prompt: A compliance analyst is independently reviewing a new monitoring data set before drawing a statistical
    conclusion. During a design review of a river-basin system, for independent events A and B, P(A∩B) equals
  choices:
  - 0 always
  - P(A)P(B)
  - P(A)+P(B)
  - P(A)-P(B)
  answer: B
  solution: '**B.** Independence gives the product rule. This result applies to the stated design review of a river-basin
    system.'
  id: ENV-B-Q007
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-030-07
  prompt: A compliance analyst is independently reviewing a new monitoring data set before drawing a statistical
    conclusion. During a design review of a process-wastewater system, a sample exceeds a limit with probability
    0.10. For 5 independent samples, find probability none exceed.
  choices:
  - '0.590'
  - '0.410'
  - '0.000'
  - '0.500'
  answer: A
  solution: '**A.** P=(1-p)^n=0.590. This result applies to the stated design review of a process-wastewater system.'
  id: ENV-B-Q008
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-031-01
  prompt: A compliance analyst is independently reviewing a new monitoring data set before drawing a statistical
    conclusion. During a design review of a reclaimed-water system, a normal variable has μ=50 and σ=5. Find z for
    x=60.
  choices:
  - '1.000'
  - '10.00'
  - '12.00'
  - '2.000'
  answer: D
  solution: '**D.** z=(60-50)/5=2. This result applies to the stated design review of a reclaimed-water system.'
  id: ENV-B-Q009
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-031-02
  prompt: A compliance analyst is independently reviewing a new monitoring data set before drawing a statistical
    conclusion. During a compliance review of a drinking-water system, find the mean of [10, 12, 14, 16].
  choices:
  - '11.00'
  - '52.00'
  - '13.00'
  - '15.00'
  answer: C
  solution: '**C.** Mean=sum/4=13.00. This result applies to the stated compliance review of a drinking-water system.'
  id: ENV-B-Q010
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-06
  prompt: A project engineer is evaluating a separate professional-practice situation before documenting the decision.
    During a compliance review of a activated-sludge system, which action best meets professional engineering obligations?
  choices:
  - conceal it
  - correct or report a material error
  - leave it unchanged
  - delete records
  answer: B
  solution: '**B.** Material errors affecting decisions must be addressed. This result applies to the stated compliance
    review of a activated-sludge system.'
  id: ENV-B-Q011
- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-07
  prompt: A project engineer is evaluating a separate professional-practice situation before documenting the decision.
    During a compliance review of a detention system, which action best meets professional engineering obligations?
  choices:
  - protect public health, safety, and welfare
  - protect schedule first
  - conceal known hazards
  - approve outside competence
  answer: A
