- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-06
  prompt: A project manager is comparing a separate environmental investment decision using the stated economic
    assumptions. During a compliance review of a site-cleanup system, for equal-service mutually exclusive alternatives,
    the present-worth criterion generally selects
  choices:
  - the lowest nominal interest rate
  - the greatest net present worth
  - the highest first cost
  - the longest life regardless of economics
  answer: B
  solution: '**B.** Choose the greatest net present worth using consistent assumptions. This result applies to the
    stated compliance review of a site-cleanup system.'
  id: ENV-B-Q016
- knowledge_area: Engineering Economics
  question_type: multiple-choice
  requires_concepts:
  - ECON-2A-004-07
  prompt: A project manager is comparing a separate environmental investment decision using the stated economic
    assumptions. During a compliance review of a river-basin system, a future environmental compliance cost of $68,000
    occurs in 5 years at 6%. Find present worth.
  choices:
  - $50813.6
  - $68000.0
  - $90999.3
  - $52307.7
  answer: A
  solution: '**A.** P=F/(1.06)^5=$50813.6. This result applies to the stated compliance review of a river-basin
    system.'
