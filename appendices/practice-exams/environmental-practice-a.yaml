  prompt: During a operations review of a water-treatment system, a stream flow is 2 m³/s at 15 mg/L. Find mass
    loading in kg/day.
  choices:
  - 2592.0 kg/day
  - 30.00 kg/day
  - 1296.0 kg/day
  - 5184.0 kg/day
  answer: A
  solution: '**A.** Load=Q C ×86.4=2592.0 kg/day. This result applies to the stated operations review of a water-treatment
    system.'
  id: ENV-A-Q020
- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-02
  prompt: During a operations review of a wastewater system, at steady state, Q=3 m³/s enters at 20 mg/L and exits
    at 8 mg/L. Find contaminant removal rate in mg·m³/s per L-equivalent basis.
  choices:
  - '60.00'
  - '24.00'
  - '18.00'
  - '36.00'
  answer: D
  solution: '**D.** Steady mass balance gives removal=Q(Cin-Cout)=36.00 in consistent flow-concentration units.
    This result applies to the stated operations review of a wastewater system.'
