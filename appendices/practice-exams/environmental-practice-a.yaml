  prompt: During a design review of a wastewater system, for y=2x²+3x, find dy/dx at x=2.
  choices:
  - '11'
  - '7'
  - '14.85'
  - '8'
  answer: A
  solution: '**A.** dy/dx=4x+3=11. This result applies to the stated design review of a wastewater system.'
