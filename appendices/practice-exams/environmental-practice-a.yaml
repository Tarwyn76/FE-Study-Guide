- knowledge_area: Ethics and Professional Practice
  question_type: multiple-choice
  requires_concepts:
  - PROF-2A-001-01
  prompt: During a compliance review of a water-treatment system, which action best meets professional engineering
    obligations?
  choices:
  - protect public health, safety, and welfare
  - protect schedule first
  - conceal known hazards
  - approve outside competence
  answer: A
  solution: '**A.** Public welfare is paramount. This result applies to the stated compliance review of a water-treatment
    system.'
