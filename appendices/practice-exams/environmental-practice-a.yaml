- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-01
  prompt: During a design review of a remediation system, a sample exceeds a limit with probability 0.10. For 5
    independent samples, find probability none exceed.
  choices:
  - '0.590'
  - '0.410'
  - '0.000'
  - '0.500'
  answer: A
  solution: '**A.** P=(1-p)^n=0.590. This result applies to the stated design review of a remediation system.'
  id: ENV-A-Q006
- knowledge_area: Probability and Statistics
  question_type: multiple-choice
  requires_concepts:
  - MATH-1D-028-02
  prompt: During a design review of a watershed system, a normal variable has μ=50 and σ=5. Find z for x=60.
  choices:
  - '1.000'
  - '10.00'
  - '12.00'
  - '2.000'
  answer: D
  solution: '**D.** z=(60-50)/5=2. This result applies to the stated design review of a watershed system.'
  id: ENV-A-Q007
