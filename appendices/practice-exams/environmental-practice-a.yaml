- knowledge_area: Fundamental Principles
  question_type: multiple-choice
  requires_concepts:
  - ENV-3-048-03
  prompt: During a operations review of a stormwater system, a first-order contaminant decays with k=0.2 day⁻¹ for
    5 days. Find C/C0.
  choices:
  - '1.000'
  - '2.718'
  - '0.368'
  - '0.632'
  answer: C
  solution: '**C.** C/C0=e^(-kt)=0.368. This result applies to the stated operations review of a stormwater system.'
