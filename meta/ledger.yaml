schema_version: 4
handbook_edition: '10.6'
_schema:
  id: required, unique, matches ID FORMAT above
  title: required, imperative or noun phrase, sentence case
  chapter: required, e.g. 01-02
  layer: required, 0|1|2|3
  tier: required for layers 1-2, one of A B C D E F; null for layers 0 and 3
  track: required for layer 3, one of the seven disciplines; null otherwise
  prerequisites: list of ledger IDs. [] only for true axioms.
  introduces_terms: terms first DEFINED here. Must be globally unique. Feeds glossary + linter.
  introduces_symbols: physical or mathematical QUANTITIES first defined here. Must exist in notation.md with SI and USCS columns.
  introduces_notation: operators, delimiters, function names, and set notation first defined here. Glossary only; no units
    row.
  uses_symbols: symbols used but defined elsewhere. Linter checks that each is introduced by a TRANSITIVE prerequisite.
  uses_terms: terms used but defined elsewhere, where the usage is load-bearing. Same transitive check as uses_symbols. Illustrative
    mentions are exempt and are marked in the source, not here.
  handbook_ref: section name + page in the Handbook edition named above, or null
  handbook_verified: true only if page confirmed against the PDF. Never true for an inferred page.
  handbook_status: in_handbook | in_handbook_memorize_anyway | not_in_handbook
  split_required: true if this atom mixes look-up and memorize content and must be decomposed before release
  spec_lines: list of {discipline, area, item} from NCEES specs
  primer_source: chapter number that borrows this concept in a Primer block; null if not borrowed
  review_questions: GENERATED by tools/count_assessments.py - do not hand-edit. TOTAL of conceptual + calculation + multiple
    choice.
  practice_problems: GENERATED by tools/count_assessments.py - do not hand-edit. Separate end-of-chapter problem set only;
    0 if the chapter has none.
  figures: list of figure IDs introduced in this concept's chapter. Each figure ID belongs to exactly one atom.
  status: planned | drafted | revised | reviewed | verified
  notes: free-form authoring notes; not student-facing
  source_sections: Optional source section numbers anchoring the editorial mapping; several sections may support one existing
    declared concept ID.
  uses_notation: Operators, delimiters, and function notation used but introduced by a transitive prerequisite. Separate from
    uses_symbols, which contains quantities only.
  term_aliases: Optional canonical introduced term -> source spelling variants. Aliases do not create a second owner. Context-dependent
    homonyms remain explicitly qualified.
  assessment_scope: chapter_total on the first ID of a supplied chapter. Its generated review_questions value is the chapter
    total; other IDs carry zero to prevent double counting. This is not a per-objective assessment map.
_conventions:
  section_numbering: 'Use the section labels actually present in the authored chapter. Layer 0 chapters use 0.1, 0.2, etc.
    Layer 1 uses the chapter number as the local prefix: 01-17 has 17.1, 17.2, etc. Across a chapter boundary, qualify the
    section with the chapter ID. Do not relabel every Layer 1 section as 1.x.'
  citation_style: 'OPTION 1, chapter-qualified on crossing. Within a chapter, cite bare: "(§0.4)". When citing a section in
    a different chapter, qualify with the chapter number: "(00-03 §0.4)". Never cite a bare section number across a chapter
    boundary. Linter rule: in any answer key or cross-reference, a bare "§N.N" must resolve to a section that exists in the
    SAME file. If it does not, the build fails and the citation must be qualified.

    '
  mentors_margin_format: "BOXED. Every Mentor's Margin uses the fenced blockquote form, with an opening and closing rule inside\
    \ the quote, the label on its own line, and blank quoted lines separating label, body, and rules:\n\n    > ---\n    >\
    \ **Mentor's Margin**\n    >\n    > Body text, wrapped to the same column as surrounding prose.\n    >\n    > ---\n\n\
    The inline form \"> **Mentor's Margin:** text\" is deprecated and must not appear in any chapter. Mentor's Margin is not\
    \ a numbered section and never appears in the anatomy table or a section list.\n"
  preview_note_format: "Single blockquote, no rules, label in bold followed by a period:\n\n    > **Preview note.** One or\
    \ two sentences naming the later concept,\n    > why it matters, and its chapter. Teaches nothing.\n"
  source_verification_format: 'Single blockquote, no rules, label in bold followed by a period. Required wherever the chapter
    states a fact originating outside this guide that can go stale: question counts, appointment structure, Handbook page
    numbers and edition, calculator policy, fees, retake rules, scoring practice, and any route or tier skip derived from
    an NCEES specification.

    '
  illustrative_mention: 'A term used purely as the name of an example, which nothing in the chapter depends on. Marked in
    the source so the term linter permits it ahead of its defining chapter. Defined for readers in 00-01 §0.6. Chapters that
    lean on the device heavily - 00-03 in particular - carry a short reader-facing note saying so.

    '
_invariants:
- 'File parses: all records under `concepts`, no root-level key/sequence mixing.'
- Every id matches the ID FORMAT and uses a legal DOMAIN token.
- Every prerequisite id exists in this file. No placeholders (0XX, TBD, XXX).
- The prerequisite graph is acyclic.
- Every term in introduces_terms appears exactly once across the whole ledger.
- Every term in uses_terms is introduced by a transitive prerequisite of this atom.
- Every symbol in introduces_symbols appears exactly once, and exists in notation.md.
- Every symbol in uses_symbols is introduced by a transitive prerequisite of this atom.
- Every figure ID is claimed by exactly one atom, and is referenced inline in that atom's chapter.
- handbook_verified is false wherever the page was inferred rather than confirmed.
- 'No atom carries split_required: true at status verified.'
- Every chapter's Key Terms table matches the union of its atoms' introduces_terms.
- Every learning objective in a chapter is assessed by at least one review question.
- Every entry in uses_notation is introduced by a transitive prerequisite of that atom; notation is not a unit-bearing quantity.
_todo:
  spec_lines_layer_1: Official specification mappings remain incomplete through 01-41. Existing mappings were preserved; no
    unsupported area/item codes were inferred for Chapters 01-38 through 01-41. Populate from official specification sheets
    before coverage certification.
  handbook_page_audit: 'Layer 3 Chemical track checked against FE Reference Handbook 10.6: Chemical Engineering printed pp.
    243–264; supporting Thermodynamics pp. 143–180; Instrumentation, Measurement, and Control pp. 225–234; Safety pp. 15–35;
    and FE Chemical exam specification Appendix pp. 478–481. Specification-required topics not directly tabulated in the Handbook
    are marked not_in_handbook or mixed rather than represented as Handbook formulas.'
  figure_audit: Figure manifest synchronized through Layer 3 Chemical track (03-13). FIG-03-01-001 through FIG-03-13-007 are
    status 'specified'. No artwork-generation or visual-QA claim is made.
  split_required_atoms: Records retaining mixed Handbook lookup and memorization content are explicitly marked split_required.
    Preserving the chapter-declared ID set does not resolve these release-time decomposition requirements; no affected concept
    is marked verified.
  chapter_01_01_anatomy: 'RESOLVED. Chapter 01-01 includes Quick Reference, What''s Next, and the closing sign-off required
    by the chapter anatomy convention.

    '
  layer_coverage: Layer 1 and Layer 2 are drafted/registered. Layer 3 Chemical Engineering track is drafted/registered through
    Chapter 03-13. The next planned Layer 3 track is Civil Engineering beginning at 03-14.
  assessment_integrity: 01-21 has 31 review questions and no key. 01-22 has two distinct 30-question sets with one key matching
    the second; its generated count of 60 is an occurrence count only. Counts elsewhere do not certify answer correctness
    or learning-objective coverage. The referenced count_assessments.py tool was not supplied; counts here were generated
    directly from the Markdown review sections and cross-checked against sequential labels.
  key_terms_alignment: 'The existing strict Key Terms-equals-introductions invariant is not met by the manuscript: tables
    repeat prerequisites (for example SI/USCS, absolute value, centroid, series, and error propagation), include symbol rows,
    and use spelling variants. This ledger keeps one first-definition owner and explicit aliases/uses instead of falsely reintroducing
    those concepts. Reconcile the chapter tables with the documented invariant before release; 01-22 also duplicates its Key
    Terms table.'
  notation_contract: Quantity ownership and operator ownership are separated, and newly added quantity meanings/units are
    recorded in _symbol_catalog. These additions have not been propagated to the frozen notation.md registry or source banners.
    Harmonize i/j, λ/λ_i, τ/τ_c, k/k_s, γ/SW, and T/T_p where the source and contract differ. Do not treat the ledger edit
    as a passed notation-contract check.
  manuscript_cross_references: The current manuscript still includes the 01-07 margin claiming 01-12 was already taught, 01-17
    chain-rule use of an untaught sine derivative, incorrect calculus handoffs in 01-18 and 01-21, and the 01-22 relative-error
    equation defect. Source chapter text was not changed by this ledger repair.
  validator_reliability: The supplied forward-reference linter performs single-word matching and omits uses_notation and alias
    checks. Missing-input skips are not validation passes. The numerical verifier still has the self-comparison defect identified
    in the audit. This ledger has independently checked structural and dependency invariants, not a clean whole-guide release
    gate.
