    on page 61. Each is limited to the formula coverage stated in its notes. Unsupported references for
    01-23 total differentials and multivariable optimization were removed. Related pages 50, 70, and 231
    are recorded in _verification_audit. Other chapters retain their previous unverified references; this
    is not a whole-guide Handbook audit.'
  figure_audit: All 120 inline figure IDs in the 26 supplied chapters have one concept owner. The manifest
    now includes FIG-01-23-001 through FIG-01-23-007, with their actual sections and current descriptions.
    Their status is specified, which does not claim generation. The user reports 35 figures generated
    guide-wide; the IDs and current artwork files have not been reconciled in this audit. Existing manifest
    status values are preserved. Eight 01-18 Section values remain blank, and the previously reported
    five 01-02 filename mismatches remain pending. Specification, generation, and visual approval are
    separate stages; missing planned artwork is an incomplete production task, not a broken manuscript
    reference.
  split_required_atoms: Records retaining mixed Handbook lookup and memorization content are explicitly
    marked split_required. Preserving the chapter-declared ID set does not resolve these release-time
    decomposition requirements; no affected concept is marked verified.
  chapter_01_01_anatomy: 'RESOLVED. Chapter 01-01 includes Quick Reference, What''s Next, and the closing
    sign-off required by the chapter anatomy convention.

    '
  layer_coverage: Layer 1 is represented through 01-23 with 94 mathematical concepts. Chapter 01-23 is
    content-complete and revised, with its Handbook coverage checked and figure specifications reconciled.
    Its actual artwork and remaining release gates are still pending. Chapter 01-21 lacks answers and
    01-22 has duplicate endings. Differential equations, numerical methods, probability/statistics, and
    later discipline layers remain outside this supplied snapshot. The three Layer 2 seeds remain planned.
  assessment_integrity: 01-21 has 31 review questions and no key. 01-22 has two distinct 30-question sets
    with one key matching the second; its generated count of 60 is an occurrence count only. Counts elsewhere
    do not certify answer correctness or learning-objective coverage. The referenced count_assessments.py
    tool was not supplied; counts here were generated directly from the Markdown review sections and cross-checked
    against sequential labels.
  key_terms_alignment: 'The existing strict Key Terms-equals-introductions invariant is not met by the
    manuscript: tables repeat prerequisites (for example SI/USCS, absolute value, centroid, series, and
    error propagation), include symbol rows, and use spelling variants. This ledger keeps one first-definition
    owner and explicit aliases/uses instead of falsely reintroducing those concepts. Reconcile the chapter
    tables with the documented invariant before release; 01-22 also duplicates its Key Terms table.'
  notation_contract: Quantity ownership and operator ownership are separated, and newly added quantity
    meanings/units are recorded in _symbol_catalog. These additions have not been propagated to the frozen
    notation.md registry or source banners. Harmonize i/j, λ/λ_i, τ/τ_c, k/k_s, γ/SW, and T/T_p where
    the source and contract differ. Do not treat the ledger edit as a passed notation-contract check.
  manuscript_cross_references: The current manuscript still includes the 01-07 margin claiming 01-12 was
    already taught, 01-17 chain-rule use of an untaught sine derivative, incorrect calculus handoffs in
    01-18 and 01-21, and the 01-22 relative-error equation defect. Source chapter text was not changed
    by this ledger repair.
  validator_reliability: The supplied forward-reference linter performs single-word matching and omits
    uses_notation and alias checks. Missing-input skips are not validation passes. The numerical verifier
    still has the self-comparison defect identified in the audit. This ledger has independently checked
    structural and dependency invariants, not a clean whole-guide release gate.
