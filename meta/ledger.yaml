# =====================================================================
# CONCEPT LEDGER
# =====================================================================
# One record per teachable atom. Chapter numbering is OUTPUT of
# tools/build_order.py, which topologically sorts the `concepts` list.
# A dependency cycle means a concept is mis-decomposed and must be split.
#
# ID FORMAT:  {DOMAIN}-{LAYER}{TIER}-{CHAPTER}-{SEQ}
#   DOMAIN  MATH ORIENT PROF PHYS MECH THRM ELEC CTRL
#           CHE CIV ECE ENV IND MEC OTH  BRDG
#   LAYER   0 1 2 3
#   TIER    A-F for layers 1 and 2; omitted for layers 0 and 3
#   Example: MECH-2C-024-01
#
# No other domain tokens are legal. MATH-TRIG-*, MATH-GEOM-* etc. will
# fail the ID lint.
# =====================================================================

schema_version: 4
handbook_edition: "10.6"

# ---------------------------------------------------------------------
# FIELD DEFINITIONS (documentation only; not parsed)
# ---------------------------------------------------------------------
_schema:
  id:                  "required, unique, matches ID FORMAT above"
  title:               "required, imperative or noun phrase, sentence case"
  chapter:             "required, e.g. 01-02"
  layer:               "required, 0|1|2|3"
  tier:                "required for layers 1-2, one of A B C D E F; null for layers 0 and 3"
  track:               "required for layer 3, one of the seven disciplines; null otherwise"
  prerequisites:       "list of ledger IDs. [] only for true axioms."
  introduces_terms:    "terms first DEFINED here. Must be globally unique. Feeds glossary + linter."
  introduces_symbols:  "physical or mathematical QUANTITIES first defined here. Must exist in notation.md with SI and USCS columns."
  introduces_notation: "operators, delimiters, function names, and set notation first defined here. Glossary only; no units row."
  uses_symbols:        "symbols used but defined elsewhere. Linter checks that each is introduced by a TRANSITIVE prerequisite."
  uses_terms:          "terms used but defined elsewhere, where the usage is load-bearing. Same transitive check as uses_symbols. Illustrative mentions are exempt and are marked in the source, not here."
  handbook_ref:        "section name + page in the Handbook edition named above, or null"
  handbook_verified:   "true only if page confirmed against the PDF. Never true for an inferred page."
  handbook_status:     "in_handbook | in_handbook_memorize_anyway | not_in_handbook"
  split_required:      "true if this atom mixes look-up and memorize content and must be decomposed before release"
  spec_lines:          "list of {discipline, area, item} from NCEES specs"
  primer_source:       "chapter number that borrows this concept in a Primer block; null if not borrowed"
  review_questions:    "GENERATED by tools/count_assessments.py - do not hand-edit. TOTAL of conceptual + calculation + multiple choice."
  practice_problems:   "GENERATED by tools/count_assessments.py - do not hand-edit. Separate end-of-chapter problem set only; 0 if the chapter has none."
  figures:             "list of figure IDs introduced in this concept's chapter. Each figure ID belongs to exactly one atom."
  status:              "planned | drafted | revised | reviewed | verified"
  notes:               "free-form authoring notes; not student-facing"

# ---------------------------------------------------------------------
# AUTHORING CONVENTIONS (enforced by tools/lint_style.py)
# ---------------------------------------------------------------------
_conventions:

  section_numbering: >
    Sections within a chapter are numbered 0.1, 0.2, 0.3 ... in Layer 0,
    and 1.1, 1.2 ... in Layer 1, matching the layer digit. Section numbers
    are NOT globally unique: every Layer 0 chapter has a 0.1.

  citation_style: >
    OPTION 1, chapter-qualified on crossing. Within a chapter, cite bare:
    "(§0.4)". When citing a section in a different chapter, qualify with
    the chapter number: "(00-03 §0.4)". Never cite a bare section number
    across a chapter boundary.
    Linter rule: in any answer key or cross-reference, a bare "§N.N" must
    resolve to a section that exists in the SAME file. If it does not, the
    build fails and the citation must be qualified.

  mentors_margin_format: >
    BOXED. Every Mentor's Margin uses the fenced blockquote form, with an
    opening and closing rule inside the quote, the label on its own line,
    and blank quoted lines separating label, body, and rules:

        > ---
        > **Mentor's Margin**
        >
        > Body text, wrapped to the same column as surrounding prose.
        >
        > ---

    The inline form "> **Mentor's Margin:** text" is deprecated and must
    not appear in any chapter. Mentor's Margin is not a numbered section
    and never appears in the anatomy table or a section list.

  preview_note_format: >
    Single blockquote, no rules, label in bold followed by a period:

        > **Preview note.** One or two sentences naming the later concept,
        > why it matters, and its chapter. Teaches nothing.

  source_verification_format: >
    Single blockquote, no rules, label in bold followed by a period.
    Required wherever the chapter states a fact originating outside this
    guide that can go stale: question counts, appointment structure,
    Handbook page numbers and edition, calculator policy, fees, retake
    rules, scoring practice, and any route or tier skip derived from an
    NCEES specification.

  illustrative_mention: >
    A term used purely as the name of an example, which nothing in the
    chapter depends on. Marked in the source so the term linter permits
    it ahead of its defining chapter. Defined for readers in 00-01 §0.6.
    Chapters that lean on the device heavily - 00-03 in particular -
    carry a short reader-facing note saying so.

# ---------------------------------------------------------------------
# INVARIANTS ENFORCED BY tools/lint_ledger.py
# ---------------------------------------------------------------------
_invariants:
  - "File parses: all records under `concepts`, no root-level key/sequence mixing."
  - "Every id matches the ID FORMAT and uses a legal DOMAIN token."
  - "Every prerequisite id exists in this file. No placeholders (0XX, TBD, XXX)."
  - "The prerequisite graph is acyclic."
  - "Every term in introduces_terms appears exactly once across the whole ledger."
  - "Every term in uses_terms is introduced by a transitive prerequisite of this atom."
  - "Every symbol in introduces_symbols appears exactly once, and exists in notation.md."
  - "Every symbol in uses_symbols is introduced by a transitive prerequisite of this atom."
  - "Every figure ID is claimed by exactly one atom, and is referenced inline in that atom's chapter."
  - "handbook_verified is false wherever the page was inferred rather than confirmed."
  - "No atom carries split_required: true at status verified."
  - "Every chapter's Key Terms table matches the union of its atoms' introduces_terms."
  - "Every learning objective in a chapter is assessed by at least one review question."

# ---------------------------------------------------------------------
# OPEN WORK (blocks release, not the build)
# ---------------------------------------------------------------------
_todo:
  spec_lines_layer_1: >
    spec_lines is empty on nearly every Tier 1A and 1B atom. Mathematics
    appears in the NCEES specifications for all seven disciplines, so the
    coverage matrix cannot be built for Layer 1 until these are populated.
    Populate from the official specification sheets only. Do not infer
    area or item letters.
  handbook_page_audit: >
    handbook_verified is true on roughly twenty atoms, all derived from
    the edition 10.6 table of contents. Schedule a deliberate spot-check
    against the Handbook PDF before release. Any page derived from a
    section start page must be set false and noted.
  figure_audit: >
    Figure ownership and inline references are reconciled through Chapter
    01-16. The manifest is normalized to its eight-column schema. Continue
    this audit as later chapters are added.
  split_required_atoms: >
    Ten atoms carry split_required: true. Each mixes Handbook look-up
    content with memorize-cold content, which no single handbook_status
    value can express. Decompose into finer atoms so summary cards can be
    generated per atom.
  chapter_01_01_anatomy: >
    RESOLVED. Chapter 01-01 includes Quick Reference, What's Next, and the
    closing sign-off required by the chapter anatomy convention.
  layer_coverage: >
    Layer 1 is represented through Chapter 01-16 in this ledger snapshot.
    Later calculus, differential equations, numerical methods, probability,
    statistics, and discipline layers remain incomplete. The dependency
    graph therefore remains a partial-build graph.

